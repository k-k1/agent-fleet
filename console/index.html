<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <!-- Classic script, so it runs synchronously before the module entry below. The
         query-only URL keeps the document path (see public/base-bootstrap.js). -->
    <script src="?af-bootstrap"></script>
    <!-- interactive-widget=resizes-content: when the mobile soft keyboard (GBoard)
         opens, shrink the LAYOUT viewport (not just the visual one) so the height:100%
         flex frame recomputes — keeping the top bar / WS bar / chat header pinned and
         letting only the chat body scroll, instead of the browser panning the whole
         page up and pushing those bars off-screen. -->
    <meta name="viewport" content="width=device-width, initial-scale=1, interactive-widget=resizes-content" />
    <title>Agent Fleet — Console</title>

    <!-- PWA / add-to-home-screen. All hrefs are RELATIVE (no leading slash) so they
         resolve against the dynamic <base href> above — required behind the
         path-stripping proxy. The manifest sits at the site root but is NOT under the
         auth-exempt /brand/ prefix, so crossorigin=use-credentials makes its fetch
         carry the session cookie (otherwise the manifest request is anonymous and the
         auth proxy 302s it). The icons live under /brand/, which authGate exempts, so
         they load regardless. -->
    <link rel="manifest" href="manifest.webmanifest" crossorigin="use-credentials" />
    <meta name="theme-color" content="#149ba7" />
    <link rel="icon" type="image/png" href="brand/icon-192.png" />
    <link rel="apple-touch-icon" href="brand/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Agent Fleet" />
    <link
      rel="preconnect"
      href="https://fonts.gstatic.com"
      crossorigin
    />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Source+Code+Pro:wght@400;600;700&family=JetBrains+Mono:wght@400;700&family=Fira+Code:wght@400;600&family=IBM+Plex+Mono:wght@400;600&display=swap"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/app/main.tsx"></script>
  </body>
</html>
