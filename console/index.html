<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <script>
    // Behind a path-stripping proxy (e.g. Caddy strips /agent-fleet), ensure a
    // trailing slash so relative asset/API/WS URLs resolve under the mount.
    (function () {
      var p = location.pathname;
      if (!p.endsWith("/") && !/\.[a-z0-9]+$/i.test(p.split("/").pop())) {
        document.write('<base href="' + p + '/">');
      }
    })();
  </script>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Agent Fleet — Console (Phase 1 MVP)</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@xterm/xterm@5.5.0/css/xterm.css" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700&display=swap" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <header>
    <h1>Agent Fleet <small>Phase 1 MVP / dev</small></h1>
    <div id="ws-controls">
      <span id="tenant-wrap" style="display:none">Tenant: <select id="tenant-picker"></select></span>
      <span>Workspace: <b id="ws-state">…</b></span>
      <button id="ws-start">Start</button>
      <button id="ws-stop">Stop</button>
    </div>
  </header>

  <main>
    <section id="sidebar">
      <div class="row">
        <h2>Connections</h2>
        <button id="conn-refresh" title="refresh">⟳</button>
      </div>
      <ul id="conn-list"></ul>

      <div class="row">
        <h2>Repos</h2>
        <button id="repos-refresh" title="refresh">⟳</button>
      </div>
      <form id="clone-repo">
        <input id="cr-url" placeholder="git clone URL" required />
        <input id="cr-branch" placeholder="branch (optional)" />
        <button type="submit">Clone</button>
      </form>
      <ul id="repo-list"></ul>

      <div class="row">
        <h2>Sessions</h2>
        <button id="sessions-refresh" title="refresh">⟳</button>
      </div>
      <form id="new-session">
        <input id="ns-name" placeholder="name (a-z0-9_-)" required />
        <input id="ns-dir" placeholder="dir (default ~)" />
        <input id="ns-url" placeholder="clone URL (optional) — CWD = repo" />
        <input id="ns-branch" placeholder="branch (optional)" />
        <button type="submit">New</button>
      </form>
      <ul id="session-list"></ul>
    </section>

    <section id="terminal-pane">
      <div id="term-header">
        <span id="term-title">no session attached</span>
        <button id="copy-login-url" title="copy the most recent sign-in URL shown in the terminal">⧉ sign-in URL</button>
      </div>
      <div id="terminal"></div>
    </section>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/@xterm/xterm@5.5.0/lib/xterm.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@xterm/addon-fit@0.10.0/lib/addon-fit.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@xterm/addon-web-links@0.11.0/lib/addon-web-links.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@xterm/addon-unicode11@0.8.0/lib/addon-unicode11.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@xterm/addon-webgl@0.18.0/lib/addon-webgl.js"></script>
  <script src="app.js"></script>
</body>
</html>
