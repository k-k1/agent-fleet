AWSTemplateFormatVersion: "2010-09-09"
# LanguageExtensions: lets DeletionPolicy/UpdateReplacePolicy take Fn::If - the
# Persistence parameter below flips them without duplicating resources.
Transform: AWS::LanguageExtensions
Description: >-
  agent-fleet ECS adapter (P3-7) - data substrate: one encrypted EFS filesystem
  (per-workspace access points are created by the Control Plane at runtime, not
  here) and an RDS PostgreSQL instance for the MetadataStore. Imports network from
  the 00-network stack. Persistence=delete (default) is dev-ephemeral (DeletionPolicy
  Delete, no backups); a production environment deploys with Persistence=retain
  (EFS Retain + daily AWS Backup, RDS Snapshot + backups + deletion protection).

Parameters:
  NetworkStackName:
    Type: String
    Default: af-ecs-network
    Description: Name of the 00-network stack to import VPC/subnets/SGs from.
  DbInstanceClass:
    Type: String
    Default: db.t4g.micro
    Description: RDS instance class (t4g.micro is enough for a small deployment).
  DbAllocatedStorage:
    Type: Number
    Default: 20
    Description: RDS storage (GiB).
  DbName:
    Type: String
    Default: agentfleet
    Description: Initial database name.
  DbUsername:
    Type: String
    Default: afadmin
    Description: Master username. The password is generated and managed by RDS in
      Secrets Manager (ManageMasterUserPassword) - never passed as a parameter.
  EfsThroughputMode:
    Type: String
    Default: elastic
    AllowedValues: [ elastic, bursting, provisioned ]
    Description: >-
      EFS throughput mode. MUST match the live file system - see the warning on the
      FileSystem resource below. elastic (default) = pay per metered I/O, no ceiling.
      bursting = free I/O but the baseline is 50 KiB/s per GiB stored, so a config-sized
      file system (a few GiB) falls to the 1 MiB/s minimum AWS guarantees once the burst
      credits run out - measured here, PermittedThroughput pinned at 1.049 MB/s.
      provisioned = a fixed MiB/s (EfsProvisionedThroughputMibps), free I/O, throttled
      above the provisioned rate.
  EfsProvisionedThroughputMibps:
    Type: Number
    Default: 24
    MinValue: 1
    Description: >-
      Sustained MiB/s to buy when EfsThroughputMode=provisioned (ignored otherwise).
      Billed at the region's Provisioned Throughput rate (ap-northeast-1: $7.20 per
      MiBps-month) whether or not it is used. The default is 1.6-2.0x the ESTIMATED peak
      for nine workspaces (12-15 MiB/s - an extrapolation from one minute of the old
      agent's traffic, not a measurement; see ADR 0087), because AWS lets you RAISE the
      provisioned amount at any time but locks a decrease - and a return to elastic - for
      24 hours. Size up, then come down a day later.
  Persistence:
    Type: String
    Default: delete
    AllowedValues: [ delete, retain ]
    Description: >-
      delete (default) = dev-ephemeral, stack deletion drops EFS and RDS with no
      backups. retain = production: EFS survives stack deletion (Retain) and is
      backed up daily by AWS Backup (EfsBackupRetentionDays), RDS leaves a final
      snapshot (Snapshot), daily backups (7 days) and deletion protection are
      enabled.
  EfsBackupRetentionDays:
    Type: Number
    Default: 7
    MinValue: 1
    Description: >-
      Days each daily EFS recovery point is kept when Persistence=retain (ignored
      otherwise). 7 matches the RDS automated backups. Billed per GB-month of
      backup storage - see the ecs runbook, "EFS backup and restore".
  CustodianKmsKey:
    Type: String
    Default: none
    AllowedValues: [ none, create ]
    Description: >-
      create = a KMS key for the Control Plane's key custodian (ADR 0005), output as
      CustodianKmsKeyArn for 30-ingress. none (default) = the local custodian, or a key
      you manage yourself. See cfn/PARAMETERS.md.

Conditions:
  IsRetain: !Equals [ !Ref Persistence, retain ]
  CreateCustodianKey: !Equals [ !Ref CustodianKmsKey, create ]
  IsProvisionedTp: !Equals [ !Ref EfsThroughputMode, provisioned ]

Resources:
  # --- EFS ---
  EfsSg:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: !Sub "af-${AWS::StackName} EFS mount targets (NFS from workspace tasks)"
      VpcId:
        Fn::ImportValue: !Sub "${NetworkStackName}-VpcId"
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 2049
          ToPort: 2049
          SourceSecurityGroupId:
            Fn::ImportValue: !Sub "${NetworkStackName}-WsSgId"
          Description: NFS from workspace tasks only
      Tags: [ { Key: Name, Value: !Sub "af-${AWS::StackName}-efs-sg" } ]

  # !! ThroughputMode is a PARAMETER, and the parameter must track the live file system.
  # The 24-hour restriction is ASYMMETRIC: after a switch TO provisioned, or a change of
  # the provisioned amount, AWS refuses a switch back to elastic/bursting AND a DECREASE
  # of the amount for 24 hours. Raising the amount is not restricted, and a switch that does
  # not involve provisioned (elastic <-> bursting) is not restricted either. The danger is not
  # the wait: a stack update can move the mode silently, and under bursting nothing goes wrong
  # until the credits drain.
  #
  # This resource used to hard-code `bursting`. Bursting gives a baseline of 50 KiB/s per
  # GiB of Standard storage; this file system holds only per-member config and credentials
  # (a few GiB), so once the burst credits are gone it sits at the 1 MiB/s minimum AWS
  # guarantees, while the workspaces' *metadata* I/O alone runs 5-18x above that. The
  # credits drained over 36 hours and every workspace went to a crawl (an `openat` of a
  # 2.4 KB file took 5.3 s), because ~/.gitconfig and CLAUDE_CONFIG_DIR are served from
  # here. The live file system was moved to elastic by hand to end the outage; leaving
  # `bursting` in the template would have re-armed the same failure on the next update.
  #
  # Keep the deployment's params file in step with the live value (capture-env.sh records
  # it), and read `docs/decisions/0087-efs-metadata-io.md` before changing it.
  FileSystem:
    Type: AWS::EFS::FileSystem
    DeletionPolicy: !If [ IsRetain, Retain, Delete ]
    UpdateReplacePolicy: !If [ IsRetain, Retain, Delete ]
    Properties:
      Encrypted: true
      PerformanceMode: generalPurpose
      ThroughputMode: !Ref EfsThroughputMode
      ProvisionedThroughputInMibps:
        !If [ IsProvisionedTp, !Ref EfsProvisionedThroughputMibps, !Ref "AWS::NoValue" ]
      FileSystemTags:
        - { Key: Name, Value: !Sub "af-${AWS::StackName}-efs" }

  # Retain above only outlives a stack deletion; a file deleted or corrupted on the running
  # file system (every home on ecs, the credentials on ecs-ec2) needs a recovery point.
  # The vault is Retain because AWS refuses to delete a vault that holds recovery points -
  # Delete would leave the stack in DELETE_FAILED. So a vault can outlive its stack, and
  # its name carries the stack id: a fixed name made the next stand-up under the same
  # stack name fail with AlreadyExists. teardown.sh finds every one by the
  # "<stack>-efs-" prefix. Switching one stack retain -> delete -> retain still collides
  # (the stack id does not change); delete the kept vault before switching back.
  EfsBackupVault:
    Type: AWS::Backup::BackupVault
    Condition: IsRetain
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      BackupVaultName: !Sub
        - "${AWS::StackName}-efs-${Suffix}"
        # First 8 hex digits of the stack id's UUID: vault names stop at 50 characters, which
        # the whole UUID (36) would overrun, and this leaves 37 for the stack name.
        - Suffix: !Select [ 0, !Split [ "-", !Select [ 2, !Split [ "/", !Ref "AWS::StackId" ] ] ] ]

  EfsBackupPlan:
    Type: AWS::Backup::BackupPlan
    Condition: IsRetain
    Properties:
      BackupPlan:
        BackupPlanName: !Sub "${AWS::StackName}-efs-daily"
        BackupPlanRule:
          - RuleName: daily
            TargetBackupVault: !Ref EfsBackupVault
            ScheduleExpression: cron(0 17 * * ? *)   # 02:00 in Tokyo, outside working hours
            StartWindowMinutes: 60
            CompletionWindowMinutes: 480
            Lifecycle:
              DeleteAfterDays: !Ref EfsBackupRetentionDays

  EfsBackupRole:
    Type: AWS::IAM::Role
    Condition: IsRetain
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal: { Service: backup.amazonaws.com }
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - !Sub "arn:${AWS::Partition}:iam::aws:policy/service-role/AWSBackupServiceRolePolicyForBackup"
        - !Sub "arn:${AWS::Partition}:iam::aws:policy/service-role/AWSBackupServiceRolePolicyForRestores"

  EfsBackupSelection:
    Type: AWS::Backup::BackupSelection
    Condition: IsRetain
    Properties:
      BackupPlanId: !Ref EfsBackupPlan
      BackupSelection:
        SelectionName: efs
        IamRoleArn: !GetAtt EfsBackupRole.Arn
        Resources:
          - !Sub "arn:${AWS::Partition}:elasticfilesystem:${AWS::Region}:${AWS::AccountId}:file-system/${FileSystem}"

  MountTarget0:
    Type: AWS::EFS::MountTarget
    Properties:
      FileSystemId: !Ref FileSystem
      SecurityGroups: [ !Ref EfsSg ]
      SubnetId: !Select [ 0, !Split [ ",", !ImportValue { "Fn::Sub": "${NetworkStackName}-PrivateSubnets" } ] ]
  MountTarget1:
    Type: AWS::EFS::MountTarget
    Properties:
      FileSystemId: !Ref FileSystem
      SecurityGroups: [ !Ref EfsSg ]
      SubnetId: !Select [ 1, !Split [ ",", !ImportValue { "Fn::Sub": "${NetworkStackName}-PrivateSubnets" } ] ]

  # --- RDS (MetadataStore, stage 3a) ---
  DbSg:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: !Sub "af-${AWS::StackName} RDS (5432 from Control Plane)"
      VpcId:
        Fn::ImportValue: !Sub "${NetworkStackName}-VpcId"
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 5432
          ToPort: 5432
          SourceSecurityGroupId:
            Fn::ImportValue: !Sub "${NetworkStackName}-CpSgId"
          Description: Postgres from Control Plane only
      Tags: [ { Key: Name, Value: !Sub "af-${AWS::StackName}-db-sg" } ]

  DbSubnetGroup:
    Type: AWS::RDS::DBSubnetGroup
    Properties:
      DBSubnetGroupDescription: !Sub "af-${AWS::StackName} private subnets"
      SubnetIds: !Split [ ",", !ImportValue { "Fn::Sub": "${NetworkStackName}-PrivateSubnets" } ]

  Db:
    Type: AWS::RDS::DBInstance
    DeletionPolicy: !If [ IsRetain, Snapshot, Delete ]
    UpdateReplacePolicy: !If [ IsRetain, Snapshot, Delete ]
    Properties:
      Engine: postgres
      DBInstanceClass: !Ref DbInstanceClass
      AllocatedStorage: !Ref DbAllocatedStorage
      DBName: !Ref DbName
      MasterUsername: !Ref DbUsername
      ManageMasterUserPassword: true   # RDS mints + rotates the password in Secrets Manager
      DBSubnetGroupName: !Ref DbSubnetGroup
      VPCSecurityGroups: [ !Ref DbSg ]
      PubliclyAccessible: false
      StorageEncrypted: true
      MultiAZ: false
      BackupRetentionPeriod: !If [ IsRetain, 7, 0 ]
      DeletionProtection: !If [ IsRetain, true, false ]
      Tags: [ { Key: Name, Value: !Sub "af-${AWS::StackName}-db" } ]

  # The key custodian's KMS key (ADR 0005, control-plane/custodian_kms.go). It lives with
  # the data it protects: every data key in the database is unreadable without it, so it
  # follows Persistence like RDS, and a deleted one is only scheduled (30 days to cancel).
  # The account root keeps administration through IAM. Every principal, the CP included, is
  # denied the crypto calls unless the request carries the custodian's encryption context,
  # so the key cannot be borrowed for anything else; the CP's own grant is 30-ingress's
  # CpCustodianKmsPolicy. deploy/local/cfn-cp-kms-scope-test.py holds both against the Go.
  CustodianKey:
    Type: AWS::KMS::Key
    Condition: CreateCustodianKey
    DeletionPolicy: !If [ IsRetain, Retain, Delete ]
    UpdateReplacePolicy: !If [ IsRetain, Retain, Delete ]
    Properties:
      Description: !Sub "af-${AWS::StackName} Control Plane key custodian"
      KeySpec: SYMMETRIC_DEFAULT
      KeyUsage: ENCRYPT_DECRYPT
      EnableKeyRotation: true
      PendingWindowInDays: 30
      KeyPolicy:
        Version: "2012-10-17"
        Statement:
          - Sid: AccountAdministersThroughIam
            Effect: Allow
            Principal: { AWS: !Sub "arn:${AWS::Partition}:iam::${AWS::AccountId}:root" }
            Action: "kms:*"
            Resource: "*"
          - Sid: DenyUseOutsideTheCustodianContext
            Effect: Deny
            Principal: "*"
            Action:
              - kms:Encrypt
              - kms:Decrypt
              - kms:ReEncrypt*
              - kms:GenerateDataKey*
            Resource: "*"
            Condition:
              StringNotEquals:
                kms:EncryptionContext:af:purpose: agent-fleet-custodian
      Tags: [ { Key: Name, Value: !Sub "af-${AWS::StackName}-custodian" } ]

  CustodianKeyAlias:
    Type: AWS::KMS::Alias
    Condition: CreateCustodianKey
    Properties:
      AliasName: !Sub "alias/af-${AWS::StackName}-custodian"
      TargetKeyId: !Ref CustodianKey

Outputs:
  EfsId:
    Value: !Ref FileSystem
    Export: { Name: !Sub "${AWS::StackName}-EfsId" }
  EfsBackupVaultName:
    Condition: IsRetain
    Description: AWS Backup vault holding the daily EFS recovery points (Persistence=retain).
    Value: !Ref EfsBackupVault
  DbEndpoint:
    Value: !GetAtt Db.Endpoint.Address
    Export: { Name: !Sub "${AWS::StackName}-DbEndpoint" }
  DbPort:
    Value: !GetAtt Db.Endpoint.Port
    Export: { Name: !Sub "${AWS::StackName}-DbPort" }
  DbSecretArn:
    Description: Secrets Manager ARN of the RDS-managed master credentials.
    Value: !GetAtt Db.MasterUserSecret.SecretArn
    Export: { Name: !Sub "${AWS::StackName}-DbSecretArn" }
  CustodianKmsKeyArn:
    Condition: CreateCustodianKey
    Description: Pass to 30-ingress as CustodianKmsKeyArn to switch the CP to the KMS custodian.
    Value: !GetAtt CustodianKey.Arn
