AWSTemplateFormatVersion: "2010-09-09"
Description: >-
  agent-fleet ECS adapter - EC2 slot pool for AF_RUNTIME=ecs-ec2 (docs/log/64 sec.64.12 /
  sec.64.15, ADR 0045 decision 10). Owns what a SLOT is: the launch template (ECS-optimized
  AMI, the cluster-join user-data, the af-mount/af-umount helpers), the instance role
  and the slot security group. It creates NO instances - the Control Plane runs them
  on demand and tags them af-pool/af-role=slot, exactly as it creates services and
  access points at runtime. Optional: deploy this only for the ecs-ec2 profile.

Parameters:
  NetworkStackName:
    Type: String
    Default: af-ecs-network
    Description: Name of the 00-network stack (VPC + private subnets).
  PlatformStackName:
    Type: String
    Default: af-ecs-platform
    Description: Name of the 20-platform stack (ECS cluster).
  SlotAmiId:
    Type: AWS::SSM::Parameter::Value<AWS::EC2::Image::Id>
    Default: /aws/service/ecs/optimized-ami/amazon-linux-2023/recommended/image_id
    Description: ECS-optimized AMI. Resolved at stack update, so re-deploying this
      stack is how slots get patched (the one operational cost the EC2 launch type
      really does add - ADR 0045 decision 7). Keep it an Amazon-published image. The
      CP role may launch only Amazon's public images and the two named here, and an image
      this account owns may still be refused on its snapshot (#1522, 20-platform
      Ec2RunForeignOwnedSnapshot).
  SlotAmiIdArm64:
    Type: String
    Default: ""
    Description: >-
      arm64 ECS-optimized AMI, for slot classes that declare arch=arm64 (docs/log/70
      sec.70.8). Leave EMPTY unless AF_ECS_EC2_SLOT_TYPES actually declares an arm64
      class - the Control Plane refuses to start when one is declared and this is
      not set, which is deliberate: a class that appears in the admin UI and cannot
      launch is worse than a deployment that says so at boot.

      To turn it on, set this to the SSM value
      /aws/service/ecs/optimized-ami/amazon-linux-2023/arm64/recommended/image_id
      (`aws ssm get-parameter --name ... --query Parameter.Value --output text`).
      A plain String rather than an SSM::Parameter::Value type because that type
      cannot be left empty, and empty is the default this has to have.

      !! There is NO second launch template. Everything about a slot except the AMI -
      instance profile, security group, root volume, and the user-data that joins the
      cluster and installs af-mount/af-umount - is architecture-neutral, so the CP
      passes this as a RunInstances ImageId override on the one template below.
      Patching it is still "redeploy this stack" (ADR 0045 decision 7).
  SlotRootVolumeGiB:
    Type: Number
    Default: 100
    MinValue: 40
    Description: Root volume of a slot. This is the IMAGE CACHE (a warm pull is 0.045s
      vs 32s cold) plus every container's write layer, and it is SHARED with whoever
      had the slot before - /tmp is a tmpfs precisely so it does not land here.
  TaskCleanupWait:
    Type: String
    Default: 5m
    Description: ECS_ENGINE_TASK_CLEANUP_WAIT_DURATION. The agent README's default is
      3h, which would hand the next user a slot still holding the previous user's
      stopped containers (ADR 0045 decision 8, price 1). Keep it short.

  PoolAlarmEmail:
    Type: String
    Default: ""
    Description: >-
      Where to send the slot-pool I/O alarms (ADR 0045 decision 28). Empty = no alarms and
      no SNS topic, which is what every deployment had before they existed. The address
      gets a confirmation mail from SNS; until it is confirmed the alarms fire into
      nothing. See the SlotIoAlarm resources for what they watch and their one caveat
      (CloudWatch cannot scope these metrics to this stack's volumes).

Conditions:
  HasArm64Ami: !Not [ !Equals [ !Ref SlotAmiIdArm64, "" ] ]
  HasPoolAlarms: !Not [ !Equals [ !Ref PoolAlarmEmail, "" ] ]

Resources:
  # --- IAM: what a slot may do. ECS join + SSM (the CP mounts/unmounts volumes over
  # SSM SendCommand) + ECR pull + logs. Nothing else: the slot is a rented box, not a
  # trusted component. ---
  SlotRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub "af-${AWS::StackName}-slot"
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal: { Service: ec2.amazonaws.com }
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AmazonEC2ContainerServiceforEC2Role
        - arn:aws:iam::aws:policy/AmazonSSMManagedInstanceCore

  SlotInstanceProfile:
    Type: AWS::IAM::InstanceProfile
    Properties:
      Roles: [ !Ref SlotRole ]

  # --- The Control Plane may pass THIS stack's slot role, and no other ---
  # The launch template carries the slot instance profile, so the CP's RunInstances has
  # to pass SlotRole. The grant lives here, attached to the CP task role the way
  # 60-engines attaches CpIngestManagedPolicy, because only this stack knows the role's ARN:
  # 20-platform cannot import from a stack that imports from it, and the pattern it used
  # to hold (role/af-*-slot) matched every deployment's slot role in the account.
  # A deployment that has no pool stack has no slot role to pass, and no grant.
  # !! The live E2E runs as the deployer: losing this policy shows up only as every slot
  # grow failing with AccessDenied on iam:PassRole, under the real CP role.
  #
  # The slot AMIs by exact ARN, in the same policy. 20-platform admits Amazon's public images
  # by ec2:Owner / ec2:Public and nothing else (#1522); these make a slot grow independent of
  # how IAM reads those two keys, and admit an image this account owns if an operator points
  # SlotAmiId at one. Such an image's own snapshot is still refused by 20-platform's snapshot
  # statement if IAM evaluates it there - see SlotAmiId.
  #
  # Deployed before 20-platform by update.sh, so the exact grants exist before the wide one
  # goes. Managed, not inline: IAM caps a role's inline policies at 10,240 bytes in total,
  # and the CP task role passed it (#1576); deploy/local/cfn-iam-policy-size-test.py holds
  # every role's total.
  CpSlotLaunchManagedPolicy:
    Type: AWS::IAM::ManagedPolicy
    Properties:
      ManagedPolicyName: !Sub "af-${AWS::StackName}-cp-slot-launch-${AWS::Region}"
      Roles:
        - !Select [ 1, !Split [ "/", !ImportValue { "Fn::Sub": "${PlatformStackName}-CpTaskRoleArn" } ] ]
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Sid: PassSlotRole
            Effect: Allow
            Action: iam:PassRole
            Resource: !GetAtt SlotRole.Arn
            Condition:
              StringEquals:
                iam:PassedToService: ec2.amazonaws.com
          - Sid: RunSlotImage
            Effect: Allow
            Action: ec2:RunInstances
            Resource: !Sub "arn:aws:ec2:${AWS::Region}::image/${SlotAmiId}"
          - !If
            - HasArm64Ami
            - Sid: RunSlotImageArm64
              Effect: Allow
              Action: ec2:RunInstances
              Resource: !Sub "arn:aws:ec2:${AWS::Region}::image/${SlotAmiIdArm64}"
            - !Ref AWS::NoValue

  # --- SG for the instance itself. No ingress at all: the workspace task has its own
  # ENI and the ws SG (awsvpc), so nothing needs to reach the host. Egress covers the
  # image pull, SSM and the agent's control channel. ---
  SlotSg:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: agent-fleet EC2 slot (no ingress; egress for ECR/SSM/agent)
      VpcId:
        Fn::ImportValue: !Sub "${NetworkStackName}-VpcId"
      SecurityGroupEgress:
        - { IpProtocol: -1, CidrIp: 0.0.0.0/0, Description: outbound only }
      Tags:
        - { Key: Name, Value: !Sub "af-${AWS::StackName}-slot" }

  SlotLaunchTemplate:
    Type: AWS::EC2::LaunchTemplate
    Properties:
      LaunchTemplateName: !Sub "af-${AWS::StackName}-slot"
      LaunchTemplateData:
        ImageId: !Ref SlotAmiId
        IamInstanceProfile: { Arn: !GetAtt SlotInstanceProfile.Arn }
        SecurityGroupIds: [ !Ref SlotSg ]
        # Private subnets + NAT only. A slot must never depend on an auto-assigned
        # public IPv4: a task ENI that survives a stop makes the instance multi-ENI and
        # the address silently stops being assigned - measured as 11 minutes of a
        # disconnected agent (ADR 0045 decision 3-3).
        # The hop limit does not protect an awsvpc task (its ENI reaches IMDS directly);
        # ECS_AWSVPC_BLOCK_IMDS below is what keeps workspace tasks off SlotRole.
        MetadataOptions:
          HttpTokens: required
          HttpPutResponseHopLimit: 2
        BlockDeviceMappings:
          - DeviceName: /dev/xvda
            Ebs:
              VolumeSize: !Ref SlotRootVolumeGiB
              VolumeType: gp3
              Encrypted: true
              DeleteOnTermination: true
        TagSpecifications:
          - ResourceType: instance
            Tags:
              - { Key: af-managed-by, Value: agent-fleet }
        UserData:
          Fn::Base64: !Sub
            - |
              #!/bin/bash
              # agent-fleet slot bootstrap. A slot is generic: it joins the cluster and
              # installs the two helpers the CP drives over SSM. It deliberately does
              # NOT touch any data volume and writes NO fstab entry - whose home is on
              # this box changes several times a day, and a stale fstab would make a
              # slot fail to boot for the NEXT user.
              exec > /var/log/af-userdata.log 2>&1
              set -x
              # ECS_AWSVPC_BLOCK_IMDS: a workspace task must not reach SlotRole through IMDS.
              # Nothing in the task uses IMDS (the Agent reads SMBIOS, not IMDS); the ECS and
              # SSM agents use the host network and keep it. Read at agent start = new slots only.
              cat >> /etc/ecs/ecs.config <<EOF
              ECS_CLUSTER=${Cluster}
              ECS_ENGINE_TASK_CLEANUP_WAIT_DURATION=${Cleanup}
              ECS_ENGINE_TASK_CLEANUP_WAIT_DURATION_JITTER=1m
              ECS_IMAGE_CLEANUP_INTERVAL=30m
              ECS_IMAGE_MINIMUM_CLEANUP_AGE=24h
              ECS_AWSVPC_BLOCK_IMDS=true
              EOF
              cat > /usr/local/bin/af-mount <<'SH'
              #!/bin/bash
              # af-mount <volume-id> <mountpoint> [--mkfs]
              # Nitro renames the device under /dev, so the volume is found by SERIAL
              # (the volume id without dashes) rather than by the requested name.
              set -euo pipefail
              VID="${!1//-/}"; MP=$2; MKFS=${!3:-}
              DEV=""
              for i in $(seq 30); do
                DEV=$(lsblk -ndo NAME,SERIAL | awk -v v="$VID" '$2==v{print "/dev/"$1}')
                [ -n "$DEV" ] && break; sleep 1
              done
              [ -n "$DEV" ] || { echo "device for $1 not found"; exit 1; }
              # Only formats a volume that has NO filesystem, which is what makes it safe
              # for the CP to pass --mkfs on every mount, including retries.
              if [ "$MKFS" = --mkfs ] && ! blkid "$DEV" >/dev/null 2>&1; then mkfs.xfs -q "$DEV"; fi
              # A home detached while it was still mounted leaves a dead mount here that answers
              # stat with EIO, and the mkdir -p below would then fail every later mount of this
              # home on this slot. Lazily unmount such a mount (device gone or root unreadable),
              # never a live one and never any other path. Same lines as staleHomeMountScript in
              # control-plane/internal/runtime/runtime_ecs_ec2_home_mount.go, which the CP also
              # sends to slots booted before this was here.
              MOUNTINFO=/proc/self/mountinfo SYSBLOCK=/sys/dev/block
              case "$MP" in
              /af-home/*/*) ;;
              /af-home/?*)
              for _ in 1 2 3 4; do
                top=$(awk -v m="$MP" '$5 == m { d = $3; f = ""; for (i = 7; i < NF; i++) if ($i == "-") { f = $(i + 1); break } } END { print d " " f }' "$MOUNTINFO")
                devt=$(echo "$top" | cut -d ' ' -f 1)
                fstype=$(echo "$top" | cut -d ' ' -f 2)
                [ "$fstype" = xfs ] || break
                if [ -e "$SYSBLOCK/$devt" ] && stat "$MP" >/dev/null 2>&1; then break; fi
                echo "dead mount at $MP (device $devt gone or unreadable); detaching it lazily"
                umount -l "$MP" || break
              done
              ;;
              esac
              mkdir -p "$MP"
              mountpoint -q "$MP" || mount -o nouuid "$DEV" "$MP"
              # Take whatever room the volume has now. A home that was grown while it was
              # detached - or whose growfs did not land at the time - carries a filesystem
              # smaller than its device, and nothing else would ever notice: the member
              # just keeps seeing the old capacity after being told it went up. xfs_growfs
              # on a filesystem that is already the full size is a no-op, so this is safe
              # on every mount, and its failure must not fail the mount.
              xfs_growfs "$MP" || true
              mkdir -p "$MP/dev"; chown 1000:1000 "$MP/dev"
              echo "mounted $DEV ($1) -> $MP"
              SH
              cat > /usr/local/bin/af-umount <<'SH'
              #!/bin/bash
              # af-umount <mountpoint>. Must succeed before the CP detaches: a forced
              # detach of a mounted filesystem corrupts it, and this is someone's home.
              # Succeeds only once nothing at all is mounted at the path: a second mount
              # stacked on the first still holds the volume the CP is about to pull.
              set -euo pipefail
              MP=$1
              mounted() { awk -v m="$MP" '$5 == m { found = 1 } END { exit !found }' /proc/self/mountinfo; }
              mounted || { echo "$MP not mounted"; exit 0; }
              for _ in 1 2 3 4 5 6; do
                if umount "$MP"; then echo "umounted $MP"; else sleep 2; fi
                mounted || exit 0
              done
              fuser -km "$MP" || true
              sleep 2
              if umount "$MP"; then echo "umounted $MP (after fuser -k)"; fi
              mounted || exit 0
              echo "$MP is still mounted" >&2
              exit 1
              SH
              chmod +x /usr/local/bin/af-mount /usr/local/bin/af-umount
            - Cluster:
                Fn::ImportValue: !Sub "${PlatformStackName}-ClusterName"
              Cleanup: !Ref TaskCleanupWait

  # --- Slot I/O alarms (ADR 0045 decision 28 / docs/log/64 sec.64.41.4) ---
  #
  # !!! What they are for: on 2026-08-27 one workspace's runaway drove its slot into
  # refault thrash - the root volume, which holds 8.0 GB of data in total, was read at
  # 39.34 GB every five minutes for three hours (docs/log/64 sec.64.40). Every daemon on the
  # box starved and the workspace could not be started again for hours.
  #
  # !! The metrics were ALL there the whole time. `VolumeQueueLength` went from 0.005
  # to a flat 2.0 at the first minute of it; `EBSByteBalance%` fell 99 -> 70. Nothing was
  # missing except somebody looking. That is the whole reason these exist - the fix for
  # "we could not see it" is not more telemetry, it is an alarm on the telemetry.
  #
  # !! THE CAVEAT, and it is a real one: CloudWatch cannot scope these to this stack.
  # The metrics are dimensioned by VolumeId / InstanceId, the pool creates those at
  # runtime, and Metrics Insights filters on dimension VALUES - not on tags. So the
  # queries below are ACCOUNT-WIDE within the region: another workload's busy volume
  # will trip them. Off by default for exactly that reason; turn them on where the
  # account is the deployment's own.
  PoolAlarmTopic:
    Type: AWS::SNS::Topic
    Condition: HasPoolAlarms
    Properties:
      TopicName: !Sub "af-${AWS::StackName}-pool-alarms"
      DisplayName: agent-fleet slot pool
      Subscription:
        - Protocol: email
          Endpoint: !Ref PoolAlarmEmail

  # The FAST one. A queue this deep, sustained, is a device that cannot keep up - which
  # is what thrash looks like from outside. Measured for the threshold: an ordinary busy
  # workspace peaked at 1.52 for a single five-minute bucket, while the incident sat at
  # a flat 2.0 (root) and 6.7 (home) for three hours. Requiring THREE consecutive
  # breaches is what separates them: real work is spiky, thrash is flat.
  SlotIoAlarmQueueDepth:
    Type: AWS::CloudWatch::Alarm
    Condition: HasPoolAlarms
    Properties:
      AlarmName: !Sub "af-${AWS::StackName}-slot-io-queue"
      AlarmDescription: >-
        An EBS volume has had a deep queue for 15 minutes. On the slot pool this means a
        workspace is thrashing its box; see docs/log/64 sec.64.40 for what that does to it.
      Metrics:
        - Id: q
          # No GROUP BY on purpose: the aggregate collapses every volume into the one
          # time series an alarm can evaluate, and "the worst volume right now" is
          # exactly the question.
          Expression: 'SELECT MAX(VolumeQueueLength) FROM SCHEMA("AWS/EBS", VolumeId)'
          Period: 300
          ReturnData: true
      ComparisonOperator: GreaterThanThreshold
      Threshold: 2
      EvaluationPeriods: 3
      DatapointsToAlarm: 3
      TreatMissingData: notBreaching
      AlarmActions: [ !Ref PoolAlarmTopic ]
      OKActions: [ !Ref PoolAlarmTopic ]

  # The UNAMBIGUOUS one, and the slower of the two. Burning EBS byte credits is not
  # something a healthy slot does at all: the pool sat at 99% for its whole life and
  # only the incident moved it (99 -> 83 in 35 minutes, -> 70 by the third hour). It needs
  # no per-instance-type tuning because it is already a percentage.
  SlotIoAlarmByteBalance:
    Type: AWS::CloudWatch::Alarm
    Condition: HasPoolAlarms
    Properties:
      AlarmName: !Sub "af-${AWS::StackName}-slot-io-credits"
      AlarmDescription: >-
        An instance has spent a fifth of its EBS bandwidth credits. Healthy slots stay
        at 99%; anything else is a sustained read or write nobody asked for.
      Metrics:
        - Id: q
          Expression: 'SELECT MIN(EBSByteBalance%) FROM SCHEMA("AWS/EC2", InstanceId)'
          Period: 300
          ReturnData: true
      ComparisonOperator: LessThanThreshold
      Threshold: 80
      EvaluationPeriods: 2
      DatapointsToAlarm: 2
      TreatMissingData: notBreaching
      AlarmActions: [ !Ref PoolAlarmTopic ]
      OKActions: [ !Ref PoolAlarmTopic ]

Outputs:
  # Conditional because CloudFormation REFUSES an empty export ("Exported values must
  # not be empty or whitespace-only") and empty is this parameter's whole point - an
  # unconditional export made the stack impossible to create at all without an arm64
  # AMI, rolling back on the very last step (measured on a fresh 0.10.0 deployment).
  SlotAmiIdArm64:
    Condition: HasArm64Ami
    Value: !Ref SlotAmiIdArm64
    Export: { Name: !Sub "${AWS::StackName}-SlotAmiIdArm64" }
  SlotLaunchTemplateId:
    Value: !Ref SlotLaunchTemplate
    Export: { Name: !Sub "${AWS::StackName}-SlotLaunchTemplateId" }
  SlotRoleArn:
    Value: !GetAtt SlotRole.Arn
    Export: { Name: !Sub "${AWS::StackName}-SlotRoleArn" }
  SlotSgId:
    Value: !Ref SlotSg
    Export: { Name: !Sub "${AWS::StackName}-SlotSgId" }
