AWSTemplateFormatVersion: "2010-09-09"
Description: >-
  agent-fleet ECS adapter (P3-7) — platform identity/compute core: ECR repos, the
  ECS cluster, the Service Connect (Cloud Map private DNS) namespace, and the IAM
  roles the Control Plane and workspace tasks assume. No ALB / services here (that
  is 30-ingress). Imports the VPC from 00-network. Per-workspace ECS Services,
  task definitions, EFS access points and SSM params are created by the CP at
  runtime (stage 2) — not by CloudFormation.

Parameters:
  NetworkStackName:
    Type: String
    Default: af-ecs-network
    Description: Name of the 00-network stack to import the VPC from.
  ServiceConnectNamespace:
    Type: String
    Default: af.internal
    Description: Private DNS namespace for Service Connect (CP reaches Agents by
      <service>.<namespace>). Internal only.

Resources:
  # --- ECR ---
  EcrControlPlane:
    Type: AWS::ECR::Repository
    DeletionPolicy: Delete
    Properties:
      RepositoryName: af-control-plane
      EmptyOnDelete: true              # dev-ephemeral: drop images on stack delete
      ImageScanningConfiguration: { ScanOnPush: true }
  EcrWorkspace:
    Type: AWS::ECR::Repository
    DeletionPolicy: Delete
    Properties:
      RepositoryName: af-workspace
      EmptyOnDelete: true
      ImageScanningConfiguration: { ScanOnPush: true }

  # --- Service Connect namespace (Cloud Map private DNS in the VPC) ---
  Namespace:
    Type: AWS::ServiceDiscovery::PrivateDnsNamespace
    Properties:
      Name: !Ref ServiceConnectNamespace
      Vpc:
        Fn::ImportValue: !Sub "${NetworkStackName}-VpcId"

  # --- ECS cluster (defaults services to the Service Connect namespace) ---
  Cluster:
    Type: AWS::ECS::Cluster
    Properties:
      ClusterName: !Sub "af-${AWS::StackName}"
      ClusterSettings:
        - { Name: containerInsights, Value: disabled }   # avoid CW cost in dev
      ServiceConnectDefaults:
        Namespace: !GetAtt Namespace.Arn

  # --- IAM: shared execution role (ECR pull + logs + SSM SecureString read) ---
  ExecRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub "af-${AWS::StackName}-exec"
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal: { Service: ecs-tasks.amazonaws.com }
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AmazonECSTaskExecutionRolePolicy
      Policies:
        - PolicyName: ssm-read
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              # Injects AGENT_TOKEN / AF_SECRET_KEY into workspace tasks via
              # `secrets: valueFrom` (frozen spec §20b.7.5). aws/ssm managed key
              # needs no explicit kms grant.
              - Effect: Allow
                Action: [ ssm:GetParameters ]
                Resource:
                  - !Sub "arn:aws:ssm:${AWS::Region}:${AWS::AccountId}:parameter/af-ws/*"
                  - !Sub "arn:aws:ssm:${AWS::Region}:${AWS::AccountId}:parameter/af-cp/*"
              # Reads the RDS-managed master password (Secrets Manager) to inject
              # AF_DB_PASSWORD into the CP task (P3-7 stage 3a). RDS-managed secrets are
              # named rds!db-*; scope to that prefix.
              - Effect: Allow
                Action: [ secretsmanager:GetSecretValue ]
                Resource: !Sub "arn:aws:secretsmanager:${AWS::Region}:${AWS::AccountId}:secret:rds!*"

  # --- IAM: workspace task role — Agent needs NO AWS APIs (least privilege) ---
  WsTaskRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub "af-${AWS::StackName}-ws-task"
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal: { Service: ecs-tasks.amazonaws.com }
            Action: sts:AssumeRole
      # No policies attached on purpose.

  # --- IAM: Control Plane task role — drives ECS/EFS/SSM for per-workspace ops ---
  CpTaskRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub "af-${AWS::StackName}-cp-task"
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal: { Service: ecs-tasks.amazonaws.com }
            Action: sts:AssumeRole
      Policies:
        - PolicyName: cp-runtime
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Sid: EcsDrive
                Effect: Allow
                Action:
                  - ecs:CreateService
                  - ecs:UpdateService
                  - ecs:DeleteService
                  - ecs:DescribeServices
                  - ecs:ListServices
                  - ecs:RegisterTaskDefinition
                  - ecs:DeregisterTaskDefinition
                  - ecs:DescribeTaskDefinition
                  - ecs:DescribeTasks
                  - ecs:ListTasks
                  - ecs:TagResource
                Resource: "*"          # ECS actions are not tightly resource-scopable; dev-acceptable
              # --- Backend drift ("要再起動" badge; control-plane/runtime_ecs_stale.go) ---
              # Read-only, one repository: resolve the workspace image TAG to the content
              # it points at now, so the CP can tell that a running workspace was launched
              # from an older image and the Console can offer a stop→start.
              #
              # ⚠️ This role, not the deployer's. The whole class of bug ADR 0045 決定 21 /
              # docs/log/64 §64.22 documents is "it passed against real AWS" while the live
              # test ran as the deployer — the CP task role is the only identity that
              # matters here. Without this statement the probe fails with AccessDenied,
              # which the CP treats as "unknown" and the badge simply never appears: a
              # silent loss of the feature, not an error anyone would see.
              - Sid: EcrImageRead
                Effect: Allow
                Action:
                  - ecr:BatchGetImage
                  - ecr:DescribeImages
                Resource:
                  - !GetAtt EcrWorkspace.Arn
              - Sid: EfsAccessPoints
                Effect: Allow
                Action:
                  - elasticfilesystem:CreateAccessPoint
                  - elasticfilesystem:DeleteAccessPoint
                  - elasticfilesystem:DescribeAccessPoints
                  - elasticfilesystem:TagResource
                Resource: "*"
              - Sid: SsmWorkspaceParams
                Effect: Allow
                Action:
                  - ssm:PutParameter
                  - ssm:GetParameters
                  - ssm:GetParameter
                  - ssm:DeleteParameter
                  - ssm:AddTagsToResource
                Resource: !Sub "arn:aws:ssm:${AWS::Region}:${AWS::AccountId}:parameter/af-ws/*"
              # --- EC2 slot pool (AF_RUNTIME=ecs-ec2 only; harmless on Fargate) ---
              # The CP owns the whole swap: find slots and volumes by tag, attach the
              # user's home, mount it over SSM, and hand the slot back. docs/log/64 §64.15.8.
              - Sid: Ec2SlotPool
                Effect: Allow
                Action:
                  - ec2:DescribeInstances
                  - ec2:DescribeVolumes
                  - ec2:DescribeSubnets
                  - ec2:CreateVolume
                  - ec2:DeleteVolume
                  - ec2:AttachVolume
                  - ec2:DetachVolume
                  - ec2:CreateTags
                  - ec2:DeleteTags
                  - ec2:RunInstances
                  - ec2:StartInstances
                  - ec2:StopInstances
                  # TerminateInstances is the dormancy series' last step
                  # (Ec2SlotTerminateAfterSec): stopping a slot ends the compute
                  # charge, only terminating it ends the ROOT VOLUME charge, and
                  # nothing else in the product ever removes a box. Without this the
                  # sweeper's terminate stage fails with AccessDenied on every pass —
                  # visible only in the CP log, while the bill keeps growing to
                  # Ec2MaxSlots x SlotRootVolumeGiB (docs/log/64 §64.32).
                  - ec2:TerminateInstances
                  # ⚠️ Snapshots were MISSING here until 2026-08-16, and nothing caught it:
                  # the live E2E runs with a deployer credential, not with this role. Every
                  # snapshot path would have failed with AccessDenied on a real deployment —
                  # and not only the optional ones. createHomeVolume asks for the user's
                  # hibernation snapshot FIRST, so a brand-new user's Start would have failed
                  # outright, not merely started slowly. (docs/log/64 §64.22.)
                  #   DescribeSnapshots — restore (決定 4), golden lookup (決定 9), backups (決定 17)
                  #   CreateSnapshot    — hibernation and backups
                  #   DeleteSnapshot    — retention, superseded captures, Destroy
                  - ec2:DescribeSnapshots
                  - ec2:CreateSnapshot
                  - ec2:DeleteSnapshot
                Resource: "*"          # Describe* cannot be resource-scoped; tags are the fence
              - Sid: EcsContainerInstances
                Effect: Allow
                Action:
                  - ecs:ListContainerInstances
                  - ecs:DescribeContainerInstances
                  # Stopped instances and disconnected agents are NOT deregistered
                  # automatically, even on terminate (ADR 0045 決定 3-2). The sweeper
                  # has to do it or ghosts accumulate and satisfy placement constraints.
                  - ecs:DeregisterContainerInstance
                Resource: "*"
              - Sid: SsmSlotCommands
                Effect: Allow
                Action:
                  - ssm:SendCommand
                  - ssm:GetCommandInvocation
                Resource: "*"          # scoped by the AWS-RunShellScript document + slot tags
              - Sid: PassSlotRole
                Effect: Allow
                Action: iam:PassRole
                # The launch template carries the slot instance profile, so RunInstances
                # needs to pass that role. Named by convention (the 40-ec2-pool stack
                # creates af-<stack>-slot) to avoid a circular stack import.
                Resource: !Sub "arn:aws:iam::${AWS::AccountId}:role/af-*-slot"
                Condition:
                  StringEquals:
                    iam:PassedToService: ec2.amazonaws.com
              - Sid: ServiceConnectDiscovery
                Effect: Allow
                Action:
                  - servicediscovery:Get*
                  - servicediscovery:List*
                  - servicediscovery:DiscoverInstances
                Resource: "*"
              - Sid: PassTaskRoles
                Effect: Allow
                Action: iam:PassRole
                Resource:
                  - !GetAtt ExecRole.Arn
                  - !GetAtt WsTaskRole.Arn
                Condition:
                  StringEquals:
                    iam:PassedToService: ecs-tasks.amazonaws.com
              # --- Cloud cost (docs/log/67, ADR 0048 決定 8) ---
              # ADR 0045 決定 21 refused to add IAM just to DISPLAY something (the vCPU
              # count became an env declaration instead). This reverses that, on purpose:
              # there the same number was obtainable another way, and here the alternative
              # to real money is a DIFFERENT number (an estimate from operator-declared
              # unit prices, which goes stale silently). There is no substitute for the
              # invoice.
              #
              # Read-only, one action. Cost Explorer has no resource-level scoping, so
              # Resource must be "*" — but what comes back is aggregated amounts, not
              # access to any resource or secret.
              #
              # ⚠️ Account prerequisite, not expressible here: an IAM role can only call
              # the Billing APIs when the account has "IAM user and role access to Billing
              # Information" enabled. Without it this policy is present and every call
              # still fails — see deploy/aws/ecs/README.md.
              - Sid: CostExplorerRead
                Effect: Allow
                Action:
                  - ce:GetCostAndUsage
                  - ce:ListCostAllocationTags
                Resource: "*"
              # ⚠️ ACCOUNT-LEVEL BILLING CONFIGURATION — the one place the Control Plane
              # writes something outside the resources it created itself. Read the reason
              # before removing it (docs/log/67 §67.5, ADR 0048 決定 11).
              #
              # A cost allocation tag only applies from the moment it is switched on, and
              # AWS will not activate a key it has not yet discovered on a real resource —
              # so the step cannot be done at deploy time, only a day later, by hand, by
              # someone who remembers. Every day it is missed is spend that can never be
              # attributed to anyone. That is the trade this grant buys.
              #
              # What bounds it, in code (cost_tags.go), not in policy:
              #   - a fixed allow-list of five keys. `af-workspace` is NEVER activated —
              #     its value is built from a member's email address.
              #   - a key a human set to Inactive is left alone (AWS stamps
              #     LastUpdatedDate on any deliberate change).
              #
              # ⚠️ Removing this statement does NOT break the cost views. The CP reports
              # "cannot activate" and the operator runs the CLI command instead.
              - Sid: CostAllocationTagActivation
                Effect: Allow
                Action:
                  - ce:UpdateCostAllocationTagsStatus
                Resource: "*"
              # Text-to-speech (docs/log/24). The CP calls Polly with the task role — no key
              # is ever stored (ADR 0013). SynthesizeSpeech has no resource-level
              # permissions, hence "*".
              #
              # ⚠️ Do not remove this "because nobody uses TTS": the provider reports
              # itself READY on the presence of a region alone (tts_polly.go Ready()),
              # and AF_ECS_REGION is always set by 30-ingress. Without the grant the
              # Console still offers voice playback and every attempt fails with a 502
              # at synthesize time — a silent-looking capability, not a disabled one.
              # On a deployment with no VOICEVOX service (AF_TTS_ECS_SERVICE unset),
              # `auto` routes EVERY utterance here, Japanese included.
              #
              # Cost is per character and only while somebody is listening: neural
              # $16 / 1M chars, standard $4 / 1M (~$0.008 for a 500-character reply).
              # The admin toggle that actually turns the feature off is in the Console.
              - Sid: PollySynthesize
                Effect: Allow
                Action:
                  - polly:SynthesizeSpeech
                Resource: "*"

Outputs:
  EcrControlPlaneUri:
    Value: !GetAtt EcrControlPlane.RepositoryUri
    Export: { Name: !Sub "${AWS::StackName}-EcrControlPlaneUri" }
  EcrWorkspaceUri:
    Value: !GetAtt EcrWorkspace.RepositoryUri
    Export: { Name: !Sub "${AWS::StackName}-EcrWorkspaceUri" }
  ClusterName:
    Value: !Ref Cluster
    Export: { Name: !Sub "${AWS::StackName}-ClusterName" }
  ClusterArn:
    Value: !GetAtt Cluster.Arn
    Export: { Name: !Sub "${AWS::StackName}-ClusterArn" }
  NamespaceArn:
    Value: !GetAtt Namespace.Arn
    Export: { Name: !Sub "${AWS::StackName}-NamespaceArn" }
  NamespaceId:
    Value: !GetAtt Namespace.Id
    Export: { Name: !Sub "${AWS::StackName}-NamespaceId" }
  ExecRoleArn:
    Value: !GetAtt ExecRole.Arn
    Export: { Name: !Sub "${AWS::StackName}-ExecRoleArn" }
  WsTaskRoleArn:
    Value: !GetAtt WsTaskRole.Arn
    Export: { Name: !Sub "${AWS::StackName}-WsTaskRoleArn" }
  CpTaskRoleArn:
    Value: !GetAtt CpTaskRole.Arn
    Export: { Name: !Sub "${AWS::StackName}-CpTaskRoleArn" }
