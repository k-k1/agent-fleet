AWSTemplateFormatVersion: "2010-09-09"
Description: >-
  agent-fleet ECS adapter (P3-7) — ingress + Control Plane service. ACM cert (DNS-
  validated via Route53), an internet-facing ALB that only terminates TLS (auth is
  the CP-native login, AUTH=oauth — no ALB OIDC), the CP/Console Fargate service
  (Service Connect client so it can reach the workspace Agents it provisions), and
  the Route53 alias. Imports 00-network, 10-data (EFS + RDS) and 20-platform. The CP
  is wired with AF_ECS_* so the stage-2 ecsRuntime provisions workspaces on demand, and
  its MetadataStore is RDS Postgres (stage 3a) so state survives task replacement.

Parameters:
  NetworkStackName:
    Type: String
    Default: af-ecs-network
  PlatformStackName:
    Type: String
    Default: af-ecs-platform
  DataStackName:
    Type: String
    Default: af-ecs-data
    Description: Name of the 10-data stack (EFS filesystem for workspace homes).
  ImageTag:
    Type: String
    Default: dev
    Description: >-
      Tag of BOTH the af-control-plane and af-workspace images in ECR (=VERSION;
      release-ecr.sh pushes the pair under one version). Upgrade = push a new tag,
      then re-deploy with only this parameter overridden: the CP service rolls to
      the new image; workspaces pick it up on their next Start (running ones are
      untouched — the adapter builds task definitions statelessly).
  WsTaskCpu:
    Type: String
    Default: "1024"
    Description: >-
      Default Fargate CPU units for a workspace task (1024 = 1 vCPU). Valid values are
      256/512/1024/2048/4096/8192/16384 — Fargate accepts only specific (cpu, memory)
      pairs (docs/log/63 §63.2). Per-user overrides are set in the Console and are snapped
      onto a valid pair, so this is only the floor everyone starts from.
  WsTaskMemory:
    Type: String
    Default: "2048"
    Description: >-
      Default workspace task memory in MiB. Must be valid for WsTaskCpu: 1 vCPU allows
      2048-8192 in 1024 steps, 2 vCPU 4096-16384, 4 vCPU 8192-30720; 8 vCPU steps by
      4096 and 16 vCPU by 8192. A development workspace measured 1.12 GiB anonymous and
      5.30 GiB peak including page cache, so 2048 is tight for real use.
  WsDiskGiB:
    Type: String
    Default: "50"
    Description: >-
      Default per-workspace WORKING disk in GiB. 0 keeps Fargate's free 20 GiB; 21-200
      sets the task's ephemeral storage (billed only above 20 GiB). This disk is wiped
      when the workspace stops — only the EFS home persists. It is also the switch for
      moving the small-file caches (go build cache, uv, go modules) and build artifacts
      (node_modules, target, .venv) off EFS onto the task-local disk: the entrypoint
      does that only when this is 30 or more, because the measured caches do not fit
      alongside the image in 20 GiB (ADR 0044 決定 3). The default is 50 so that
      relocation is ON — at 0 it can never arm, which is what shipped before and meant
      every deployment ran builds on EFS at ~9x the cost. Roughly $2.9/month per
      workspace at 24/7, and only while the task runs. Set 0 to opt out.
  WsRuntime:
    Type: String
    Default: ecs
    AllowedValues: [ ecs, ecs-ec2 ]
    Description: >-
      Which Runtime adapter the Control Plane uses. `ecs` = Fargate (the shipped
      default: two resources per workspace, ~105s to start, home on EFS). `ecs-ec2` =
      a pool of EC2 slots with a persistent per-user EBS home (docs/log/64 §64.12/§64.17,
      ADR 0045 決定 10/12). Switch for I/O and persistence (small-file writes 8-30x faster
      than EFS, a home that survives) and for sizes above Fargate's ceilings — NOT for
      start latency: measured 43-110s against Fargate's ~105s. The price is six resource
      kinds per workspace on a substrate with no production mileage. Requires the
      40-ec2-pool stack and Ec2SlotLaunchTemplate below. Falling back is this one value.
  Ec2SlotLaunchTemplate:
    Type: String
    Default: ""
    Description: >-
      SlotLaunchTemplateId output of the 40-ec2-pool stack (lt-…). Required when
      WsRuntime=ecs-ec2 — the CP refuses to boot on that profile without it, rather
      than silently running no workspaces.
  Ec2SlotTypes:
    Type: String
    Default: "standard|Standard (Intel)|x86_64|m7i.large:8192:2,m7i.xlarge:16384:4,m7i.2xlarge:32768:8;saver|Lower cost (Intel, previous gen)|x86_64|m6i.large:8192:2,m6i.xlarge:16384:4,m6i.2xlarge:32768:8"
    Description: >-
      The slot sizes the pool may run. A workspace lands on the smallest slot that
      holds its memory REQUEST and gets the WHOLE box (the task reserves neither cpu
      nor memory — on EC2 those are reservations against the instance). EC2 on-demand
      pricing is perfectly linear in vCPU, so bigger slots are not more expensive per
      user (ADR 0045 決定 8). The vCPU field is optional and display-only: the Console
      prints it so a tenant admin can see which box a memory number lands on, and
      omitting it just omits the label (ADR 0045 決定 21 — asking EC2 instead would
      mean an extra IAM action for a label).

      Two shapes, and the old one is not deprecated (docs/log/70 §70.4.2):

        instanceType:memoryMiB[:vcpu],…                one unnamed class, x86_64
        id|label|arch|<ladder>[;id|label|arch|<ladder>] one class per entry

      With more than one class, a tenant admin chooses WHICH KIND of machine per
      tenant and per member, and the memory number still picks the rung within it.
      arch is x86_64 or arm64 and is DECLARED, never guessed from the family name.

      The default above offers two x86_64 classes, because m6i needs NOTHING to work:
      same architecture, so the same workspace image, the same AMI, the same golden
      snapshot, and a member's home stays valid when they move (measured
      ap-northeast-1 2026-08-22: m6i is 4.8% cheaper than m7i). It is the "cost over
      speed" choice that is available today.

      ⚠️ Changing this parameter moves nobody by itself — Ec2DefaultSlotClass decides
      where members with no choice of their own land, and it defaults to the FIRST
      class. An existing stack also keeps its own value on a redeploy unless you pass
      this parameter, so upgrading does not add a picker to a running deployment.

      Adding Graviton is a matter of appending a class. Measured in ap-northeast-1 on
      2026-08-22 (price, and this repository's own build times on each family):

        m8g  -11.0% per hour and 29% FASTER than m7i  <- strictly better than m7i
        m7g  -19.0% per hour and 10% faster           <- no reason to pick over m8g
        m6g  -24.0% per hour but 32% SLOWER           <- cheapest per HOUR, not per unit of work

        …;arm|Faster and cheaper (Arm)|arm64|m8g.large:8192:2,m8g.xlarge:16384:4,m8g.2xlarge:32768:8

      ⚠️ m6g is the cheapest per hour and the most expensive per build. Which one is
      right depends on the member: a slot bills for the wall-clock time it is RUNNING,
      and a workspace spends most of that idle, so the hourly price is what a
      mostly-reading member pays — while a member who builds all day pays in time. If
      you offer m6g, put the trade-off in its LABEL; "24% cheaper" on its own will be
      read as free money.

      ⚠️ Unlike m6i, an arm64 class has TWO prerequisites, in this order:

        1. a workspace image with an arm64 manifest. Without it the slot launches and
           the task cannot pull anything that runs on it.
        2. Ec2SlotAmiArm64 below. The CP refuses to boot when an arm64 class is
           declared and that is empty, rather than showing a class in the admin UI
           that cannot launch.

      ⚠️ Adding a class moves nobody: Ec2DefaultSlotClass still decides where a member
      with no choice of their own lands. Changing the class of a member who already has
      a home makes their next start reinstall its architecture-dependent tools
      (docs/log/70 §70.5) — that is expected, and it costs them one slow start.
  Ec2SlotAmiArm64:
    Type: String
    Default: ""
    Description: >-
      SlotAmiIdArm64 output of the 40-ec2-pool stack. Required only when Ec2SlotTypes
      declares an arm64 class — the CP refuses to boot otherwise, rather than showing
      a class in the admin UI that cannot launch.
  Ec2DefaultSlotClass:
    Type: String
    Default: ""
    Description: >-
      The class id a member lands on with no per-user and no per-tenant value. Empty =
      the first class declared in Ec2SlotTypes. ⚠️ Moving this on a running deployment
      moves EVERY member who has not chosen for themselves, and each of their homes
      then reinstalls its architecture-dependent tools on the next start.
  Ec2MaxSlots:
    Type: String
    Default: "8"
    Description: >-
      Hard cap on instances in the pool. A slot is one concurrently RUNNING workspace,
      so size this like "how many people work at once", not "how many accounts exist".
      Start fails with a clear error at the cap instead of growing the bill.
  Ec2HostReserveMb:
    Type: String
    Default: auto
    Description: >-
      How much of a slot is held back from the WORKSPACE so the box's own daemons
      (dockerd, containerd, the ECS agent, SSM, the EFS stunnel) cannot be starved by
      it. "auto" = a fifth of the rung, clamped to 1-2 GiB: an 8 GiB slot's workspace is
      capped at 6.4 GiB, and the Console prints that number with the box beside it.
      "off" = uncapped, which is what every deployment did before this existed — and what
      melted a live slot on 2026-08-27 (docs/log/64 section 64.40): one workspace took enough
      anonymous memory that the kernel evicted all page cache, every daemon spent hours
      re-reading its own executable off disk, and the box stopped answering the cluster
      while still looking healthy to EC2. A plain number is that many MiB.
      NOTE: this is part of the task definition, so changing it replaces the running task
      at the owner's next start, exactly as an image change does.
  Ec2SlotSleepSec:
    Type: String
    Default: "900"
    Description: >-
      How long a slot may sit with no running task before the instance is STOPPED (not
      terminated — the image cache lives on its root volume). NOT the same thing as the
      idle-stop the product already has: AF_WS_IDLE_TIMEOUT / the per-tenant
      ws_idle_timeout watches the PERSON and stops their WORKSPACE on every runtime,
      while this one starts counting after that has happened and puts the BOX to sleep.
      They run in series (person leaves -> workspace stops -> slot sleeps). A sleeping
      slot costs only its root volume (~$9.6/month at 100 GiB) instead of ~$95 running,
      and its owner wakes it in ~110s.
      It governs BOTH kinds of dormant slot, from this one value: a slot still holding
      its owner's home (which stays ATTACHED while the slot sleeps — that is what keeps
      "the same user gets the same slot"), and a slot holding NO home at all, freed by an
      eviction, a size/class change, a Destroy, or the golden bake. No warm spare is kept:
      an empty RUNNING slot saves the next arrival ~67s and costs a full instance-hour,
      and this deployment keeps the box STOPPED instead (docs/log/64 §64.31).
      Set 0 to keep every slot running forever (fastest returns, highest bill).
  Ec2SlotTerminateAfterSec:
    Type: String
    Default: "0"
    Description: >-
      The step AFTER Ec2SlotSleepSec on the same clock, and the only one that gives the
      ROOT VOLUME back: past this the box is TERMINATED rather than left stopped.
      Why you want it: nothing else ever removes a box, so the number of retained roots
      only grows and its ceiling is Ec2MaxSlots. Raising Ec2MaxSlots to serve more people
      therefore also signs you up for Ec2MaxSlots x SlotRootVolumeGiB of gp3, permanently
      and whether or not anybody is working -- 30 x 40 GiB x $0.096/GB-month is ~$115 a
      month of stopped boxes. Measured on a live deployment; the only cure was terminating
      them by hand (docs/log/64 section 64.32).
      What it costs your users: 25 seconds, once, and only for the first arrival after the
      box is gone. Waking a dormant box that still holds its owner's home is 110s; building
      a new one from scratch is 135s. The image cache on the root volume saves the 32s cold
      pull, and instance boot plus ECS re-registration spends it again.
      There is deliberately NO warm floor ("keep N stopped boxes"). A dormant box is only
      reusable BY ITS OWNER -- for anybody else the wake, the attach and the mount SSM
      round trip come to 123-143s against 135s for a fresh box -- so a shared warm box is
      worth about nothing, and a floor would hold specific people's boxes through weekends
      and shutdowns. The 92 seconds that IS worth buying belongs to a RUNNING free slot,
      which costs ~$95/month, not $3.84.
      0 (the default) = never terminate, which is what every deployment did before this
      existed. 14400 (4h) is the recommended value: come back the same day and you get the
      110s path, come back tomorrow and you pay 135s.
      Must be >= Ec2SlotSleepSec to mean "sleep, then terminate"; a smaller value simply
      skips the sleeping stage.
  Ec2HibernateAfterSec:
    Type: String
    Default: "0"
    Description: >-
      The DEPLOYMENT DEFAULT for how long a home may sit unopened before it is
      snapshotted and its volume deleted; the next start restores it (ADR 0045 決定 4
      and 13-2). A tenant overrides it from the Console (Tenants > the tenant >
      "Hibernate unused homes"), so this is only what a tenant that has not chosen gets.
      ⚠️ This is the only automatic path in the product that moves a user's HOME, which
      is why 0 (off) is the default and why it is reversible: hibernation snapshots
      first and deletes only once the snapshot completes, so nothing is destroyed. What
      the user pays is the restore on their next start (about 122s) and a slower first
      day (restored blocks hydrate from S3 lazily, ~2.3x on first touch).
      What it saves: a home is billed on PROVISIONED size ($0.096/GB-month) and a
      snapshot on USED blocks ($0.05/GB-month), so a 50 GiB volume holding 20 GiB goes
      from $4.80 to about $1.00 a month. Judge it by last-opened date, not by size.
      Until this parameter existed the value could not be set on an ECS deployment at
      all -- there was no CFN parameter and a hand-edited task definition is overwritten
      by the next deploy. 2160h (90 days) is a reasonable starting point; leave it 0 and
      set it per tenant if the retention is theirs to choose.
  Ec2HomeGiB:
    Type: String
    Default: "50"
    Description: >-
      Default size of a user's persistent home volume (gp3). Unlike EFS this is billed
      as PROVISIONED ($0.096/GB-month vs EFS $0.36 for what you use), so the break-even
      fill rate is 26.7% — do not hand out volumes far larger than people fill.
  # --- WAF (optional, OFF by default) ---------------------------------------
  # ⚠️ ONLY rate limiting and IP reputation. The signature rule sets (Core rule
  # set, SQLi, XSS, LFI) are deliberately NOT offered here: this product carries
  # SOURCE CODE AND SHELL COMMANDS in ordinary request bodies — chat messages,
  # file writes, terminal input — so strings like `'; DROP TABLE`, `../../etc/passwd`
  # and `<script>` are legitimate traffic. Those rules would 403 real work at
  # random, and it would look like a product bug rather than a WAF decision (the
  # expensive part is the hours spent before anyone suspects the WAF). WAF also
  # inspects only the first 8 KB of a body by default, so a signature set here
  # buys less than it appears to.
  #
  # The cheaper, stronger control for a private deployment is upstream of this:
  # 00-network's AlbIngressCidr, which stops the traffic at the security group.
  WafRateLimitPer5Min:
    Type: Number
    Default: 0
    Description: >-
      Requests per 5 minutes from one IP before WAF blocks it (0 = no WAF at all).
      Counts every request including Console polling, so keep it well above what a
      whole office behind one NAT produces — 3000 is a sane starting point.
  WafIpReputation:
    Type: String
    Default: "off"
    AllowedValues: [ "off", "on" ]
    Description: >-
      Add AWS's managed IP reputation list (known scanners/botnets). Matches on the
      SOURCE, not on the body, so it cannot mangle legitimate agent traffic.
      Requires WafRateLimitPer5Min > 0 (that is what creates the web ACL).
  Fqdn:
    Type: String
    Description: >-
      Public host for the Console/API (ACM cert + Route53 alias), e.g.
      af.example.com. Required — pass your own domain.
  HostedZoneId:
    Type: String
    Description: >-
      Route53 hosted zone id for the Fqdn's domain. Required — the zone must be
      in this account (ACM DNS validation + alias record are created in it).
  PreviewDomain:
    Type: String
    Default: ""
    Description: >-
      Parent domain for the per-start preview subdomains (docs/81), e.g.
      pv.example.com. A workspace start mints a random slug and its services become
      reachable at https://{slug}-{port}.{PreviewDomain} — 3000 と 8080 のような
      2 ポート構成が、サブパスではなく **それぞれのルート直下**で開ける。

      Empty (the default) = the feature is OFF and nothing below is created; only
      the existing path-mode /preview/{port} exists.

      ★ ラベルは 1 段しか使えない。ACM のワイルドカード証明書が 1 段しか受け持たない
      ので、ポートは `{slug}-{port}` とラベルの中に前置してある（`{port}.{slug}.…` は
      `*.*.…` を要求して発行できない — ADR 0062 決定 2）。

      ⚠️ Console の FQDN の **子ではなく兄弟**を勧める（af.example.com に対して
      pv.example.com）。子（*.af.example.com）にすると、プレビューで動くアプリが
      .af.example.com のドメイン cookie を書けてしまい、Console の cookie を上書き /
      固定できる余地が残る（ADR 0062 決定 13）。

      ⚠️ この名前を含むゾーンが HostedZoneId でなければ、ACM の DNS 検証が終わらず
      **失敗ではなく「進まない」**形でスタックが止まる。
  CpPort:
    Type: Number
    Default: 8099
  CpCpu:
    Type: String
    Default: "512"
  CpMemory:
    Type: String
    Default: "1024"
  CpArch:
    Type: String
    Default: x86_64
    AllowedValues: [ x86_64, arm64 ]
    Description: >-
      Which CPU architecture the Control Plane's own Fargate task runs on (docs/log/72).
      arm64 = AWS Graviton: same task sizes, ~20% cheaper per vCPU-hour, and Service
      Connect works on it (AWS added Fargate/Graviton support to Service Connect in
      December 2022). Fargate platform version 1.4.0 or later is required, which
      LATEST already is.

      ⚠️ The prerequisite is the IMAGE, and there is exactly one: the tag in ImageTag
      must carry an arm64 manifest. Releases publish one only when publish-dist is
      run with control_plane_arm64 — it is off by default, so an ordinary release is
      amd64-only and setting this to arm64 against it leaves the service unable to
      place its task at all. Check before switching:

        crane manifest <repo>/af-control-plane:<tag> | jq -r '.manifests[].platform'
        (or: docker buildx imagetools inspect <repo>/af-control-plane:<tag>)

      ⚠️ ImageTag is shared by the CP and the workspace image, and their architectures
      are decided separately — this parameter for the CP, Ec2SlotTypes for the slots.
      A deployment can perfectly well run an arm64 CP over x86_64 slots or the reverse;
      neither reads the other's architecture.

      This defaults to x86_64 rather than to "unset" on purpose. Fargate assigns X86_64
      when runtimePlatform is omitted, so the default changes nothing about a running
      deployment — but it is now WRITTEN DOWN. Left implicit, the day the image gains
      an arm64 manifest is the day the architecture becomes a property of whatever
      Fargate happened to pick, and nobody would see it in the template.
  SsmPrefix:
    Type: String
    Default: /af-cp
    Description: SSM SecureString path prefix holding the CP secrets (created out of
      band before deploy — see README). Params - cookie-secret, master-key, plus
      google-client-secret / oidc-client-secret / github-client-secret depending on
      the IdPs in use.
  GoogleClientId:
    Type: String
    Default: ""
    Description: Google OAuth client id (not secret; the secret comes from SSM).
      Leave empty to sign in with the OIDC provider below instead.
  OidcProviderId:
    Type: String
    Default: ""
    AllowedPattern: "^[A-Z0-9_]*$"
    Description: >-
      Enable an OIDC IdP (Entra ID / Okta / Keycloak / Auth0 / Cognito / GitLab)
      under this id — UPPERCASE, e.g. ENTRA (it names the AF_OIDC_<ID>_* env). Empty
      = Google only. Its client secret must exist at <SsmPrefix>/oidc-client-secret.
      docs/log/61.
  OidcIssuer:
    Type: String
    Default: ""
    Description: >-
      AF_OIDC_<ID>_ISSUER, e.g. https://login.microsoftonline.com/<tenant-guid>/v2.0.
      ★ Pin Entra to your tenant guid — with /common/ or /organizations/ every
      Microsoft account in the world reaches the login and personal accounts can
      rewrite their own email, so the CP refuses to start unless OidcAllowedTids is set.
  OidcClientId:
    Type: String
    Default: ""
    Description: AF_OIDC_<ID>_CLIENT_ID (not secret; the secret comes from SSM).
  OidcTrust:
    Type: String
    Default: issuer
    AllowedValues: [ issuer, email_verified ]
    Description: >-
      AF_OIDC_<ID>_TRUST — why this IdP's email may be believed. issuer = the issuer
      is pinned to one tenant (Entra ID, which never emits email_verified).
      email_verified = accept only when the IdP asserts that claim (Okta / Keycloak / Auth0).
  OidcAllowedTids:
    Type: String
    Default: ""
    Description: AF_OIDC_<ID>_ALLOWED_TIDS — accepted Entra tenant ids. Required only
      when the issuer is the /common/ or /organizations/ endpoint.
  OidcLabelJa:
    Type: String
    Default: ""
    Description: Login button label, Japanese (default is generated from the id).
  OidcLabelEn:
    Type: String
    Default: ""
    Description: Login button label, English (default is generated from the id).
  GithubAllowedOrgs:
    Type: String
    Default: ""
    Description: >-
      AF_GITHUB_ALLOWED_ORGS — comma-separated GitHub orgs whose ACTIVE members may
      sign in. Setting this is what enables the GitHub button; its OAuth App secret
      must exist at <SsmPrefix>/github-client-secret, and the app needs the
      redirect URI https://<Fqdn>/oauth2/callback. ★ If the org restricts
      third-party OAuth apps, an org owner must approve the app or everyone is
      rejected. docs/log/61 §61.7.
  GithubClientId:
    Type: String
    Default: ""
    Description: GITHUB_OAUTH_CLIENT_ID (not secret; the secret comes from SSM). Sign-in
      only since docs/log/71 — the Console's GitHub "Connect" button reads the OAuth app the
      TENANT registered (Tenant settings -> Integrations), not this one.
  GithubAllowedDomains:
    Type: String
    Default: ""
    Description: >-
      AF_GITHUB_ALLOWED_DOMAINS — strongly recommended. GitHub hands us the
      account's PRIMARY VERIFIED address, which is a personal one for most people,
      and a personal address is a different person here: they get a new empty
      workspace rather than their own. Empty = the deployment-wide allowlist.
  AllowedEmails:
    Type: String
    Default: ""
    Description: AF_OAUTH_ALLOWED_EMAILS (comma-separated) permitted to sign in.
  AllowedDomains:
    Type: String
    Default: ""
    Description: AF_OAUTH_ALLOWED_DOMAINS (comma-separated email domains) permitted
      to sign in. Somebody invited to a tenant in the Admin panel also gets in
      without being listed here, so an invite-run deployment can leave both empty.
      Both empty AND nobody invited => every login is denied (fail closed), which
      is what a fresh stack looks like - set one to get your first admin in.
  SuperAdminEmails:
    Type: String
    Default: ""
    Description: SUPER_ADMIN_EMAILS (comma-separated). Read once at task start and
      treated as the only source of truth - an account removed from this list also
      loses the role in the database on the next start, so a handover completes for
      somebody who never signs in again. Changing it needs a service redeploy.
  AfProvision:
    Type: String
    Default: invite
    AllowedValues: [ invite, auto ]
    Description: >-
      AF_PROVISION - what happens to somebody who signs in with no tenant membership
      yet. invite (the default here) = they land on a "you haven't been invited yet"
      page until an admin adds them; auto = they are given a membership of the default
      tenant on the spot, so AF_OAUTH_ALLOWED_* is the only thing between a stranger
      and a workspace. A tenant's own auto_join_domains is checked BEFORE either.
      ★ Switching an existing stack to invite does NOT affect anyone already working:
      an existing membership is consulted first, so this only stops NEW auto-admissions.
      (The CP's built-in default is still auto - it is this template that starts closed,
      so a deployment that never set it keeps its behaviour until you redeploy.)
  AuthMode:
    Type: String
    Default: oauth
    AllowedValues: [ oauth, dev ]
    Description: >-
      CP auth mode. oauth (default) = the CP-native login (Google and/or OIDC). dev = fixed dev
      identity with NO login — sandbox/E2E gates only: restrict the ALB security
      group to your own IP before using it (an internet-facing ALB with dev auth
      hands out an authenticated session to anyone who reaches it).

Conditions:
  # Each IdP's client secret is pulled from SSM, and a Secrets entry pointing at a
  # parameter that doesn't exist stops the task from starting — so wire each one in
  # only when that IdP is actually configured.
  HasGoogle: !Not [ !Equals [ !Ref GoogleClientId, "" ] ]
  HasOidc: !Not [ !Equals [ !Ref OidcProviderId, "" ] ]
  # The org list, not the client id — historically GITHUB_OAUTH_CLIENT_ID also drove
  # the Console's git-connect device flow, which many deployments set without wanting a
  # login. That flow reads the tenant's own app since docs/log/71, but the switch stays the
  # org list: it is the thing that authorizes the sign-in.
  HasGithub: !Not [ !Equals [ !Ref GithubAllowedOrgs, "" ] ]
  # The rate limit is what creates the web ACL; reputation is an extra rule on it.
  HasPreviewDomain: !Not [ !Equals [ !Ref PreviewDomain, "" ] ]
  HasWaf: !Not [ !Equals [ !Ref WafRateLimitPer5Min, 0 ] ]
  HasWafReputation: !And [ !Condition HasWaf, !Equals [ !Ref WafIpReputation, "on" ] ]

Resources:
  Cert:
    Type: AWS::CertificateManager::Certificate
    Properties:
      DomainName: !Ref Fqdn
      ValidationMethod: DNS
      DomainValidationOptions:
        - DomainName: !Ref Fqdn
          HostedZoneId: !Ref HostedZoneId

  Alb:
    Type: AWS::ElasticLoadBalancingV2::LoadBalancer
    Properties:
      Name: !Sub "af-${AWS::StackName}"
      Scheme: internet-facing
      Type: application
      Subnets: !Split [ ",", !ImportValue { "Fn::Sub": "${NetworkStackName}-PublicSubnets" } ]
      SecurityGroups:
        - Fn::ImportValue: !Sub "${NetworkStackName}-AlbSgId"
      # Spelled out at the AWS default (60s) rather than left implicit: it is the
      # hard ceiling on every CP request, and a handler that outran it is what
      # turned a cold workspace Start into a 504 (docs/log/62 §62.5). The CP now
      # answers Start immediately and reports convergence through GET
      # /api/workspace, so raise this only for a NEW long-poll — never to let a
      # handler block longer.
      LoadBalancerAttributes:
        - { Key: idle_timeout.timeout_seconds, Value: "60" }

  # --- WAF (only when WafRateLimitPer5Min > 0) --------------------------------
  WebAcl:
    Type: AWS::WAFv2::WebACL
    Condition: HasWaf
    Properties:
      Name: !Sub "af-${AWS::StackName}"
      Scope: REGIONAL
      DefaultAction: { Allow: {} }
      VisibilityConfig:
        SampledRequestsEnabled: true
        CloudWatchMetricsEnabled: true
        MetricName: !Sub "af-${AWS::StackName}"
      Rules:
        # Rate limit first: it is the one rule that protects the login endpoint and
        # the API from a flood, and it decides on the SOURCE rather than the body.
        - Name: rate-limit
          Priority: 0
          Action: { Block: {} }
          Statement:
            RateBasedStatement:
              Limit: !Ref WafRateLimitPer5Min
              AggregateKeyType: IP
          VisibilityConfig:
            SampledRequestsEnabled: true
            CloudWatchMetricsEnabled: true
            MetricName: !Sub "af-${AWS::StackName}-rate"
        - !If
          - HasWafReputation
          - Name: ip-reputation
            Priority: 1
            OverrideAction: { None: {} }
            Statement:
              ManagedRuleGroupStatement:
                VendorName: AWS
                Name: AWSManagedRulesAmazonIpReputationList
            VisibilityConfig:
              SampledRequestsEnabled: true
              CloudWatchMetricsEnabled: true
              MetricName: !Sub "af-${AWS::StackName}-reputation"
          - !Ref AWS::NoValue

  WebAclAssociation:
    Type: AWS::WAFv2::WebACLAssociation
    Condition: HasWaf
    Properties:
      ResourceArn: !Ref Alb
      WebACLArn: !GetAtt WebAcl.Arn

  TargetGroup:
    Type: AWS::ElasticLoadBalancingV2::TargetGroup
    Properties:
      VpcId:
        Fn::ImportValue: !Sub "${NetworkStackName}-VpcId"
      Port: !Ref CpPort
      Protocol: HTTP
      TargetType: ip                     # Fargate awsvpc = register by ENI IP
      HealthCheckPath: /healthz          # CP serves this unauthenticated
      HealthCheckProtocol: HTTP
      Matcher: { HttpCode: "200" }
      TargetGroupAttributes:
        - { Key: deregistration_delay.timeout_seconds, Value: "30" }

  Listener443:
    Type: AWS::ElasticLoadBalancingV2::Listener
    Properties:
      LoadBalancerArn: !Ref Alb
      Port: 443
      Protocol: HTTPS
      SslPolicy: ELBSecurityPolicy-TLS13-1-2-2021-06
      Certificates:
        - CertificateArn: !Ref Cert
      DefaultActions:
        - Type: forward
          TargetGroupArn: !Ref TargetGroup

  # --- preview subdomains (docs/81), only when PreviewDomain is set -----------
  # ★ 既存の Cert には触らない。SAN を足す形は **証明書の置換**になり、Console が今
  # 出せている TLS を「プレビューを足す」という理由で作り直すことになる。リスナーは
  # SNI で追加証明書を選べるので、2 枚目として貼る（やめるときは外すだけ・決定 4）。
  PreviewCert:
    Type: AWS::CertificateManager::Certificate
    Condition: HasPreviewDomain
    Properties:
      DomainName: !Sub "*.${PreviewDomain}"
      ValidationMethod: DNS
      DomainValidationOptions:
        - DomainName: !Sub "*.${PreviewDomain}"
          HostedZoneId: !Ref HostedZoneId

  PreviewListenerCert:
    Type: AWS::ElasticLoadBalancingV2::ListenerCertificate
    Condition: HasPreviewDomain
    Properties:
      ListenerArn: !Ref Listener443
      Certificates:
        - CertificateArn: !Ref PreviewCert

  # ワイルドカード 1 本で全 Workspace・全ポートを受け持つ。★ Workspace ごとに
  # レコードを書く設計にはしない —— 起動のたびに API 往復と伝播待ちが乗り、レコード数の
  # クォータにも当たる。発行コスト 0・伝播待ち 0 がホスト方式の数少ない「ただの得」で、
  # そこを崩すと残るのは複雑さだけになる（決定 5）。
  PreviewDnsRecord:
    Type: AWS::Route53::RecordSet
    Condition: HasPreviewDomain
    Properties:
      HostedZoneId: !Ref HostedZoneId
      Name: !Sub "*.${PreviewDomain}"
      Type: A
      AliasTarget:
        DNSName: !GetAtt Alb.DNSName
        HostedZoneId: !GetAtt Alb.CanonicalHostedZoneID

  Listener80:
    Type: AWS::ElasticLoadBalancingV2::Listener
    Properties:
      LoadBalancerArn: !Ref Alb
      Port: 80
      Protocol: HTTP
      DefaultActions:
        - Type: redirect
          RedirectConfig: { Protocol: HTTPS, Port: "443", StatusCode: HTTP_301 }

  LogGroup:
    Type: AWS::Logs::LogGroup
    DeletionPolicy: Delete
    Properties:
      LogGroupName: !Sub "/af/${AWS::StackName}/cp"
      RetentionInDays: 7

  # Workspace tasks (created by the CP at runtime) log here — the CP passes this
  # group name to each task definition via AF_ECS_LOG_GROUP.
  WsLogGroup:
    Type: AWS::Logs::LogGroup
    DeletionPolicy: Delete
    Properties:
      LogGroupName: !Sub "/af/${AWS::StackName}/ws"
      RetentionInDays: 7

  TaskDef:
    Type: AWS::ECS::TaskDefinition
    Properties:
      Family: !Sub "af-${AWS::StackName}-cp"
      RequiresCompatibilities: [ FARGATE ]
      NetworkMode: awsvpc
      Cpu: !Ref CpCpu
      Memory: !Ref CpMemory
      # Declared, not inferred (docs/log/72). Fargate defaults an omitted cpuArchitecture
      # to X86_64 — which is why leaving this out has worked so far — but that default
      # is applied when the TASK STARTS, not when the definition is registered, so
      # `describe-task-definition` shows runtimePlatform: null and the architecture the
      # CP actually runs on is nowhere in the template. Stating it also makes the value
      # part of the definition's identity, so switching CpArch produces a new revision
      # and a rolling deployment rather than a no-op.
      # ⚠️ EC2 does NOT share this default (docs/log/70 §70.8): there an omitted
      # runtimePlatform stays null and placement decides. Only Fargate fills it in.
      RuntimePlatform:
        CpuArchitecture: !Ref CpArch
        OperatingSystemFamily: LINUX
      ExecutionRoleArn:
        Fn::ImportValue: !Sub "${PlatformStackName}-ExecRoleArn"
      TaskRoleArn:
        Fn::ImportValue: !Sub "${PlatformStackName}-CpTaskRoleArn"
      ContainerDefinitions:
        - Name: cp
          Essential: true
          Image: !Sub
            - "${Uri}:${Tag}"
            - Uri: !ImportValue { "Fn::Sub": "${PlatformStackName}-EcrControlPlaneUri" }
              Tag: !Ref ImageTag
          PortMappings:
            - ContainerPort: !Ref CpPort
          Environment:
            # ECS/awsvpc: the ALB reaches the task over its ENI, so CP must bind
            # non-loopback (the CpSg restricts 8099 ingress to the ALB SG — the
            # network isolation the compose loopback bind gives on a single box).
            - { Name: CP_ADDR, Value: !Sub "0.0.0.0:${CpPort}" }
            - { Name: WS_DATA, Value: /tmp }   # unused for state now (store = RDS/Postgres, below)
            # MetadataStore = RDS Postgres (P3-7 stage 3a): survives CP task replacement.
            # The CP composes the DSN from these parts; the password arrives as a
            # secret (below) so it never sits in a plaintext URL/env.
            - { Name: AF_DB_HOST, Value: !ImportValue { "Fn::Sub": "${DataStackName}-DbEndpoint" } }
            - { Name: AF_DB_PORT, Value: !ImportValue { "Fn::Sub": "${DataStackName}-DbPort" } }
            - { Name: AF_DB_NAME, Value: agentfleet }
            - { Name: AF_DB_USER, Value: afadmin }
            # ⚠️ Exactly one proxy sits in front of the CP here: this ALB. The CP needs
            # to be TOLD, because it cannot tell — without this, r.RemoteAddr is the load
            # balancer and every request looks like it comes from the same private
            # address. That is what a tenant's source-network restriction is matched
            # against (docs/log/66, ADR 0047 決定 2), so a wrong value here is either "the
            # rule never matches anyone" or "the rule matches everyone".
            - { Name: AF_TRUSTED_PROXY_HOPS, Value: "1" }
            - { Name: AUTH, Value: !Ref AuthMode }
            - { Name: PUBLIC_BASE_URL, Value: !Sub "https://${Fqdn}" }
            - { Name: PUBLIC_DOMAIN, Value: !Ref Fqdn }
            # docs/81: プレビュー用サブドメインの親。空なら CP はホスト方式の振り分けを
            # 一切登録しない（従来のパス方式だけが残る）。
            - { Name: AF_PREVIEW_DOMAIN, Value: !Ref PreviewDomain }
            - { Name: GOOGLE_OAUTH_CLIENT_ID, Value: !Ref GoogleClientId }
            - { Name: AF_OAUTH_ALLOWED_EMAILS, Value: !Ref AllowedEmails }
            - { Name: AF_OAUTH_ALLOWED_DOMAINS, Value: !Ref AllowedDomains }
            - { Name: SUPER_ADMIN_EMAILS, Value: !Ref SuperAdminEmails }
            - { Name: AF_PROVISION, Value: !Ref AfProvision }
            # Generic OIDC IdP (docs/log/61). The redirect URI stays the single
            # https://<Fqdn>/oauth2/callback whether or not this is enabled.
            - { Name: AF_OIDC_PROVIDERS, Value: !Ref OidcProviderId }
            - !If [ HasOidc, { Name: !Sub "AF_OIDC_${OidcProviderId}_ISSUER", Value: !Ref OidcIssuer }, !Ref "AWS::NoValue" ]
            - !If [ HasOidc, { Name: !Sub "AF_OIDC_${OidcProviderId}_CLIENT_ID", Value: !Ref OidcClientId }, !Ref "AWS::NoValue" ]
            - !If [ HasOidc, { Name: !Sub "AF_OIDC_${OidcProviderId}_TRUST", Value: !Ref OidcTrust }, !Ref "AWS::NoValue" ]
            - !If [ HasOidc, { Name: !Sub "AF_OIDC_${OidcProviderId}_ALLOWED_TIDS", Value: !Ref OidcAllowedTids }, !Ref "AWS::NoValue" ]
            - !If [ HasOidc, { Name: !Sub "AF_OIDC_${OidcProviderId}_LABEL_JA", Value: !Ref OidcLabelJa }, !Ref "AWS::NoValue" ]
            - !If [ HasOidc, { Name: !Sub "AF_OIDC_${OidcProviderId}_LABEL_EN", Value: !Ref OidcLabelEn }, !Ref "AWS::NoValue" ]
            # GitHub sign-in (docs/log/61 §61.7).
            - { Name: GITHUB_OAUTH_CLIENT_ID, Value: !Ref GithubClientId }
            - { Name: AF_GITHUB_ALLOWED_ORGS, Value: !Ref GithubAllowedOrgs }
            - { Name: AF_GITHUB_ALLOWED_DOMAINS, Value: !Ref GithubAllowedDomains }
            # ★ No BITBUCKET_OAUTH_* and no workspace GITHUB_OAUTH_CLIENT_ID: the git
            # providers' OAuth apps are per-tenant rows since docs/log/71, registered in the
            # Console under Tenant settings -> Integrations -> Git provider OAuth. The CP
            # still owns the Bitbucket callback and derives it from PUBLIC_BASE_URL above.
            # AF_RUNTIME=ecs = the P3-7 stage-2 adapter (Fargate). AF_RUNTIME=ecs-ec2
            # keeps the same substrate but puts workspaces on a pool of EC2 slots with a
            # persistent per-user EBS home (docs/log/64, ADR 0045 決定 10) — deploy the
            # 40-ec2-pool stack and set WsRuntime=ecs-ec2 + Ec2SlotLaunchTemplate.
            # Rolling back is this one parameter. The AF_ECS_* below are shared by both.
            - { Name: AF_RUNTIME, Value: !Ref WsRuntime }
            - { Name: AF_ECS_REGION, Value: !Ref "AWS::Region" }
            - { Name: AF_ECS_CLUSTER, Value: !ImportValue { "Fn::Sub": "${PlatformStackName}-ClusterName" } }
            - { Name: AF_ECS_SUBNETS, Value: !ImportValue { "Fn::Sub": "${NetworkStackName}-PrivateSubnets" } }
            - { Name: AF_ECS_SECURITY_GROUP, Value: !ImportValue { "Fn::Sub": "${NetworkStackName}-WsSgId" } }
            - { Name: AF_ECS_EFS_ID, Value: !ImportValue { "Fn::Sub": "${DataStackName}-EfsId" } }
            - { Name: AF_ECS_NAMESPACE_ARN, Value: !ImportValue { "Fn::Sub": "${PlatformStackName}-NamespaceArn" } }
            - { Name: AF_ECS_EXEC_ROLE, Value: !ImportValue { "Fn::Sub": "${PlatformStackName}-ExecRoleArn" } }
            - { Name: AF_ECS_TASK_ROLE, Value: !ImportValue { "Fn::Sub": "${PlatformStackName}-WsTaskRoleArn" } }
            - { Name: AF_ECS_LOG_GROUP, Value: !Ref WsLogGroup }
            - { Name: AF_ECS_TASK_CPU, Value: !Ref WsTaskCpu }
            - { Name: AF_ECS_TASK_MEMORY, Value: !Ref WsTaskMemory }
            - { Name: AF_ECS_WS_DISK_GB, Value: !Ref WsDiskGiB }
            # --- EC2 slot pool (only read when WsRuntime=ecs-ec2) ---
            - { Name: AF_ECS_EC2_LAUNCH_TEMPLATE, Value: !Ref Ec2SlotLaunchTemplate }
            - { Name: AF_ECS_EC2_SLOT_TYPES, Value: !Ref Ec2SlotTypes }
            - { Name: AF_ECS_EC2_AMI_ARM64, Value: !Ref Ec2SlotAmiArm64 }
            - { Name: AF_ECS_EC2_DEFAULT_SLOT_CLASS, Value: !Ref Ec2DefaultSlotClass }
            - { Name: AF_ECS_EC2_MAX_SLOTS, Value: !Ref Ec2MaxSlots }
            - { Name: AF_ECS_EC2_HOST_RESERVE_MB, Value: !Ref Ec2HostReserveMb }
            - { Name: AF_ECS_EC2_SLOT_SLEEP_SEC, Value: !Ref Ec2SlotSleepSec }
            - { Name: AF_ECS_EC2_SLOT_TERMINATE_AFTER_SEC, Value: !Ref Ec2SlotTerminateAfterSec }
            - { Name: AF_ECS_EC2_HIBERNATE_AFTER_SEC, Value: !Ref Ec2HibernateAfterSec }
            - { Name: AF_ECS_EC2_HOME_GB, Value: !Ref Ec2HomeGiB }
            # Start returns as soon as the service is at desiredCount 1; the Agent
            # readiness poll runs in the background for the log line only, on the
            # AF_ECS_START_TIMEOUT_SEC budget (default 300s). Nothing waits on it,
            # so it is deliberately longer than the ALB idle timeout above.
            - Name: AF_ECS_WORKSPACE_IMAGE
              Value: !Sub
                - "${Uri}:${Tag}"
                - Uri: !ImportValue { "Fn::Sub": "${PlatformStackName}-EcrWorkspaceUri" }
                  Tag: !Ref ImageTag
          Secrets:
            # RDS-managed master password (Secrets Manager JSON → the `password` key).
            - Name: AF_DB_PASSWORD
              ValueFrom: !Sub
                - "${Arn}:password::"
                - Arn: !ImportValue { "Fn::Sub": "${DataStackName}-DbSecretArn" }
            - !If
              - HasGoogle
              - Name: GOOGLE_OAUTH_CLIENT_SECRET
                ValueFrom: !Sub "arn:aws:ssm:${AWS::Region}:${AWS::AccountId}:parameter${SsmPrefix}/google-client-secret"
              - !Ref "AWS::NoValue"
            - !If
              - HasOidc
              - Name: !Sub "AF_OIDC_${OidcProviderId}_CLIENT_SECRET"
                ValueFrom: !Sub "arn:aws:ssm:${AWS::Region}:${AWS::AccountId}:parameter${SsmPrefix}/oidc-client-secret"
              - !Ref "AWS::NoValue"
            - !If
              - HasGithub
              - Name: GITHUB_OAUTH_CLIENT_SECRET
                ValueFrom: !Sub "arn:aws:ssm:${AWS::Region}:${AWS::AccountId}:parameter${SsmPrefix}/github-client-secret"
              - !Ref "AWS::NoValue"
            - Name: AF_COOKIE_SECRET
              ValueFrom: !Sub "arn:aws:ssm:${AWS::Region}:${AWS::AccountId}:parameter${SsmPrefix}/cookie-secret"
            - Name: AF_MASTER_KEY
              ValueFrom: !Sub "arn:aws:ssm:${AWS::Region}:${AWS::AccountId}:parameter${SsmPrefix}/master-key"
          LogConfiguration:
            LogDriver: awslogs
            Options:
              awslogs-group: !Ref LogGroup
              awslogs-region: !Ref "AWS::Region"
              awslogs-stream-prefix: cp

  Service:
    Type: AWS::ECS::Service
    DependsOn: Listener443
    Properties:
      ServiceName: !Sub "af-${AWS::StackName}-cp"
      Cluster: !ImportValue { "Fn::Sub": "${PlatformStackName}-ClusterArn" }
      TaskDefinition: !Ref TaskDef
      DesiredCount: 1
      LaunchType: FARGATE
      HealthCheckGracePeriodSeconds: 60
      NetworkConfiguration:
        AwsvpcConfiguration:
          AssignPublicIp: DISABLED
          Subnets: !Split [ ",", !ImportValue { "Fn::Sub": "${NetworkStackName}-PrivateSubnets" } ]
          SecurityGroups:
            - Fn::ImportValue: !Sub "${NetworkStackName}-CpSgId"
      LoadBalancers:
        - TargetGroupArn: !Ref TargetGroup
          ContainerName: cp
          ContainerPort: !Ref CpPort
      # CP as a Service Connect client so it can resolve workspace Agents by
      # <service>.<namespace> once the stage-2 adapter creates them.
      ServiceConnectConfiguration:
        Enabled: true
        Namespace: !ImportValue { "Fn::Sub": "${PlatformStackName}-NamespaceArn" }

  DnsRecord:
    Type: AWS::Route53::RecordSet
    Properties:
      HostedZoneId: !Ref HostedZoneId
      Name: !Ref Fqdn
      Type: A
      AliasTarget:
        DNSName: !GetAtt Alb.DNSName
        HostedZoneId: !GetAtt Alb.CanonicalHostedZoneID

Outputs:
  Url:
    Value: !Sub "https://${Fqdn}"
  AlbDnsName:
    Value: !GetAtt Alb.DNSName
