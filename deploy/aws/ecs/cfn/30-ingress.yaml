AWSTemplateFormatVersion: "2010-09-09"
Description: >-
  agent-fleet ECS adapter (P3-7) — ingress + Control Plane service. ACM cert (DNS-
  validated via Route53), an internet-facing ALB that only terminates TLS (auth is
  the CP-native login, AUTH=oauth — no ALB OIDC), the CP/Console Fargate service
  (Service Connect client so it can reach the workspace Agents it provisions), and
  the Route53 alias. Imports 00-network, 10-data (EFS + RDS) and 20-platform. The CP
  is wired with AF_ECS_* so the stage-2 ecsRuntime provisions workspaces on demand, and
  its MetadataStore is RDS Postgres (stage 3a) so state survives task replacement.

Parameters:
  # Anything too long for one line is in PARAMETERS.md next door (measurements, trade-offs,
  # traps). These are terse because of the 51,200-byte template limit: a YAML comment counts
  # toward the body exactly like a Description, so moving prose into a `#` does not shrink
  # the template — only moving it out of the file does.
  NetworkStackName:
    Type: String
    Default: af-ecs-network
  PlatformStackName:
    Type: String
    Default: af-ecs-platform
  DataStackName:
    Type: String
    Default: af-ecs-data
    Description: Name of the 10-data stack (EFS filesystem for workspace homes).
  ImageTag:
    Type: String
    Default: dev
    Description: >-
      Tag of BOTH the af-control-plane and af-workspace images in ECR (=VERSION).
      Upgrade = push a new tag and re-deploy with only this overridden; running
      workspaces are untouched and pick it up on their next Start.
  WsTaskCpu:
    Type: String
    Default: "1024"
    Description: >-
      Default Fargate CPU units for a workspace task (1024 = 1 vCPU). Only
      256/512/1024/2048/4096/8192/16384 are valid, and only in Fargate's (cpu, memory) pairs.
  WsTaskMemory:
    Type: String
    Default: "2048"
    Description: >-
      Default workspace task memory in MiB. Must be a valid pair with WsTaskCpu (1 vCPU
      allows 2048-8192 in 1024 steps). 2048 is tight for real use — see PARAMETERS.md.
  WsDiskGiB:
    Type: String
    Default: "50"
    Description: >-
      Default per-workspace WORKING disk in GiB (wiped on stop; only the EFS home persists).
      0 keeps Fargate's free 20 GiB; 21-200 sets ephemeral storage. ⚠️ Also the switch that
      moves caches and build artifacts off EFS — it arms only at 30 or more. PARAMETERS.md.
  WsRuntime:
    Type: String
    Default: ecs
    AllowedValues: [ ecs, ecs-ec2 ]
    Description: >-
      Which Runtime adapter the CP uses. ecs = Fargate (shipped default). ecs-ec2 = a pool of
      EC2 slots with a persistent per-user EBS home; requires the 40-ec2-pool stack and
      Ec2SlotLaunchTemplate. Choose it for I/O and persistence, NOT for start latency.
  Ec2SlotLaunchTemplate:
    Type: String
    Default: ""
    Description: >-
      SlotLaunchTemplateId output of the 40-ec2-pool stack (lt-…). Required when
      WsRuntime=ecs-ec2 — the CP refuses to boot on that profile without it.
  Ec2SlotTypes:
    Type: String
    Default: "standard|Standard (Intel)|x86_64|m7i.large:8192:2,m7i.xlarge:16384:4,m7i.2xlarge:32768:8;saver|Lower cost (Intel, previous gen)|x86_64|m6i.large:8192:2,m6i.xlarge:16384:4,m6i.2xlarge:32768:8"
    Description: >-
      The slot sizes the pool may run; a workspace lands on the smallest rung that holds its
      memory request and gets the whole box. Either `instanceType:memoryMiB[:vcpu],…` (one
      unnamed x86_64 class) or `id|label|arch|<ladder>[;…]` (one class per entry). arch is
      declared, never guessed. ⚠️ Changing it moves nobody — see Ec2DefaultSlotClass. Adding
      an arm64 class needs an arm64 workspace image AND Ec2SlotAmiArm64. PARAMETERS.md.
  Ec2SlotAmiArm64:
    Type: String
    Default: ""
    Description: >-
      SlotAmiIdArm64 output of the 40-ec2-pool stack. Required only when Ec2SlotTypes
      declares an arm64 class — the CP refuses to boot otherwise.
  Ec2DefaultSlotClass:
    Type: String
    Default: ""
    Description: >-
      The class id a member lands on with no per-user and no per-tenant value. Empty = the
      first class in Ec2SlotTypes. ⚠️ Moving it moves EVERY member who has not chosen.
  Ec2MaxSlots:
    Type: String
    Default: "8"
    Description: >-
      Hard cap on instances in the pool. A slot is one concurrently RUNNING workspace, so
      size it like "how many people work at once". Start fails at the cap, clearly.
  Ec2HostReserveMb:
    Type: String
    Default: auto
    Description: >-
      How much of a slot is held back from the workspace so the box's own daemons cannot be
      starved. auto = a fifth of the rung, clamped to 1-2 GiB; off = uncapped (what melted a
      live slot on 2026-08-27); a number = that many MiB. PARAMETERS.md.
  Ec2SlotSleepSec:
    Type: String
    Default: "900"
    Description: >-
      How long a slot may sit with no running task before the instance is STOPPED (the image
      cache lives on its root volume). Not the per-person idle-stop — this starts counting
      after that. Sleeping ~$9.6/month vs ~$95 running; the owner wakes it in ~110s.
      0 = keep every slot running forever. PARAMETERS.md.
  Ec2SlotTerminateAfterSec:
    Type: String
    Default: "0"
    Description: >-
      The step after Ec2SlotSleepSec on the same clock, and the only one that gives the ROOT
      VOLUME back. 0 (default) = never terminate, so retained roots only grow to Ec2MaxSlots
      × SlotRootVolumeGiB of gp3. 14400 (4h) is the recommended value; it costs the next
      arrival 25s. Must be >= Ec2SlotSleepSec. PARAMETERS.md.
  Ec2HibernateAfterSec:
    Type: String
    Default: "0"
    Description: >-
      Deployment default for how long a home may sit unopened before it is snapshotted and
      its volume deleted; the next start restores it (~122s). A tenant overrides it from the
      Console. ⚠️ The only automatic path that moves a user's HOME — hence 0 (off) by
      default, and it snapshots before deleting. 2160h (90d) is a sane start. PARAMETERS.md.
  Ec2HomeGiB:
    Type: String
    Default: "50"
    Description: >-
      Default size of a user's persistent home volume (gp3). Billed on PROVISIONED size, so
      the break-even fill rate against EFS is 26.7% — do not over-provision.
  # --- Scheduled execution (docs/log/38) ------------------------------------
  # ⚠️ EMPTY means "keep the product default" for all four; the defaults live in the CP
  # (control-plane/main.go). Copying them here would freeze this deployment on whatever they
  # were the day the stack was written.
  SchedulerInterval:
    Type: String
    Default: ""
    Description: >-
      Tick cadence of the scheduled-execution loop (Go duration, default 1m). "0"
      hard-disables timed execution and the Console hides the Schedules section.
  ScheduleWakeTimeout:
    Type: String
    Default: ""
    Description: >-
      How long one fire waits for the woken workspace's Agent to answer (Go duration,
      default 300s). ⚠️ Do not lower this on ecs-ec2 without measuring — the clock starts
      ~20s before the adapter's own, and the same workspace measured 65-131s. PARAMETERS.md.
  ScheduleSettle:
    Type: String
    Default: ""
    Description: >-
      How long a schedule-woken workspace is held up so the reaper cannot stop it out from
      under the session it just started (Go duration, default 5m).
  ScheduleJitter:
    Type: String
    Default: ""
    Description: >-
      Deterministic spread applied to CRON fires so 09:00 does not wake everyone at once (Go
      duration, default 2m; "0" = the exact slot). Derived from the schedule id, so next_run
      and {{time}} still show the requested time.

  # --- WAF (optional, OFF by default) ---------------------------------------
  # ⚠️ ONLY rate limiting and IP reputation. The signature rule sets (Core rule set, SQLi,
  # XSS, LFI) are deliberately NOT offered: this product carries source code and shell
  # commands in ordinary request bodies, so they would 403 real work at random and look like
  # a product bug. The stronger control is upstream — 00-network's AlbIngressCidr.
  WafRateLimitPer5Min:
    Type: Number
    Default: 0
    Description: >-
      Requests per 5 minutes from one IP before WAF blocks it (0 = no WAF at all). Counts
      Console polling too, so keep it well above one office behind one NAT — 3000 to start.
  WafIpReputation:
    Type: String
    Default: "off"
    AllowedValues: [ "off", "on" ]
    Description: >-
      Add AWS's managed IP reputation list (known scanners/botnets). Matches on the SOURCE,
      not the body. Requires WafRateLimitPer5Min > 0 (that is what creates the web ACL).
  Fqdn:
    Type: String
    Description: >-
      Public host for the Console/API (ACM cert + Route53 alias), e.g.
      af.example.com. Required — pass your own domain.
  HostedZoneId:
    Type: String
    Description: >-
      Route53 hosted zone id for the Fqdn's domain. Required — the zone must be
      in this account (ACM DNS validation + alias record are created in it).
  PreviewDomain:
    Type: String
    Default: ""
    Description: >-
      Parent domain for the per-start preview subdomains (docs/81), e.g. pv.example.com;
      services become reachable at https://{slug}-{port}.{PreviewDomain}. Empty (default) =
      the feature is off and only path-mode /preview/{port} exists. ⚠️ Use a SIBLING of the
      Console FQDN, not a child (cookie scope — ADR 0062 decision 13), and make sure a zone you
      pass here or in PreviewHostedZoneId contains it, or ACM validation never finishes and
      the stack stalls rather than fails. PARAMETERS.md.
  PreviewHostedZoneId:
    Type: String
    Default: ""
    Description: >-
      Route53 hosted zone id containing PreviewDomain, when that is NOT the Console's zone
      (a delegated sibling zone). Empty = use HostedZoneId. Affects only the preview
      certificate validation and the wildcard A record. PARAMETERS.md.
  CpPort:
    Type: Number
    Default: 8099
  CpCpu:
    Type: String
    Default: "512"
  CpMemory:
    Type: String
    Default: "1024"
  CpArch:
    Type: String
    Default: x86_64
    AllowedValues: [ x86_64, arm64 ]
    Description: >-
      CPU architecture of the Control Plane's own Fargate task (docs/log/72). arm64 =
      Graviton, ~20% cheaper per vCPU-hour. ⚠️ The one prerequisite is the IMAGE: the tag in
      ImageTag must carry an arm64 manifest, and an ordinary release is amd64-only, so check
      first or the service cannot place its task at all. Independent of the slots'
      architecture (Ec2SlotTypes). PARAMETERS.md.
  SsmPrefix:
    Type: String
    Default: /af-cp
    Description: SSM SecureString path prefix holding the CP secrets (created out of
      band before deploy — see README). Params - cookie-secret, master-key, plus
      google-client-secret / oidc-client-secret / github-client-secret depending on
      the IdPs in use.
  GoogleClientId:
    Type: String
    Default: ""
    Description: Google OAuth client id (not secret; the secret comes from SSM).
      Leave empty to sign in with the OIDC provider below instead.
  OidcProviderId:
    Type: String
    Default: ""
    AllowedPattern: "^[A-Z0-9_]*$"
    Description: >-
      Enable an OIDC IdP (Entra ID / Okta / Keycloak / Auth0 / Cognito / GitLab)
      under this id — UPPERCASE, e.g. ENTRA (it names the AF_OIDC_<ID>_* env). Empty
      = Google only. Its client secret must exist at <SsmPrefix>/oidc-client-secret.
      docs/log/61.
  OidcIssuer:
    Type: String
    Default: ""
    Description: >-
      AF_OIDC_<ID>_ISSUER, e.g. https://login.microsoftonline.com/<tenant-guid>/v2.0.
      ★ Pin Entra to your tenant guid — with /common/ or /organizations/ every
      Microsoft account in the world reaches the login and personal accounts can
      rewrite their own email, so the CP refuses to start unless OidcAllowedTids is set.
  OidcClientId:
    Type: String
    Default: ""
    Description: AF_OIDC_<ID>_CLIENT_ID (not secret; the secret comes from SSM).
  OidcTrust:
    Type: String
    Default: issuer
    AllowedValues: [ issuer, email_verified ]
    Description: >-
      AF_OIDC_<ID>_TRUST — why this IdP's email may be believed. issuer = the issuer
      is pinned to one tenant (Entra ID, which never emits email_verified).
      email_verified = accept only when the IdP asserts that claim (Okta / Keycloak / Auth0).
  OidcAllowedTids:
    Type: String
    Default: ""
    Description: AF_OIDC_<ID>_ALLOWED_TIDS — accepted Entra tenant ids. Required only
      when the issuer is the /common/ or /organizations/ endpoint.
  OidcLabelJa:
    Type: String
    Default: ""
    Description: Login button label, Japanese (default is generated from the id).
  OidcLabelEn:
    Type: String
    Default: ""
    Description: Login button label, English (default is generated from the id).
  GithubAllowedOrgs:
    Type: String
    Default: ""
    Description: >-
      AF_GITHUB_ALLOWED_ORGS — comma-separated GitHub orgs whose ACTIVE members may sign in.
      Setting this is what enables the GitHub button; its OAuth App secret must exist at
      <SsmPrefix>/github-client-secret and the app needs the redirect URI
      https://<Fqdn>/oauth2/callback. ★ An org that restricts third-party OAuth apps must
      approve it or everyone is rejected. docs/log/61 §61.7.
  GithubClientId:
    Type: String
    Default: ""
    Description: GITHUB_OAUTH_CLIENT_ID (not secret; the secret comes from SSM). Sign-in
      only since docs/log/71 — the Console's GitHub "Connect" button reads the OAuth app the
      TENANT registered (Tenant settings -> Integrations), not this one.
  GithubAllowedDomains:
    Type: String
    Default: ""
    Description: >-
      AF_GITHUB_ALLOWED_DOMAINS — strongly recommended. GitHub hands us the account's PRIMARY
      VERIFIED address, personal for most people, and a personal address is a DIFFERENT
      person here: they get a new empty workspace. Empty = the deployment-wide allowlist.
  AllowedEmails:
    Type: String
    Default: ""
    Description: AF_OAUTH_ALLOWED_EMAILS (comma-separated) permitted to sign in.
  AllowedDomains:
    Type: String
    Default: ""
    Description: AF_OAUTH_ALLOWED_DOMAINS (comma-separated email domains) permitted
      to sign in. Somebody invited to a tenant in the Admin panel also gets in
      without being listed here, so an invite-run deployment can leave both empty.
      Both empty AND nobody invited => every login is denied (fail closed), which
      is what a fresh stack looks like - set one to get your first admin in.
  SuperAdminEmails:
    Type: String
    Default: ""
    Description: SUPER_ADMIN_EMAILS (comma-separated). Read once at task start and
      treated as the only source of truth - an account removed from this list also
      loses the role in the database on the next start. Changing it needs a redeploy.
  AfProvision:
    Type: String
    Default: invite
    AllowedValues: [ invite, auto ]
    Description: >-
      AF_PROVISION - what happens to somebody who signs in with no tenant membership yet.
      invite (the default here) = they wait for an admin; auto = they are given the default
      tenant on the spot, so AF_OAUTH_ALLOWED_* is the only gate. A tenant's own
      auto_join_domains is checked BEFORE either. Switching to invite does not evict anyone
      already working. PARAMETERS.md.
  AuthMode:
    Type: String
    Default: oauth
    AllowedValues: [ oauth, dev ]
    Description: >-
      CP auth mode. oauth (default) = the CP-native login (Google and/or OIDC). dev = fixed dev
      identity with NO login — sandbox/E2E gates only: restrict the ALB security
      group to your own IP before using it (an internet-facing ALB with dev auth
      hands out an authenticated session to anyone who reaches it).
  CpAlarmEmail:
    Type: String
    Default: ""
    Description: >-
      Where to send "the Control Plane cannot reach its database". Empty (the default) = no
      topic and no alarm, and the only trace is the CP log. ⚠️ That is exactly how the
      2026-09-01 outage stayed silent — /healthz kept answering 200. Set it.

Conditions:
  # Each IdP's client secret is pulled from SSM, and a Secrets entry pointing at a
  # parameter that doesn't exist stops the task from starting — so wire each one in
  # only when that IdP is actually configured.
  HasGoogle: !Not [ !Equals [ !Ref GoogleClientId, "" ] ]
  HasOidc: !Not [ !Equals [ !Ref OidcProviderId, "" ] ]
  # The org list, not the client id — historically GITHUB_OAUTH_CLIENT_ID also drove
  # the Console's git-connect device flow, which many deployments set without wanting a
  # login. That flow reads the tenant's own app since docs/log/71, but the switch stays the
  # org list: it is the thing that authorizes the sign-in.
  HasGithub: !Not [ !Equals [ !Ref GithubAllowedOrgs, "" ] ]
  # The rate limit is what creates the web ACL; reputation is an extra rule on it.
  HasPreviewDomain: !Not [ !Equals [ !Ref PreviewDomain, "" ] ]
  # Set when the preview name lives in another zone (a sibling needs its own delegated
  # zone). Empty = the Console's zone, as before.
  HasPreviewZone: !Not [ !Equals [ !Ref PreviewHostedZoneId, "" ] ]
  # Scheduled execution: each knob is passed ONLY when the operator set it, so an unset
  # parameter means "whatever the CP's own default is" rather than a copy frozen here.
  HasSchedulerInterval: !Not [ !Equals [ !Ref SchedulerInterval, "" ] ]
  HasScheduleWakeTimeout: !Not [ !Equals [ !Ref ScheduleWakeTimeout, "" ] ]
  HasScheduleSettle: !Not [ !Equals [ !Ref ScheduleSettle, "" ] ]
  HasScheduleJitter: !Not [ !Equals [ !Ref ScheduleJitter, "" ] ]
  HasCpAlarms: !Not [ !Equals [ !Ref CpAlarmEmail, "" ] ]
  HasWaf: !Not [ !Equals [ !Ref WafRateLimitPer5Min, 0 ] ]
  HasWafReputation: !And [ !Condition HasWaf, !Equals [ !Ref WafIpReputation, "on" ] ]

Resources:
  Cert:
    Type: AWS::CertificateManager::Certificate
    Properties:
      DomainName: !Ref Fqdn
      ValidationMethod: DNS
      DomainValidationOptions:
        - DomainName: !Ref Fqdn
          HostedZoneId: !Ref HostedZoneId

  Alb:
    Type: AWS::ElasticLoadBalancingV2::LoadBalancer
    Properties:
      Name: !Sub "af-${AWS::StackName}"
      Scheme: internet-facing
      Type: application
      Subnets: !Split [ ",", !ImportValue { "Fn::Sub": "${NetworkStackName}-PublicSubnets" } ]
      SecurityGroups:
        - Fn::ImportValue: !Sub "${NetworkStackName}-AlbSgId"
      # Spelled out at the AWS default (60s) rather than left implicit: it is the
      # hard ceiling on every CP request, and a handler that outran it is what
      # turned a cold workspace Start into a 504 (docs/log/62 §62.5). The CP now
      # answers Start immediately and reports convergence through GET
      # /api/workspace, so raise this only for a NEW long-poll — never to let a
      # handler block longer.
      LoadBalancerAttributes:
        - { Key: idle_timeout.timeout_seconds, Value: "60" }

  # --- WAF (only when WafRateLimitPer5Min > 0) --------------------------------
  WebAcl:
    Type: AWS::WAFv2::WebACL
    Condition: HasWaf
    Properties:
      Name: !Sub "af-${AWS::StackName}"
      Scope: REGIONAL
      DefaultAction: { Allow: {} }
      VisibilityConfig:
        SampledRequestsEnabled: true
        CloudWatchMetricsEnabled: true
        MetricName: !Sub "af-${AWS::StackName}"
      Rules:
        # Rate limit first: it is the one rule that protects the login endpoint and
        # the API from a flood, and it decides on the SOURCE rather than the body.
        - Name: rate-limit
          Priority: 0
          Action: { Block: {} }
          Statement:
            RateBasedStatement:
              Limit: !Ref WafRateLimitPer5Min
              AggregateKeyType: IP
          VisibilityConfig:
            SampledRequestsEnabled: true
            CloudWatchMetricsEnabled: true
            MetricName: !Sub "af-${AWS::StackName}-rate"
        - !If
          - HasWafReputation
          - Name: ip-reputation
            Priority: 1
            OverrideAction: { None: {} }
            Statement:
              ManagedRuleGroupStatement:
                VendorName: AWS
                Name: AWSManagedRulesAmazonIpReputationList
            VisibilityConfig:
              SampledRequestsEnabled: true
              CloudWatchMetricsEnabled: true
              MetricName: !Sub "af-${AWS::StackName}-reputation"
          - !Ref AWS::NoValue

  WebAclAssociation:
    Type: AWS::WAFv2::WebACLAssociation
    Condition: HasWaf
    Properties:
      ResourceArn: !Ref Alb
      WebACLArn: !GetAtt WebAcl.Arn

  TargetGroup:
    Type: AWS::ElasticLoadBalancingV2::TargetGroup
    Properties:
      VpcId:
        Fn::ImportValue: !Sub "${NetworkStackName}-VpcId"
      Port: !Ref CpPort
      Protocol: HTTP
      TargetType: ip                     # Fargate awsvpc = register by ENI IP
      HealthCheckPath: /healthz          # CP serves this unauthenticated
      HealthCheckProtocol: HTTP
      Matcher: { HttpCode: "200" }
      TargetGroupAttributes:
        - { Key: deregistration_delay.timeout_seconds, Value: "30" }

  Listener443:
    Type: AWS::ElasticLoadBalancingV2::Listener
    Properties:
      LoadBalancerArn: !Ref Alb
      Port: 443
      Protocol: HTTPS
      SslPolicy: ELBSecurityPolicy-TLS13-1-2-2021-06
      Certificates:
        - CertificateArn: !Ref Cert
      DefaultActions:
        - Type: forward
          TargetGroupArn: !Ref TargetGroup

  # --- preview subdomains (docs/81), only when PreviewDomain is set -----------
  # Never touch the existing Cert: adding a SAN replaces the certificate, rebuilding the TLS
  # the Console already serves just to add previews. A listener can pick extra certificates
  # by SNI, so attach this as a second one — turning previews off is then only a removal
  # (decision 4).
  PreviewCert:
    Type: AWS::CertificateManager::Certificate
    Condition: HasPreviewDomain
    Properties:
      DomainName: !Sub "*.${PreviewDomain}"
      ValidationMethod: DNS
      DomainValidationOptions:
        - DomainName: !Sub "*.${PreviewDomain}"
          # The zone the validation record `_xxx.{PreviewDomain}` is written into. The
          # `*.` is stripped, so what is needed is the zone containing PreviewDomain
          # itself, not the Console's zone.
          HostedZoneId: !If [ HasPreviewZone, !Ref PreviewHostedZoneId, !Ref HostedZoneId ]

  PreviewListenerCert:
    Type: AWS::ElasticLoadBalancingV2::ListenerCertificate
    Condition: HasPreviewDomain
    Properties:
      ListenerArn: !Ref Listener443
      Certificates:
        - CertificateArn: !Ref PreviewCert

  # One wildcard covers every workspace and every port. Never write a record per workspace:
  # that puts an API round trip and a propagation wait on every start and runs into the
  # record-count quota. Zero issuance cost and zero propagation wait are the one plain win
  # host mode has, and giving it up leaves only the complexity (decision 5).
  PreviewDnsRecord:
    Type: AWS::Route53::RecordSet
    Condition: HasPreviewDomain
    Properties:
      HostedZoneId: !If [ HasPreviewZone, !Ref PreviewHostedZoneId, !Ref HostedZoneId ]
      Name: !Sub "*.${PreviewDomain}"
      Type: A
      AliasTarget:
        DNSName: !GetAtt Alb.DNSName
        HostedZoneId: !GetAtt Alb.CanonicalHostedZoneID

  Listener80:
    Type: AWS::ElasticLoadBalancingV2::Listener
    Properties:
      LoadBalancerArn: !Ref Alb
      Port: 80
      Protocol: HTTP
      DefaultActions:
        - Type: redirect
          RedirectConfig: { Protocol: HTTPS, Port: "443", StatusCode: HTTP_301 }

  LogGroup:
    Type: AWS::Logs::LogGroup
    DeletionPolicy: Delete
    Properties:
      LogGroupName: !Sub "/af/${AWS::StackName}/cp"
      RetentionInDays: 7

  # --- "the Control Plane cannot reach its database", made visible -------------
  #
  # The 2026-09-01 outage was not a monitoring gap in the sense of "we had no
  # metric". Every metric was green: the process was up, so /healthz returned 200,
  # so the ALB target was healthy, so ECS was at steady state. The product was
  # entirely broken and every instrument agreed it was fine. The only signal that
  # existed at all was a line in this log group.
  #
  # So: turn that line into a metric. The marker is a constant shared with
  # control-plane/store_postgres_secret.go (logDBUnavailable) — change one and you
  # change the other, and nothing will tell you if you don't.
  #
  # Unconditional on purpose. A filter that matches nothing publishes nothing and
  # therefore costs nothing, and the point of an incident like this is that you want
  # the history to already exist by the time you think to look.
  CpDbUnavailableFilter:
    Type: AWS::Logs::MetricFilter
    Properties:
      LogGroupName: !Ref LogGroup
      FilterPattern: DB_UNAVAILABLE
      MetricTransformations:
        - MetricNamespace: !Sub "AgentFleet/${AWS::StackName}"
          MetricName: DbUnavailable
          MetricValue: "1"
          DefaultValue: 0
          Unit: Count

  CpAlarmTopic:
    Type: AWS::SNS::Topic
    Condition: HasCpAlarms
    Properties:
      TopicName: !Sub "af-${AWS::StackName}-cp-alarms"
      DisplayName: agent-fleet control plane
      Subscription:
        - Protocol: email
          Endpoint: !Ref CpAlarmEmail

  # One breach is enough. The CP rate-limits this line to one a minute, so a single
  # datapoint already means "for a whole minute, connections were failing" — not a
  # blip. Waiting for a second period would only add five minutes to an outage in
  # which the product returns 500 to everybody.
  CpDbUnavailableAlarm:
    Type: AWS::CloudWatch::Alarm
    Condition: HasCpAlarms
    Properties:
      AlarmName: !Sub "af-${AWS::StackName}-cp-db-unavailable"
      AlarmDescription: >-
        The Control Plane could not open a database connection. If this coincides with
        the RDS secret's rotation schedule, the credential refresh
        (control-plane/store_postgres_secret.go) did not work — check the log for
        DB_SECRET_REFRESH_FAILED, which usually means CpTaskRole lost
        secretsmanager:GetSecretValue. Recovery of last resort, ~4 minutes and no
        outage because it is blue/green:
        aws ecs update-service --cluster <cluster> --service <cp-service> --force-new-deployment
      Namespace: !Sub "AgentFleet/${AWS::StackName}"
      MetricName: DbUnavailable
      Statistic: Sum
      Period: 300
      ComparisonOperator: GreaterThanOrEqualToThreshold
      Threshold: 1
      EvaluationPeriods: 1
      DatapointsToAlarm: 1
      TreatMissingData: notBreaching
      AlarmActions: [ !Ref CpAlarmTopic ]
      OKActions: [ !Ref CpAlarmTopic ]

  # Workspace tasks (created by the CP at runtime) log here — the CP passes this
  # group name to each task definition via AF_ECS_LOG_GROUP.
  WsLogGroup:
    Type: AWS::Logs::LogGroup
    DeletionPolicy: Delete
    Properties:
      LogGroupName: !Sub "/af/${AWS::StackName}/ws"
      RetentionInDays: 7

  TaskDef:
    Type: AWS::ECS::TaskDefinition
    Properties:
      Family: !Sub "af-${AWS::StackName}-cp"
      RequiresCompatibilities: [ FARGATE ]
      NetworkMode: awsvpc
      Cpu: !Ref CpCpu
      Memory: !Ref CpMemory
      # Declared, not inferred (docs/log/72). Fargate defaults an omitted cpuArchitecture
      # to X86_64 — which is why leaving this out has worked so far — but that default
      # is applied when the TASK STARTS, not when the definition is registered, so
      # `describe-task-definition` shows runtimePlatform: null and the architecture the
      # CP actually runs on is nowhere in the template. Stating it also makes the value
      # part of the definition's identity, so switching CpArch produces a new revision
      # and a rolling deployment rather than a no-op.
      # ⚠️ EC2 does NOT share this default (docs/log/70 §70.8): there an omitted
      # runtimePlatform stays null and placement decides. Only Fargate fills it in.
      RuntimePlatform:
        CpuArchitecture: !Ref CpArch
        OperatingSystemFamily: LINUX
      ExecutionRoleArn:
        Fn::ImportValue: !Sub "${PlatformStackName}-ExecRoleArn"
      TaskRoleArn:
        Fn::ImportValue: !Sub "${PlatformStackName}-CpTaskRoleArn"
      ContainerDefinitions:
        - Name: cp
          Essential: true
          Image: !Sub
            - "${Uri}:${Tag}"
            - Uri: !ImportValue { "Fn::Sub": "${PlatformStackName}-EcrControlPlaneUri" }
              Tag: !Ref ImageTag
          PortMappings:
            - ContainerPort: !Ref CpPort
          Environment:
            # ECS/awsvpc: the ALB reaches the task over its ENI, so CP must bind
            # non-loopback (the CpSg restricts 8099 ingress to the ALB SG — the
            # network isolation the compose loopback bind gives on a single box).
            - { Name: CP_ADDR, Value: !Sub "0.0.0.0:${CpPort}" }
            - { Name: WS_DATA, Value: /tmp }   # unused for state now (store = RDS/Postgres, below)
            # MetadataStore = RDS Postgres (P3-7 stage 3a): survives CP task replacement.
            # The CP composes the DSN from these parts; the password arrives as a
            # secret (below) so it never sits in a plaintext URL/env.
            - { Name: AF_DB_HOST, Value: !ImportValue { "Fn::Sub": "${DataStackName}-DbEndpoint" } }
            - { Name: AF_DB_PORT, Value: !ImportValue { "Fn::Sub": "${DataStackName}-DbPort" } }
            - { Name: AF_DB_NAME, Value: agentfleet }
            - { Name: AF_DB_USER, Value: afadmin }
            # …and where to go and read the password AGAIN when the injected one stops
            # working, because RDS rotates it every 7 days and `secrets` below is
            # resolved once, at task start (the 2026-09-01 outage; ADR 0065).
            #
            # ⚠️ Environment, NOT Secrets. An ARN is not a credential, and putting it
            # under `secrets` would make it another start-time snapshot — which is the
            # very thing being fixed. Unset = the CP keeps using the injected value and
            # nothing else changes, which is how every non-RDS deployment behaves.
            - Name: AF_DB_PASSWORD_SECRET_ARN
              Value: !ImportValue { "Fn::Sub": "${DataStackName}-DbSecretArn" }
            # The JSON field inside the RDS-managed secret — the same `password` the
            # `:password::` suffix picks out below.
            - { Name: AF_DB_PASSWORD_SECRET_KEY, Value: password }
            # ⚠️ Exactly one proxy sits in front of the CP here: this ALB. The CP needs
            # to be TOLD, because it cannot tell — without this, r.RemoteAddr is the load
            # balancer and every request looks like it comes from the same private
            # address. That is what a tenant's source-network restriction is matched
            # against (docs/log/66, ADR 0047 decision 2), so a wrong value here is either "the
            # rule never matches anyone" or "the rule matches everyone".
            - { Name: AF_TRUSTED_PROXY_HOPS, Value: "1" }
            - { Name: AUTH, Value: !Ref AuthMode }
            - { Name: PUBLIC_BASE_URL, Value: !Sub "https://${Fqdn}" }
            - { Name: PUBLIC_DOMAIN, Value: !Ref Fqdn }
            # docs/81: parent domain for the preview subdomains. Empty and the CP registers
            # no host-mode routing at all (only the existing path mode remains).
            - { Name: AF_PREVIEW_DOMAIN, Value: !Ref PreviewDomain }
            - { Name: GOOGLE_OAUTH_CLIENT_ID, Value: !Ref GoogleClientId }
            - { Name: AF_OAUTH_ALLOWED_EMAILS, Value: !Ref AllowedEmails }
            - { Name: AF_OAUTH_ALLOWED_DOMAINS, Value: !Ref AllowedDomains }
            - { Name: SUPER_ADMIN_EMAILS, Value: !Ref SuperAdminEmails }
            - { Name: AF_PROVISION, Value: !Ref AfProvision }
            # Generic OIDC IdP (docs/log/61). The redirect URI stays the single
            # https://<Fqdn>/oauth2/callback whether or not this is enabled.
            - { Name: AF_OIDC_PROVIDERS, Value: !Ref OidcProviderId }
            - !If [ HasOidc, { Name: !Sub "AF_OIDC_${OidcProviderId}_ISSUER", Value: !Ref OidcIssuer }, !Ref "AWS::NoValue" ]
            - !If [ HasOidc, { Name: !Sub "AF_OIDC_${OidcProviderId}_CLIENT_ID", Value: !Ref OidcClientId }, !Ref "AWS::NoValue" ]
            - !If [ HasOidc, { Name: !Sub "AF_OIDC_${OidcProviderId}_TRUST", Value: !Ref OidcTrust }, !Ref "AWS::NoValue" ]
            - !If [ HasOidc, { Name: !Sub "AF_OIDC_${OidcProviderId}_ALLOWED_TIDS", Value: !Ref OidcAllowedTids }, !Ref "AWS::NoValue" ]
            - !If [ HasOidc, { Name: !Sub "AF_OIDC_${OidcProviderId}_LABEL_JA", Value: !Ref OidcLabelJa }, !Ref "AWS::NoValue" ]
            - !If [ HasOidc, { Name: !Sub "AF_OIDC_${OidcProviderId}_LABEL_EN", Value: !Ref OidcLabelEn }, !Ref "AWS::NoValue" ]
            # GitHub sign-in (docs/log/61 §61.7).
            - { Name: GITHUB_OAUTH_CLIENT_ID, Value: !Ref GithubClientId }
            - { Name: AF_GITHUB_ALLOWED_ORGS, Value: !Ref GithubAllowedOrgs }
            - { Name: AF_GITHUB_ALLOWED_DOMAINS, Value: !Ref GithubAllowedDomains }
            # ★ No BITBUCKET_OAUTH_* and no workspace GITHUB_OAUTH_CLIENT_ID: the git
            # providers' OAuth apps are per-tenant rows since docs/log/71, registered in the
            # Console under Tenant settings -> Integrations -> Git provider OAuth. The CP
            # still owns the Bitbucket callback and derives it from PUBLIC_BASE_URL above.
            # AF_RUNTIME=ecs = the P3-7 stage-2 adapter (Fargate). AF_RUNTIME=ecs-ec2
            # keeps the same substrate but puts workspaces on a pool of EC2 slots with a
            # persistent per-user EBS home (docs/log/64, ADR 0045 decision 10) — deploy the
            # 40-ec2-pool stack and set WsRuntime=ecs-ec2 + Ec2SlotLaunchTemplate.
            # Rolling back is this one parameter. The AF_ECS_* below are shared by both.
            - { Name: AF_RUNTIME, Value: !Ref WsRuntime }
            - { Name: AF_ECS_REGION, Value: !Ref "AWS::Region" }
            - { Name: AF_ECS_CLUSTER, Value: !ImportValue { "Fn::Sub": "${PlatformStackName}-ClusterName" } }
            - { Name: AF_ECS_SUBNETS, Value: !ImportValue { "Fn::Sub": "${NetworkStackName}-PrivateSubnets" } }
            - { Name: AF_ECS_SECURITY_GROUP, Value: !ImportValue { "Fn::Sub": "${NetworkStackName}-WsSgId" } }
            - { Name: AF_ECS_EFS_ID, Value: !ImportValue { "Fn::Sub": "${DataStackName}-EfsId" } }
            - { Name: AF_ECS_NAMESPACE_ARN, Value: !ImportValue { "Fn::Sub": "${PlatformStackName}-NamespaceArn" } }
            - { Name: AF_ECS_EXEC_ROLE, Value: !ImportValue { "Fn::Sub": "${PlatformStackName}-ExecRoleArn" } }
            - { Name: AF_ECS_TASK_ROLE, Value: !ImportValue { "Fn::Sub": "${PlatformStackName}-WsTaskRoleArn" } }
            - { Name: AF_ECS_LOG_GROUP, Value: !Ref WsLogGroup }
            - { Name: AF_ECS_TASK_CPU, Value: !Ref WsTaskCpu }
            - { Name: AF_ECS_TASK_MEMORY, Value: !Ref WsTaskMemory }
            - { Name: AF_ECS_WS_DISK_GB, Value: !Ref WsDiskGiB }
            # --- EC2 slot pool (only read when WsRuntime=ecs-ec2) ---
            - { Name: AF_ECS_EC2_LAUNCH_TEMPLATE, Value: !Ref Ec2SlotLaunchTemplate }
            - { Name: AF_ECS_EC2_SLOT_TYPES, Value: !Ref Ec2SlotTypes }
            - { Name: AF_ECS_EC2_AMI_ARM64, Value: !Ref Ec2SlotAmiArm64 }
            - { Name: AF_ECS_EC2_DEFAULT_SLOT_CLASS, Value: !Ref Ec2DefaultSlotClass }
            - { Name: AF_ECS_EC2_MAX_SLOTS, Value: !Ref Ec2MaxSlots }
            - { Name: AF_ECS_EC2_HOST_RESERVE_MB, Value: !Ref Ec2HostReserveMb }
            - { Name: AF_ECS_EC2_SLOT_SLEEP_SEC, Value: !Ref Ec2SlotSleepSec }
            - { Name: AF_ECS_EC2_SLOT_TERMINATE_AFTER_SEC, Value: !Ref Ec2SlotTerminateAfterSec }
            - { Name: AF_ECS_EC2_HIBERNATE_AFTER_SEC, Value: !Ref Ec2HibernateAfterSec }
            - { Name: AF_ECS_EC2_HOME_GB, Value: !Ref Ec2HomeGiB }
            # --- Scheduled execution (docs/log/38). Unset = the CP's own default. ---
            - !If [ HasSchedulerInterval, { Name: AF_SCHEDULER_INTERVAL, Value: !Ref SchedulerInterval }, !Ref "AWS::NoValue" ]
            - !If [ HasScheduleWakeTimeout, { Name: AF_SCHEDULE_WAKE_TIMEOUT, Value: !Ref ScheduleWakeTimeout }, !Ref "AWS::NoValue" ]
            - !If [ HasScheduleSettle, { Name: AF_SCHEDULE_SETTLE, Value: !Ref ScheduleSettle }, !Ref "AWS::NoValue" ]
            - !If [ HasScheduleJitter, { Name: AF_SCHEDULE_JITTER, Value: !Ref ScheduleJitter }, !Ref "AWS::NoValue" ]
            # Start returns as soon as the service is at desiredCount 1; the Agent
            # readiness poll runs in the background for the log line only, on the
            # AF_ECS_START_TIMEOUT_SEC budget (default 300s). Nothing waits on it,
            # so it is deliberately longer than the ALB idle timeout above.
            - Name: AF_ECS_WORKSPACE_IMAGE
              Value: !Sub
                - "${Uri}:${Tag}"
                - Uri: !ImportValue { "Fn::Sub": "${PlatformStackName}-EcrWorkspaceUri" }
                  Tag: !Ref ImageTag
          Secrets:
            # RDS-managed master password (Secrets Manager JSON → the `password` key).
            - Name: AF_DB_PASSWORD
              ValueFrom: !Sub
                - "${Arn}:password::"
                - Arn: !ImportValue { "Fn::Sub": "${DataStackName}-DbSecretArn" }
            - !If
              - HasGoogle
              - Name: GOOGLE_OAUTH_CLIENT_SECRET
                ValueFrom: !Sub "arn:aws:ssm:${AWS::Region}:${AWS::AccountId}:parameter${SsmPrefix}/google-client-secret"
              - !Ref "AWS::NoValue"
            - !If
              - HasOidc
              - Name: !Sub "AF_OIDC_${OidcProviderId}_CLIENT_SECRET"
                ValueFrom: !Sub "arn:aws:ssm:${AWS::Region}:${AWS::AccountId}:parameter${SsmPrefix}/oidc-client-secret"
              - !Ref "AWS::NoValue"
            - !If
              - HasGithub
              - Name: GITHUB_OAUTH_CLIENT_SECRET
                ValueFrom: !Sub "arn:aws:ssm:${AWS::Region}:${AWS::AccountId}:parameter${SsmPrefix}/github-client-secret"
              - !Ref "AWS::NoValue"
            - Name: AF_COOKIE_SECRET
              ValueFrom: !Sub "arn:aws:ssm:${AWS::Region}:${AWS::AccountId}:parameter${SsmPrefix}/cookie-secret"
            - Name: AF_MASTER_KEY
              ValueFrom: !Sub "arn:aws:ssm:${AWS::Region}:${AWS::AccountId}:parameter${SsmPrefix}/master-key"
          LogConfiguration:
            LogDriver: awslogs
            Options:
              awslogs-group: !Ref LogGroup
              awslogs-region: !Ref "AWS::Region"
              awslogs-stream-prefix: cp

  Service:
    Type: AWS::ECS::Service
    DependsOn: Listener443
    Properties:
      ServiceName: !Sub "af-${AWS::StackName}-cp"
      Cluster: !ImportValue { "Fn::Sub": "${PlatformStackName}-ClusterArn" }
      TaskDefinition: !Ref TaskDef
      DesiredCount: 1
      LaunchType: FARGATE
      HealthCheckGracePeriodSeconds: 60
      NetworkConfiguration:
        AwsvpcConfiguration:
          AssignPublicIp: DISABLED
          Subnets: !Split [ ",", !ImportValue { "Fn::Sub": "${NetworkStackName}-PrivateSubnets" } ]
          SecurityGroups:
            - Fn::ImportValue: !Sub "${NetworkStackName}-CpSgId"
      LoadBalancers:
        - TargetGroupArn: !Ref TargetGroup
          ContainerName: cp
          ContainerPort: !Ref CpPort
      # CP as a Service Connect client so it can resolve workspace Agents by
      # <service>.<namespace> once the stage-2 adapter creates them.
      ServiceConnectConfiguration:
        Enabled: true
        Namespace: !ImportValue { "Fn::Sub": "${PlatformStackName}-NamespaceArn" }

  DnsRecord:
    Type: AWS::Route53::RecordSet
    Properties:
      HostedZoneId: !Ref HostedZoneId
      Name: !Ref Fqdn
      Type: A
      AliasTarget:
        DNSName: !GetAtt Alb.DNSName
        HostedZoneId: !GetAtt Alb.CanonicalHostedZoneID

Outputs:
  Url:
    Value: !Sub "https://${Fqdn}"
  AlbDnsName:
    Value: !GetAtt Alb.DNSName
