AWSTemplateFormatVersion: "2010-09-09"
Description: >-
  agent-fleet ECS adapter (P3-7) — ingress + Control Plane service. ACM cert (DNS-
  validated via Route53), an internet-facing ALB that only terminates TLS (auth is
  the CP-native login, AUTH=oauth — no ALB OIDC), the CP/Console Fargate service
  (Service Connect client so it can reach the workspace Agents it provisions), and
  the Route53 alias. Imports 00-network, 10-data (EFS + RDS) and 20-platform. The CP
  is wired with AF_ECS_* so the stage-2 ecsRuntime provisions workspaces on demand, and
  its MetadataStore is RDS Postgres (stage 3a) so state survives task replacement.

Parameters:
  NetworkStackName:
    Type: String
    Default: af-ecs-network
  PlatformStackName:
    Type: String
    Default: af-ecs-platform
  DataStackName:
    Type: String
    Default: af-ecs-data
    Description: Name of the 10-data stack (EFS filesystem for workspace homes).
  ImageTag:
    Type: String
    Default: dev
    Description: >-
      Tag of BOTH the af-control-plane and af-workspace images in ECR (=VERSION;
      release-ecr.sh pushes the pair under one version). Upgrade = push a new tag,
      then re-deploy with only this parameter overridden: the CP service rolls to
      the new image; workspaces pick it up on their next Start (running ones are
      untouched — the adapter builds task definitions statelessly).
  Fqdn:
    Type: String
    Description: >-
      Public host for the Console/API (ACM cert + Route53 alias), e.g.
      af.example.com. Required — pass your own domain.
  HostedZoneId:
    Type: String
    Description: >-
      Route53 hosted zone id for the Fqdn's domain. Required — the zone must be
      in this account (ACM DNS validation + alias record are created in it).
  CpPort:
    Type: Number
    Default: 8099
  CpCpu:
    Type: String
    Default: "512"
  CpMemory:
    Type: String
    Default: "1024"
  SsmPrefix:
    Type: String
    Default: /af-cp
    Description: SSM SecureString path prefix holding the CP secrets (created out of
      band before deploy — see README). Params - cookie-secret, master-key, plus
      google-client-secret / oidc-client-secret / github-client-secret depending on
      the IdPs in use.
  GoogleClientId:
    Type: String
    Default: ""
    Description: Google OAuth client id (not secret; the secret comes from SSM).
      Leave empty to sign in with the OIDC provider below instead.
  OidcProviderId:
    Type: String
    Default: ""
    AllowedPattern: "^[A-Z0-9_]*$"
    Description: >-
      Enable an OIDC IdP (Entra ID / Okta / Keycloak / Auth0 / Cognito / GitLab)
      under this id — UPPERCASE, e.g. ENTRA (it names the AF_OIDC_<ID>_* env). Empty
      = Google only. Its client secret must exist at <SsmPrefix>/oidc-client-secret.
      docs/61.
  OidcIssuer:
    Type: String
    Default: ""
    Description: >-
      AF_OIDC_<ID>_ISSUER, e.g. https://login.microsoftonline.com/<tenant-guid>/v2.0.
      ★ Pin Entra to your tenant guid — with /common/ or /organizations/ every
      Microsoft account in the world reaches the login and personal accounts can
      rewrite their own email, so the CP refuses to start unless OidcAllowedTids is set.
  OidcClientId:
    Type: String
    Default: ""
    Description: AF_OIDC_<ID>_CLIENT_ID (not secret; the secret comes from SSM).
  OidcTrust:
    Type: String
    Default: issuer
    AllowedValues: [ issuer, email_verified ]
    Description: >-
      AF_OIDC_<ID>_TRUST — why this IdP's email may be believed. issuer = the issuer
      is pinned to one tenant (Entra ID, which never emits email_verified).
      email_verified = accept only when the IdP asserts that claim (Okta / Keycloak / Auth0).
  OidcAllowedTids:
    Type: String
    Default: ""
    Description: AF_OIDC_<ID>_ALLOWED_TIDS — accepted Entra tenant ids. Required only
      when the issuer is the /common/ or /organizations/ endpoint.
  OidcLabelJa:
    Type: String
    Default: ""
    Description: Login button label, Japanese (default is generated from the id).
  OidcLabelEn:
    Type: String
    Default: ""
    Description: Login button label, English (default is generated from the id).
  GithubAllowedOrgs:
    Type: String
    Default: ""
    Description: >-
      AF_GITHUB_ALLOWED_ORGS — comma-separated GitHub orgs whose ACTIVE members may
      sign in. Setting this is what enables the GitHub button; its OAuth App secret
      must exist at <SsmPrefix>/github-client-secret, and the app needs the
      redirect URI https://<Fqdn>/oauth2/callback. ★ If the org restricts
      third-party OAuth apps, an org owner must approve the app or everyone is
      rejected. docs/61 §61.7.
  GithubClientId:
    Type: String
    Default: ""
    Description: GITHUB_OAUTH_CLIENT_ID (not secret; the secret comes from SSM). The
      same OAuth App also drives the Console's GitHub "Connect" device flow.
  GithubAllowedDomains:
    Type: String
    Default: ""
    Description: >-
      AF_GITHUB_ALLOWED_DOMAINS — strongly recommended. GitHub hands us the
      account's PRIMARY VERIFIED address, which is a personal one for most people,
      and a personal address is a different person here: they get a new empty
      workspace rather than their own. Empty = the deployment-wide allowlist.
  AllowedEmails:
    Type: String
    Default: ""
    Description: AF_OAUTH_ALLOWED_EMAILS (comma-separated) permitted to sign in.
  AllowedDomains:
    Type: String
    Default: ""
    Description: AF_OAUTH_ALLOWED_DOMAINS (comma-separated email domains) permitted
      to sign in. Somebody invited to a tenant in the Admin panel also gets in
      without being listed here, so an invite-run deployment can leave both empty.
      Both empty AND nobody invited => every login is denied (fail closed), which
      is what a fresh stack looks like - set one to get your first admin in.
  SuperAdminEmails:
    Type: String
    Default: ""
    Description: SUPER_ADMIN_EMAILS (comma-separated). Read once at task start and
      treated as the only source of truth - an account removed from this list also
      loses the role in the database on the next start, so a handover completes for
      somebody who never signs in again. Changing it needs a service redeploy.
  AuthMode:
    Type: String
    Default: oauth
    AllowedValues: [ oauth, dev ]
    Description: >-
      CP auth mode. oauth (default) = the CP-native login (Google and/or OIDC). dev = fixed dev
      identity with NO login — sandbox/E2E gates only: restrict the ALB security
      group to your own IP before using it (an internet-facing ALB with dev auth
      hands out an authenticated session to anyone who reaches it).

Conditions:
  # Each IdP's client secret is pulled from SSM, and a Secrets entry pointing at a
  # parameter that doesn't exist stops the task from starting — so wire each one in
  # only when that IdP is actually configured.
  HasGoogle: !Not [ !Equals [ !Ref GoogleClientId, "" ] ]
  HasOidc: !Not [ !Equals [ !Ref OidcProviderId, "" ] ]
  # The org list, not the client id: GITHUB_OAUTH_CLIENT_ID is also the Console's
  # git-connect device flow, which many deployments set without wanting a login.
  HasGithub: !Not [ !Equals [ !Ref GithubAllowedOrgs, "" ] ]

Resources:
  Cert:
    Type: AWS::CertificateManager::Certificate
    Properties:
      DomainName: !Ref Fqdn
      ValidationMethod: DNS
      DomainValidationOptions:
        - DomainName: !Ref Fqdn
          HostedZoneId: !Ref HostedZoneId

  Alb:
    Type: AWS::ElasticLoadBalancingV2::LoadBalancer
    Properties:
      Name: !Sub "af-${AWS::StackName}"
      Scheme: internet-facing
      Type: application
      Subnets: !Split [ ",", !ImportValue { "Fn::Sub": "${NetworkStackName}-PublicSubnets" } ]
      SecurityGroups:
        - Fn::ImportValue: !Sub "${NetworkStackName}-AlbSgId"

  TargetGroup:
    Type: AWS::ElasticLoadBalancingV2::TargetGroup
    Properties:
      VpcId:
        Fn::ImportValue: !Sub "${NetworkStackName}-VpcId"
      Port: !Ref CpPort
      Protocol: HTTP
      TargetType: ip                     # Fargate awsvpc = register by ENI IP
      HealthCheckPath: /healthz          # CP serves this unauthenticated
      HealthCheckProtocol: HTTP
      Matcher: { HttpCode: "200" }
      TargetGroupAttributes:
        - { Key: deregistration_delay.timeout_seconds, Value: "30" }

  Listener443:
    Type: AWS::ElasticLoadBalancingV2::Listener
    Properties:
      LoadBalancerArn: !Ref Alb
      Port: 443
      Protocol: HTTPS
      SslPolicy: ELBSecurityPolicy-TLS13-1-2-2021-06
      Certificates:
        - CertificateArn: !Ref Cert
      DefaultActions:
        - Type: forward
          TargetGroupArn: !Ref TargetGroup

  Listener80:
    Type: AWS::ElasticLoadBalancingV2::Listener
    Properties:
      LoadBalancerArn: !Ref Alb
      Port: 80
      Protocol: HTTP
      DefaultActions:
        - Type: redirect
          RedirectConfig: { Protocol: HTTPS, Port: "443", StatusCode: HTTP_301 }

  LogGroup:
    Type: AWS::Logs::LogGroup
    DeletionPolicy: Delete
    Properties:
      LogGroupName: !Sub "/af/${AWS::StackName}/cp"
      RetentionInDays: 7

  # Workspace tasks (created by the CP at runtime) log here — the CP passes this
  # group name to each task definition via AF_ECS_LOG_GROUP.
  WsLogGroup:
    Type: AWS::Logs::LogGroup
    DeletionPolicy: Delete
    Properties:
      LogGroupName: !Sub "/af/${AWS::StackName}/ws"
      RetentionInDays: 7

  TaskDef:
    Type: AWS::ECS::TaskDefinition
    Properties:
      Family: !Sub "af-${AWS::StackName}-cp"
      RequiresCompatibilities: [ FARGATE ]
      NetworkMode: awsvpc
      Cpu: !Ref CpCpu
      Memory: !Ref CpMemory
      ExecutionRoleArn:
        Fn::ImportValue: !Sub "${PlatformStackName}-ExecRoleArn"
      TaskRoleArn:
        Fn::ImportValue: !Sub "${PlatformStackName}-CpTaskRoleArn"
      ContainerDefinitions:
        - Name: cp
          Essential: true
          Image: !Sub
            - "${Uri}:${Tag}"
            - Uri: !ImportValue { "Fn::Sub": "${PlatformStackName}-EcrControlPlaneUri" }
              Tag: !Ref ImageTag
          PortMappings:
            - ContainerPort: !Ref CpPort
          Environment:
            # ECS/awsvpc: the ALB reaches the task over its ENI, so CP must bind
            # non-loopback (the CpSg restricts 8099 ingress to the ALB SG — the
            # network isolation the compose loopback bind gives on a single box).
            - { Name: CP_ADDR, Value: !Sub "0.0.0.0:${CpPort}" }
            - { Name: WS_DATA, Value: /tmp }   # unused for state now (store = RDS/Postgres, below)
            # MetadataStore = RDS Postgres (P3-7 stage 3a): survives CP task replacement.
            # The CP composes the DSN from these parts; the password arrives as a
            # secret (below) so it never sits in a plaintext URL/env.
            - { Name: AF_DB_HOST, Value: !ImportValue { "Fn::Sub": "${DataStackName}-DbEndpoint" } }
            - { Name: AF_DB_PORT, Value: !ImportValue { "Fn::Sub": "${DataStackName}-DbPort" } }
            - { Name: AF_DB_NAME, Value: agentfleet }
            - { Name: AF_DB_USER, Value: afadmin }
            - { Name: AUTH, Value: !Ref AuthMode }
            - { Name: PUBLIC_BASE_URL, Value: !Sub "https://${Fqdn}" }
            - { Name: PUBLIC_DOMAIN, Value: !Ref Fqdn }
            - { Name: GOOGLE_OAUTH_CLIENT_ID, Value: !Ref GoogleClientId }
            - { Name: AF_OAUTH_ALLOWED_EMAILS, Value: !Ref AllowedEmails }
            - { Name: AF_OAUTH_ALLOWED_DOMAINS, Value: !Ref AllowedDomains }
            - { Name: SUPER_ADMIN_EMAILS, Value: !Ref SuperAdminEmails }
            # Generic OIDC IdP (docs/61). The redirect URI stays the single
            # https://<Fqdn>/oauth2/callback whether or not this is enabled.
            - { Name: AF_OIDC_PROVIDERS, Value: !Ref OidcProviderId }
            - !If [ HasOidc, { Name: !Sub "AF_OIDC_${OidcProviderId}_ISSUER", Value: !Ref OidcIssuer }, !Ref "AWS::NoValue" ]
            - !If [ HasOidc, { Name: !Sub "AF_OIDC_${OidcProviderId}_CLIENT_ID", Value: !Ref OidcClientId }, !Ref "AWS::NoValue" ]
            - !If [ HasOidc, { Name: !Sub "AF_OIDC_${OidcProviderId}_TRUST", Value: !Ref OidcTrust }, !Ref "AWS::NoValue" ]
            - !If [ HasOidc, { Name: !Sub "AF_OIDC_${OidcProviderId}_ALLOWED_TIDS", Value: !Ref OidcAllowedTids }, !Ref "AWS::NoValue" ]
            - !If [ HasOidc, { Name: !Sub "AF_OIDC_${OidcProviderId}_LABEL_JA", Value: !Ref OidcLabelJa }, !Ref "AWS::NoValue" ]
            - !If [ HasOidc, { Name: !Sub "AF_OIDC_${OidcProviderId}_LABEL_EN", Value: !Ref OidcLabelEn }, !Ref "AWS::NoValue" ]
            # GitHub sign-in (docs/61 §61.7). GITHUB_OAUTH_CLIENT_ID is passed
            # unconditionally: it is also the Console's git-connect device flow.
            - { Name: GITHUB_OAUTH_CLIENT_ID, Value: !Ref GithubClientId }
            - { Name: AF_GITHUB_ALLOWED_ORGS, Value: !Ref GithubAllowedOrgs }
            - { Name: AF_GITHUB_ALLOWED_DOMAINS, Value: !Ref GithubAllowedDomains }
            # AF_RUNTIME=ecs = the P3-7 stage-2 adapter. The AF_ECS_* below give it the
            # substrate placement it needs to provision per-workspace ECS services.
            - { Name: AF_RUNTIME, Value: ecs }
            - { Name: AF_ECS_REGION, Value: !Ref "AWS::Region" }
            - { Name: AF_ECS_CLUSTER, Value: !ImportValue { "Fn::Sub": "${PlatformStackName}-ClusterName" } }
            - { Name: AF_ECS_SUBNETS, Value: !ImportValue { "Fn::Sub": "${NetworkStackName}-PrivateSubnets" } }
            - { Name: AF_ECS_SECURITY_GROUP, Value: !ImportValue { "Fn::Sub": "${NetworkStackName}-WsSgId" } }
            - { Name: AF_ECS_EFS_ID, Value: !ImportValue { "Fn::Sub": "${DataStackName}-EfsId" } }
            - { Name: AF_ECS_NAMESPACE_ARN, Value: !ImportValue { "Fn::Sub": "${PlatformStackName}-NamespaceArn" } }
            - { Name: AF_ECS_EXEC_ROLE, Value: !ImportValue { "Fn::Sub": "${PlatformStackName}-ExecRoleArn" } }
            - { Name: AF_ECS_TASK_ROLE, Value: !ImportValue { "Fn::Sub": "${PlatformStackName}-WsTaskRoleArn" } }
            - { Name: AF_ECS_LOG_GROUP, Value: !Ref WsLogGroup }
            # Start's Agent-readiness wait is best-effort (a cold pull that outlasts
            # it does NOT fail Start — the workspace converges async), so the default
            # 90s budget is fine; override AF_ECS_START_TIMEOUT_SEC only if needed.
            - Name: AF_ECS_WORKSPACE_IMAGE
              Value: !Sub
                - "${Uri}:${Tag}"
                - Uri: !ImportValue { "Fn::Sub": "${PlatformStackName}-EcrWorkspaceUri" }
                  Tag: !Ref ImageTag
          Secrets:
            # RDS-managed master password (Secrets Manager JSON → the `password` key).
            - Name: AF_DB_PASSWORD
              ValueFrom: !Sub
                - "${Arn}:password::"
                - Arn: !ImportValue { "Fn::Sub": "${DataStackName}-DbSecretArn" }
            - !If
              - HasGoogle
              - Name: GOOGLE_OAUTH_CLIENT_SECRET
                ValueFrom: !Sub "arn:aws:ssm:${AWS::Region}:${AWS::AccountId}:parameter${SsmPrefix}/google-client-secret"
              - !Ref "AWS::NoValue"
            - !If
              - HasOidc
              - Name: !Sub "AF_OIDC_${OidcProviderId}_CLIENT_SECRET"
                ValueFrom: !Sub "arn:aws:ssm:${AWS::Region}:${AWS::AccountId}:parameter${SsmPrefix}/oidc-client-secret"
              - !Ref "AWS::NoValue"
            - !If
              - HasGithub
              - Name: GITHUB_OAUTH_CLIENT_SECRET
                ValueFrom: !Sub "arn:aws:ssm:${AWS::Region}:${AWS::AccountId}:parameter${SsmPrefix}/github-client-secret"
              - !Ref "AWS::NoValue"
            - Name: AF_COOKIE_SECRET
              ValueFrom: !Sub "arn:aws:ssm:${AWS::Region}:${AWS::AccountId}:parameter${SsmPrefix}/cookie-secret"
            - Name: AF_MASTER_KEY
              ValueFrom: !Sub "arn:aws:ssm:${AWS::Region}:${AWS::AccountId}:parameter${SsmPrefix}/master-key"
          LogConfiguration:
            LogDriver: awslogs
            Options:
              awslogs-group: !Ref LogGroup
              awslogs-region: !Ref "AWS::Region"
              awslogs-stream-prefix: cp

  Service:
    Type: AWS::ECS::Service
    DependsOn: Listener443
    Properties:
      ServiceName: !Sub "af-${AWS::StackName}-cp"
      Cluster: !ImportValue { "Fn::Sub": "${PlatformStackName}-ClusterArn" }
      TaskDefinition: !Ref TaskDef
      DesiredCount: 1
      LaunchType: FARGATE
      HealthCheckGracePeriodSeconds: 60
      NetworkConfiguration:
        AwsvpcConfiguration:
          AssignPublicIp: DISABLED
          Subnets: !Split [ ",", !ImportValue { "Fn::Sub": "${NetworkStackName}-PrivateSubnets" } ]
          SecurityGroups:
            - Fn::ImportValue: !Sub "${NetworkStackName}-CpSgId"
      LoadBalancers:
        - TargetGroupArn: !Ref TargetGroup
          ContainerName: cp
          ContainerPort: !Ref CpPort
      # CP as a Service Connect client so it can resolve workspace Agents by
      # <service>.<namespace> once the stage-2 adapter creates them.
      ServiceConnectConfiguration:
        Enabled: true
        Namespace: !ImportValue { "Fn::Sub": "${PlatformStackName}-NamespaceArn" }

  DnsRecord:
    Type: AWS::Route53::RecordSet
    Properties:
      HostedZoneId: !Ref HostedZoneId
      Name: !Ref Fqdn
      Type: A
      AliasTarget:
        DNSName: !GetAtt Alb.DNSName
        HostedZoneId: !GetAtt Alb.CanonicalHostedZoneID

Outputs:
  Url:
    Value: !Sub "https://${Fqdn}"
  AlbDnsName:
    Value: !GetAtt Alb.DNSName
