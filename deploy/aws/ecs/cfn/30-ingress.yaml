AWSTemplateFormatVersion: "2010-09-09"
Description: >-
  agent-fleet ECS adapter (P3-7) - ingress + Control Plane service. ACM cert (DNS-
  validated via Route53), an internet-facing ALB that only terminates TLS (auth is
  the CP-native login, AUTH=oauth - no ALB OIDC), the CP/Console Fargate service
  (Service Connect client so it can reach the workspace Agents it provisions), and
  the Route53 alias. Imports 00-network, 10-data (EFS + RDS) and 20-platform. The CP
  is wired with AF_ECS_* so the stage-2 ecsRuntime provisions workspaces on demand, and
  its MetadataStore is RDS Postgres (stage 3a) so state survives task replacement.

Parameters:
  # Anything too long for one line is in PARAMETERS.md next door (measurements, trade-offs,
  # traps). These are terse because of the 51,200-byte template limit: a YAML comment counts
  # toward the body exactly like a Description, so moving prose into a `#` does not shrink
  # the template - only moving it out of the file does.
  NetworkStackName:
    Type: String
    Default: af-ecs-network
  PlatformStackName:
    Type: String
    Default: af-ecs-platform
  DataStackName:
    Type: String
    Default: af-ecs-data
    Description: Name of the 10-data stack (EFS filesystem for workspace homes).
  EfsBackup:
    Type: String
    Default: ""
    AllowedValues: [ "", "off", present, missing ]
    Description: Daily EFS backup state of the data stack, set by update.sh/standup.sh (PARAMETERS.md).
  CustodianKmsKeyArn:
    Type: String
    Default: ""
    AllowedPattern: "^(arn:aws[a-z-]*:kms:[a-z0-9-]+:[0-9]{12}:key/[A-Za-z0-9-]+)?$"
    Description: Empty = the local key custodian. A KMS key ARN = the kms one (PARAMETERS.md).
  WorkspaceDekRandom:
    Type: String
    Default: "off"
    AllowedValues: [ "off", "on" ]
    Description: on = AF_WORKSPACE_DEK=random; needs CustodianKmsKeyArn.
  ImageTag:
    Type: String
    Default: dev
    Description: "Tag of BOTH the CP and workspace images in ECR (=VERSION). PARAMETERS.md."
  WsTaskCpu:
    Type: String
    Default: "1024"
    Description: "Default Fargate CPU units for a workspace task (1024 = 1 vCPU). PARAMETERS.md."
  WsTaskMemory:
    Type: String
    Default: "2048"
    Description: "Default workspace task memory in MiB; must pair with WsTaskCpu. PARAMETERS.md."
  WsDiskGiB:
    Type: String
    Default: "50"
    Description: "Default per-workspace working disk in GiB (0 = Fargate's 20). PARAMETERS.md."
  WsRuntime:
    Type: String
    Default: ecs
    AllowedValues: [ ecs, ecs-ec2 ]
    Description: "ecs = Fargate (default); ecs-ec2 = EC2 slot pool, needs 40-ec2-pool. PARAMETERS.md."
  Ec2SlotLaunchTemplate:
    Type: String
    Default: ""
    Description: >-
      SlotLaunchTemplateId output of the 40-ec2-pool stack (lt-...). Required when
      WsRuntime=ecs-ec2 - the CP refuses to boot on that profile without it.
  Ec2SlotTypes:
    Type: String
    Default: "standard|Standard (Intel)|x86_64|m7i.large:8192:2,m7i.xlarge:16384:4,m7i.2xlarge:32768:8;saver|Lower cost (Intel, previous gen)|x86_64|m6i.large:8192:2,m6i.xlarge:16384:4,m6i.2xlarge:32768:8"
    Description: "Slot sizes/classes the pool may run (instanceType:memoryMiB[:vcpu] or id|label|arch|ladder). PARAMETERS.md."
  Ec2SlotAmiArm64:
    Type: String
    Default: ""
    Description: >-
      SlotAmiIdArm64 output of the 40-ec2-pool stack. Required only when Ec2SlotTypes
      declares an arm64 class - the CP refuses to boot otherwise.
  Ec2DefaultSlotClass:
    Type: String
    Default: ""
    Description: "Class id for members with no choice. Empty = first of Ec2SlotTypes. PARAMETERS.md."
  Ec2MaxSlots:
    Type: String
    Default: "8"
    Description: "Hard cap on pool instances = concurrently running workspaces. PARAMETERS.md."
  Ec2HostReserveMb:
    Type: String
    Default: auto
    Description: "Memory held back from a slot: auto, off, or MiB. PARAMETERS.md."
  Ec2SlotSleepSec:
    Type: String
    Default: "900"
    Description: "Idle seconds before an empty slot instance is stopped; 0 = never. PARAMETERS.md."
  Ec2SlotTerminateAfterSec:
    Type: String
    Default: "0"
    Description: "Seconds after sleep before the slot root volume is released; 0 = never. PARAMETERS.md."
  Ec2HibernateAfterSec:
    Type: String
    Default: "0"
    Description: "Idle seconds before a home is snapshotted and its volume deleted; 0 = off. PARAMETERS.md."
  Ec2HomeGiB:
    Type: String
    Default: "50"
    Description: "Default size of a user's persistent home volume (gp3). PARAMETERS.md."
  # --- Scheduled execution (docs/log/38) ------------------------------------
  # !! EMPTY means "keep the product default" for all four; the defaults live in the CP
  # (control-plane/main.go). Copying them here would freeze this deployment on whatever they
  # were the day the stack was written.
  SchedulerInterval:
    Type: String
    Default: ""
    Description: "Tick cadence of the schedule loop (Go duration, default 1m; 0 = timed execution off)."
  ScheduleWakeTimeout:
    Type: String
    Default: ""
    Description: "How long one schedule fire waits for the woken Agent (Go duration, default 300s). PARAMETERS.md."
  ScheduleSettle:
    Type: String
    Default: ""
    Description: "How long a schedule-woken workspace is held against the reaper (default 5m)."
  ScheduleJitter:
    Type: String
    Default: ""
    Description: "Deterministic spread on CRON fires (Go duration, default 2m; 0 = exact). PARAMETERS.md."

  # --- WAF (optional, OFF by default) ---------------------------------------
  # !! ONLY rate limiting and IP reputation. The signature rule sets (Core rule set, SQLi,
  # XSS, LFI) are deliberately NOT offered: this product carries source code and shell
  # commands in ordinary request bodies, so they would 403 real work at random and look like
  # a product bug. The stronger control is upstream - 00-network's AlbIngressCidr.
  WafRateLimitPer5Min:
    Type: Number
    Default: 0
    Description: "Requests per 5 min per IP before WAF blocks (0 = no WAF). PARAMETERS.md."
  WafIpReputation:
    Type: String
    Default: "off"
    AllowedValues: [ "off", "on" ]
    Description: "on = AWS managed IP reputation list; needs WafRateLimitPer5Min > 0."
  Fqdn:
    Type: String
    Description: >-
      Public host for the Console/API (ACM cert + Route53 alias), e.g.
      af.example.com. Required - pass your own domain.
  HostedZoneId:
    Type: String
    Description: >-
      Route53 hosted zone id for the Fqdn's domain. Required - the zone must be
      in this account (ACM DNS validation + alias record are created in it).
  PreviewDomain:
    Type: String
    Default: ""
    Description: "Parent domain of preview subdomains; empty = path-mode previews only. PARAMETERS.md."
  PreviewHostedZoneId:
    Type: String
    Default: ""
    Description: "Hosted zone of PreviewDomain when not the Console's. Empty = HostedZoneId. PARAMETERS.md."
  CpPort:
    Type: Number
    Default: 8099
  CpCpu:
    Type: String
    Default: "512"
  CpMemory:
    Type: String
    Default: "1024"
  CpArch:
    Type: String
    Default: x86_64
    AllowedValues: [ x86_64, arm64 ]
    Description: "Architecture of the CP's Fargate task; arm64 needs an arm64 ImageTag. PARAMETERS.md."
  SsmPrefix:
    Type: String
    Default: /af-cp
    Description: "SSM SecureString prefix of the CP secrets (cookie-secret, master-key, IdP and engine secrets). PARAMETERS.md."
  GoogleClientId:
    Type: String
    Default: ""
    Description: Google OAuth client id (not secret; the secret comes from SSM).
      Leave empty to sign in with the OIDC provider below instead.
  OidcProviderId:
    Type: String
    Default: ""
    AllowedPattern: "^[A-Z0-9_]*$"
    Description: "UPPERCASE id enabling an OIDC IdP (names AF_OIDC_<ID>_*). Empty = Google only. PARAMETERS.md."
  OidcIssuer:
    Type: String
    Default: ""
    Description: "AF_OIDC_<ID>_ISSUER; pin Entra to a tenant guid. PARAMETERS.md."
  OidcClientId:
    Type: String
    Default: ""
    Description: AF_OIDC_<ID>_CLIENT_ID (not secret; the secret comes from SSM).
  OidcTrust:
    Type: String
    Default: issuer
    AllowedValues: [ issuer, email_verified ]
    Description: "AF_OIDC_<ID>_TRUST: issuer (pinned tenant) or email_verified. PARAMETERS.md."
  OidcAllowedTids:
    Type: String
    Default: ""
    Description: AF_OIDC_<ID>_ALLOWED_TIDS - accepted Entra tenant ids. Required only
      when the issuer is the /common/ or /organizations/ endpoint.
  OidcLabelJa:
    Type: String
    Default: ""
    Description: Login button label, Japanese (default is generated from the id).
  OidcLabelEn:
    Type: String
    Default: ""
    Description: Login button label, English (default is generated from the id).
  GithubAllowedOrgs:
    Type: String
    Default: ""
    Description: "AF_GITHUB_ALLOWED_ORGS (comma list); setting it enables the GitHub button. PARAMETERS.md."
  GithubClientId:
    Type: String
    Default: ""
    Description: "GITHUB_OAUTH_CLIENT_ID (not secret); sign-in only. PARAMETERS.md."
  GithubAllowedDomains:
    Type: String
    Default: ""
    Description: "AF_GITHUB_ALLOWED_DOMAINS; strongly recommended. PARAMETERS.md."
  AllowedEmails:
    Type: String
    Default: ""
    Description: AF_OAUTH_ALLOWED_EMAILS (comma-separated) permitted to sign in.
  AllowedDomains:
    Type: String
    Default: ""
    Description: "AF_OAUTH_ALLOWED_DOMAINS (comma list). Both allow-lists empty + nobody invited = login denied. PARAMETERS.md."
  SuperAdminEmails:
    Type: String
    Default: ""
    Description: SUPER_ADMIN_EMAILS (comma-separated), the only source of truth; read at task start (PARAMETERS.md).
  AfProvision:
    Type: String
    Default: invite
    AllowedValues: [ invite, auto ]
    Description: >-
      AF_PROVISION - what a sign-in with no tenant membership gets: invite = waits for
      an admin, auto = the default tenant. PARAMETERS.md.
  AuthMode:
    Type: String
    Default: oauth
    AllowedValues: [ oauth, dev ]
    Description: "oauth = CP-native login; dev = NO login, sandbox only. PARAMETERS.md."
  TtsEcsService:
    Type: String
    Default: ""
    Description: "AF_TTS_ECS_SERVICE, from 50-tts. Empty = no managed engine (Polly). PARAMETERS.md."
  VoicevoxUrl:
    Type: String
    Default: ""
    Description: "AF_VOICEVOX_URL, from 50-tts. PARAMETERS.md."
  EnginesSsmParam:
    Type: String
    Default: ""
    Description: "AF_ENGINES_SSM_PARAM, from 60-engines. Empty = no engines. PARAMETERS.md."
  CivitaiRed:
    Type: String
    Default: "0"
    AllowedValues: [ "0", "1" ]
    Description: "AF_ENGINE_CIVITAI_RED: 1 offers the Civitai Red source. PARAMETERS.md."
  BrandColor:
    Type: String
    Default: ""
    AllowedValues: [ "", teal, blue, violet, magenta, red, orange, green, slate ]
    Description: "AF_BRAND_COLOR, favicon/PWA colour. PARAMETERS.md."
  BrandLabel:
    Type: String
    Default: ""
    MaxLength: 16
    Description: "AF_BRAND_LABEL, label before the app name. PARAMETERS.md."
  CpAlarmEmail:
    Type: String
    Default: ""
    Description: "Email for CP-database-unreachable alarms; empty = no alarm. PARAMETERS.md."
  McpEnabled:
    Type: String
    Default: "off"
    AllowedValues: [ "off", "on" ]
    Description: on = AF_MCP_ENABLED=true, serving /mcp (PAT sign-in). PARAMETERS.md.
  McpOAuth:
    Type: String
    Default: "off"
    AllowedValues: [ "off", "on" ]
    Description: on = AF_MCP_OAUTH=1, OAuth sign-in for /mcp clients; needs McpEnabled=on.
  McpOAuthTrustedHosts:
    Type: String
    Default: ""
    Description: AF_MCP_OAUTH_TRUSTED_HOSTS (comma list). Empty = the CP default. PARAMETERS.md.
  SessionTtl:
    Type: String
    Default: ""
    Description: AF_SESSION_TTL, how long a sign-in cookie lives (Go duration, e.g. 72h). Empty = 168h.
  GithubAllowedEmails:
    Type: String
    Default: ""
    Description: AF_GITHUB_ALLOWED_EMAILS (comma list) admitted by GitHub sign-in, besides orgs and domains.
  KmsDataKeyCacheTtl:
    Type: String
    Default: ""
    Description: AF_KMS_DATA_KEY_CACHE_TTL (Go duration; 0s = no cache). Empty = 5m. Kms custodian only.
  SessionIdleTimeout:
    Type: String
    Default: ""
    Description: "AF_SESSION_IDLE_TIMEOUT; empty = CP default. PARAMETERS.md"
  InteractionIdleTimeout:
    Type: String
    Default: ""
    Description: "AF_INTERACTION_IDLE_TIMEOUT; empty = CP default. PARAMETERS.md"
  WsIdleTimeout:
    Type: String
    Default: ""
    Description: "AF_WS_IDLE_TIMEOUT; empty = CP default. PARAMETERS.md"
  PresenceIdleTimeout:
    Type: String
    Default: ""
    Description: "AF_PRESENCE_IDLE_TIMEOUT; empty = CP default. PARAMETERS.md"
  BackgroundHoldMax:
    Type: String
    Default: ""
    Description: "AF_BACKGROUND_HOLD_MAX; empty = CP default. PARAMETERS.md"
  WorkspaceStartDeadline:
    Type: String
    Default: ""
    Description: "AF_WORKSPACE_START_DEADLINE; empty = CP default. PARAMETERS.md"
  UsageSampleInterval:
    Type: String
    Default: ""
    Description: "AF_USAGE_SAMPLE_INTERVAL; empty = CP default. PARAMETERS.md"
  GithubLoginClientId:
    Type: String
    Default: ""
    Description: "AF_GITHUB_LOGIN_CLIENT_ID; empty = CP default. PARAMETERS.md"
  GithubLabelJa:
    Type: String
    Default: ""
    Description: "AF_GITHUB_LABEL_JA; empty = CP default. PARAMETERS.md"
  GithubLabelEn:
    Type: String
    Default: ""
    Description: "AF_GITHUB_LABEL_EN; empty = CP default. PARAMETERS.md"
  GithubMembershipTtl:
    Type: String
    Default: ""
    Description: "AF_GITHUB_MEMBERSHIP_TTL; empty = CP default. PARAMETERS.md"
  GithubMembershipGrace:
    Type: String
    Default: ""
    Description: "AF_GITHUB_MEMBERSHIP_GRACE; empty = CP default. PARAMETERS.md"
  LlmUrl:
    Type: String
    Default: ""
    Description: "AF_LLM_URL; empty = CP default. PARAMETERS.md"
  ComfyUrl:
    Type: String
    Default: ""
    Description: "AF_COMFY_URL; empty = CP default. PARAMETERS.md"
  RemoteEngineUrl:
    Type: String
    Default: ""
    Description: "AF_REMOTE_ENGINE_URL; empty = CP default. PARAMETERS.md"
  RemoteEngineKeys:
    Type: String
    Default: ""
    Description: "AF_REMOTE_ENGINE_KEYS; empty = CP default. PARAMETERS.md"
  GithubLoginSecret:
    Type: String
    Default: "off"
    AllowedValues: [ "off", "on" ]
    Description: "on = AF_GITHUB_LOGIN_CLIENT_SECRET from SSM github-login-client-secret. PARAMETERS.md"
  ComfyApiKey:
    Type: String
    Default: "off"
    AllowedValues: [ "off", "on" ]
    Description: "on = AF_COMFY_API_KEY from SSM comfy-api-key. PARAMETERS.md"
  RemoteEngineToken:
    Type: String
    Default: "off"
    AllowedValues: [ "off", "on" ]
    Description: "on = AF_REMOTE_ENGINE_TOKEN from SSM remote-engine-token. PARAMETERS.md"

Rules:
  McpOAuthNeedsMcp:
    RuleCondition: !Equals [ !Ref McpOAuth, "on" ]
    Assertions:
      - Assert: !Equals [ !Ref McpEnabled, "on" ]
        AssertDescription: McpOAuth=on needs McpEnabled=on.
  # The CP refuses the flag without kms (dek.go). Execute-time guard: see PARAMETERS.md.
  WorkspaceDekNeedsKmsCustodian:
    RuleCondition: !Equals [ !Ref WorkspaceDekRandom, "on" ]
    Assertions:
      - Assert: !Not [ !Equals [ !Ref CustodianKmsKeyArn, "" ] ]
        AssertDescription: WorkspaceDekRandom=on needs CustodianKmsKeyArn (AF_KEY_CUSTODIAN=kms).

Conditions:
  # Each IdP's client secret is pulled from SSM, and a Secrets entry pointing at a
  # parameter that doesn't exist stops the task from starting - so wire each one in
  # only when that IdP is actually configured.
  HasGoogle: !Not [ !Equals [ !Ref GoogleClientId, "" ] ]
  HasOidc: !Not [ !Equals [ !Ref OidcProviderId, "" ] ]
  # The org list, not the client id - historically GITHUB_OAUTH_CLIENT_ID also drove
  # the Console's git-connect device flow, which many deployments set without wanting a
  # login. That flow reads the tenant's own app since docs/log/71, but the switch stays the
  # org list: it is the thing that authorizes the sign-in.
  HasGithub: !Not [ !Equals [ !Ref GithubAllowedOrgs, "" ] ]
  # The rate limit is what creates the web ACL; reputation is an extra rule on it.
  HasPreviewDomain: !Not [ !Equals [ !Ref PreviewDomain, "" ] ]
  # Set when the preview name lives in another zone (a sibling needs its own delegated
  # zone). Empty = the Console's zone, as before.
  HasPreviewZone: !Not [ !Equals [ !Ref PreviewHostedZoneId, "" ] ]
  # Scheduled execution: each knob is passed ONLY when the operator set it, so an unset
  # parameter means "whatever the CP's own default is" rather than a copy frozen here.
  HasSchedulerInterval: !Not [ !Equals [ !Ref SchedulerInterval, "" ] ]
  HasScheduleWakeTimeout: !Not [ !Equals [ !Ref ScheduleWakeTimeout, "" ] ]
  HasScheduleSettle: !Not [ !Equals [ !Ref ScheduleSettle, "" ] ]
  HasScheduleJitter: !Not [ !Equals [ !Ref ScheduleJitter, "" ] ]
  # Speech (ADR 0070). Each is passed ONLY when 50-tts was deployed, so a deployment
  # without the engine stack carries neither variable and the CP keeps its own defaults -
  # no managed engine, and Polly reads. The two are separate conditions because they are
  # separately meaningful: a URL alone points at an engine somebody else runs.
  HasTtsEcsService: !Not [ !Equals [ !Ref TtsEcsService, "" ] ]
  HasVoicevoxUrl: !Not [ !Equals [ !Ref VoicevoxUrl, "" ] ]
  # Self-hosted inference engines (ADR 0071). One parameter, so one condition.
  HasEnginesSsmParam: !Not [ !Equals [ !Ref EnginesSsmParam, "" ] ]
  # CpArch keeps the operator's spelling (arm64); ECS stores the case verbatim, so it is
  # turned here, never in AllowedValues (that would reject every captured value). TaskDef below.
  CpArm: !Equals [ !Ref CpArch, arm64 ]
  UseKmsCustodian: !Not [ !Equals [ !Ref CustodianKmsKeyArn, "" ] ]
  UseWorkspaceDek: !And [ !Condition UseKmsCustodian, !Equals [ !Ref WorkspaceDekRandom, "on" ] ]
  McpOn: !Equals [ !Ref McpEnabled, "on" ]
  McpOAuthOn: !Equals [ !Ref McpOAuth, "on" ]
  HasMcpTrustedHosts: !Not [ !Equals [ !Ref McpOAuthTrustedHosts, "" ] ]
  HasSessionIdleTimeout: !Not [ !Equals [ !Ref SessionIdleTimeout, "" ] ]
  HasInteractionIdleTimeout: !Not [ !Equals [ !Ref InteractionIdleTimeout, "" ] ]
  HasWsIdleTimeout: !Not [ !Equals [ !Ref WsIdleTimeout, "" ] ]
  HasPresenceIdleTimeout: !Not [ !Equals [ !Ref PresenceIdleTimeout, "" ] ]
  HasBackgroundHoldMax: !Not [ !Equals [ !Ref BackgroundHoldMax, "" ] ]
  HasWorkspaceStartDeadline: !Not [ !Equals [ !Ref WorkspaceStartDeadline, "" ] ]
  HasUsageSampleInterval: !Not [ !Equals [ !Ref UsageSampleInterval, "" ] ]
  HasGithubLoginClientId: !Not [ !Equals [ !Ref GithubLoginClientId, "" ] ]
  HasGithubLabelJa: !Not [ !Equals [ !Ref GithubLabelJa, "" ] ]
  HasGithubLabelEn: !Not [ !Equals [ !Ref GithubLabelEn, "" ] ]
  HasGithubMembershipTtl: !Not [ !Equals [ !Ref GithubMembershipTtl, "" ] ]
  HasGithubMembershipGrace: !Not [ !Equals [ !Ref GithubMembershipGrace, "" ] ]
  HasLlmUrl: !Not [ !Equals [ !Ref LlmUrl, "" ] ]
  HasComfyUrl: !Not [ !Equals [ !Ref ComfyUrl, "" ] ]
  HasRemoteEngineUrl: !Not [ !Equals [ !Ref RemoteEngineUrl, "" ] ]
  HasRemoteEngineKeys: !Not [ !Equals [ !Ref RemoteEngineKeys, "" ] ]
  GithubLoginSecretOn: !Equals [ !Ref GithubLoginSecret, "on" ]
  ComfyApiKeyOn: !Equals [ !Ref ComfyApiKey, "on" ]
  RemoteEngineTokenOn: !Equals [ !Ref RemoteEngineToken, "on" ]
  HasCpAlarms: !Not [ !Equals [ !Ref CpAlarmEmail, "" ] ]
  HasWaf: !Not [ !Equals [ !Ref WafRateLimitPer5Min, 0 ] ]
  HasWafReputation: !And [ !Condition HasWaf, !Equals [ !Ref WafIpReputation, "on" ] ]

Resources:
  Cert:
    Type: AWS::CertificateManager::Certificate
    Properties:
      DomainName: !Ref Fqdn
      ValidationMethod: DNS
      DomainValidationOptions:
        - DomainName: !Ref Fqdn
          HostedZoneId: !Ref HostedZoneId

  Alb:
    Type: AWS::ElasticLoadBalancingV2::LoadBalancer
    Properties:
      Name: !Sub "af-${AWS::StackName}"
      Scheme: internet-facing
      Type: application
      Subnets: !Split [ ",", !ImportValue { "Fn::Sub": "${NetworkStackName}-PublicSubnets" } ]
      SecurityGroups:
        - Fn::ImportValue: !Sub "${NetworkStackName}-AlbSgId"
      # Spelled out at the AWS default (60s): the hard ceiling on every CP request. Raise it
      # only for a NEW long-poll, never to let a handler block longer (docs/log/62 sec.62.5).
      LoadBalancerAttributes:
        - { Key: idle_timeout.timeout_seconds, Value: "60" }

  # --- WAF (only when WafRateLimitPer5Min > 0) --------------------------------
  WebAcl:
    Type: AWS::WAFv2::WebACL
    Condition: HasWaf
    Properties:
      Name: !Sub "af-${AWS::StackName}"
      Scope: REGIONAL
      DefaultAction: { Allow: {} }
      VisibilityConfig:
        SampledRequestsEnabled: true
        CloudWatchMetricsEnabled: true
        MetricName: !Sub "af-${AWS::StackName}"
      Rules:
        # Rate limit first: it is the one rule that protects the login endpoint and
        # the API from a flood, and it decides on the SOURCE rather than the body.
        - Name: rate-limit
          Priority: 0
          Action: { Block: {} }
          Statement:
            RateBasedStatement:
              Limit: !Ref WafRateLimitPer5Min
              AggregateKeyType: IP
          VisibilityConfig:
            SampledRequestsEnabled: true
            CloudWatchMetricsEnabled: true
            MetricName: !Sub "af-${AWS::StackName}-rate"
        - !If
          - HasWafReputation
          - Name: ip-reputation
            Priority: 1
            OverrideAction: { None: {} }
            Statement:
              ManagedRuleGroupStatement:
                VendorName: AWS
                Name: AWSManagedRulesAmazonIpReputationList
            VisibilityConfig:
              SampledRequestsEnabled: true
              CloudWatchMetricsEnabled: true
              MetricName: !Sub "af-${AWS::StackName}-reputation"
          - !Ref AWS::NoValue

  WebAclAssociation:
    Type: AWS::WAFv2::WebACLAssociation
    Condition: HasWaf
    Properties:
      ResourceArn: !Ref Alb
      WebACLArn: !GetAtt WebAcl.Arn

  TargetGroup:
    Type: AWS::ElasticLoadBalancingV2::TargetGroup
    Properties:
      VpcId:
        Fn::ImportValue: !Sub "${NetworkStackName}-VpcId"
      Port: !Ref CpPort
      Protocol: HTTP
      TargetType: ip                     # Fargate awsvpc = register by ENI IP
      HealthCheckPath: /healthz          # CP serves this unauthenticated
      HealthCheckProtocol: HTTP
      Matcher: { HttpCode: "200" }
      TargetGroupAttributes:
        - { Key: deregistration_delay.timeout_seconds, Value: "30" }

  Listener443:
    Type: AWS::ElasticLoadBalancingV2::Listener
    Properties:
      LoadBalancerArn: !Ref Alb
      Port: 443
      Protocol: HTTPS
      SslPolicy: ELBSecurityPolicy-TLS13-1-2-2021-06
      Certificates:
        - CertificateArn: !Ref Cert
      DefaultActions:
        - Type: forward
          TargetGroupArn: !Ref TargetGroup

  # --- preview subdomains (docs/81), only when PreviewDomain is set -----------
  # Never touch the existing Cert: adding a SAN replaces the certificate, rebuilding the TLS
  # the Console already serves just to add previews. A listener can pick extra certificates
  # by SNI, so attach this as a second one - turning previews off is then only a removal
  # (decision 4).
  PreviewCert:
    Type: AWS::CertificateManager::Certificate
    Condition: HasPreviewDomain
    Properties:
      DomainName: !Sub "*.${PreviewDomain}"
      ValidationMethod: DNS
      DomainValidationOptions:
        - DomainName: !Sub "*.${PreviewDomain}"
          # The zone the validation record `_xxx.{PreviewDomain}` is written into. The
          # `*.` is stripped, so what is needed is the zone containing PreviewDomain
          # itself, not the Console's zone.
          HostedZoneId: !If [ HasPreviewZone, !Ref PreviewHostedZoneId, !Ref HostedZoneId ]

  PreviewListenerCert:
    Type: AWS::ElasticLoadBalancingV2::ListenerCertificate
    Condition: HasPreviewDomain
    Properties:
      ListenerArn: !Ref Listener443
      Certificates:
        - CertificateArn: !Ref PreviewCert

  # One wildcard covers every workspace and every port. Never write a record per workspace:
  # that puts an API round trip and a propagation wait on every start and runs into the
  # record-count quota. Zero issuance cost and zero propagation wait are the one plain win
  # host mode has, and giving it up leaves only the complexity (decision 5).
  PreviewDnsRecord:
    Type: AWS::Route53::RecordSet
    Condition: HasPreviewDomain
    Properties:
      HostedZoneId: !If [ HasPreviewZone, !Ref PreviewHostedZoneId, !Ref HostedZoneId ]
      Name: !Sub "*.${PreviewDomain}"
      Type: A
      AliasTarget:
        DNSName: !GetAtt Alb.DNSName
        HostedZoneId: !GetAtt Alb.CanonicalHostedZoneID

  Listener80:
    Type: AWS::ElasticLoadBalancingV2::Listener
    Properties:
      LoadBalancerArn: !Ref Alb
      Port: 80
      Protocol: HTTP
      DefaultActions:
        - Type: redirect
          RedirectConfig: { Protocol: HTTPS, Port: "443", StatusCode: HTTP_301 }

  LogGroup:
    Type: AWS::Logs::LogGroup
    DeletionPolicy: Delete
    Properties:
      LogGroupName: !Sub "/af/${AWS::StackName}/cp"
      RetentionInDays: 7

  # --- "the Control Plane cannot reach its database", made visible -------------
  # The only signal in the 2026-09-01 outage was a line in this log group (README, "Alarms").
  # The marker is shared with control-plane/store_postgres_secret.go (logDBUnavailable):
  # change both or neither. Unconditional: a filter matching nothing costs nothing.
  CpDbUnavailableFilter:
    Type: AWS::Logs::MetricFilter
    Properties:
      LogGroupName: !Ref LogGroup
      FilterPattern: DB_UNAVAILABLE
      MetricTransformations:
        - MetricNamespace: !Sub "AgentFleet/${AWS::StackName}"
          MetricName: DbUnavailable
          MetricValue: "1"
          DefaultValue: 0
          Unit: Count

  CpAlarmTopic:
    Type: AWS::SNS::Topic
    Condition: HasCpAlarms
    Properties:
      TopicName: !Sub "af-${AWS::StackName}-cp-alarms"
      DisplayName: agent-fleet control plane
      Subscription:
        - Protocol: email
          Endpoint: !Ref CpAlarmEmail

  # One breach is enough. The CP rate-limits this line to one a minute, so a single
  # datapoint already means "for a whole minute, connections were failing" - not a
  # blip. Waiting for a second period would only add five minutes to an outage in
  # which the product returns 500 to everybody.
  CpDbUnavailableAlarm:
    Type: AWS::CloudWatch::Alarm
    Condition: HasCpAlarms
    Properties:
      AlarmName: !Sub "af-${AWS::StackName}-cp-db-unavailable"
      AlarmDescription: >-
        The Control Plane could not open a database connection. If this coincides with
        the RDS secret's rotation schedule, the credential refresh
        (control-plane/store_postgres_secret.go) did not work - check the log for
        DB_SECRET_REFRESH_FAILED, which usually means CpTaskRole lost
        secretsmanager:GetSecretValue. Recovery of last resort, ~4 minutes and no
        outage because it is blue/green:
        aws ecs update-service --cluster <cluster> --service <cp-service> --force-new-deployment
      Namespace: !Sub "AgentFleet/${AWS::StackName}"
      MetricName: DbUnavailable
      Statistic: Sum
      Period: 300
      ComparisonOperator: GreaterThanOrEqualToThreshold
      Threshold: 1
      EvaluationPeriods: 1
      DatapointsToAlarm: 1
      TreatMissingData: notBreaching
      AlarmActions: [ !Ref CpAlarmTopic ]
      OKActions: [ !Ref CpAlarmTopic ]

  # Workspace tasks (created by the CP at runtime) log here - the CP passes this
  # group name to each task definition via AF_ECS_LOG_GROUP.
  WsLogGroup:
    Type: AWS::Logs::LogGroup
    DeletionPolicy: Delete
    Properties:
      LogGroupName: !Sub "/af/${AWS::StackName}/ws"
      RetentionInDays: 7

  # --- The home task: Recreate, Clean home and Destroy on an EFS home (ecs; #1260) ---
  # The CP cannot mount EFS (the EFS SG admits only the workspace SG), so Recreate, Clean home
  # and Destroy run as a one-shot RunTask of `af-cp efs-home-op` from the CP's own image
  # (control-plane/internal/runtime/home_task.go); the CP reads the exit code back.
  #
  # !! The file system ROOT as uid 0, not a member's access point: volumes cannot be
  # overridden per RunTask, and an access point (uid 1000) cannot remove read-only trees or
  # its own root. The confinement is the command's (PARAMETERS.md, "Home task").
  #
  # No task role: the command calls no AWS API. The execution role pulls the image and
  # writes the log; the CP may already pass it (PassTaskRoles, 20-platform).
  HomeOpsTaskDef:
    Type: AWS::ECS::TaskDefinition
    Properties:
      Family: !Sub "af-${AWS::StackName}-home-ops"
      RequiresCompatibilities: [ FARGATE ]
      NetworkMode: awsvpc
      Cpu: "256"
      Memory: "512"
      # The CP image, so the CP's architecture (see TaskDef below).
      RuntimePlatform:
        CpuArchitecture: !If [ CpArm, ARM64, X86_64 ]
        OperatingSystemFamily: LINUX
      ExecutionRoleArn:
        Fn::ImportValue: !Sub "${PlatformStackName}-ExecRoleArn"
      Volumes:
        - Name: efs
          EFSVolumeConfiguration:
            FilesystemId: !ImportValue { "Fn::Sub": "${DataStackName}-EfsId" }
            RootDirectory: /
            TransitEncryption: ENABLED
      ContainerDefinitions:
        - Name: home-ops
          Essential: true
          Image: !Sub
            - "${Uri}:${Tag}"
            - Uri: !ImportValue { "Fn::Sub": "${PlatformStackName}-EcrControlPlaneUri" }
              Tag: !Ref ImageTag
          User: "0"
          Command: [ efs-home-op ]
          # Placeholders; the CP overrides both on every RunTask. Empty is refused (exit 2).
          Environment:
            - { Name: AF_HOME_OP, Value: "" }
            - { Name: AF_HOME_MEMBERSHIP, Value: "" }
          MountPoints: [ { SourceVolume: efs, ContainerPath: /mnt/efs } ]
          LogConfiguration:
            LogDriver: awslogs
            Options:
              awslogs-group: !Ref WsLogGroup
              awslogs-region: !Ref "AWS::Region"
              awslogs-stream-prefix: home-ops

  # The CP's grant for the task above, in this stack because only this stack can name the
  # family: RunTask fenced to that family and this cluster, and the cost tags authorized as
  # ecs:TagResource on the new task only (PARAMETERS.md, "Home task grant").
  # deploy/local/cfn-cp-ec2-scope-test.py holds the allowed calls and the denied ones.
  # Managed (inline total is capped, #1576); names are account-wide, hence the region.
  CpHomeOpsManagedPolicy:
    Type: AWS::IAM::ManagedPolicy
    Properties:
      ManagedPolicyName: !Sub "af-${AWS::StackName}-cp-home-ops-${AWS::Region}"
      Roles:
        - !Select [ 1, !Split [ "/", !ImportValue { "Fn::Sub": "${PlatformStackName}-CpTaskRoleArn" } ] ]
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Sid: RunHomeOpsTask
            Effect: Allow
            Action: [ ecs:RunTask ]
            Resource: !Sub "arn:aws:ecs:${AWS::Region}:${AWS::AccountId}:task-definition/af-${AWS::StackName}-home-ops:*"
            Condition:
              ArnEquals: { "ecs:cluster": !ImportValue { "Fn::Sub": "${PlatformStackName}-ClusterArn" } }
          - Sid: TagHomeOpsTaskOnRun
            Effect: Allow
            Action: ecs:TagResource
            Resource: !Sub
              - "arn:aws:ecs:${AWS::Region}:${AWS::AccountId}:task/${ClusterName}/*"
              - ClusterName: !ImportValue { "Fn::Sub": "${PlatformStackName}-ClusterName" }
            Condition:
              StringEquals:
                ecs:CreateAction: RunTask
              "Null":
                aws:TagKeys: "false"
              ForAllValues:StringEquals:
                aws:TagKeys: [ af-membership, af-role, af-tenant ]

  # The kms key custodian's grant (ADR 0005): this key, its two calls, its encryption
  # context only. deploy/local/cfn-cp-kms-scope-test.py.
  CpCustodianKmsPolicy:
    Type: AWS::IAM::ManagedPolicy
    Condition: UseKmsCustodian
    Properties:
      ManagedPolicyName: !Sub "af-${AWS::StackName}-cp-custodian-kms-${AWS::Region}"
      Roles:
        - !Select [ 1, !Split [ "/", !ImportValue { "Fn::Sub": "${PlatformStackName}-CpTaskRoleArn" } ] ]
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Sid: CustodianDataKeys
            Effect: Allow
            Action: [ kms:GenerateDataKey, kms:Decrypt ]
            Resource: !Ref CustodianKmsKeyArn
            Condition:
              StringEquals:
                kms:EncryptionContext:af:purpose: agent-fleet-custodian
              "Null":
                kms:EncryptionContext:af:key_ref: "false"
              ForAllValues:StringEquals:
                kms:EncryptionContextKeys: [ af:purpose, af:key_ref ]

  TaskDef:
    Type: AWS::ECS::TaskDefinition
    # AF_ECS_HOME_TASK names the family as a string, which CloudFormation does not order by:
    # without this a fresh CP could offer Recreate before the family or its grant exists.
    DependsOn: [ HomeOpsTaskDef, CpHomeOpsManagedPolicy ]
    Properties:
      Family: !Sub "af-${AWS::StackName}-cp"
      RequiresCompatibilities: [ FARGATE ]
      NetworkMode: awsvpc
      Cpu: !Ref CpCpu
      Memory: !Ref CpMemory
      # Declared, not inferred (docs/log/72): Fargate applies its X86_64 default at task
      # start, so an omitted value is nowhere in the definition, and stating it makes a
      # CpArch switch a new revision rather than a no-op. EC2 has no such default
      # (docs/log/70 sec.70.8). The ECS enum's spelling, not CpArch's (see CpArm).
      RuntimePlatform:
        CpuArchitecture: !If [ CpArm, ARM64, X86_64 ]
        OperatingSystemFamily: LINUX
      ExecutionRoleArn:
        Fn::ImportValue: !Sub "${PlatformStackName}-ExecRoleArn"
      TaskRoleArn:
        Fn::ImportValue: !Sub "${PlatformStackName}-CpTaskRoleArn"
      ContainerDefinitions:
        - Name: cp
          Essential: true
          Image: !Sub
            - "${Uri}:${Tag}"
            - Uri: !ImportValue { "Fn::Sub": "${PlatformStackName}-EcrControlPlaneUri" }
              Tag: !Ref ImageTag
          PortMappings:
            - ContainerPort: !Ref CpPort
          Environment:
            # ECS/awsvpc: the ALB reaches the task over its ENI, so CP must bind
            # non-loopback (the CpSg restricts 8099 ingress to the ALB SG - the
            # network isolation the compose loopback bind gives on a single box).
            - { Name: CP_ADDR, Value: !Sub "0.0.0.0:${CpPort}" }
            - { Name: WS_DATA, Value: /tmp }   # unused for state now (store = RDS/Postgres, below)
            # MetadataStore = RDS Postgres (P3-7 stage 3a): survives CP task replacement.
            # The CP composes the DSN from these parts; the password arrives as a
            # secret (below) so it never sits in a plaintext URL/env.
            - { Name: AF_DB_HOST, Value: !ImportValue { "Fn::Sub": "${DataStackName}-DbEndpoint" } }
            - { Name: AF_DB_PORT, Value: !ImportValue { "Fn::Sub": "${DataStackName}-DbPort" } }
            - { Name: AF_DB_NAME, Value: agentfleet }
            - { Name: AF_KEY_CUSTODIAN, Value: !If [ UseKmsCustodian, kms, local ] }
            - !If [ UseKmsCustodian, { Name: AF_KMS_KEY_ID, Value: !Ref CustodianKmsKeyArn }, !Ref "AWS::NoValue" ]
            - !If [ UseWorkspaceDek, { Name: AF_WORKSPACE_DEK, Value: random }, !Ref "AWS::NoValue" ]
            - { Name: AF_DB_USER, Value: afadmin }
            # Where the CP re-reads the RDS password (rotated every 7 days; `secrets` below is
            # resolved once at task start, ADR 0065). Environment, NOT Secrets: an ARN is no
            # credential, and `secrets` would be another start-time snapshot.
            - Name: AF_DB_PASSWORD_SECRET_ARN
              Value: !ImportValue { "Fn::Sub": "${DataStackName}-DbSecretArn" }
            # The JSON field inside the RDS-managed secret - the same `password` the
            # `:password::` suffix picks out below.
            - { Name: AF_DB_PASSWORD_SECRET_KEY, Value: password }
            # !! Exactly one proxy (this ALB) sits in front of the CP, and the CP cannot tell:
            # tenant source-network rules are matched on the client address this derives
            # (docs/log/66, ADR 0047 decision 2), so a wrong value matches no one or everyone.
            - { Name: AF_TRUSTED_PROXY_HOPS, Value: "1" }
            - { Name: AUTH, Value: !Ref AuthMode }
            - { Name: PUBLIC_BASE_URL, Value: !Sub "https://${Fqdn}" }
            - { Name: PUBLIC_DOMAIN, Value: !Ref Fqdn }
            # docs/81: parent domain for the preview subdomains. Empty and the CP registers
            # no host-mode routing at all (only the existing path mode remains).
            - { Name: AF_PREVIEW_DOMAIN, Value: !Ref PreviewDomain }
            # Per-deployment favicon colour and app-name label (control-plane/brand.go).
            - { Name: AF_BRAND_COLOR, Value: !Ref BrandColor }
            - { Name: AF_BRAND_LABEL, Value: !Ref BrandLabel }
            - { Name: GOOGLE_OAUTH_CLIENT_ID, Value: !Ref GoogleClientId }
            - { Name: AF_OAUTH_ALLOWED_EMAILS, Value: !Ref AllowedEmails }
            - { Name: AF_OAUTH_ALLOWED_DOMAINS, Value: !Ref AllowedDomains }
            - { Name: SUPER_ADMIN_EMAILS, Value: !Ref SuperAdminEmails }
            - { Name: AF_PROVISION, Value: !Ref AfProvision }
            # Generic OIDC IdP (docs/log/61). The redirect URI stays the single
            # https://<Fqdn>/oauth2/callback whether or not this is enabled.
            - { Name: AF_OIDC_PROVIDERS, Value: !Ref OidcProviderId }
            - !If [ HasOidc, { Name: !Sub "AF_OIDC_${OidcProviderId}_ISSUER", Value: !Ref OidcIssuer }, !Ref "AWS::NoValue" ]
            - !If [ HasOidc, { Name: !Sub "AF_OIDC_${OidcProviderId}_CLIENT_ID", Value: !Ref OidcClientId }, !Ref "AWS::NoValue" ]
            - !If [ HasOidc, { Name: !Sub "AF_OIDC_${OidcProviderId}_TRUST", Value: !Ref OidcTrust }, !Ref "AWS::NoValue" ]
            - !If [ HasOidc, { Name: !Sub "AF_OIDC_${OidcProviderId}_ALLOWED_TIDS", Value: !Ref OidcAllowedTids }, !Ref "AWS::NoValue" ]
            - !If [ HasOidc, { Name: !Sub "AF_OIDC_${OidcProviderId}_LABEL_JA", Value: !Ref OidcLabelJa }, !Ref "AWS::NoValue" ]
            - !If [ HasOidc, { Name: !Sub "AF_OIDC_${OidcProviderId}_LABEL_EN", Value: !Ref OidcLabelEn }, !Ref "AWS::NoValue" ]
            # GitHub sign-in (docs/log/61 sec.61.7).
            - { Name: GITHUB_OAUTH_CLIENT_ID, Value: !Ref GithubClientId }
            - { Name: AF_GITHUB_ALLOWED_ORGS, Value: !Ref GithubAllowedOrgs }
            - { Name: AF_GITHUB_ALLOWED_DOMAINS, Value: !Ref GithubAllowedDomains }
            - { Name: AF_SESSION_TTL, Value: !Ref SessionTtl }
            - { Name: AF_GITHUB_ALLOWED_EMAILS, Value: !Ref GithubAllowedEmails }
            - { Name: AF_KMS_DATA_KEY_CACHE_TTL, Value: !Ref KmsDataKeyCacheTtl }
            - !If [ McpOn, { Name: AF_MCP_ENABLED, Value: "true" }, !Ref "AWS::NoValue" ]
            - !If [ McpOAuthOn, { Name: AF_MCP_OAUTH, Value: "1" }, !Ref "AWS::NoValue" ]
            - !If [ HasMcpTrustedHosts, { Name: AF_MCP_OAUTH_TRUSTED_HOSTS, Value: !Ref McpOAuthTrustedHosts }, !Ref "AWS::NoValue" ]
            - !If [ HasSessionIdleTimeout, { Name: AF_SESSION_IDLE_TIMEOUT, Value: !Ref SessionIdleTimeout }, !Ref "AWS::NoValue" ]
            - !If [ HasInteractionIdleTimeout, { Name: AF_INTERACTION_IDLE_TIMEOUT, Value: !Ref InteractionIdleTimeout }, !Ref "AWS::NoValue" ]
            - !If [ HasWsIdleTimeout, { Name: AF_WS_IDLE_TIMEOUT, Value: !Ref WsIdleTimeout }, !Ref "AWS::NoValue" ]
            - !If [ HasPresenceIdleTimeout, { Name: AF_PRESENCE_IDLE_TIMEOUT, Value: !Ref PresenceIdleTimeout }, !Ref "AWS::NoValue" ]
            - !If [ HasBackgroundHoldMax, { Name: AF_BACKGROUND_HOLD_MAX, Value: !Ref BackgroundHoldMax }, !Ref "AWS::NoValue" ]
            - !If [ HasWorkspaceStartDeadline, { Name: AF_WORKSPACE_START_DEADLINE, Value: !Ref WorkspaceStartDeadline }, !Ref "AWS::NoValue" ]
            - !If [ HasUsageSampleInterval, { Name: AF_USAGE_SAMPLE_INTERVAL, Value: !Ref UsageSampleInterval }, !Ref "AWS::NoValue" ]
            - !If [ HasGithubLoginClientId, { Name: AF_GITHUB_LOGIN_CLIENT_ID, Value: !Ref GithubLoginClientId }, !Ref "AWS::NoValue" ]
            - !If [ HasGithubLabelJa, { Name: AF_GITHUB_LABEL_JA, Value: !Ref GithubLabelJa }, !Ref "AWS::NoValue" ]
            - !If [ HasGithubLabelEn, { Name: AF_GITHUB_LABEL_EN, Value: !Ref GithubLabelEn }, !Ref "AWS::NoValue" ]
            - !If [ HasGithubMembershipTtl, { Name: AF_GITHUB_MEMBERSHIP_TTL, Value: !Ref GithubMembershipTtl }, !Ref "AWS::NoValue" ]
            - !If [ HasGithubMembershipGrace, { Name: AF_GITHUB_MEMBERSHIP_GRACE, Value: !Ref GithubMembershipGrace }, !Ref "AWS::NoValue" ]
            - !If [ HasLlmUrl, { Name: AF_LLM_URL, Value: !Ref LlmUrl }, !Ref "AWS::NoValue" ]
            - !If [ HasComfyUrl, { Name: AF_COMFY_URL, Value: !Ref ComfyUrl }, !Ref "AWS::NoValue" ]
            - !If [ HasRemoteEngineUrl, { Name: AF_REMOTE_ENGINE_URL, Value: !Ref RemoteEngineUrl }, !Ref "AWS::NoValue" ]
            - !If [ HasRemoteEngineKeys, { Name: AF_REMOTE_ENGINE_KEYS, Value: !Ref RemoteEngineKeys }, !Ref "AWS::NoValue" ]
            # No BITBUCKET_OAUTH_* / workspace GITHUB_OAUTH_CLIENT_ID: git OAuth apps are
            # per-tenant rows (docs/log/71); the Bitbucket callback derives from PUBLIC_BASE_URL.
            # AF_RUNTIME: ecs = Fargate, ecs-ec2 = EC2 slots with a per-user EBS home (needs
            # 40-ec2-pool + Ec2SlotLaunchTemplate; docs/log/64, ADR 0045 decision 10). Rolling
            # back is this one parameter. The AF_ECS_* below are shared by both.
            - { Name: AF_RUNTIME, Value: !Ref WsRuntime }
            - { Name: AF_ECS_REGION, Value: !Ref "AWS::Region" }
            - { Name: AF_ECS_CLUSTER, Value: !ImportValue { "Fn::Sub": "${PlatformStackName}-ClusterName" } }
            - { Name: AF_ECS_SUBNETS, Value: !ImportValue { "Fn::Sub": "${NetworkStackName}-PrivateSubnets" } }
            - { Name: AF_ECS_SECURITY_GROUP, Value: !ImportValue { "Fn::Sub": "${NetworkStackName}-WsSgId" } }
            - { Name: AF_EFS_BACKUP, Value: !Ref EfsBackup }
            - { Name: AF_ECS_EFS_ID, Value: !ImportValue { "Fn::Sub": "${DataStackName}-EfsId" } }
            - { Name: AF_ECS_NAMESPACE_ARN, Value: !ImportValue { "Fn::Sub": "${PlatformStackName}-NamespaceArn" } }
            - { Name: AF_ECS_EXEC_ROLE, Value: !ImportValue { "Fn::Sub": "${PlatformStackName}-ExecRoleArn" } }
            - { Name: AF_ECS_TASK_ROLE, Value: !ImportValue { "Fn::Sub": "${PlatformStackName}-WsTaskRoleArn" } }
            - { Name: AF_ECS_LOG_GROUP, Value: !Ref WsLogGroup }
            - { Name: AF_ECS_TASK_CPU, Value: !Ref WsTaskCpu }
            - { Name: AF_ECS_TASK_MEMORY, Value: !Ref WsTaskMemory }
            - { Name: AF_ECS_WS_DISK_GB, Value: !Ref WsDiskGiB }
            # The home task above, by FAMILY: a revision would go inactive at the next update.
            - { Name: AF_ECS_HOME_TASK, Value: !Sub "af-${AWS::StackName}-home-ops" }
            # --- EC2 slot pool (only read when WsRuntime=ecs-ec2) ---
            - { Name: AF_ECS_EC2_LAUNCH_TEMPLATE, Value: !Ref Ec2SlotLaunchTemplate }
            - { Name: AF_ECS_EC2_SLOT_TYPES, Value: !Ref Ec2SlotTypes }
            - { Name: AF_ECS_EC2_AMI_ARM64, Value: !Ref Ec2SlotAmiArm64 }
            - { Name: AF_ECS_EC2_DEFAULT_SLOT_CLASS, Value: !Ref Ec2DefaultSlotClass }
            - { Name: AF_ECS_EC2_MAX_SLOTS, Value: !Ref Ec2MaxSlots }
            - { Name: AF_ECS_EC2_HOST_RESERVE_MB, Value: !Ref Ec2HostReserveMb }
            - { Name: AF_ECS_EC2_SLOT_SLEEP_SEC, Value: !Ref Ec2SlotSleepSec }
            - { Name: AF_ECS_EC2_SLOT_TERMINATE_AFTER_SEC, Value: !Ref Ec2SlotTerminateAfterSec }
            - { Name: AF_ECS_EC2_HIBERNATE_AFTER_SEC, Value: !Ref Ec2HibernateAfterSec }
            - { Name: AF_ECS_EC2_HOME_GB, Value: !Ref Ec2HomeGiB }
            # --- Scheduled execution (docs/log/38). Unset = the CP's own default. ---
            - !If [ HasSchedulerInterval, { Name: AF_SCHEDULER_INTERVAL, Value: !Ref SchedulerInterval }, !Ref "AWS::NoValue" ]
            - !If [ HasScheduleWakeTimeout, { Name: AF_SCHEDULE_WAKE_TIMEOUT, Value: !Ref ScheduleWakeTimeout }, !Ref "AWS::NoValue" ]
            - !If [ HasScheduleSettle, { Name: AF_SCHEDULE_SETTLE, Value: !Ref ScheduleSettle }, !Ref "AWS::NoValue" ]
            - !If [ HasScheduleJitter, { Name: AF_SCHEDULE_JITTER, Value: !Ref ScheduleJitter }, !Ref "AWS::NoValue" ]
            # --- Speech: the VOICEVOX engine of 50-tts (ADR 0070). Unset = Polly only. ---
            # AF_TTS_ECS_CLUSTER / _REGION are deliberately absent: tts_ecs.go falls back to
            # AF_ECS_CLUSTER and AF_ECS_REGION above, and the engine is in the same cluster.
            - !If [ HasTtsEcsService, { Name: AF_TTS_ECS_SERVICE, Value: !Ref TtsEcsService }, !Ref "AWS::NoValue" ]
            - !If [ HasVoicevoxUrl, { Name: AF_VOICEVOX_URL, Value: !Ref VoicevoxUrl }, !Ref "AWS::NoValue" ]
            # --- Self-hosted inference engines: the table 60-engines wrote (ADR 0071).
            # Unset = no engines, and the /engine/* gateway answers 404. Cluster and region
            # ride on AF_ECS_* above, as they do for the speech engine.
            - !If [ HasEnginesSsmParam, { Name: AF_ENGINES_SSM_PARAM, Value: !Ref EnginesSsmParam }, !Ref "AWS::NoValue" ]
            # Unconditional, unlike the table above: this parameter has no empty state to
            # condition on -- "0" IS the answer, and it is the one that hides the NSFW
            # search source. PARAMETERS.md.
            - { Name: AF_ENGINE_CIVITAI_RED, Value: !Ref CivitaiRed }
            # Start returns as soon as the service is at desiredCount 1; the Agent
            # readiness poll runs in the background for the log line only, on the
            # AF_ECS_START_TIMEOUT_SEC budget (default 300s). Nothing waits on it,
            # so it is deliberately longer than the ALB idle timeout above.
            - Name: AF_ECS_WORKSPACE_IMAGE
              Value: !Sub
                - "${Uri}:${Tag}"
                - Uri: !ImportValue { "Fn::Sub": "${PlatformStackName}-EcrWorkspaceUri" }
                  Tag: !Ref ImageTag
          Secrets:
            # RDS-managed master password (Secrets Manager JSON -> the `password` key).
            - Name: AF_DB_PASSWORD
              ValueFrom: !Sub
                - "${Arn}:password::"
                - Arn: !ImportValue { "Fn::Sub": "${DataStackName}-DbSecretArn" }
            - !If
              - HasGoogle
              - Name: GOOGLE_OAUTH_CLIENT_SECRET
                ValueFrom: !Sub "arn:aws:ssm:${AWS::Region}:${AWS::AccountId}:parameter${SsmPrefix}/google-client-secret"
              - !Ref "AWS::NoValue"
            - !If
              - HasOidc
              - Name: !Sub "AF_OIDC_${OidcProviderId}_CLIENT_SECRET"
                ValueFrom: !Sub "arn:aws:ssm:${AWS::Region}:${AWS::AccountId}:parameter${SsmPrefix}/oidc-client-secret"
              - !Ref "AWS::NoValue"
            - !If
              - HasGithub
              - Name: GITHUB_OAUTH_CLIENT_SECRET
                ValueFrom: !Sub "arn:aws:ssm:${AWS::Region}:${AWS::AccountId}:parameter${SsmPrefix}/github-client-secret"
              - !Ref "AWS::NoValue"
            - !If
              - GithubLoginSecretOn
              - Name: AF_GITHUB_LOGIN_CLIENT_SECRET
                ValueFrom: !Sub "arn:aws:ssm:${AWS::Region}:${AWS::AccountId}:parameter${SsmPrefix}/github-login-client-secret"
              - !Ref "AWS::NoValue"
            - !If
              - ComfyApiKeyOn
              - Name: AF_COMFY_API_KEY
                ValueFrom: !Sub "arn:aws:ssm:${AWS::Region}:${AWS::AccountId}:parameter${SsmPrefix}/comfy-api-key"
              - !Ref "AWS::NoValue"
            - !If
              - RemoteEngineTokenOn
              - Name: AF_REMOTE_ENGINE_TOKEN
                ValueFrom: !Sub "arn:aws:ssm:${AWS::Region}:${AWS::AccountId}:parameter${SsmPrefix}/remote-engine-token"
              - !Ref "AWS::NoValue"
            - Name: AF_COOKIE_SECRET
              ValueFrom: !Sub "arn:aws:ssm:${AWS::Region}:${AWS::AccountId}:parameter${SsmPrefix}/cookie-secret"
            - Name: AF_MASTER_KEY
              ValueFrom: !Sub "arn:aws:ssm:${AWS::Region}:${AWS::AccountId}:parameter${SsmPrefix}/master-key"
          LogConfiguration:
            LogDriver: awslogs
            Options:
              awslogs-group: !Ref LogGroup
              awslogs-region: !Ref "AWS::Region"
              awslogs-stream-prefix: cp

  Service:
    Type: AWS::ECS::Service
    DependsOn: Listener443
    Properties:
      ServiceName: !Sub "af-${AWS::StackName}-cp"
      Cluster: !ImportValue { "Fn::Sub": "${PlatformStackName}-ClusterArn" }
      TaskDefinition: !Ref TaskDef
      DesiredCount: 1
      LaunchType: FARGATE
      HealthCheckGracePeriodSeconds: 60
      NetworkConfiguration:
        AwsvpcConfiguration:
          AssignPublicIp: DISABLED
          Subnets: !Split [ ",", !ImportValue { "Fn::Sub": "${NetworkStackName}-PrivateSubnets" } ]
          SecurityGroups:
            - Fn::ImportValue: !Sub "${NetworkStackName}-CpSgId"
      LoadBalancers:
        - TargetGroupArn: !Ref TargetGroup
          ContainerName: cp
          ContainerPort: !Ref CpPort
      # CP as a Service Connect client so it can resolve workspace Agents by
      # <service>.<namespace> once the stage-2 adapter creates them.
      ServiceConnectConfiguration:
        Enabled: true
        Namespace: !ImportValue { "Fn::Sub": "${PlatformStackName}-NamespaceArn" }

  DnsRecord:
    Type: AWS::Route53::RecordSet
    Properties:
      HostedZoneId: !Ref HostedZoneId
      Name: !Ref Fqdn
      Type: A
      AliasTarget:
        DNSName: !GetAtt Alb.DNSName
        HostedZoneId: !GetAtt Alb.CanonicalHostedZoneID

Outputs:
  Url:
    Value: !Sub "https://${Fqdn}"
  AlbDnsName:
    Value: !GetAtt Alb.DNSName
