AWSTemplateFormatVersion: "2010-09-09"
Description: >-
  agent-fleet ECS adapter - the fleet's own inference engines on GPU, normally scaled to zero
  (ADR 0071). Optional, each role on its own - PARAMETERS-60-engines.md, "What this stack is".

# !! Every "why" is in PARAMETERS-60-engines.md. Read it before editing this file.

Parameters:
  # !! BLOCK form only, and prose stays OUT (the wall) - PARAMETERS, "Editing this template".
  NetworkStackName:
    Type: String
    Default: af-ecs-network
    Description: "00-network stack: the VPC, private subnets and the CP SG."
  PlatformStackName:
    Type: String
    Default: af-ecs-platform
    Description: "20-platform stack: cluster, exec role, namespace, engine ECR repositories."
  ServiceConnectNamespace:
    Type: String
    Default: af.internal
    Description: The private DNS namespace NAME, as given to 20-platform.
  EnginesSsmParamName:
    Type: String
    Default: /af-ws/engines
    AllowedPattern: "^/af-ws/[A-Za-z0-9_.\\-/]+$"
    Description: SSM parameter for the engine table. MUST be under /af-ws/.

  # --- llm role (llama.cpp) ---
  LlmEnabled:
    Type: String
    Default: ""
    AllowedValues: [ "", "true", "false" ]
    Description: Create the llm role. Only "true" creates it.
  LlmDiscoveryName:
    Type: String
    Default: llm
    Description: DNS label the llm engine answers on.
  LlmImageTag:
    Type: String
    Default: server-cuda
    Description: Tag in the af-llamacpp ECR repository.
  LlmExtraArgs:
    Type: CommaDelimitedList
    Default: "-ngl,99,--jinja,--no-mmap"
    Description: Extra llama-server flags. !! NEVER -c here.
  LlmModelsMax:
    Type: Number
    Default: 1
    MinValue: 0
    Description: Models the router may hold at once (0 = unlimited).
  LlmInstanceClasses:
    Type: String
    Default: ""
    Description: GPU rungs this role may be switched between. EMPTY = no choice.
  LlmApiKeySsmParam:
    Type: String
    Default: /af-ws/engine-llm-key
    Description: SSM SecureString for llama-server --api-key. Empty = no key.
  LlmTaskCpu:
    Type: String
    Default: "4096"
    Description: Task vCPU units; keep it under the instance.
  LlmTaskMemory:
    Type: String
    Default: "14336"
    Description: Task memory (MiB); leave the ECS agent room.
  LlmAllowedInstanceTypes:
    Type: CommaDelimitedList
    Default: "g6.xlarge,g5.xlarge"
    Description: Instance types this role may buy. !! A FILTER, not a preference order.
  LlmAcceleratorMemMinMiB:
    Type: Number
    Default: 21000
    Description: VRAM floor (MiB). 0 = do not ask.
  LlmGpuCount:
    Type: Number
    Default: 1
    Description: GPUs per instance and per task. 0 = CPU (test only).
  LlmVCpuMin:
    Type: Number
    Default: 4
    Description: Instance requirement, vCPU minimum.
  LlmVCpuMax:
    Type: Number
    Default: 8
    Description: Instance requirement, vCPU maximum.
  LlmMemMinMiB:
    Type: Number
    Default: 15000
    Description: Instance requirement, memory minimum (MiB).
  LlmMemMaxMiB:
    Type: Number
    Default: 65536
    Description: Instance requirement, memory maximum (MiB).
  LlmStorageGiB:
    Type: Number
    Default: 120
    Description: EBS data volume per instance when UseLocalStorage is off.
  LlmUseLocalStorage:
    Type: String
    Default: "true"
    AllowedValues: [ "true", "false" ]
    Description: Use the instance store, not an EBS volume. On, it halved the cold start.
  LlmScaleInAfter:
    Type: Number
    Default: -2
    Description: scaleInAfter seconds. -2 = AWS default, -1 = never, 0-3600 = seconds.
  LlmIdleSec:
    Type: Number
    Default: 1800
    Description: How long unwanted before the controller stops it.
  LlmStartDeadlineSec:
    Type: Number
    Default: 900
    Description: Start budget. MUST exceed the real cold start (527-586 s).
  LlmMode:
    Type: String
    Default: ondemand
    AllowedValues: [ off, on, ondemand ]
    Description: Initial mode, written to the table as the DEFAULT only; a stored setting wins.

  # --- image role (sd-server, or ComfyUI) ---
  ImageEnabled:
    Type: String
    Default: ""
    AllowedValues: [ "", "true", "false" ]
    Description: Create the image role, as LlmEnabled does. Only "true".
  ImageDiscoveryName:
    Type: String
    Default: image
    Description: DNS label the image engine answers on.
  ImageEngine:
    Type: String
    Default: sdcpp
    AllowedValues: [ sdcpp, comfy ]
    Description: Which server the image role runs.
  ImageImageTag:
    Type: String
    Default: master-cuda
    Description: Tag in the af-sdcpp ECR repository (sdcpp only). Amd64 only.
  ImageComfyImageTag:
    Type: String
    Default: v0.34.0
    Description: Tag in the af-comfyui ECR repository (comfy only).
  ImageExtraArgs:
    Type: CommaDelimitedList
    Default: "--diffusion-fa"
    Description: Extra sd-server flags (sdcpp only).
  ImageInstanceClasses:
    Type: String
    Default: ""
    Description: The image role's ladder, as LlmInstanceClasses. Empty = no choice.
  ImageCapacityOptionType:
    Type: String
    Default: ON_DEMAND
    AllowedValues: [ ON_DEMAND, SPOT ]
    Description: "Buy the image role's box on Spot. !! Changing it REPLACES the provider - PARAMETERS-60-engines.md."
  ImageTaskCpu:
    Type: String
    Default: "4096"
    Description: Task vCPU units; keep it under the instance.
  ImageTaskMemory:
    Type: String
    Default: "14336"
    Description: Task memory (MiB); leave the ECS agent room.
  ImageAllowedInstanceTypes:
    Type: CommaDelimitedList
    Default: "g6.xlarge,g5.xlarge"
    Description: Instance types this role may buy. !! A FILTER, as on the llm role.
  ImageAcceleratorMemMinMiB:
    Type: Number
    Default: 8000
    Description: VRAM floor (MiB). 0 = do not ask.
  ImageGpuCount:
    Type: Number
    Default: 1
    Description: GPUs per instance and per task. 0 = CPU (test only).
  ImageVCpuMin:
    Type: Number
    Default: 4
    Description: Instance requirement, vCPU minimum.
  ImageVCpuMax:
    Type: Number
    Default: 8
    Description: Instance requirement, vCPU maximum.
  ImageMemMinMiB:
    Type: Number
    Default: 15000
    Description: Instance requirement, memory minimum (MiB).
  ImageMemMaxMiB:
    Type: Number
    Default: 65536
    Description: Instance requirement, memory maximum (MiB).
  ImageStorageGiB:
    Type: Number
    Default: 60
    Description: EBS data volume per instance when ImageUseLocalStorage is off.
  ImageUseLocalStorage:
    Type: String
    Default: "true"
    AllowedValues: [ "true", "false" ]
    Description: Use the instance store instead of an EBS data volume, as on the llm role.
  ImageScaleInAfter:
    Type: Number
    Default: -2
    Description: scaleInAfter seconds. !! -1 is a trap here.
  ImageIdleSec:
    Type: Number
    Default: 900
    Description: How long unwanted before the controller stops it.
  ImageStartDeadlineSec:
    Type: Number
    Default: 900
    Description: Start budget. sd-server measured 195 s to listen.
  ImageMode:
    Type: String
    Default: ondemand
    AllowedValues: [ off, on, ondemand ]
    Description: Initial mode, written to the table as the DEFAULT only.

  # --- ingest ---
  IngestCpu:
    Type: String
    Default: "2048"
    Description: Fargate vCPU units for the ingest task.
  IngestMemory:
    Type: String
    Default: "4096"
    Description: Fargate memory (MiB) for the ingest task.
  IngestDiskGiB:
    Type: Number
    Default: 80
    Description: Ephemeral storage for the largest model this deployment can take in.
  LogRetentionDays:
    Type: Number
    Default: 14
    Description: CloudWatch retention for the engine and ingest log group.
Mappings:
  # !! One sidecar for both roles, a LITERAL block, never folded - PARAMETERS, "The fetch sidecar".
  Engine:
    fetch:
      script: |-
        set -e
        mkdir -p "$MODELS_DIR"
        trap 'touch "$MODELS_DIR/ready" 2>/dev/null || true' EXIT
        V=$(aws ssm get-parameter --name "$ACTIVE_PARAM" --query Parameter.Value --output text 2>/dev/null || true)
        if [ -z "$V" ] || [ "$V" = "None" ]; then
          echo "engine fetch: no active set at $ACTIVE_PARAM - this engine has nothing to load"
          : > "$MODELS_DIR/cmdline"
          exit 0
        fi
        START=$(printf '%s' "$V" | jq -r '.start // ""')
        echo "engine fetch: active set for $ACTIVE_PARAM starts with '$START'"
        if [ -n "$PRESET_FILE" ]; then
          START=$(printf '%s' "$V" | jq -r --arg s "$START" '[(.models[]?|select(.id==$s)|.id),(.models[0].id?)][0]//""')
        fi
        : > "$MODELS_DIR"/keys.rest
        if [ -n "$PRESET_FILE$SYNC_ALL" ]; then
          printf '%s' "$V" | jq -r --arg s "$START" '[.models[]?|select(.id!=$s)|.f[]?|if type=="string" then . else .k end]|.[]' > "$MODELS_DIR"/keys.rest
        fi
        printf '%s' "$V" | jq -r --arg s "$START" '[(.models[]?|select(.id==$s)|.f[]?|if type=="string" then . else .k end),(.loras[]?)]|.[]' > "$MODELS_DIR"/keys.start
        fetch_keys() {
          while read -r k; do
            [ -n "$k" ] || continue
            dst="$MODELS_DIR/$k"
            if [ -s "$dst" ]; then echo "engine fetch: $k is already on this box"; continue; fi
            mkdir -p "$(dirname "$dst")"
            t0=$(date +%s)
            aws s3 cp "s3://$BUCKET/$k" "$dst.part" --only-show-errors
            mv "$dst.part" "$dst"
            echo "engine fetch: $k $(stat -c %s "$dst") bytes in $(( $(date +%s) - t0 ))s"
          done < "$1"
        }
        fetch_keys "$MODELS_DIR"/keys.start
        if [ -n "$PRESET_FILE" ]; then
          mkdir -p "$(dirname "$PRESET_FILE")"
          printf '%s' "$V" | jq -r --arg s "$START" --arg d "$MODELS_DIR" '.models[]? as $m | ($m.a // []) as $a | (["["+$m.id+"]"] + [$m.f[]?|if type=="string" then "model = "+$d+"/"+. else (.g|ltrimstr("-")|ltrimstr("-"))+" = "+$d+"/"+.k end] + (if ($m.c//0)>0 then ["c = "+($m.c|tostring)] else [] end) + [$a|to_entries[]|select(.value|startswith("-"))|(.value|ltrimstr("-")|ltrimstr("-")) as $k|($a[.key+1]//"") as $v|if ($v!="" and ($v|startswith("-")|not)) then $k+" = "+$v else $k+" = true" end] + (if (($m.lo//[])|length)>0 then ["lora-scaled = " + (($m.lo)|map($d+"/"+.)|join(","))] else [] end) + (if $m.id==$s then ["load-on-startup = true"] else [] end) + [""])[]' > "$PRESET_FILE.part"
          mv "$PRESET_FILE.part" "$PRESET_FILE"
          echo "engine fetch: preset $PRESET_FILE holds $(grep -c '^\[' "$PRESET_FILE" || true) model(s), '$START' loaded at startup"
          if [ -s "$PRESET_FILE" ]; then printf -- '--models-preset %s' "$PRESET_FILE" > "$MODELS_DIR/cmdline.part"; else : > "$MODELS_DIR/cmdline.part"; fi
        else
          printf '%s' "$V" | jq -r --arg s "$START" --arg d "$MODELS_DIR" --arg al "$ALIAS_FLAG" --arg cf "$CTX_FLAG" '(.models[]?|select(.id==$s)) as $m | if $m == null then "" else ([$m.f[]? | if type=="string" then ["-m",($d+"/"+.)] else [.g,($d+"/"+.k)] end] | add // []) + (if $al != "" then [$al,$m.id] else [] end) + (if $cf != "" and (($m.c // 0) > 0) then [$cf,($m.c|tostring)] else [] end) + ($m.a // []) | join(" ") end' > "$MODELS_DIR/cmdline.part"
        fi
        mv "$MODELS_DIR/cmdline.part" "$MODELS_DIR/cmdline"
        echo "engine fetch: cmdline = $(cat "$MODELS_DIR/cmdline")"
        touch "$MODELS_DIR/ready"
        echo "engine fetch: engine may start; $(grep -c . "$MODELS_DIR"/keys.rest || true) file(s) still to sync"
        fetch_keys "$MODELS_DIR"/keys.rest
        echo "engine fetch: sync done"

Conditions:
  # Whether the ROLE exists; what it loads is the catalogue's - PARAMETERS, "The engine table".
  HasLlmModel: !Equals [ !Ref LlmEnabled, "true" ]
  HasGpu: !Not [ !Equals [ !Ref LlmGpuCount, 0 ] ]
  HasLlmAcceleratorMem: !And [ !Condition HasGpu, !Not [ !Equals [ !Ref LlmAcceleratorMemMinMiB, 0 ] ] ]
  UseLocalStorage: !Equals [ !Ref LlmUseLocalStorage, "true" ]
  HasScaleInAfter: !Not [ !Equals [ !Ref LlmScaleInAfter, -2 ] ]
  HasLlmApiKey: !Not [ !Equals [ !Ref LlmApiKeySsmParam, "" ] ]
  HasImageModel: !Equals [ !Ref ImageEnabled, "true" ]
  HasImageGpu: !Not [ !Equals [ !Ref ImageGpuCount, 0 ] ]
  HasImageAcceleratorMem: !And [ !Condition HasImageGpu, !Not [ !Equals [ !Ref ImageAcceleratorMemMinMiB, 0 ] ] ]
  ImageUsesLocalStorage: !Equals [ !Ref ImageUseLocalStorage, "true" ]
  HasImageScaleInAfter: !Not [ !Equals [ !Ref ImageScaleInAfter, -2 ] ]
  HasBothModels: !And [ !Condition HasLlmModel, !Condition HasImageModel ]
  ImageIsComfy: !Equals [ !Ref ImageEngine, "comfy" ]
  # The provider's NAME carries the option type, and it has to: the field itself is create-only,
  # so a switch is a replacement, and CloudFormation refuses to replace a resource that keeps a
  # custom name (measured - PARAMETERS-60-engines.md, "The capacity providers"). ON_DEMAND keeps
  # the historic name, so a deployment that never asks for Spot is not replaced at all.
  ImageIsSpot: !Equals [ !Ref ImageCapacityOptionType, SPOT ]

Resources:
  # --- IAM: three roles, closed inside this stack - PARAMETERS, "The task roles" ---
  InfraRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub "af-${AWS::StackName}-mi-infra"
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal: { Service: ecs.amazonaws.com }
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/AmazonECSInfrastructureRolePolicyForManagedInstances
      Policies:
        - PolicyName: pass-instance-role
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action: iam:PassRole
                Resource: !Sub "arn:aws:iam::${AWS::AccountId}:role/af-${AWS::StackName}-mi-instance"
                Condition: { StringLike: { "iam:PassedToService": "ec2.*" } }

  InstanceRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub "af-${AWS::StackName}-mi-instance"
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal: { Service: ec2.amazonaws.com }
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/AmazonECSInstanceRolePolicyForManagedInstances

  InstanceProfile:
    Type: AWS::IAM::InstanceProfile
    Properties:
      InstanceProfileName: !Sub "af-${AWS::StackName}-mi-instance"
      Roles: [ !Ref InstanceRole ]

  EngineTaskRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub "af-${AWS::StackName}-engine-task"
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal: { Service: ecs-tasks.amazonaws.com }
            Action: sts:AssumeRole
      Policies:
        - PolicyName: models-read
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action: [ s3:GetObject ]
                Resource: !Sub "${ModelsBucket.Arn}/*"
              - Effect: Allow
                Action: [ s3:ListBucket ]
                Resource: !GetAtt ModelsBucket.Arn
              - Effect: Allow
                Action: [ ssm:GetParameter ]
                Resource: !Sub "arn:aws:ssm:${AWS::Region}:${AWS::AccountId}:parameter${EnginesSsmParamName}/*"

  IngestTaskRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub "af-${AWS::StackName}-ingest-task"
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal: { Service: ecs-tasks.amazonaws.com }
            Action: sts:AssumeRole
      Policies:
        - PolicyName: models-write
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action: [ s3:PutObject, s3:AbortMultipartUpload, s3:GetObject ]
                Resource: !Sub "${ModelsBucket.Arn}/*"
              - Effect: Allow
                Action: [ s3:ListBucket ]
                Resource: !GetAtt ModelsBucket.Arn
              - Effect: Allow
                Action: [ s3:DeleteObject ]
                Resource: !Sub "${ModelsBucket.Arn}/*"

  # !! The CP's only new IAM, all pinned to this stack - PARAMETERS, "The ingest permissions".
  CpIngestPolicy:
    Type: AWS::IAM::Policy
    Properties:
      PolicyName: !Sub "af-${AWS::StackName}-cp-ingest"
      Roles:
        - !Select [ 1, !Split [ "/", !ImportValue { "Fn::Sub": "${PlatformStackName}-CpTaskRoleArn" } ] ]
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Action: [ ecs:RunTask ]
            Resource: !Sub "arn:aws:ecs:${AWS::Region}:${AWS::AccountId}:task-definition/af-${AWS::StackName}-ingest:*"
            Condition:
              ArnEquals: { "ecs:cluster": !ImportValue { "Fn::Sub": "${PlatformStackName}-ClusterArn" } }
          - Effect: Allow
            Action: [ iam:PassRole ]
            Resource: !GetAtt IngestTaskRole.Arn
            Condition: { StringEquals: { "iam:PassedToService": ecs-tasks.amazonaws.com } }
          - Effect: Allow
            Action: [ logs:GetLogEvents, logs:DescribeLogStreams ]
            Resource: !Sub "arn:aws:logs:${AWS::Region}:${AWS::AccountId}:log-group:/af/${AWS::StackName}/engines:*"
          - Effect: Allow
            Action: [ secretsmanager:PutSecretValue ]
            Resource: !Ref HfTokenSecret
          # !! The third action is one the CP never calls - PARAMETERS, "The instance classes".
          - Effect: Allow
            Action: [ ecs:DescribeCapacityProviders, ecs:UpdateCapacityProvider ]
            Resource: !Sub "arn:aws:ecs:${AWS::Region}:${AWS::AccountId}:capacity-provider/af-${AWS::StackName}-*"
          - Effect: Allow
            Action: [ ecs:PutClusterCapacityProviders ]
            Resource: !ImportValue { "Fn::Sub": "${PlatformStackName}-ClusterArn" }
          - Effect: Allow
            Action: [ iam:PassRole ]
            Resource: [ !GetAtt InfraRole.Arn, !GetAtt InstanceRole.Arn ]
            Condition: { StringEquals: { "iam:PassedToService": ecs.amazonaws.com } }

  # !! Always created, holding a sentinel - PARAMETERS, "The Hugging Face token".
  HfTokenSecret:
    Type: AWS::SecretsManager::Secret
    Properties:
      Description: !Sub "HF_TOKEN for af-${AWS::StackName} ingest, written by the Control Plane"
      SecretString: "-"

  # !! Secrets resolve with the EXECUTION role - PARAMETERS, "The Hugging Face token".
  ExecHfTokenPolicy:
    Type: AWS::IAM::Policy
    Properties:
      PolicyName: !Sub "af-${AWS::StackName}-exec-hf"
      Roles:
        - !Select [ 1, !Split [ "/", !ImportValue { "Fn::Sub": "${PlatformStackName}-ExecRoleArn" } ] ]
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Action: [ secretsmanager:GetSecretValue ]
            Resource: !Ref HfTokenSecret

  # --- the model catalogue - PARAMETERS, "The models bucket" ---
  ModelsBucket:
    Type: AWS::S3::Bucket
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      BucketName: !Sub "af-${AWS::StackName}-models-${AWS::AccountId}"
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault: { SSEAlgorithm: AES256 }
      LifecycleConfiguration:
        Rules:
          - Id: abort-incomplete-uploads
            Status: Enabled
            AbortIncompleteMultipartUpload: { DaysAfterInitiation: 3 }
      # !! A cost allocation key is never retroactive - PARAMETERS, "Cost allocation".
      Tags:
        - { Key: af-role, Value: engine-models }
        - { Key: af-pool, Value: !ImportValue { "Fn::Sub": "${PlatformStackName}-ClusterName" } }

  LogGroup:
    Type: AWS::Logs::LogGroup
    DeletionPolicy: Delete
    Properties:
      LogGroupName: !Sub "/af/${AWS::StackName}/engines"
      RetentionInDays: !Ref LogRetentionDays
      Tags:
        - { Key: af-role, Value: engine-logs }
        - { Key: af-pool, Value: !ImportValue { "Fn::Sub": "${PlatformStackName}-ClusterName" } }

  # !! Reachability IS the access control - PARAMETERS, "The engine security group".
  EngineSg:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: !Sub "af-${AWS::StackName} inference engines (CP to engine, 8080)"
      VpcId: !ImportValue { "Fn::Sub": "${NetworkStackName}-VpcId" }
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 8080
          ToPort: 8080
          SourceSecurityGroupId: !ImportValue { "Fn::Sub": "${NetworkStackName}-CpSgId" }
          Description: engine port from the Control Plane only
      Tags: [ { Key: Name, Value: !Sub "af-${AWS::StackName}-engine-sg" } ]

  # --- capacity, one provider per role - PARAMETERS, "The capacity providers" ---
  LlmCapacityProvider:
    Type: AWS::ECS::CapacityProvider
    Properties:
      Name: !Sub "af-${AWS::StackName}-llm"
      ClusterName: !ImportValue { "Fn::Sub": "${PlatformStackName}-ClusterName" }
      ManagedInstancesProvider:
        InfrastructureRoleArn: !GetAtt InfraRole.Arn
        PropagateTags: CAPACITY_PROVIDER
        InfrastructureOptimization: !If
          - HasScaleInAfter
          - ScaleInAfter: !Ref LlmScaleInAfter
          - !Ref "AWS::NoValue"
        InstanceLaunchTemplate:
          Ec2InstanceProfileArn: !GetAtt InstanceProfile.Arn
          CapacityOptionType: ON_DEMAND
          NetworkConfiguration:
            Subnets: !Split [ ",", !ImportValue { "Fn::Sub": "${NetworkStackName}-PrivateSubnets" } ]
            SecurityGroups: [ !Ref EngineSg ]
          StorageConfiguration: !If
            - UseLocalStorage
            - !Ref "AWS::NoValue"
            - StorageSizeGiB: !Ref LlmStorageGiB
          LocalStorageConfiguration: !If
            - UseLocalStorage
            - UseLocalStorage: true
            - !Ref "AWS::NoValue"
          InstanceRequirements:
            VCpuCount: { Min: !Ref LlmVCpuMin, Max: !Ref LlmVCpuMax }
            MemoryMiB: { Min: !Ref LlmMemMinMiB, Max: !Ref LlmMemMaxMiB }
            BurstablePerformance: excluded
            AllowedInstanceTypes: !Ref LlmAllowedInstanceTypes
            AcceleratorCount: !If [ HasGpu, { Min: !Ref LlmGpuCount, Max: !Ref LlmGpuCount }, !Ref "AWS::NoValue" ]
            AcceleratorTypes: !If [ HasGpu, [ gpu ], !Ref "AWS::NoValue" ]
            AcceleratorManufacturers: !If [ HasGpu, [ nvidia ], !Ref "AWS::NoValue" ]
            AcceleratorTotalMemoryMiB: !If [ HasLlmAcceleratorMem, { Min: !Ref LlmAcceleratorMemMinMiB }, !Ref "AWS::NoValue" ]
      Tags:
        - { Key: af-role, Value: engine-llm }
        - { Key: af-pool, Value: !ImportValue { "Fn::Sub": "${PlatformStackName}-ClusterName" } }

  ImageCapacityProvider:
    Type: AWS::ECS::CapacityProvider
    Properties:
      Name: !If
        - ImageIsSpot
        - !Sub "af-${AWS::StackName}-image-spot"
        - !Sub "af-${AWS::StackName}-image"
      ClusterName: !ImportValue { "Fn::Sub": "${PlatformStackName}-ClusterName" }
      ManagedInstancesProvider:
        InfrastructureRoleArn: !GetAtt InfraRole.Arn
        PropagateTags: CAPACITY_PROVIDER
        InfrastructureOptimization: !If
          - HasImageScaleInAfter
          - ScaleInAfter: !Ref ImageScaleInAfter
          - !Ref "AWS::NoValue"
        InstanceLaunchTemplate:
          Ec2InstanceProfileArn: !GetAtt InstanceProfile.Arn
          CapacityOptionType: !Ref ImageCapacityOptionType
          NetworkConfiguration:
            Subnets: !Split [ ",", !ImportValue { "Fn::Sub": "${NetworkStackName}-PrivateSubnets" } ]
            SecurityGroups: [ !Ref EngineSg ]
          StorageConfiguration: !If
            - ImageUsesLocalStorage
            - !Ref "AWS::NoValue"
            - StorageSizeGiB: !Ref ImageStorageGiB
          LocalStorageConfiguration: !If
            - ImageUsesLocalStorage
            - UseLocalStorage: true
            - !Ref "AWS::NoValue"
          InstanceRequirements:
            VCpuCount: { Min: !Ref ImageVCpuMin, Max: !Ref ImageVCpuMax }
            MemoryMiB: { Min: !Ref ImageMemMinMiB, Max: !Ref ImageMemMaxMiB }
            BurstablePerformance: excluded
            AllowedInstanceTypes: !Ref ImageAllowedInstanceTypes
            AcceleratorCount: !If [ HasImageGpu, { Min: !Ref ImageGpuCount, Max: !Ref ImageGpuCount }, !Ref "AWS::NoValue" ]
            AcceleratorTypes: !If [ HasImageGpu, [ gpu ], !Ref "AWS::NoValue" ]
            AcceleratorManufacturers: !If [ HasImageGpu, [ nvidia ], !Ref "AWS::NoValue" ]
            AcceleratorTotalMemoryMiB: !If [ HasImageAcceleratorMem, { Min: !Ref ImageAcceleratorMemMinMiB }, !Ref "AWS::NoValue" ]
      Tags:
        - { Key: af-role, Value: engine-image }
        - { Key: af-pool, Value: !ImportValue { "Fn::Sub": "${PlatformStackName}-ClusterName" } }

  # !! REPLACES the cluster's list, and the empty default strategy is load-bearing.
  Associations:
    Type: AWS::ECS::ClusterCapacityProviderAssociations
    Properties:
      Cluster: !ImportValue { "Fn::Sub": "${PlatformStackName}-ClusterName" }
      CapacityProviders: [ FARGATE, FARGATE_SPOT, !Ref LlmCapacityProvider, !Ref ImageCapacityProvider ]
      DefaultCapacityProviderStrategy: []

  # --- ingest: HF -> S3, out of the start path - PARAMETERS, "Ingest" ---
  IngestTaskDef:
    Type: AWS::ECS::TaskDefinition
    Properties:
      Family: !Sub "af-${AWS::StackName}-ingest"
      RequiresCompatibilities: [ FARGATE ]
      NetworkMode: awsvpc
      Cpu: !Ref IngestCpu
      Memory: !Ref IngestMemory
      EphemeralStorage: { SizeInGiB: !Ref IngestDiskGiB }
      ExecutionRoleArn: !ImportValue { "Fn::Sub": "${PlatformStackName}-ExecRoleArn" }
      TaskRoleArn: !GetAtt IngestTaskRole.Arn
      Volumes: [ { Name: scratch } ]
      ContainerDefinitions:
        - Name: fetch
          Essential: false
          Image: curlimages/curl:latest
          User: "0"
          EntryPoint: [ "sh", "-c" ]
          Command:
            - >-
              set -e;
              [ "$MODE" = delete ] && { echo "ingest: delete mode, nothing to fetch"; exit 0; };
              [ -n "$URL" ] || { echo "ingest: URL is required"; exit 2; };
              start=$(date +%s);
              if [ -n "$HF_TOKEN" ] && [ "$HF_TOKEN" != - ];
              then set -- -H "Authorization: Bearer $HF_TOKEN"; else set --; fi;
              curl -fsSL "$@" -o /scratch/blob "$URL";
              size=$(stat -c %s /scratch/blob);
              secs=$(( $(date +%s) - start ));
              echo "ingest: fetched $size bytes in ${secs}s";
              if [ -n "$SHA256" ]; then
                got=$(sha256sum /scratch/blob | cut -d" " -f1);
                [ "$got" = "$SHA256" ] || { echo "ingest: sha256 mismatch: got $got want $SHA256"; exit 1; };
                echo "ingest: sha256 ok $got";
              else
                echo "ingest: WARNING no SHA256 given - the upload is unverified";
              fi
          Environment:
            - { Name: URL, Value: "" }
            - { Name: SHA256, Value: "" }
            - { Name: MODE, Value: "" }
          Secrets: [ { Name: HF_TOKEN, ValueFrom: !Ref HfTokenSecret } ]
          MountPoints: [ { SourceVolume: scratch, ContainerPath: /scratch } ]
          LogConfiguration:
            LogDriver: awslogs
            Options:
              awslogs-group: !Ref LogGroup
              awslogs-region: !Ref "AWS::Region"
              awslogs-stream-prefix: ingest-fetch
        - Name: upload
          Essential: true
          Image: public.ecr.aws/aws-cli/aws-cli:latest
          EntryPoint: [ "sh", "-c" ]
          Command:
            - !Sub >-
              set -e;
              [ -n "$KEY" ] || { echo "ingest: KEY is required"; exit 2; };
              start=$(date +%s);
              if [ "$MODE" = delete ]; then
                for k in $KEY; do aws s3 rm "s3://${ModelsBucket}/$k" --only-show-errors; echo "ingest: deleted $k"; done;
                exit 0;
              fi;
              aws s3 cp /scratch/blob "s3://${ModelsBucket}/$KEY" --only-show-errors;
              echo "ingest: uploaded $KEY in $(( $(date +%s) - start ))s";
          Environment: [ { Name: KEY, Value: "" }, { Name: MODE, Value: "" } ]
          MountPoints: [ { SourceVolume: scratch, ContainerPath: /scratch } ]
          DependsOn: [ { ContainerName: fetch, Condition: SUCCESS } ]
          LogConfiguration:
            LogDriver: awslogs
            Options:
              awslogs-group: !Ref LogGroup
              awslogs-region: !Ref "AWS::Region"
              awslogs-stream-prefix: ingest-upload

  # --- the llm engine ---
  LlmTaskDef:
    Type: AWS::ECS::TaskDefinition
    Condition: HasLlmModel
    Properties:
      Family: !Sub "af-${AWS::StackName}-llm"
      RequiresCompatibilities: [ MANAGED_INSTANCES ]
      NetworkMode: awsvpc
      Cpu: !Ref LlmTaskCpu
      Memory: !Ref LlmTaskMemory
      ExecutionRoleArn: !ImportValue { "Fn::Sub": "${PlatformStackName}-ExecRoleArn" }
      TaskRoleArn: !GetAtt EngineTaskRole.Arn
      Volumes:
        # !! ANONYMOUS on purpose - PARAMETERS, "The model volume".
        - Name: models
          Host: {}
      ContainerDefinitions:
        - Name: fetch
          Essential: false
          Image: public.ecr.aws/aws-cli/aws-cli:latest
          EntryPoint: [ "sh", "-c" ]
          Command: [ !FindInMap [ Engine, fetch, script ] ]
          Environment:
            - { Name: MODELS_DIR, Value: /models }
            - { Name: BUCKET, Value: !Ref ModelsBucket }
            - { Name: ACTIVE_PARAM, Value: !Sub "${EnginesSsmParamName}/llm/active" }
            - { Name: PRESET_FILE, Value: /models/llm/presets.ini }
            - { Name: ALIAS_FLAG, Value: "" }
            - { Name: CTX_FLAG, Value: "" }
          MountPoints: [ { SourceVolume: models, ContainerPath: /models } ]
          LogConfiguration:
            LogDriver: awslogs
            Options:
              awslogs-group: !Ref LogGroup
              awslogs-region: !Ref "AWS::Region"
              awslogs-stream-prefix: llm-fetch
        - Name: llama
          Essential: true
          # !! The image must already be in ECR - PARAMETERS, "The engine services".
          Image: !Sub
            - "${Uri}:${Tag}"
            - Uri: !ImportValue { "Fn::Sub": "${PlatformStackName}-EcrLlamacppUri" }
              Tag: !Ref LlmImageTag
          PortMappings: [ { ContainerPort: 8080 } ]
          # !! The idle wrapper - PARAMETERS, "The idle wrapper".
          EntryPoint: [ "sh", "-c" ]
          Command:
            - !Sub
              - >-
                n=0; while [ ! -f /models/ready ] && [ $n -lt 3600 ]; do n=$((n+1)); sleep 1; done;
                if [ -s /models/cmdline ]; then exec /app/llama-server --host 0.0.0.0 --port 8080
                --models-max ${LlmModelsMax} ${Extra} $(cat /models/cmdline);
                else echo "llm: no model in the catalogue - idling"; sleep infinity; fi
              - Extra: !Join [ " ", !Ref LlmExtraArgs ]
          ResourceRequirements: !If [ HasGpu, [ { Type: GPU, Value: !Ref LlmGpuCount } ], !Ref "AWS::NoValue" ]
          MountPoints: [ { SourceVolume: models, ContainerPath: /models } ]
          DependsOn: [ { ContainerName: fetch, Condition: START } ]
          Environment:
            - { Name: LLAMA_CACHE, Value: /tmp/llama-cache }
          Secrets: !If
            - HasLlmApiKey
            - - Name: LLAMA_API_KEY
                ValueFrom: !Sub "arn:aws:ssm:${AWS::Region}:${AWS::AccountId}:parameter${LlmApiKeySsmParam}"
            - !Ref "AWS::NoValue"
          LogConfiguration:
            LogDriver: awslogs
            Options:
              awslogs-group: !Ref LogGroup
              awslogs-region: !Ref "AWS::Region"
              awslogs-stream-prefix: llm

  # Cloud Map DNS, not Service Connect - PARAMETERS, "The engine table".
  LlmDiscovery:
    Type: AWS::ServiceDiscovery::Service
    Condition: HasLlmModel
    Properties:
      Name: !Ref LlmDiscoveryName
      NamespaceId: !ImportValue { "Fn::Sub": "${PlatformStackName}-NamespaceId" }
      DnsConfig:
        DnsRecords: [ { Type: A, TTL: 10 } ]
      HealthCheckCustomConfig: { FailureThreshold: 1 }

  LlmService:
    Type: AWS::ECS::Service
    Condition: HasLlmModel
    DependsOn: Associations
    Properties:
      ServiceName: !Sub "af-${AWS::StackName}-llm"
      Cluster: !ImportValue { "Fn::Sub": "${PlatformStackName}-ClusterArn" }
      TaskDefinition: !Ref LlmTaskDef
      # !! No DesiredCount and no LaunchType, both load-bearing - PARAMETERS, "The engine services".
      CapacityProviderStrategy:
        - { CapacityProvider: !Ref LlmCapacityProvider, Weight: 1 }
      DeploymentConfiguration: { MinimumHealthyPercent: 0, MaximumPercent: 100 }
      NetworkConfiguration:
        AwsvpcConfiguration:
          AssignPublicIp: DISABLED
          Subnets: !Split [ ",", !ImportValue { "Fn::Sub": "${NetworkStackName}-PrivateSubnets" } ]
          SecurityGroups: [ !Ref EngineSg ]
      ServiceRegistries:
        - RegistryArn: !GetAtt LlmDiscovery.Arn
      PropagateTags: SERVICE
      Tags:
        - { Key: af-pool, Value: !ImportValue { "Fn::Sub": "${PlatformStackName}-ClusterName" } }
        - { Key: af-role, Value: engine-llm }

  # --- the image engine ---
  ImageTaskDef:
    Type: AWS::ECS::TaskDefinition
    Condition: HasImageModel
    Properties:
      Family: !Sub "af-${AWS::StackName}-image"
      RequiresCompatibilities: [ MANAGED_INSTANCES ]
      NetworkMode: awsvpc
      Cpu: !Ref ImageTaskCpu
      Memory: !Ref ImageTaskMemory
      ExecutionRoleArn: !ImportValue { "Fn::Sub": "${PlatformStackName}-ExecRoleArn" }
      TaskRoleArn: !GetAtt EngineTaskRole.Arn
      Volumes:
        - Name: models
          Host: {}
      ContainerDefinitions:
        - Name: fetch
          Essential: false
          Image: public.ecr.aws/aws-cli/aws-cli:latest
          EntryPoint: [ "sh", "-c" ]
          Command: [ !FindInMap [ Engine, fetch, script ] ]
          Environment:
            - { Name: MODELS_DIR, Value: /models }
            - { Name: BUCKET, Value: !Ref ModelsBucket }
            - { Name: ACTIVE_PARAM, Value: !Sub "${EnginesSsmParamName}/image/active" }
            - { Name: SYNC_ALL, Value: !If [ ImageIsComfy, "1", "" ] }
            - { Name: PRESET_FILE, Value: "" }
            - { Name: ALIAS_FLAG, Value: "" }
            - { Name: CTX_FLAG, Value: "" }
          MountPoints: [ { SourceVolume: models, ContainerPath: /models } ]
          LogConfiguration:
            LogDriver: awslogs
            Options:
              awslogs-group: !Ref LogGroup
              awslogs-region: !Ref "AWS::Region"
              awslogs-stream-prefix: image-fetch
        # !! ImageEngine picks the image AND the command - PARAMETERS, "The idle wrapper".
        - Name: engine
          Essential: true
          Image: !If
            - ImageIsComfy
            - !Sub
              - "${Uri}:${Tag}"
              - Uri: !ImportValue { "Fn::Sub": "${PlatformStackName}-EcrComfyuiUri" }
                Tag: !Ref ImageComfyImageTag
            - !Sub
              - "${Uri}:${Tag}"
              - Uri: !ImportValue { "Fn::Sub": "${PlatformStackName}-EcrSdcppUri" }
                Tag: !Ref ImageImageTag
          EntryPoint: [ "sh", "-c" ]
          Command:
            - !If
              - ImageIsComfy
              # !! Two traps in this one line - PARAMETERS, "The idle wrapper".
              - >-
                n=0; while [ ! -f /models/ready ] && [ $n -lt 3600 ]; do n=$((n+1)); sleep 1; done;
                if [ -s /models/cmdline ]; then rm -rf /ComfyUI/models; ln -sfn /models/image /ComfyUI/models;
                exec python3 /ComfyUI/main.py --listen 0.0.0.0 --port 8080 --disable-auto-launch
                --verbose DETAIL;
                else echo "image: no checkpoint in the catalogue - idling"; sleep infinity; fi
              - !Sub
                - >-
                  mkdir -p /models/image/loras;
                  n=0; while [ ! -f /models/ready ] && [ $n -lt 3600 ]; do n=$((n+1)); sleep 1; done;
                  if [ -s /models/cmdline ]; then exec /sd-server --listen-ip 0.0.0.0
                  --listen-port 8080 --lora-model-dir /models/image/loras
                  ${Extra} $(cat /models/cmdline);
                  else echo "image: no checkpoint in the catalogue - idling"; sleep infinity; fi
                - Extra: !Join [ " ", !Ref ImageExtraArgs ]
          ResourceRequirements: !If [ HasImageGpu, [ { Type: GPU, Value: !Ref ImageGpuCount } ], !Ref "AWS::NoValue" ]
          MountPoints: [ { SourceVolume: models, ContainerPath: /models } ]
          DependsOn: [ { ContainerName: fetch, Condition: START } ]
          LogConfiguration:
            LogDriver: awslogs
            Options:
              awslogs-group: !Ref LogGroup
              awslogs-region: !Ref "AWS::Region"
              awslogs-stream-prefix: image

  ImageDiscovery:
    Type: AWS::ServiceDiscovery::Service
    Condition: HasImageModel
    Properties:
      Name: !Ref ImageDiscoveryName
      NamespaceId: !ImportValue { "Fn::Sub": "${PlatformStackName}-NamespaceId" }
      DnsConfig:
        DnsRecords: [ { Type: A, TTL: 10 } ]
      HealthCheckCustomConfig: { FailureThreshold: 1 }

  ImageService:
    Type: AWS::ECS::Service
    Condition: HasImageModel
    DependsOn: Associations
    Properties:
      ServiceName: !Sub "af-${AWS::StackName}-image"
      Cluster: !ImportValue { "Fn::Sub": "${PlatformStackName}-ClusterArn" }
      TaskDefinition: !Ref ImageTaskDef
      CapacityProviderStrategy:
        - { CapacityProvider: !Ref ImageCapacityProvider, Weight: 1 }
      DeploymentConfiguration: { MinimumHealthyPercent: 0, MaximumPercent: 100 }
      NetworkConfiguration:
        AwsvpcConfiguration:
          AssignPublicIp: DISABLED
          Subnets: !Split [ ",", !ImportValue { "Fn::Sub": "${NetworkStackName}-PrivateSubnets" } ]
          SecurityGroups: [ !Ref EngineSg ]
      ServiceRegistries:
        - RegistryArn: !GetAtt ImageDiscovery.Arn
      PropagateTags: SERVICE
      Tags:
        - { Key: af-pool, Value: !ImportValue { "Fn::Sub": "${PlatformStackName}-ClusterName" } }
        - { Key: af-role, Value: engine-image }

  # --- the engine table - PARAMETERS, "The engine table" ---
  EnginesParam:
    Type: AWS::SSM::Parameter
    Properties:
      Name: !Ref EnginesSsmParamName
      Type: String
      Description: !Sub "agent-fleet engine table written by ${AWS::StackName} (ADR 0071)"
      Value: !Sub
        - '{"engines":[${Llm}${Sep}${Image}],"ingest":${Ingest}}'
        - Llm: !If
            - HasLlmModel
            - !Sub
              - >-
                {"key":"llm","api":"chat","service":"${Service}","capacityProvider":"${Cp}",
                "url":"http://${LlmDiscoveryName}.${ServiceConnectNamespace}:8080",
                "health":"/health","warmPath":"/models","provider":"llamacpp",
                "apiKeyParam":"${LlmApiKeySsmParam}","classes":"${LlmInstanceClasses}","idleSec":${LlmIdleSec},
                "startDeadlineSec":${LlmStartDeadlineSec},"mode":"${LlmMode}"}
              - Service: !GetAtt LlmService.Name
                Cp: !Ref LlmCapacityProvider
            - ""
          Image: !If
            - HasImageModel
            - !Sub
              - >-
                {"key":"image","api":"images","service":"${Service}","capacityProvider":"${Cp}",
                "url":"http://${ImageDiscoveryName}.${ServiceConnectNamespace}:8080",
                "health":"${Health}","provider":"${Provider}",
                "apiKeyParam":"","classes":"${ImageInstanceClasses}","idleSec":${ImageIdleSec},
                "startDeadlineSec":${ImageStartDeadlineSec},"mode":"${ImageMode}"}
              - Service: !GetAtt ImageService.Name
                # !Ref on a capacity provider is its NAME. Written this way and not restated as
                # a !Sub because the image role's name moves with ImageCapacityOptionType, and a
                # table naming a provider nobody uses fails SILENTLY: the CP would watch the
                # wrong one for draining and apply the ADR 0074 rungs to it.
                Cp: !Ref ImageCapacityProvider
                Health: !If [ ImageIsComfy, "/system_stats", "/v1/models" ]
                Provider: !If [ ImageIsComfy, "comfy", "sdcpp" ]
            - ""
          Sep: !If [ HasBothModels, ",", "" ]
          Ingest: !Sub
            - >-
              {"taskDef":"${Family}","subnets":["${Subnets}"],"securityGroups":["${Sg}"],
              "logGroup":"${Log}","tokenSecret":"${Secret}"}
            - Family: !Ref IngestTaskDef
              Subnets: !Join [ '","', !Split [ ",", !ImportValue { "Fn::Sub": "${NetworkStackName}-PrivateSubnets" } ] ]
              Sg: !Ref EngineSg
              Log: !Ref LogGroup
              Secret: !Ref HfTokenSecret

Outputs:
  EnginesSsmParam:
    Description: AF_ENGINES_SSM_PARAM for the Control Plane.
    Value: !Ref EnginesSsmParamName
    Export: { Name: !Sub "${AWS::StackName}-EnginesSsmParam" }
  LlmServiceName:
    Description: The llm ECS service name, or - when the role is off (never empty).
    Value: !If [ HasLlmModel, !GetAtt LlmService.Name, "-" ]
    Export: { Name: !Sub "${AWS::StackName}-LlmServiceName" }
  LlmCapacityProviderName:
    Description: The llm capacity provider; what marks an instance as NOT a slot.
    Value: !Ref LlmCapacityProvider
    Export: { Name: !Sub "${AWS::StackName}-LlmCapacityProviderName" }
  ImageServiceName:
    Description: The image ECS service name, or - when the role is off (never empty).
    Value: !If [ HasImageModel, !GetAtt ImageService.Name, "-" ]
    Export: { Name: !Sub "${AWS::StackName}-ImageServiceName" }
  ImageCapacityProviderName:
    Description: The image capacity provider, as the llm one.
    Value: !Ref ImageCapacityProvider
    Export: { Name: !Sub "${AWS::StackName}-ImageCapacityProviderName" }
  ModelsBucket:
    Description: S3 bucket the models are staged in.
    Value: !Ref ModelsBucket
    Export: { Name: !Sub "${AWS::StackName}-ModelsBucket" }
  IngestTaskDefFamily:
    Description: Task definition family for the ingest task.
    Value: !Ref IngestTaskDef
    Export: { Name: !Sub "${AWS::StackName}-IngestTaskDefFamily" }
