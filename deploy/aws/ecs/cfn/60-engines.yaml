AWSTemplateFormatVersion: "2010-09-09"
Description: >-
  agent-fleet ECS adapter — the fleet's own inference engines on GPU, normally scaled to zero
  (ADR 0071). Optional, each role on its own. What it imports and why it is deployed before
  30-ingress: PARAMETERS-60-engines.md, "What this stack is".

# ⚠️ Read PARAMETERS-60-engines.md, "What this template learned the hard way", before editing
# the capacity providers or the services.

Parameters:
  # ⚠️ The long-form reasoning is in cfn/PARAMETERS-60-engines.md (a comment costs what a
  # Description does, and this file is at the 51,200-byte wall). Write every parameter in BLOCK
  # form — see that file, "Editing this template".
  NetworkStackName:
    Type: String
    Default: af-ecs-network
    Description: 00-network stack to import the VPC, private subnets and the CP SG from.
  PlatformStackName:
    Type: String
    Default: af-ecs-platform
    Description: "20-platform stack: cluster, execution role, namespace, af-llamacpp/af-sdcpp/af-comfyui ECR."
  ServiceConnectNamespace:
    Type: String
    Default: af.internal
    Description: "The private DNS namespace's NAME — must match what 20-platform was given."
  EnginesSsmParamName:
    Type: String
    Default: /af-ws/engines
    AllowedPattern: "^/af-ws/[A-Za-z0-9_.\\-/]+$"
    Description: "SSM parameter for the engine table, handed to 30-ingress. MUST be under /af-ws/."

  # --- the llm role (llama.cpp) -------------------------------------------------
  LlmEnabled:
    Type: String
    Default: ""
    AllowedValues: [ "", "true", "false" ]
    Description: "Create the llm role at all. \"\" = whatever LlmModelS3Key said (one release of compat)."
  LlmDiscoveryName:
    Type: String
    Default: llm
    Description: DNS label the llm engine answers on, i.e. <LlmDiscoveryName>.<namespace>.
  LlmImageTag:
    Type: String
    Default: server-cuda
    Description: "Tag in the af-llamacpp ECR repository. standup.sh copies it in before deploy."
  # ⚠️ SEED PARAMETERS (ADR 0072 decision 7), read ONCE by a CP whose catalogue for the role is
  # empty — PARAMETERS-60-engines.md, "The seed parameters".
  LlmModelS3Key:
    Type: String
    Default: ""
    Description: >-
      SEED: the key this deployment already serves. Empty with LlmEnabled unset = no llm role.
  LlmModelIds:
    Type: CommaDelimitedList
    Default: "qwen3-coder-30b-a3b"
    Description: "SEED: the catalogue id for that model. The FIRST is the one that is seeded."
  LlmContextTokens:
    Type: Number
    Default: 32768
    MinValue: 512
    Description: "SEED: that model's context window (llama-server's -c, and what is advertised)."
  LlmMaxOutputTokens:
    Type: Number
    Default: 4096
    MinValue: 256
    Description: "SEED: the output cap advertised with it (0 does not mean unset)."
  LlmExtraArgs:
    Type: CommaDelimitedList
    Default: "-ngl,99,--jinja,--no-mmap"
    Description: "Extra llama-server flags on an L4. ⚠️ NEVER -c here — PARAMETERS-60-engines.md."
  LlmModelsMax:
    Type: Number
    Default: 1
    MinValue: 0
    Description: "Models the router may hold at once (0 = unlimited). 1 — PARAMETERS-60-engines.md."
  LlmInstanceClasses:
    Type: String
    Default: ""
    Description: >-
      GPU rungs this role may be switched between (ADR 0074). EMPTY = no choice, and the CP
      never touches the capacity provider — PARAMETERS-60-engines.md, "The instance classes".
  LlmApiKeySsmParam:
    Type: String
    Default: /af-ws/engine-llm-key
    Description: "SSM SecureString for llama-server's --api-key. standup.sh creates it. Empty = no key."
  LlmTaskCpu:
    Type: String
    Default: "4096"
    Description: Task vCPU units. 4096 fills a g6.xlarge; keep it under the instance.
  LlmTaskMemory:
    Type: String
    Default: "14336"
    Description: "Task memory (MiB), below the instance's 16 GiB by enough for the ECS agent."
  LlmAllowedInstanceTypes:
    Type: CommaDelimitedList
    Default: "g6.xlarge,g5.xlarge"
    Description: "Instance types this role may buy. ⚠️ A FILTER, not a preference order — PARAMETERS-60-engines.md."
  LlmAcceleratorMemMinMiB:
    Type: Number
    Default: 21000
    Description: "VRAM floor (MiB), above the 30B's measured 20,943. 0 = do not ask."
  LlmGpuCount:
    Type: Number
    Default: 1
    Description: GPUs per box, and the task's GPU resource requirement. 0 = a CPU box (test only).
  LlmVCpuMin:
    Type: Number
    Default: 4
    Description: Lower bound of the instance requirement (vCPU).
  LlmVCpuMax:
    Type: Number
    Default: 8
    Description: Upper bound of the instance requirement (vCPU).
  LlmMemMinMiB:
    Type: Number
    Default: 15000
    Description: Lower bound of the instance requirement (MiB).
  LlmMemMaxMiB:
    Type: Number
    Default: 65536
    Description: Upper bound of the instance requirement (MiB).
  LlmStorageGiB:
    Type: Number
    Default: 120
    Description: "EBS data volume per box when UseLocalStorage is off. MI exposes only the SIZE."
  LlmUseLocalStorage:
    Type: String
    Default: "true"
    AllowedValues: [ "true", "false" ]
    Description: "Use the 250 GB instance store, not an EBS volume. On: it halved the cold start."
  LlmScaleInAfter:
    Type: Number
    Default: -2
    Description: "infrastructureOptimization.scaleInAfter in seconds. -2=default, -1=never, 0-3600=seconds."
  LlmIdleSec:
    Type: Number
    Default: 1800
    Description: How long the engine goes unwanted before the controller stops it.
  LlmStartDeadlineSec:
    Type: Number
    Default: 900
    Description: "How long a start may take before it's a failure. MUST exceed the real cold start (527-586 s)."
  LlmMode:
    Type: String
    Default: ondemand
    AllowedValues: [ off, on, ondemand ]
    Description: >-
      The engine's initial mode, written into the SSM table as the DEFAULT only — once an
      admin sets it, the stored setting wins (ADR 0070 decision 7).

  # --- the image role (stable-diffusion.cpp — ADR 0071 P1) ----------------------
  # A mirror of the llm block on purpose: the instance floor is a VRAM number, per role.
  ImageEnabled:
    Type: String
    Default: ""
    AllowedValues: [ "", "true", "false" ]
    Description: "Create the image role at all. \"\" = whatever ImageModelS3Key said (as LlmEnabled)."
  ImageDiscoveryName:
    Type: String
    Default: image
    Description: DNS label the image engine answers on, i.e. <ImageDiscoveryName>.<namespace>.
  ImageEngine:
    Type: String
    Default: sdcpp
    AllowedValues: [ sdcpp, comfy ]
    Description: >-
      Which server the image role runs (ADR 0072 decision 4). sdcpp holds one checkpoint,
      chosen at start; comfy (this deployment's own image) switches per request —
      PARAMETERS-60-engines.md, "ImageEngine".
  ImageImageTag:
    Type: String
    Default: master-cuda
    Description: "Tag in the af-sdcpp ECR repository (ImageEngine=sdcpp only). Amd64 only: no arm64 G-family."
  ImageComfyImageTag:
    Type: String
    Default: v0.34.0
    Description: >-
      Tag in the af-comfyui ECR repository (ImageEngine=comfy only), baked by
      comfyui-image.yml and copied in by standup.sh before deploy.
  # SEED parameters, as on the llm role above.
  ImageModelS3Key:
    Type: String
    Default: ""
    Description: "SEED: the checkpoint already served. Empty + ImageEnabled unset = no image role."
  ImageModelIds:
    Type: CommaDelimitedList
    Default: "sdxl-base-1.0"
    Description: "SEED: the catalogue id for that checkpoint. The FIRST is the one seeded."
  ImageExtraArgs:
    Type: CommaDelimitedList
    Default: "--diffusion-fa"
    Description: "Extra sd-server flags (ImageEngine=sdcpp only) — PARAMETERS-60-engines.md."
  ImageInstanceClasses:
    Type: String
    Default: ""
    Description: "The image role's ladder, as LlmInstanceClasses. Empty = no choice."
  ImageTaskCpu:
    Type: String
    Default: "4096"
    Description: Task vCPU units. 4096 fills a g6.xlarge; keep it under the instance.
  ImageTaskMemory:
    Type: String
    Default: "14336"
    Description: Task memory (MiB), below the instance's 16 GiB by enough for the ECS agent.
  ImageAllowedInstanceTypes:
    Type: CommaDelimitedList
    Default: "g6.xlarge,g5.xlarge"
    Description: "Instance types this role may buy — PARAMETERS-60-engines.md (same filter warning as the llm role's)."
  ImageAcceleratorMemMinMiB:
    Type: Number
    Default: 8000
    Description: "VRAM floor (MiB), above SDXL fp16's measured 7,379. 0 = do not ask."
  ImageGpuCount:
    Type: Number
    Default: 1
    Description: GPUs per box, and the task's GPU resource requirement. 0 = a CPU box (test only).
  ImageVCpuMin:
    Type: Number
    Default: 4
    Description: Lower bound of the instance requirement (vCPU).
  ImageVCpuMax:
    Type: Number
    Default: 8
    Description: Upper bound of the instance requirement (vCPU).
  ImageMemMinMiB:
    Type: Number
    Default: 15000
    Description: Lower bound of the instance requirement (MiB).
  ImageMemMaxMiB:
    Type: Number
    Default: 65536
    Description: Upper bound of the instance requirement (MiB).
  ImageStorageGiB:
    Type: Number
    Default: 60
    Description: "EBS data volume per box when ImageUseLocalStorage is off — PARAMETERS-60-engines.md."
  ImageUseLocalStorage:
    Type: String
    Default: "true"
    AllowedValues: [ "true", "false" ]
    Description: "Use the instance store instead of an EBS data volume. As on the llm role."
  ImageScaleInAfter:
    Type: Number
    Default: -2
    Description: "infrastructureOptimization.scaleInAfter in seconds. -1 is a trap here — PARAMETERS-60-engines.md."
  ImageIdleSec:
    Type: Number
    Default: 900
    Description: "How long unwanted before the controller stops it. Half the llm role's window."
  ImageStartDeadlineSec:
    Type: Number
    Default: 900
    Description: "How long a start may take before it's a failure. sd-server measured 195 s to listen."
  ImageMode:
    Type: String
    Default: ondemand
    AllowedValues: [ off, on, ondemand ]
    Description: The engine's initial mode, written into the SSM table as the DEFAULT only.

  # --- ingest -----------------------------------------------------------------
  IngestCpu:
    Type: String
    Default: "2048"
    Description: Fargate vCPU units for the ingest task.
  IngestMemory:
    Type: String
    Default: "4096"
    Description: Fargate memory (MiB) for the ingest task.
  IngestDiskGiB:
    Type: Number
    Default: 80
    Description: "Ephemeral storage for the ingest task: the largest model this deployment can take in."
  LogRetentionDays:
    Type: Number
    Default: 14
    Description: CloudWatch retention for the engine and ingest log group.

Mappings:
  # ONE fetch sidecar for both roles. ⚠️ A LITERAL block (`|-`), never folded —
  # PARAMETERS-60-engines.md, "The fetch sidecar" (engine-sidecar-test.sh runs it for real).
  Engine:
    fetch:
      script: |-
        set -e
        mkdir -p "$MODELS_DIR"
        trap 'touch "$MODELS_DIR/ready" 2>/dev/null || true' EXIT
        V=$(aws ssm get-parameter --name "$ACTIVE_PARAM" --query Parameter.Value --output text 2>/dev/null || true)
        if [ -z "$V" ] || [ "$V" = "None" ]; then
          echo "engine fetch: no active set at $ACTIVE_PARAM - this engine has nothing to load"
          : > "$MODELS_DIR/cmdline"
          exit 0
        fi
        START=$(printf '%s' "$V" | jq -r '.start // ""')
        echo "engine fetch: active set for $ACTIVE_PARAM starts with '$START'"
        if [ -n "$PRESET_FILE" ]; then
          START=$(printf '%s' "$V" | jq -r --arg s "$START" '[(.models[]?|select(.id==$s)|.id),(.models[0].id?)][0]//""')
          printf '%s' "$V" | jq -r --arg s "$START" '[.models[]?|select(.id!=$s)|.f[]?|if type=="string" then . else .k end]|.[]' > /tmp/keys.rest
        else
          : > /tmp/keys.rest
        fi
        printf '%s' "$V" | jq -r --arg s "$START" '[(.models[]?|select(.id==$s)|.f[]?|if type=="string" then . else .k end),(.loras[]?)]|.[]' > /tmp/keys.start
        fetch_keys() {
          while read -r k; do
            [ -n "$k" ] || continue
            dst="$MODELS_DIR/$k"
            if [ -s "$dst" ]; then echo "engine fetch: $k is already on this box"; continue; fi
            mkdir -p "$(dirname "$dst")"
            t0=$(date +%s)
            aws s3 cp "s3://$BUCKET/$k" "$dst.part" --only-show-errors
            mv "$dst.part" "$dst"
            echo "engine fetch: $k $(stat -c %s "$dst") bytes in $(( $(date +%s) - t0 ))s"
          done < "$1"
        }
        fetch_keys /tmp/keys.start
        if [ -n "$PRESET_FILE" ]; then
          mkdir -p "$(dirname "$PRESET_FILE")"
          printf '%s' "$V" | jq -r --arg s "$START" --arg d "$MODELS_DIR" '.models[]? as $m | ($m.a // []) as $a | (["["+$m.id+"]"] + [$m.f[]?|if type=="string" then "model = "+$d+"/"+. else (.g|ltrimstr("-")|ltrimstr("-"))+" = "+$d+"/"+.k end] + (if ($m.c//0)>0 then ["c = "+($m.c|tostring)] else [] end) + [$a|to_entries[]|select(.value|startswith("-"))|(.value|ltrimstr("-")|ltrimstr("-")) as $k|($a[.key+1]//"") as $v|if ($v!="" and ($v|startswith("-")|not)) then $k+" = "+$v else $k+" = true" end] + (if $m.id==$s then ["load-on-startup = true"] else [] end) + [""])[]' > "$PRESET_FILE.part"
          mv "$PRESET_FILE.part" "$PRESET_FILE"
          echo "engine fetch: preset $PRESET_FILE holds $(grep -c '^\[' "$PRESET_FILE" || true) model(s), '$START' loaded at startup"
          if [ -s "$PRESET_FILE" ]; then printf -- '--models-preset %s' "$PRESET_FILE" > "$MODELS_DIR/cmdline.part"; else : > "$MODELS_DIR/cmdline.part"; fi
        else
          printf '%s' "$V" | jq -r --arg s "$START" --arg d "$MODELS_DIR" --arg al "$ALIAS_FLAG" --arg cf "$CTX_FLAG" '(.models[]?|select(.id==$s)) as $m | if $m == null then "" else ([$m.f[]? | if type=="string" then ["-m",($d+"/"+.)] else [.g,($d+"/"+.k)] end] | add // []) + (if $al != "" then [$al,$m.id] else [] end) + (if $cf != "" and (($m.c // 0) > 0) then [$cf,($m.c|tostring)] else [] end) + ($m.a // []) | join(" ") end' > "$MODELS_DIR/cmdline.part"
        fi
        mv "$MODELS_DIR/cmdline.part" "$MODELS_DIR/cmdline"
        echo "engine fetch: cmdline = $(cat "$MODELS_DIR/cmdline")"
        touch "$MODELS_DIR/ready"
        echo "engine fetch: engine may start; $(grep -c . /tmp/keys.rest || true) file(s) still to sync"
        fetch_keys /tmp/keys.rest
        echo "engine fetch: every enabled model is on this box"

Conditions:
  # Whether the ROLE exists. WHAT it loads is the catalogue's (ADR 0072 decision 1); `""` keeps
  # the old "empty model key = no role" meaning for one release. PARAMETERS-60-engines.md.
  HasLlmModel: !Or
    - !Equals [ !Ref LlmEnabled, "true" ]
    - !And [ !Equals [ !Ref LlmEnabled, "" ], !Not [ !Equals [ !Ref LlmModelS3Key, "" ] ] ]
  HasGpu: !Not [ !Equals [ !Ref LlmGpuCount, 0 ] ]
  HasLlmAcceleratorMem: !And [ !Condition HasGpu, !Not [ !Equals [ !Ref LlmAcceleratorMemMinMiB, 0 ] ] ]
  UseLocalStorage: !Equals [ !Ref LlmUseLocalStorage, "true" ]
  HasScaleInAfter: !Not [ !Equals [ !Ref LlmScaleInAfter, -2 ] ]
  HasLlmApiKey: !Not [ !Equals [ !Ref LlmApiKeySsmParam, "" ] ]
  # The same four for the image role, and the pair that decides the shape of the engine table
  # (0, 1 or 2 rows — the comma between them only exists when both are there).
  HasImageModel: !Or
    - !Equals [ !Ref ImageEnabled, "true" ]
    - !And [ !Equals [ !Ref ImageEnabled, "" ], !Not [ !Equals [ !Ref ImageModelS3Key, "" ] ] ]
  HasImageGpu: !Not [ !Equals [ !Ref ImageGpuCount, 0 ] ]
  HasImageAcceleratorMem: !And [ !Condition HasImageGpu, !Not [ !Equals [ !Ref ImageAcceleratorMemMinMiB, 0 ] ] ]
  ImageUsesLocalStorage: !Equals [ !Ref ImageUseLocalStorage, "true" ]
  HasImageScaleInAfter: !Not [ !Equals [ !Ref ImageScaleInAfter, -2 ] ]
  HasBothModels: !And [ !Condition HasLlmModel, !Condition HasImageModel ]
  ImageIsComfy: !Equals [ !Ref ImageEngine, "comfy" ]

Resources:
  # --- IAM: three roles, all closed inside this stack (ADR 0071 decision 8) ------
  # The CP needs nothing new beyond CpIngestPolicy below.

  # The role ECS itself assumes to run the Managed Instances fleet.
  InfraRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub "af-${AWS::StackName}-mi-infra"
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal: { Service: ecs.amazonaws.com }
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/AmazonECSInfrastructureRolePolicyForManagedInstances
      # iam:PassRole in the managed policy only covers ecsInstanceRole*, and ours is
      # fleet-named. Without this: UnauthorizedOperation, CloudTrail only (measured).
      Policies:
        - PolicyName: pass-instance-role
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action: iam:PassRole
                Resource: !Sub "arn:aws:iam::${AWS::AccountId}:role/af-${AWS::StackName}-mi-instance"
                Condition: { StringLike: { "iam:PassedToService": "ec2.*" } }

  InstanceRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub "af-${AWS::StackName}-mi-instance"
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal: { Service: ec2.amazonaws.com }
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/AmazonECSInstanceRolePolicyForManagedInstances

  InstanceProfile:
    Type: AWS::IAM::InstanceProfile
    Properties:
      InstanceProfileName: !Sub "af-${AWS::StackName}-mi-instance"
      Roles: [ !Ref InstanceRole ]

  # Engine tasks READ the model catalogue; ingest WRITES it and holds the HF token. Two roles on
  # purpose, and no ssmmessages:* on either: PARAMETERS-60-engines.md, "The task roles".
  EngineTaskRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub "af-${AWS::StackName}-engine-task"
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal: { Service: ecs-tasks.amazonaws.com }
            Action: sts:AssumeRole
      Policies:
        - PolicyName: models-read
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action: [ s3:GetObject ]
                Resource: !Sub "${ModelsBucket.Arn}/*"
              - Effect: Allow
                Action: [ s3:ListBucket ]
                Resource: !GetAtt ModelsBucket.Arn
              # The active set the Control Plane publishes (ADR 0072 decision 2). Scoped to the
              # granted INSIDE this stack (ADR 0071 decision 8); the CP side needs nothing new.
              - Effect: Allow
                Action: [ ssm:GetParameter ]
                Resource: !Sub "arn:aws:ssm:${AWS::Region}:${AWS::AccountId}:parameter${EnginesSsmParamName}/*"

  IngestTaskRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub "af-${AWS::StackName}-ingest-task"
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal: { Service: ecs-tasks.amazonaws.com }
            Action: sts:AssumeRole
      Policies:
        - PolicyName: models-write
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action: [ s3:PutObject, s3:AbortMultipartUpload, s3:GetObject ]
                Resource: !Sub "${ModelsBucket.Arn}/*"
              - Effect: Allow
                Action: [ s3:ListBucket ]
                Resource: !GetAtt ModelsBucket.Arn
              # MODE=delete (ADR 0072 decision 7): the CP has no s3:DeleteObject, so forgetting
              # a row and deleting the bytes are different acts by different principals.
              - Effect: Allow
                Action: [ s3:DeleteObject ]
                Resource: !Sub "${ModelsBucket.Arn}/*"

  # The CP's only new permissions (ADR 0072 decision 6), all pinned to THIS stack's
  # resources — PARAMETERS-60-engines.md, "The ingest permissions".
  CpIngestPolicy:
    Type: AWS::IAM::Policy
    Properties:
      PolicyName: !Sub "af-${AWS::StackName}-cp-ingest"
      Roles:
        - !Select [ 1, !Split [ "/", !ImportValue { "Fn::Sub": "${PlatformStackName}-CpTaskRoleArn" } ] ]
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Action: [ ecs:RunTask ]
            Resource: !Sub "arn:aws:ecs:${AWS::Region}:${AWS::AccountId}:task-definition/af-${AWS::StackName}-ingest:*"
            Condition:
              ArnEquals: { "ecs:cluster": !ImportValue { "Fn::Sub": "${PlatformStackName}-ClusterArn" } }
          - Effect: Allow
            Action: [ iam:PassRole ]
            Resource: !GetAtt IngestTaskRole.Arn
            Condition: { StringEquals: { "iam:PassedToService": ecs-tasks.amazonaws.com } }
          # The log, not just the exit code: DescribeTasks says a container failed, the log
          # says WHY, and that sentence is what the panel shows instead of "exit 1".
          - Effect: Allow
            Action: [ logs:GetLogEvents, logs:DescribeLogStreams ]
            Resource: !Sub "arn:aws:logs:${AWS::Region}:${AWS::AccountId}:log-group:/af/${AWS::StackName}/engines:*"
          # Write only: the CP fills the token in and can never read it back. That is the
          # boundary decision 6 keeps once the token stops being a stack parameter.
          - Effect: Allow
            Action: [ secretsmanager:PutSecretValue ]
            Resource: !Ref HfTokenSecret
          # Rung changes (ADR 0074 decision 9). 🔴 The third action is one the CP never calls:
          # ECS authorizes an MI provider update as PutClusterCapacityProviders on the CLUSTER
          # (measured, P1) — PARAMETERS-60-engines.md, "The instance classes".
          - Effect: Allow
            Action: [ ecs:DescribeCapacityProviders, ecs:UpdateCapacityProvider ]
            Resource: !Sub "arn:aws:ecs:${AWS::Region}:${AWS::AccountId}:capacity-provider/af-${AWS::StackName}-*"
          - Effect: Allow
            Action: [ ecs:PutClusterCapacityProviders ]
            Resource: !ImportValue { "Fn::Sub": "${PlatformStackName}-ClusterArn" }
          - Effect: Allow
            Action: [ iam:PassRole ]
            Resource: [ !GetAtt InfraRole.Arn, !GetAtt InstanceRole.Arn ]
            Condition: { StringEquals: { "iam:PassedToService": ecs.amazonaws.com } }

  # Always created, holding the sentinel until somebody registers a token in the Console —
  # PARAMETERS-60-engines.md, "The Hugging Face token".
  HfTokenSecret:
    Type: AWS::SecretsManager::Secret
    Properties:
      Description: !Sub "HF_TOKEN for af-${AWS::StackName} ingest, written by the Control Plane"
      SecretString: "-"

  # 🔴 ECS injects Secrets with the EXECUTION role, which reads `secret:rds!*` only — without
  # this the task dies at startup. PARAMETERS-60-engines.md, "The Hugging Face token".
  ExecHfTokenPolicy:
    Type: AWS::IAM::Policy
    Properties:
      PolicyName: !Sub "af-${AWS::StackName}-exec-hf"
      Roles:
        - !Select [ 1, !Split [ "/", !ImportValue { "Fn::Sub": "${PlatformStackName}-ExecRoleArn" } ] ]
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Action: [ secretsmanager:GetSecretValue ]
            Resource: !Ref HfTokenSecret

  # --- the model catalogue (PARAMETERS-60-engines.md, "The models bucket") ------
  ModelsBucket:
    Type: AWS::S3::Bucket
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      BucketName: !Sub "af-${AWS::StackName}-models-${AWS::AccountId}"
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault: { SSEAlgorithm: AES256 }
      LifecycleConfiguration:
        Rules:
          - Id: abort-incomplete-uploads
            Status: Enabled
            AbortIncompleteMultipartUpload: { DaysAfterInitiation: 3 }
      # Cost allocation (ADR 0048 decision 15): without these the stack's storage and logs are
      # the only part of the engines' bill with no name on it. A key is never retroactive.
      Tags:
        - { Key: af-role, Value: engine-models }
        - { Key: af-pool, Value: !ImportValue { "Fn::Sub": "${PlatformStackName}-ClusterName" } }

  LogGroup:
    Type: AWS::Logs::LogGroup
    DeletionPolicy: Delete
    Properties:
      LogGroupName: !Sub "/af/${AWS::StackName}/engines"
      RetentionInDays: !Ref LogRetentionDays
      Tags:
        - { Key: af-role, Value: engine-logs }
        - { Key: af-pool, Value: !ImportValue { "Fn::Sub": "${PlatformStackName}-ClusterName" } }

  # Reachability IS the access control (ADR 0071 decision 4): 8080 from the CP's SG and nothing
  # else. sd-server has no authentication of its own, so for the image role this is all of it.
  EngineSg:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: !Sub "af-${AWS::StackName} inference engines (CP to engine, 8080)"
      VpcId: !ImportValue { "Fn::Sub": "${NetworkStackName}-VpcId" }
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 8080
          ToPort: 8080
          SourceSecurityGroupId: !ImportValue { "Fn::Sub": "${NetworkStackName}-CpSgId" }
          Description: engine port from the Control Plane only
      Tags: [ { Key: Name, Value: !Sub "af-${AWS::StackName}-engine-sg" } ]

  # --- capacity: one provider per engine role (ADR 0071 decision 2) -------------
  # ⚠️ PARAMETERS-60-engines.md, "The capacity providers" and "The G-family quota".
  LlmCapacityProvider:
    Type: AWS::ECS::CapacityProvider
    Properties:
      Name: !Sub "af-${AWS::StackName}-llm"
      ClusterName: !ImportValue { "Fn::Sub": "${PlatformStackName}-ClusterName" }
      ManagedInstancesProvider:
        InfrastructureRoleArn: !GetAtt InfraRole.Arn
        PropagateTags: CAPACITY_PROVIDER
        InfrastructureOptimization: !If
          - HasScaleInAfter
          - ScaleInAfter: !Ref LlmScaleInAfter
          - !Ref "AWS::NoValue"
        InstanceLaunchTemplate:
          Ec2InstanceProfileArn: !GetAtt InstanceProfile.Arn
          CapacityOptionType: ON_DEMAND
          NetworkConfiguration:
            Subnets: !Split [ ",", !ImportValue { "Fn::Sub": "${NetworkStackName}-PrivateSubnets" } ]
            SecurityGroups: [ !Ref EngineSg ]
          StorageConfiguration: !If
            - UseLocalStorage
            - !Ref "AWS::NoValue"
            - StorageSizeGiB: !Ref LlmStorageGiB
          LocalStorageConfiguration: !If
            - UseLocalStorage
            - UseLocalStorage: true
            - !Ref "AWS::NoValue"
          InstanceRequirements:
            VCpuCount: { Min: !Ref LlmVCpuMin, Max: !Ref LlmVCpuMax }
            MemoryMiB: { Min: !Ref LlmMemMinMiB, Max: !Ref LlmMemMaxMiB }
            BurstablePerformance: excluded
            AllowedInstanceTypes: !Ref LlmAllowedInstanceTypes
            # AcceleratorCount is refused without AcceleratorTypes (measured).
            AcceleratorCount: !If [ HasGpu, { Min: !Ref LlmGpuCount, Max: !Ref LlmGpuCount }, !Ref "AWS::NoValue" ]
            AcceleratorTypes: !If [ HasGpu, [ gpu ], !Ref "AWS::NoValue" ]
            AcceleratorManufacturers: !If [ HasGpu, [ nvidia ], !Ref "AWS::NoValue" ]
            # Total across the accelerators asked for: with AcceleratorCount 1, the card.
            AcceleratorTotalMemoryMiB: !If [ HasLlmAcceleratorMem, { Min: !Ref LlmAcceleratorMemMinMiB }, !Ref "AWS::NoValue" ]
      Tags:
        # Cost allocation: engine hours are a COMPONENT cost, shown as such and never
        # apportioned to a member (ADR 0048, ADR 0071 decision 9).
        - { Key: af-role, Value: engine-llm }
        - { Key: af-pool, Value: !ImportValue { "Fn::Sub": "${PlatformStackName}-ClusterName" } }

  # The image role's own capacity. Created even when no image model is staged: a capacity
  # provider costs nothing while idle and the association list below is replaced wholesale.
  ImageCapacityProvider:
    Type: AWS::ECS::CapacityProvider
    Properties:
      Name: !Sub "af-${AWS::StackName}-image"
      ClusterName: !ImportValue { "Fn::Sub": "${PlatformStackName}-ClusterName" }
      ManagedInstancesProvider:
        InfrastructureRoleArn: !GetAtt InfraRole.Arn
        PropagateTags: CAPACITY_PROVIDER
        InfrastructureOptimization: !If
          - HasImageScaleInAfter
          - ScaleInAfter: !Ref ImageScaleInAfter
          - !Ref "AWS::NoValue"
        InstanceLaunchTemplate:
          Ec2InstanceProfileArn: !GetAtt InstanceProfile.Arn
          CapacityOptionType: ON_DEMAND
          NetworkConfiguration:
            Subnets: !Split [ ",", !ImportValue { "Fn::Sub": "${NetworkStackName}-PrivateSubnets" } ]
            SecurityGroups: [ !Ref EngineSg ]
          StorageConfiguration: !If
            - ImageUsesLocalStorage
            - !Ref "AWS::NoValue"
            - StorageSizeGiB: !Ref ImageStorageGiB
          LocalStorageConfiguration: !If
            - ImageUsesLocalStorage
            - UseLocalStorage: true
            - !Ref "AWS::NoValue"
          InstanceRequirements:
            VCpuCount: { Min: !Ref ImageVCpuMin, Max: !Ref ImageVCpuMax }
            MemoryMiB: { Min: !Ref ImageMemMinMiB, Max: !Ref ImageMemMaxMiB }
            BurstablePerformance: excluded
            AllowedInstanceTypes: !Ref ImageAllowedInstanceTypes
            AcceleratorCount: !If [ HasImageGpu, { Min: !Ref ImageGpuCount, Max: !Ref ImageGpuCount }, !Ref "AWS::NoValue" ]
            AcceleratorTypes: !If [ HasImageGpu, [ gpu ], !Ref "AWS::NoValue" ]
            AcceleratorManufacturers: !If [ HasImageGpu, [ nvidia ], !Ref "AWS::NoValue" ]
            AcceleratorTotalMemoryMiB: !If [ HasImageAcceleratorMem, { Min: !Ref ImageAcceleratorMemMinMiB }, !Ref "AWS::NoValue" ]
      Tags:
        - { Key: af-role, Value: engine-image }
        - { Key: af-pool, Value: !ImportValue { "Fn::Sub": "${PlatformStackName}-ClusterName" } }

  # ⚠️ This REPLACES the cluster's provider list, and its empty default strategy is
  # load-bearing: PARAMETERS-60-engines.md, "The capacity providers".
  Associations:
    Type: AWS::ECS::ClusterCapacityProviderAssociations
    Properties:
      Cluster: !ImportValue { "Fn::Sub": "${PlatformStackName}-ClusterName" }
      CapacityProviders: [ FARGATE, FARGATE_SPOT, !Ref LlmCapacityProvider, !Ref ImageCapacityProvider ]
      DefaultCapacityProviderStrategy: []

  # --- ingest: HF -> S3, once, out of the start path (ADR 0071 decision 3) ------
  # Started by the CP (ADR 0072 decision 6) or by hand: PARAMETERS-60-engines.md, "Ingest".
  IngestTaskDef:
    Type: AWS::ECS::TaskDefinition
    Properties:
      Family: !Sub "af-${AWS::StackName}-ingest"
      RequiresCompatibilities: [ FARGATE ]
      NetworkMode: awsvpc
      Cpu: !Ref IngestCpu
      Memory: !Ref IngestMemory
      EphemeralStorage: { SizeInGiB: !Ref IngestDiskGiB }
      ExecutionRoleArn: !ImportValue { "Fn::Sub": "${PlatformStackName}-ExecRoleArn" }
      TaskRoleArn: !GetAtt IngestTaskRole.Arn
      Volumes: [ { Name: scratch } ]
      ContainerDefinitions:
        - Name: fetch
          Essential: false
          Image: curlimages/curl:latest
          # The shared volume is root-owned and curlimages/curl runs as uid 100, which
          # surfaces as the useless "curl: (23) client returned ERROR on write" (measured).
          User: "0"
          EntryPoint: [ "sh", "-c" ]
          Command:
            - >-
              set -e;
              [ "$MODE" = delete ] && { echo "ingest: delete mode, nothing to fetch"; exit 0; };
              [ -n "$URL" ] || { echo "ingest: URL is required"; exit 2; };
              start=$(date +%s);
              if [ -n "$HF_TOKEN" ] && [ "$HF_TOKEN" != - ];
              then set -- -H "Authorization: Bearer $HF_TOKEN"; else set --; fi;
              curl -fsSL "$@" -o /scratch/blob "$URL";
              size=$(stat -c %s /scratch/blob);
              secs=$(( $(date +%s) - start ));
              echo "ingest: fetched $size bytes in ${secs}s";
              if [ -n "$SHA256" ]; then
                got=$(sha256sum /scratch/blob | cut -d" " -f1);
                [ "$got" = "$SHA256" ] || { echo "ingest: sha256 mismatch: got $got want $SHA256"; exit 1; };
                echo "ingest: sha256 ok $got";
              else
                echo "ingest: WARNING no SHA256 given — the upload is unverified";
              fi
          Environment:
            - { Name: URL, Value: "" }
            - { Name: SHA256, Value: "" }
            - { Name: MODE, Value: "" }
          # Always injected; "-" is the sentinel the fetch above reads as "no token".
          Secrets: [ { Name: HF_TOKEN, ValueFrom: !Ref HfTokenSecret } ]
          MountPoints: [ { SourceVolume: scratch, ContainerPath: /scratch } ]
          LogConfiguration:
            LogDriver: awslogs
            Options:
              awslogs-group: !Ref LogGroup
              awslogs-region: !Ref "AWS::Region"
              awslogs-stream-prefix: ingest-fetch
        - Name: upload
          Essential: true
          Image: public.ecr.aws/aws-cli/aws-cli:latest
          EntryPoint: [ "sh", "-c" ]
          Command:
            - !Sub >-
              set -e;
              [ -n "$KEY" ] || { echo "ingest: KEY is required"; exit 2; };
              start=$(date +%s);
              if [ "$MODE" = delete ]; then
                for k in $KEY; do aws s3 rm "s3://${ModelsBucket}/$k" --only-show-errors; echo "ingest: deleted $k"; done;
                exit 0;
              fi;
              aws s3 cp /scratch/blob "s3://${ModelsBucket}/$KEY" --only-show-errors;
              echo "ingest: uploaded $KEY in $(( $(date +%s) - start ))s";
          Environment: [ { Name: KEY, Value: "" }, { Name: MODE, Value: "" } ]
          MountPoints: [ { SourceVolume: scratch, ContainerPath: /scratch } ]
          # SUCCESS, not COMPLETE: a fetch that failed its checksum must not be uploaded.
          DependsOn: [ { ContainerName: fetch, Condition: SUCCESS } ]
          LogConfiguration:
            LogDriver: awslogs
            Options:
              awslogs-group: !Ref LogGroup
              awslogs-region: !Ref "AWS::Region"
              awslogs-stream-prefix: ingest-upload

  # --- the llm engine -----------------------------------------------------------
  LlmTaskDef:
    Type: AWS::ECS::TaskDefinition
    Condition: HasLlmModel
    Properties:
      Family: !Sub "af-${AWS::StackName}-llm"
      RequiresCompatibilities: [ MANAGED_INSTANCES ]
      NetworkMode: awsvpc
      Cpu: !Ref LlmTaskCpu
      Memory: !Ref LlmTaskMemory
      ExecutionRoleArn: !ImportValue { "Fn::Sub": "${PlatformStackName}-ExecRoleArn" }
      TaskRoleArn: !GetAtt EngineTaskRole.Arn
      Volumes:
        # An ANONYMOUS host volume — empty `Host`, no SourcePath, both measured:
        # PARAMETERS-60-engines.md, "The model volume".
        - Name: models
          Host: {}
      ContainerDefinitions:
        # Runs to completion before llama-server starts, and logs how long the S3 half of the
        # cold start took. Shared with the image role; the difference is the environment below.
        - Name: fetch
          Essential: false
          Image: public.ecr.aws/aws-cli/aws-cli:latest
          EntryPoint: [ "sh", "-c" ]
          Command: [ !FindInMap [ Engine, fetch, script ] ]
          Environment:
            - { Name: MODELS_DIR, Value: /models }
            - { Name: BUCKET, Value: !Ref ModelsBucket }
            - { Name: ACTIVE_PARAM, Value: !Sub "${EnginesSsmParamName}/llm/active" }
            # ROUTER MODE (ADR 0072 decision 3): everything model-specific moves into a preset
            # section named after the catalogue id — hence ALIAS_FLAG and CTX_FLAG empty.
            - { Name: PRESET_FILE, Value: /models/llm/presets.ini }
            - { Name: ALIAS_FLAG, Value: "" }
            - { Name: CTX_FLAG, Value: "" }
          MountPoints: [ { SourceVolume: models, ContainerPath: /models } ]
          LogConfiguration:
            LogDriver: awslogs
            Options:
              awslogs-group: !Ref LogGroup
              awslogs-region: !Ref "AWS::Region"
              awslogs-stream-prefix: llm-fetch
        - Name: llama
          Essential: true
          # ⚠️ The image must ALREADY be in that repository when this stack is created, or the
          # stack blocks in CREATE_IN_PROGRESS: PARAMETERS-60-engines.md, "The engine services".
          Image: !Sub
            - "${Uri}:${Tag}"
            - Uri: !ImportValue { "Fn::Sub": "${PlatformStackName}-EcrLlamacppUri" }
              Tag: !Ref LlmImageTag
          PortMappings: [ { ContainerPort: 8080 } ]
          # ⚠️ The idle wrapper (ADR 0072 decision 1(a)) — PARAMETERS-60-engines.md.
          EntryPoint: [ "sh", "-c" ]
          Command:
            - !Sub
              - >-
                n=0; while [ ! -f /models/ready ] && [ $n -lt 3600 ]; do n=$((n+1)); sleep 1; done;
                if [ -s /models/cmdline ]; then exec /app/llama-server --host 0.0.0.0 --port 8080
                --models-max ${LlmModelsMax} ${Extra} $(cat /models/cmdline);
                else echo "llm: no model in the catalogue — idling"; sleep infinity; fi
              - Extra: !Join [ " ", !Ref LlmExtraArgs ]
          ResourceRequirements: !If [ HasGpu, [ { Type: GPU, Value: !Ref LlmGpuCount } ], !Ref "AWS::NoValue" ]
          MountPoints: [ { SourceVolume: models, ContainerPath: /models } ]
          DependsOn: [ { ContainerName: fetch, Condition: START } ]
          Environment:
            # -hf is never used (decision 3), but llama-server writes here regardless of
            # how the model arrived; pointing it at /tmp keeps it off the model volume.
            - { Name: LLAMA_CACHE, Value: /tmp/llama-cache }
          Secrets: !If
            - HasLlmApiKey
            - - Name: LLAMA_API_KEY
                ValueFrom: !Sub "arn:aws:ssm:${AWS::Region}:${AWS::AccountId}:parameter${LlmApiKeySsmParam}"
            - !Ref "AWS::NoValue"
          LogConfiguration:
            LogDriver: awslogs
            Options:
              awslogs-group: !Ref LogGroup
              awslogs-region: !Ref "AWS::Region"
              awslogs-stream-prefix: llm

  # Cloud Map DNS, not Service Connect (ADR 0070 decision 8). At desired 0 the name has no A
  # record at all — the normal state of an engine nobody is using, not an error.
  LlmDiscovery:
    Type: AWS::ServiceDiscovery::Service
    Condition: HasLlmModel
    Properties:
      Name: !Ref LlmDiscoveryName
      NamespaceId: !ImportValue { "Fn::Sub": "${PlatformStackName}-NamespaceId" }
      DnsConfig:
        DnsRecords: [ { Type: A, TTL: 10 } ]
      # Without it Cloud Map refuses the registration for an ECS service that has no load
      # balancer.
      HealthCheckCustomConfig: { FailureThreshold: 1 }

  LlmService:
    Type: AWS::ECS::Service
    Condition: HasLlmModel
    DependsOn: Associations
    Properties:
      ServiceName: !Sub "af-${AWS::StackName}-llm"
      Cluster: !ImportValue { "Fn::Sub": "${PlatformStackName}-ClusterArn" }
      TaskDefinition: !Ref LlmTaskDef
      # ⚠️ No DesiredCount (declaring 0 kills a GPU box mid-answer on every update) and no
      # LaunchType. Both load-bearing: PARAMETERS-60-engines.md, "The engine services".
      CapacityProviderStrategy:
        - { CapacityProvider: !Ref LlmCapacityProvider, Weight: 1 }
      # One engine, one DNS name: two tasks during a redeploy split requests between a warm
      # engine and a cold one. Stop the old task first.
      DeploymentConfiguration: { MinimumHealthyPercent: 0, MaximumPercent: 100 }
      NetworkConfiguration:
        AwsvpcConfiguration:
          AssignPublicIp: DISABLED
          Subnets: !Split [ ",", !ImportValue { "Fn::Sub": "${NetworkStackName}-PrivateSubnets" } ]
          SecurityGroups: [ !Ref EngineSg ]
      ServiceRegistries:
        - RegistryArn: !GetAtt LlmDiscovery.Arn
      PropagateTags: SERVICE
      Tags:
        - { Key: af-pool, Value: !ImportValue { "Fn::Sub": "${PlatformStackName}-ClusterName" } }
        - { Key: af-role, Value: engine-llm }

  # --- the image engine (ADR 0071 P1) -------------------------------------------
  ImageTaskDef:
    Type: AWS::ECS::TaskDefinition
    Condition: HasImageModel
    Properties:
      Family: !Sub "af-${AWS::StackName}-image"
      RequiresCompatibilities: [ MANAGED_INSTANCES ]
      NetworkMode: awsvpc
      Cpu: !Ref ImageTaskCpu
      Memory: !Ref ImageTaskMemory
      ExecutionRoleArn: !ImportValue { "Fn::Sub": "${PlatformStackName}-ExecRoleArn" }
      TaskRoleArn: !GetAtt EngineTaskRole.Arn
      Volumes:
        # `Host: {}`, as on the llm role above.
        - Name: models
          Host: {}
      ContainerDefinitions:
        - Name: fetch
          Essential: false
          Image: public.ecr.aws/aws-cli/aws-cli:latest
          EntryPoint: [ "sh", "-c" ]
          Command: [ !FindInMap [ Engine, fetch, script ] ]
          Environment:
            - { Name: MODELS_DIR, Value: /models }
            - { Name: BUCKET, Value: !Ref ModelsBucket }
            - { Name: ACTIVE_PARAM, Value: !Sub "${EnginesSsmParamName}/image/active" }
            # Neither engine is a router — PARAMETERS-60-engines.md, "The idle wrapper".
            - { Name: PRESET_FILE, Value: "" }
            - { Name: ALIAS_FLAG, Value: "" }
            - { Name: CTX_FLAG, Value: "" }
          MountPoints: [ { SourceVolume: models, ContainerPath: /models } ]
          LogConfiguration:
            LogDriver: awslogs
            Options:
              awslogs-group: !Ref LogGroup
              awslogs-region: !Ref "AWS::Region"
              awslogs-stream-prefix: image-fetch
        # ⚠️ ImageEngine picks the image AND the command (ADR 0072 decision 4) — one
        # container, one task def: PARAMETERS-60-engines.md, "The idle wrapper".
        - Name: engine
          Essential: true
          Image: !If
            - ImageIsComfy
            - !Sub
              - "${Uri}:${Tag}"
              - Uri: !ImportValue { "Fn::Sub": "${PlatformStackName}-EcrComfyuiUri" }
                Tag: !Ref ImageComfyImageTag
            - !Sub
              - "${Uri}:${Tag}"
              - Uri: !ImportValue { "Fn::Sub": "${PlatformStackName}-EcrSdcppUri" }
                Tag: !Ref ImageImageTag
          EntryPoint: [ "sh", "-c" ]
          Command:
            - !If
              - ImageIsComfy
              # ln -sfn is the whole S3-layout integration — PARAMETERS-60-engines.md, "The
              # idle wrapper". The checkpoint is picked per REQUEST by the provider's graph.
              - >-
                n=0; while [ ! -f /models/ready ] && [ $n -lt 3600 ]; do n=$((n+1)); sleep 1; done;
                if [ -s /models/cmdline ]; then ln -sfn /models/image /ComfyUI/models;
                exec python3 /ComfyUI/main.py --listen 0.0.0.0 --port 8080 --disable-auto-launch;
                else echo "image: no checkpoint in the catalogue — idling"; sleep infinity; fi
              # ⚠️ Why sd-server's flags are spelled differently and why --lora-model-dir is
              # stated: PARAMETERS-60-engines.md, "The idle wrapper".
              - !Sub
                - >-
                  mkdir -p /models/image/loras;
                  n=0; while [ ! -f /models/ready ] && [ $n -lt 3600 ]; do n=$((n+1)); sleep 1; done;
                  if [ -s /models/cmdline ]; then exec /sd-server --listen-ip 0.0.0.0
                  --listen-port 8080 --lora-model-dir /models/image/loras
                  ${Extra} $(cat /models/cmdline);
                  else echo "image: no checkpoint in the catalogue — idling"; sleep infinity; fi
                - Extra: !Join [ " ", !Ref ImageExtraArgs ]
          ResourceRequirements: !If [ HasImageGpu, [ { Type: GPU, Value: !Ref ImageGpuCount } ], !Ref "AWS::NoValue" ]
          MountPoints: [ { SourceVolume: models, ContainerPath: /models } ]
          DependsOn: [ { ContainerName: fetch, Condition: START } ]
          LogConfiguration:
            LogDriver: awslogs
            Options:
              awslogs-group: !Ref LogGroup
              awslogs-region: !Ref "AWS::Region"
              awslogs-stream-prefix: image

  ImageDiscovery:
    Type: AWS::ServiceDiscovery::Service
    Condition: HasImageModel
    Properties:
      Name: !Ref ImageDiscoveryName
      NamespaceId: !ImportValue { "Fn::Sub": "${PlatformStackName}-NamespaceId" }
      DnsConfig:
        DnsRecords: [ { Type: A, TTL: 10 } ]
      HealthCheckCustomConfig: { FailureThreshold: 1 }

  ImageService:
    Type: AWS::ECS::Service
    Condition: HasImageModel
    DependsOn: Associations
    Properties:
      ServiceName: !Sub "af-${AWS::StackName}-image"
      Cluster: !ImportValue { "Fn::Sub": "${PlatformStackName}-ClusterArn" }
      TaskDefinition: !Ref ImageTaskDef
      # DesiredCount deliberately ABSENT — see the llm service. standup.sh scales a NEWLY
      # created service to 0; a later update leaves whatever count the controller set.
      CapacityProviderStrategy:
        - { CapacityProvider: !Ref ImageCapacityProvider, Weight: 1 }
      DeploymentConfiguration: { MinimumHealthyPercent: 0, MaximumPercent: 100 }
      NetworkConfiguration:
        AwsvpcConfiguration:
          AssignPublicIp: DISABLED
          Subnets: !Split [ ",", !ImportValue { "Fn::Sub": "${NetworkStackName}-PrivateSubnets" } ]
          SecurityGroups: [ !Ref EngineSg ]
      ServiceRegistries:
        - RegistryArn: !GetAtt ImageDiscovery.Arn
      PropagateTags: SERVICE
      Tags:
        - { Key: af-pool, Value: !ImportValue { "Fn::Sub": "${PlatformStackName}-ClusterName" } }
        - { Key: af-role, Value: engine-image }

  # --- the engine table the CP reads at startup (ADR 0071 decision 8) -----------
  # ONE parameter name is handed to 30-ingress; the CP reads the table from SSM at startup.
  EnginesParam:
    Type: AWS::SSM::Parameter
    Properties:
      Name: !Ref EnginesSsmParamName
      Type: String
      Description: !Sub "agent-fleet engine table written by ${AWS::StackName} (ADR 0071)"
  # 0, 1 or 2 rows, so: two fragments and a separator that exists only when both do. What each
  # field decides: PARAMETERS-60-engines.md, "The engine table".
      Value: !Sub
        - '{"engines":[${Llm}${Sep}${Image}],"ingest":${Ingest}}'
        - Llm: !If
            - HasLlmModel
            - !Sub
              - >-
                {"key":"llm","api":"chat","service":"${Service}","capacityProvider":"${Cp}",
                "url":"http://${LlmDiscoveryName}.${ServiceConnectNamespace}:8080",
                "health":"/health","warmPath":"/models","provider":"llamacpp","models":["${Models}"],
                "contextTokens":${LlmContextTokens},"maxOutputTokens":${LlmMaxOutputTokens},
                "modelS3Key":"${LlmModelS3Key}",
                "apiKeyParam":"${LlmApiKeySsmParam}","classes":"${LlmInstanceClasses}","idleSec":${LlmIdleSec},
                "startDeadlineSec":${LlmStartDeadlineSec},"mode":"${LlmMode}"}
              - Service: !GetAtt LlmService.Name
                Cp: !Sub "af-${AWS::StackName}-llm"
                Models: !Join [ '","', !Ref LlmModelIds ]
            - ""
          Image: !If
            - HasImageModel
            - !Sub
              - >-
                {"key":"image","api":"images","service":"${Service}","capacityProvider":"${Cp}",
                "url":"http://${ImageDiscoveryName}.${ServiceConnectNamespace}:8080",
                "health":"${Health}","provider":"${Provider}","models":["${Models}"],
                "modelS3Key":"${ImageModelS3Key}",
                "apiKeyParam":"","classes":"${ImageInstanceClasses}","idleSec":${ImageIdleSec},
                "startDeadlineSec":${ImageStartDeadlineSec},"mode":"${ImageMode}"}
              - Service: !GetAtt ImageService.Name
                Cp: !Sub "af-${AWS::StackName}-image"
                # ComfyUI has no OpenAI-compatible /v1/models; /system_stats is what it answers
                # unauthenticated and immediately (ADR 0072, "実測で解けた点" 1 measured it up).
                Health: !If [ ImageIsComfy, "/system_stats", "/v1/models" ]
                Provider: !If [ ImageIsComfy, "comfy", "sdcpp" ]
                Models: !Join [ '","', !Ref ImageModelIds ]
            - ""
          Sep: !If [ HasBothModels, ",", "" ]
          # What the CP needs to start an ingest and read why one failed. Declared, not
          # derived (ADR 0053): the CP cannot ask CloudFormation at request time.
          Ingest: !Sub
            - >-
              {"taskDef":"${Family}","subnets":["${Subnets}"],"securityGroups":["${Sg}"],
              "logGroup":"${Log}","tokenSecret":"${Secret}"}
            - Family: !Ref IngestTaskDef
              Subnets: !Join [ '","', !Split [ ",", !ImportValue { "Fn::Sub": "${NetworkStackName}-PrivateSubnets" } ] ]
              Sg: !Ref EngineSg
              Log: !Ref LogGroup
              Secret: !Ref HfTokenSecret

Outputs:
  # The one value standup.sh feeds to 30-ingress. Non-empty by construction (a parameter
  # with a non-empty default), which is what check-cfn-exports.py insists on.
  EnginesSsmParam:
    Description: AF_ENGINES_SSM_PARAM for the Control Plane (the engine table's SSM name).
    Value: !Ref EnginesSsmParamName
    Export: { Name: !Sub "${AWS::StackName}-EnginesSsmParam" }
  LlmServiceName:
    Description: "The llm ECS service name, or \"-\" while no model is staged (never empty)."
    Value: !If [ HasLlmModel, !GetAtt LlmService.Name, "-" ]
    Export: { Name: !Sub "${AWS::StackName}-LlmServiceName" }
  LlmCapacityProviderName:
    Description: "The llm capacity provider, i.e. what marks a box as NOT a workspace slot."
    Value: !Ref LlmCapacityProvider
    Export: { Name: !Sub "${AWS::StackName}-LlmCapacityProviderName" }
  ImageServiceName:
    Description: "The image ECS service name, or \"-\" while no checkpoint is staged (never empty)."
    Value: !If [ HasImageModel, !GetAtt ImageService.Name, "-" ]
    Export: { Name: !Sub "${AWS::StackName}-ImageServiceName" }
  ImageCapacityProviderName:
    Description: "The image capacity provider (same idea as the llm one)."
    Value: !Ref ImageCapacityProvider
    Export: { Name: !Sub "${AWS::StackName}-ImageCapacityProviderName" }
  ModelsBucket:
    Description: S3 bucket the models are staged in (ingest writes, engines read).
    Value: !Ref ModelsBucket
    Export: { Name: !Sub "${AWS::StackName}-ModelsBucket" }
  IngestTaskDefFamily:
    Description: Task definition family to `aws ecs run-task` to take a model in.
    Value: !Ref IngestTaskDef
    Export: { Name: !Sub "${AWS::StackName}-IngestTaskDefFamily" }
