AWSTemplateFormatVersion: "2010-09-09"
Description: >-
  agent-fleet ECS adapter - the fleet's own inference engines on GPU, normally scaled to zero
  (ADR 0071). Optional, each role on its own - PARAMETERS-60-engines.md, "What this stack is".

# !! Every "why" is in PARAMETERS-60-engines.md. Read it before editing this file.

Parameters:
  # !! BLOCK form only, and prose stays OUT (the wall) - PARAMETERS, "Editing this template".
  NetworkStackName:
    Type: String
    Default: af-ecs-network
    Description: "00-network stack: the VPC, private subnets and the CP SG."
  PlatformStackName:
    Type: String
    Default: af-ecs-platform
    Description: "20-platform stack: cluster, exec role, namespace, engine ECR repositories."
  ServiceConnectNamespace:
    Type: String
    Default: af.internal
    Description: The private DNS namespace NAME, as given to 20-platform.
  EngineToolsImageTag:
    Type: String
    Default: "2026-09-11"
    Description: Tag in the af-engine-tools ECR repository. !! Bound to the script contract.
  EnginesSsmParamName:
    Type: String
    Default: /af-ws/engines
    AllowedPattern: "^/af-ws/[A-Za-z0-9_.\\-/]+$"
    Description: SSM parameter for the engine table. MUST be under /af-ws/.

  # --- llm role (llama.cpp) ---
  LlmEnabled:
    Type: String
    Default: ""
    AllowedValues: [ "", "true", "false" ]
    Description: Create the llm role. Only "true" creates it.
  LlmDiscoveryName:
    Type: String
    Default: llm
    Description: DNS label the llm engine answers on.
  LlmImageTag:
    Type: String
    Default: server-cuda
    Description: Tag in the af-llamacpp ECR repository.
  LlmExtraArgs:
    Type: CommaDelimitedList
    Default: "-ngl,99,--jinja,--no-mmap"
    Description: Extra llama-server flags. !! NEVER -c here.
  LlmModelsMax:
    Type: Number
    Default: 1
    MinValue: 0
    Description: Models the router may hold at once (0 = unlimited).
  LlmInstanceClasses:
    Type: String
    Default: ""
    Description: GPU rungs this role may be switched between. EMPTY = no choice.
  LlmOffers:
    Type: String
    Default: ""
    Description: Purchase offers, tried in the order written. EMPTY = the rungs above, all on demand.
  LlmOfferBudgetSec:
    Type: Number
    Default: 300
    Description: Seconds the box that WAS bought may take to register with ECS.
  LlmApiKeySsmParam:
    Type: String
    Default: /af-ws/engine-llm-key
    Description: SSM SecureString for llama-server --api-key. Empty = no key.
  LlmTaskCpu:
    Type: String
    Default: "4096"
    Description: Task vCPU units; keep it under the instance.
  LlmTaskMemory:
    Type: String
    Default: "14336"
    Description: Task memory (MiB); leave the ECS agent room.
  LlmGpuCount:
    Type: Number
    Default: 1
    Description: GPUs per instance and per task. 0 = CPU (test only).
  LlmStorageGiB:
    Type: Number
    Default: 120
    Description: Root gp3 volume (GiB) of the box. It holds the images AND the models.
  LlmIdleSec:
    Type: Number
    Default: 1800
    Description: How long unwanted before the controller stops it.
  LlmStartDeadlineSec:
    Type: Number
    Default: 900
    Description: Start budget. MUST exceed the real cold start (527-586 s).
  LlmMode:
    Type: String
    Default: ondemand
    AllowedValues: [ off, on, ondemand ]
    Description: Initial mode, written to the table as the DEFAULT only; a stored setting wins.

  # --- image role (sd-server, or ComfyUI) ---
  ImageEnabled:
    Type: String
    Default: ""
    AllowedValues: [ "", "true", "false" ]
    Description: Create the image role, as LlmEnabled does. Only "true".
  ImageDiscoveryName:
    Type: String
    Default: image
    Description: DNS label the image engine answers on.
  ImageEngine:
    Type: String
    Default: sdcpp
    AllowedValues: [ sdcpp, comfy ]
    Description: Which server the image role runs.
  ImageImageTag:
    Type: String
    Default: master-cuda
    Description: Tag in the af-sdcpp ECR repository (sdcpp only). Amd64 only.
  ImageComfyImageTag:
    Type: String
    Default: v0.34.0
    Description: Tag in the af-comfyui ECR repository (comfy only).
  ImageExtraArgs:
    Type: CommaDelimitedList
    Default: "--diffusion-fa"
    Description: Extra sd-server flags (sdcpp only).
  ImageInstanceClasses:
    Type: String
    Default: ""
    Description: The image role's ladder, as LlmInstanceClasses. Empty = no choice.
  ImageOffers:
    Type: String
    Default: ""
    Description: The image role's offers, as LlmOffers. This is the role Spot is offered on.
  ImageOfferBudgetSec:
    Type: Number
    Default: 300
    Description: ECS registration ceiling, as LlmOfferBudgetSec.
  ImageTaskCpu:
    Type: String
    Default: "4096"
    Description: Task vCPU units; keep it under the instance.
  ImageTaskMemory:
    Type: String
    Default: "14336"
    Description: Task memory (MiB); leave the ECS agent room.
  ImageGpuCount:
    Type: Number
    Default: 1
    Description: GPUs per instance and per task. 0 = CPU (test only).
  ImageStorageGiB:
    Type: Number
    Default: 60
    Description: Root gp3 volume (GiB) of the box, as on the llm role.
  ImageIdleSec:
    Type: Number
    Default: 900
    Description: How long unwanted before the controller stops it.
  ImageStartDeadlineSec:
    Type: Number
    Default: 900
    Description: Start budget. sd-server measured 195 s to listen.
  ImageMode:
    Type: String
    Default: ondemand
    AllowedValues: [ off, on, ondemand ]
    Description: Initial mode, written to the table as the DEFAULT only.

  # --- ingest ---
  IngestCpu:
    Type: String
    Default: "2048"
    Description: Fargate vCPU units for the ingest task.
  IngestMemory:
    Type: String
    Default: "4096"
    Description: Fargate memory (MiB) for the ingest task.
  IngestDiskGiB:
    Type: Number
    Default: 80
    Description: Ephemeral storage for the largest model this deployment can take in.
  LogRetentionDays:
    Type: Number
    Default: 14
    Description: CloudWatch retention for the engine and ingest log group.
Conditions:
  # Whether the ROLE exists; what it loads is the catalogue's - PARAMETERS, "The engine table".
  HasLlmModel: !Equals [ !Ref LlmEnabled, "true" ]
  HasGpu: !Not [ !Equals [ !Ref LlmGpuCount, 0 ] ]
  HasLlmApiKey: !Not [ !Equals [ !Ref LlmApiKeySsmParam, "" ] ]
  HasImageModel: !Equals [ !Ref ImageEnabled, "true" ]
  HasImageGpu: !Not [ !Equals [ !Ref ImageGpuCount, 0 ] ]
  HasBothModels: !And [ !Condition HasLlmModel, !Condition HasImageModel ]
  ImageIsComfy: !Equals [ !Ref ImageEngine, "comfy" ]

Resources:
  # --- IAM: three roles, closed inside this stack - PARAMETERS, "The task roles" ---
  # !! The name must match the CP's PassRole (af-*-engine) - PARAMETERS, "The engine boxes".
  EngineInstanceRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub "af-${AWS::StackName}-engine"
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal: { Service: ec2.amazonaws.com }
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AmazonEC2ContainerServiceforEC2Role
        - arn:aws:iam::aws:policy/AmazonSSMManagedInstanceCore

  EngineInstanceProfile:
    Type: AWS::IAM::InstanceProfile
    Properties:
      InstanceProfileName: !Sub "af-${AWS::StackName}-engine"
      Roles: [ !Ref EngineInstanceRole ]

  EngineTaskRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub "af-${AWS::StackName}-engine-task"
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal: { Service: ecs-tasks.amazonaws.com }
            Action: sts:AssumeRole
      Policies:
        - PolicyName: models-read
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action: [ s3:GetObject ]
                Resource: !Sub "${ModelsBucket.Arn}/*"
              - Effect: Allow
                Action: [ s3:ListBucket ]
                Resource: !GetAtt ModelsBucket.Arn
              - Effect: Allow
                Action: [ ssm:GetParameter ]
                Resource: !Sub "arn:aws:ssm:${AWS::Region}:${AWS::AccountId}:parameter${EnginesSsmParamName}/*"
              # !! The sidecar publishes what it has NOT synced yet, so the gateway can answer
              # !! `engine_waking` instead of the engine's own 400 - PARAMETERS, "The fetch sidecar".
              # !! The same path it already reads, which keeps this stack's IAM closed inside it.
              - Effect: Allow
                Action: [ ssm:PutParameter ]
                Resource: !Sub "arn:aws:ssm:${AWS::Region}:${AWS::AccountId}:parameter${EnginesSsmParamName}/*"

  IngestTaskRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub "af-${AWS::StackName}-ingest-task"
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal: { Service: ecs-tasks.amazonaws.com }
            Action: sts:AssumeRole
      Policies:
        - PolicyName: models-write
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action: [ s3:PutObject, s3:AbortMultipartUpload, s3:GetObject ]
                Resource: !Sub "${ModelsBucket.Arn}/*"
              - Effect: Allow
                Action: [ s3:ListBucket ]
                Resource: !GetAtt ModelsBucket.Arn
              - Effect: Allow
                Action: [ s3:DeleteObject ]
                Resource: !Sub "${ModelsBucket.Arn}/*"

  # !! The CP's only new IAM, all pinned to this stack - PARAMETERS, "The ingest permissions".
  CpIngestPolicy:
    Type: AWS::IAM::Policy
    Properties:
      PolicyName: !Sub "af-${AWS::StackName}-cp-ingest"
      Roles:
        - !Select [ 1, !Split [ "/", !ImportValue { "Fn::Sub": "${PlatformStackName}-CpTaskRoleArn" } ] ]
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Action: [ ecs:RunTask ]
            Resource: !Sub "arn:aws:ecs:${AWS::Region}:${AWS::AccountId}:task-definition/af-${AWS::StackName}-ingest:*"
            Condition:
              ArnEquals: { "ecs:cluster": !ImportValue { "Fn::Sub": "${PlatformStackName}-ClusterArn" } }
          - Effect: Allow
            Action: [ iam:PassRole ]
            Resource: !GetAtt IngestTaskRole.Arn
            Condition: { StringEquals: { "iam:PassedToService": ecs-tasks.amazonaws.com } }
          - Effect: Allow
            Action: [ logs:GetLogEvents, logs:DescribeLogStreams ]
            Resource: !Sub "arn:aws:logs:${AWS::Region}:${AWS::AccountId}:log-group:/af/${AWS::StackName}/engines:*"
          - Effect: Allow
            Action: [ secretsmanager:PutSecretValue ]
            Resource: !Ref HfTokenSecret
          # !! The CP buys the box itself (ADR 0077 decision 10) - PARAMETERS, "The engine boxes".
          # A fleet has no ARN to scope to; the fence is the launch template it may pass.
          - Effect: Allow
            Action: [ ec2:CreateFleet, ec2:DescribeFleets, ec2:DeleteFleets ]
            Resource: "*"
          # !! Without this CreateFleet fails top-level with SsmAccessDenied, naming neither the
          # action nor the parameter (measured, ADR 0077 P0). The launch template's ImageId is
          # resolved by the CALLER. The public parameter has no account id in its ARN.
          - Effect: Allow
            Action: [ ssm:GetParameters ]
            Resource: !Sub "arn:aws:ssm:${AWS::Region}::parameter/aws/service/ecs/optimized-ami/*"
          - Effect: Allow
            Action: [ iam:PassRole ]
            Resource: !GetAtt EngineInstanceRole.Arn
            Condition: { StringEquals: { "iam:PassedToService": ec2.amazonaws.com } }
          # !! AWSServiceRoleForEC2Fleet: AWS asks for it, and three CreateFleet calls went
          # through without it (measured, ADR 0077 P0 - none of them launched). standup.sh
          # creates it anyway; this is the CP's own way out on a deployment stood up otherwise.
          - Effect: Allow
            Action: [ iam:CreateServiceLinkedRole ]
            Resource: "*"
            Condition:
              StringEquals:
                "iam:AWSServiceName": [ spot.amazonaws.com, ec2fleet.amazonaws.com ]

  # !! Always created, holding a sentinel - PARAMETERS, "The Hugging Face token".
  HfTokenSecret:
    Type: AWS::SecretsManager::Secret
    Properties:
      Description: !Sub "HF_TOKEN for af-${AWS::StackName} ingest, written by the Control Plane"
      SecretString: "-"

  # !! Secrets resolve with the EXECUTION role - PARAMETERS, "The Hugging Face token".
  ExecHfTokenPolicy:
    Type: AWS::IAM::Policy
    Properties:
      PolicyName: !Sub "af-${AWS::StackName}-exec-hf"
      Roles:
        - !Select [ 1, !Split [ "/", !ImportValue { "Fn::Sub": "${PlatformStackName}-ExecRoleArn" } ] ]
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Action: [ secretsmanager:GetSecretValue ]
            Resource: !Ref HfTokenSecret

  # --- the model catalogue - PARAMETERS, "The models bucket" ---
  ModelsBucket:
    Type: AWS::S3::Bucket
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      BucketName: !Sub "af-${AWS::StackName}-models-${AWS::AccountId}"
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault: { SSEAlgorithm: AES256 }
      LifecycleConfiguration:
        Rules:
          - Id: abort-incomplete-uploads
            Status: Enabled
            AbortIncompleteMultipartUpload: { DaysAfterInitiation: 3 }
      # !! A cost allocation key is never retroactive - PARAMETERS, "Cost allocation".
      Tags:
        - { Key: af-role, Value: engine-models }
        - { Key: af-pool, Value: !ImportValue { "Fn::Sub": "${PlatformStackName}-ClusterName" } }

  LogGroup:
    Type: AWS::Logs::LogGroup
    DeletionPolicy: Delete
    Properties:
      LogGroupName: !Sub "/af/${AWS::StackName}/engines"
      RetentionInDays: !Ref LogRetentionDays
      Tags:
        - { Key: af-role, Value: engine-logs }
        - { Key: af-pool, Value: !ImportValue { "Fn::Sub": "${PlatformStackName}-ClusterName" } }

  # !! Reachability IS the access control - PARAMETERS, "The engine security group".
  EngineSg:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: !Sub "af-${AWS::StackName} inference engines (CP to engine, 8080)"
      VpcId: !ImportValue { "Fn::Sub": "${NetworkStackName}-VpcId" }
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 8080
          ToPort: 8080
          SourceSecurityGroupId: !ImportValue { "Fn::Sub": "${NetworkStackName}-CpSgId" }
          Description: engine port from the Control Plane only
      Tags: [ { Key: Name, Value: !Sub "af-${AWS::StackName}-engine-sg" } ]

  # --- the boxes the Control Plane buys - PARAMETERS, "The engine boxes" ---
  #
  # !! ImageId is EC2's `resolve:ssm:`, NOT CloudFormation's `{{resolve:ssm:...}}` and not an
  # AMI id: the string travels to EC2 untouched and is resolved at LAUNCH, which is how a box
  # gets the current GPU AMI without a stack update (ADR 0077 decision 7). Instant fleets are
  # the only launch path that supports it.
  # !! ECS_INSTANCE_ATTRIBUTES is what the service's placement constraint binds to, and what
  # keeps this box out of the slot pool (ADR 0077 decision 3). One template per role.
  LlmLaunchTemplate:
    Type: AWS::EC2::LaunchTemplate
    Properties:
      LaunchTemplateName: !Sub "af-${AWS::StackName}-engine-llm"
      LaunchTemplateData:
        ImageId: resolve:ssm:/aws/service/ecs/optimized-ami/amazon-linux-2023/gpu/recommended/image_id
        IamInstanceProfile: { Arn: !GetAtt EngineInstanceProfile.Arn }
        SecurityGroupIds: [ !Ref EngineSg ]
        MetadataOptions: { HttpTokens: required, HttpPutResponseHopLimit: 2 }
        BlockDeviceMappings:
          - DeviceName: /dev/xvda
            Ebs:
              VolumeSize: !Ref LlmStorageGiB
              VolumeType: gp3
              Encrypted: true
              DeleteOnTermination: true
        # The CP writes af-pool / af-role / af-engine-offer / af-engine-buy at CreateFleet, as
        # the slot pool does at RunInstances - PARAMETERS, "The engine boxes".
        TagSpecifications:
          - ResourceType: instance
            Tags: [ { Key: af-managed-by, Value: agent-fleet } ]
        UserData:
          Fn::Base64: !Sub
            - |
              #!/bin/bash
              exec > /var/log/af-userdata.log 2>&1
              set -x
              # The instance store, when the type has one. Docker's data-root goes on it, and
              # the models go with it: an ECS `host` volume with no sourcePath is handed to
              # Docker as an ANONYMOUS volume, which lives under <data-root>/volumes - so the
              # fetch sidecar writes to NVMe without the task definition knowing. Measured on
              # the Managed Instances equivalent (2026-09-09): S3 -> disk 1.4x, disk -> VRAM
              # 2.9x, RunTask -> model loaded 527-586 s -> 275 s.
              # !! An EBS-only type (g6e) matches nothing here and keeps the root volume; the
              # && chain leaves Docker where it was if any step fails, and starts it either way.
              # !! Order: this runs from cloud-init, and ecs.service is After=cloud-final, so
              # the agent has not started yet - the same reason writing ecs.config here works.
              # !! ecs.service is PartOf=docker.service, so stopping docker CANCELS the start job
              # systemd has queued for it and starting docker does not queue it again: the agent
              # then sits `inactive (dead)` with an empty journal and the box never registers.
              # Measured on af-sandbox 2026-09-12 (ADR 0077 P1): three boxes in a row were
              # terminated at the registration ceiling, and `systemctl start ecs` by hand
              # registered one in 3 seconds. So the start below is explicit, and last - after
              # ecs.config is written, because the agent reads it at start.
              # !! --no-block is not decoration either: ecs.service is After=cloud-final.service
              # and this script IS cloud-final, so a blocking start waits for a job that waits
              # for this script. Measured the same day: `systemctl list-jobs` showed
              # `ecs.service start waiting` behind `cloud-final.service start running` and the
              # box hung there until the registration ceiling terminated it.
              DEV=$(lsblk -dno NAME,MODEL | awk '/Instance Storage/ {print "/dev/"$1; exit}')
              if [ -n "$DEV" ]; then
                systemctl stop docker docker.socket
                mkfs.xfs -f "$DEV" && mkdir -p /mnt/af-store /var/lib/docker \
                  && mount "$DEV" /mnt/af-store \
                  && cp -a /var/lib/docker/. /mnt/af-store/ \
                  && umount /mnt/af-store && mount "$DEV" /var/lib/docker
                systemctl start docker
              fi
              cat >> /etc/ecs/ecs.config <<EOF
              ECS_CLUSTER=${Cluster}
              ECS_INSTANCE_ATTRIBUTES={"af-role":"engine-llm"}
              ECS_ENABLE_SPOT_INSTANCE_DRAINING=true
              ECS_ENGINE_TASK_CLEANUP_WAIT_DURATION=5m
              ECS_ENGINE_TASK_CLEANUP_WAIT_DURATION_JITTER=1m
              ECS_IMAGE_CLEANUP_INTERVAL=30m
              ECS_IMAGE_MINIMUM_CLEANUP_AGE=24h
              EOF
              systemctl start --no-block ecs
            - Cluster: !ImportValue { "Fn::Sub": "${PlatformStackName}-ClusterName" }

  ImageLaunchTemplate:
    Type: AWS::EC2::LaunchTemplate
    Properties:
      LaunchTemplateName: !Sub "af-${AWS::StackName}-engine-image"
      LaunchTemplateData:
        ImageId: resolve:ssm:/aws/service/ecs/optimized-ami/amazon-linux-2023/gpu/recommended/image_id
        IamInstanceProfile: { Arn: !GetAtt EngineInstanceProfile.Arn }
        SecurityGroupIds: [ !Ref EngineSg ]
        MetadataOptions: { HttpTokens: required, HttpPutResponseHopLimit: 2 }
        BlockDeviceMappings:
          - DeviceName: /dev/xvda
            Ebs:
              VolumeSize: !Ref ImageStorageGiB
              VolumeType: gp3
              Encrypted: true
              DeleteOnTermination: true
        TagSpecifications:
          - ResourceType: instance
            Tags: [ { Key: af-managed-by, Value: agent-fleet } ]
        UserData:
          Fn::Base64: !Sub
            - |
              #!/bin/bash
              exec > /var/log/af-userdata.log 2>&1
              set -x
              # The instance store, when the type has one. Docker's data-root goes on it, and
              # the models go with it: an ECS `host` volume with no sourcePath is handed to
              # Docker as an ANONYMOUS volume, which lives under <data-root>/volumes - so the
              # fetch sidecar writes to NVMe without the task definition knowing. Measured on
              # the Managed Instances equivalent (2026-09-09): S3 -> disk 1.4x, disk -> VRAM
              # 2.9x, RunTask -> model loaded 527-586 s -> 275 s.
              # !! An EBS-only type (g6e) matches nothing here and keeps the root volume; the
              # && chain leaves Docker where it was if any step fails, and starts it either way.
              # !! Order: this runs from cloud-init, and ecs.service is After=cloud-final, so
              # the agent has not started yet - the same reason writing ecs.config here works.
              # !! ecs.service is PartOf=docker.service, so stopping docker CANCELS the start job
              # systemd has queued for it and starting docker does not queue it again: the agent
              # then sits `inactive (dead)` with an empty journal and the box never registers.
              # Measured on af-sandbox 2026-09-12 (ADR 0077 P1): three boxes in a row were
              # terminated at the registration ceiling, and `systemctl start ecs` by hand
              # registered one in 3 seconds. So the start below is explicit, and last - after
              # ecs.config is written, because the agent reads it at start.
              # !! --no-block is not decoration either: ecs.service is After=cloud-final.service
              # and this script IS cloud-final, so a blocking start waits for a job that waits
              # for this script. Measured the same day: `systemctl list-jobs` showed
              # `ecs.service start waiting` behind `cloud-final.service start running` and the
              # box hung there until the registration ceiling terminated it.
              DEV=$(lsblk -dno NAME,MODEL | awk '/Instance Storage/ {print "/dev/"$1; exit}')
              if [ -n "$DEV" ]; then
                systemctl stop docker docker.socket
                mkfs.xfs -f "$DEV" && mkdir -p /mnt/af-store /var/lib/docker \
                  && mount "$DEV" /mnt/af-store \
                  && cp -a /var/lib/docker/. /mnt/af-store/ \
                  && umount /mnt/af-store && mount "$DEV" /var/lib/docker
                systemctl start docker
              fi
              cat >> /etc/ecs/ecs.config <<EOF
              ECS_CLUSTER=${Cluster}
              ECS_INSTANCE_ATTRIBUTES={"af-role":"engine-image"}
              ECS_ENABLE_SPOT_INSTANCE_DRAINING=true
              ECS_ENGINE_TASK_CLEANUP_WAIT_DURATION=5m
              ECS_ENGINE_TASK_CLEANUP_WAIT_DURATION_JITTER=1m
              ECS_IMAGE_CLEANUP_INTERVAL=30m
              ECS_IMAGE_MINIMUM_CLEANUP_AGE=24h
              EOF
              systemctl start --no-block ecs
            - Cluster: !ImportValue { "Fn::Sub": "${PlatformStackName}-ClusterName" }

  # !! REPLACES the cluster's list, and the empty default strategy is load-bearing. The engines
  # have no provider of their own any more (ADR 0077), but this resource STAYS: the list is
  # this stack's to own, and 50-tts reaches FARGATE_SPOT through it.
  Associations:
    Type: AWS::ECS::ClusterCapacityProviderAssociations
    Properties:
      Cluster: !ImportValue { "Fn::Sub": "${PlatformStackName}-ClusterName" }
      CapacityProviders: [ FARGATE, FARGATE_SPOT ]
      DefaultCapacityProviderStrategy: []

  # --- ingest: HF -> S3, out of the start path - PARAMETERS, "Ingest" ---
  IngestTaskDef:
    Type: AWS::ECS::TaskDefinition
    Properties:
      Family: !Sub "af-${AWS::StackName}-ingest"
      RequiresCompatibilities: [ FARGATE ]
      NetworkMode: awsvpc
      Cpu: !Ref IngestCpu
      Memory: !Ref IngestMemory
      EphemeralStorage: { SizeInGiB: !Ref IngestDiskGiB }
      ExecutionRoleArn: !ImportValue { "Fn::Sub": "${PlatformStackName}-ExecRoleArn" }
      TaskRoleArn: !GetAtt IngestTaskRole.Arn
      Volumes: [ { Name: scratch } ]
      ContainerDefinitions:
        - Name: fetch
          Essential: false
          # One image for all three scripts, and a pinned one: this was curlimages/curl:latest
          # beside an aws-cli:latest, which is two third-party `latest` tags in a start path.
          Image: !Sub
            - "${Uri}:${Tag}"
            - Uri: !ImportValue { "Fn::Sub": "${PlatformStackName}-EcrEngineToolsUri" }
              Tag: !Ref EngineToolsImageTag
          User: "0"
          Command: [ /opt/af/ingest-fetch.sh ]
          Environment:
            - { Name: ENGINE_TOOLS_CONTRACT, Value: "1" }
            - { Name: URL, Value: "" }
            - { Name: SHA256, Value: "" }
            - { Name: MODE, Value: "" }
          Secrets: [ { Name: HF_TOKEN, ValueFrom: !Ref HfTokenSecret } ]
          MountPoints: [ { SourceVolume: scratch, ContainerPath: /scratch } ]
          LogConfiguration:
            LogDriver: awslogs
            Options:
              awslogs-group: !Ref LogGroup
              awslogs-region: !Ref "AWS::Region"
              awslogs-stream-prefix: ingest-fetch
        - Name: upload
          Essential: true
          Image: !Sub
            - "${Uri}:${Tag}"
            - Uri: !ImportValue { "Fn::Sub": "${PlatformStackName}-EcrEngineToolsUri" }
              Tag: !Ref EngineToolsImageTag
          Command: [ /opt/af/ingest-upload.sh ]
          # BUCKET was a CloudFormation substitution while the script was inline; it is an
          # environment variable now, and the only interface change the move made.
          Environment:
            - { Name: ENGINE_TOOLS_CONTRACT, Value: "1" }
            - { Name: BUCKET, Value: !Ref ModelsBucket }
            - { Name: KEY, Value: "" }
            - { Name: MODE, Value: "" }
          MountPoints: [ { SourceVolume: scratch, ContainerPath: /scratch } ]
          DependsOn: [ { ContainerName: fetch, Condition: SUCCESS } ]
          LogConfiguration:
            LogDriver: awslogs
            Options:
              awslogs-group: !Ref LogGroup
              awslogs-region: !Ref "AWS::Region"
              awslogs-stream-prefix: ingest-upload

  # --- the llm engine ---
  LlmTaskDef:
    Type: AWS::ECS::TaskDefinition
    Condition: HasLlmModel
    Properties:
      Family: !Sub "af-${AWS::StackName}-llm"
      RequiresCompatibilities: [ EC2 ]
      NetworkMode: awsvpc
      Cpu: !Ref LlmTaskCpu
      Memory: !Ref LlmTaskMemory
      ExecutionRoleArn: !ImportValue { "Fn::Sub": "${PlatformStackName}-ExecRoleArn" }
      TaskRoleArn: !GetAtt EngineTaskRole.Arn
      Volumes:
        # !! ANONYMOUS on purpose - PARAMETERS, "The model volume".
        - Name: models
          Host: {}
      ContainerDefinitions:
        - Name: fetch
          Essential: false
          # !! The script is BAKED, and the contract below is what refuses an image that speaks
          # a different one - PARAMETERS, "The engine tools image".
          Image: !Sub
            - "${Uri}:${Tag}"
            - Uri: !ImportValue { "Fn::Sub": "${PlatformStackName}-EcrEngineToolsUri" }
              Tag: !Ref EngineToolsImageTag
          Command: [ /opt/af/fetch-models.sh ]
          Environment:
            - { Name: ENGINE_TOOLS_CONTRACT, Value: "1" }
            - { Name: MODELS_DIR, Value: /models }
            - { Name: BUCKET, Value: !Ref ModelsBucket }
            - { Name: ACTIVE_PARAM, Value: !Sub "${EnginesSsmParamName}/llm/active" }
            - { Name: PENDING_PARAM, Value: !Sub "${EnginesSsmParamName}/llm/pending" }
            - { Name: WATCH_SEC, Value: "60" }
            - { Name: PRESET_FILE, Value: /models/llm/presets.ini }
            - { Name: ALIAS_FLAG, Value: "" }
            - { Name: CTX_FLAG, Value: "" }
          MountPoints: [ { SourceVolume: models, ContainerPath: /models } ]
          LogConfiguration:
            LogDriver: awslogs
            Options:
              awslogs-group: !Ref LogGroup
              awslogs-region: !Ref "AWS::Region"
              awslogs-stream-prefix: llm-fetch
        - Name: llama
          Essential: true
          # !! The image must already be in ECR - PARAMETERS, "The engine services".
          Image: !Sub
            - "${Uri}:${Tag}"
            - Uri: !ImportValue { "Fn::Sub": "${PlatformStackName}-EcrLlamacppUri" }
              Tag: !Ref LlmImageTag
          PortMappings: [ { ContainerPort: 8080 } ]
          # !! The idle wrapper STAYS inline, and cannot move with the rest - PARAMETERS,
          # "The engine tools image". It runs in the ENGINE's image, which is a third-party
          # copy this repository does not build.
          EntryPoint: [ "sh", "-c" ]
          Command:
            - !Sub
              - >-
                n=0; while [ ! -f /models/ready ] && [ $n -lt 3600 ]; do n=$((n+1)); sleep 1; done;
                if [ -s /models/cmdline ]; then exec /app/llama-server --host 0.0.0.0 --port 8080
                --models-max ${LlmModelsMax} ${Extra} $(cat /models/cmdline);
                else echo "llm: no model in the catalogue - idling"; sleep infinity; fi
              - Extra: !Join [ " ", !Ref LlmExtraArgs ]
          ResourceRequirements: !If [ HasGpu, [ { Type: GPU, Value: !Ref LlmGpuCount } ], !Ref "AWS::NoValue" ]
          MountPoints: [ { SourceVolume: models, ContainerPath: /models } ]
          DependsOn: [ { ContainerName: fetch, Condition: START } ]
          Environment:
            - { Name: LLAMA_CACHE, Value: /tmp/llama-cache }
          Secrets: !If
            - HasLlmApiKey
            - - Name: LLAMA_API_KEY
                ValueFrom: !Sub "arn:aws:ssm:${AWS::Region}:${AWS::AccountId}:parameter${LlmApiKeySsmParam}"
            - !Ref "AWS::NoValue"
          LogConfiguration:
            LogDriver: awslogs
            Options:
              awslogs-group: !Ref LogGroup
              awslogs-region: !Ref "AWS::Region"
              awslogs-stream-prefix: llm

  # Cloud Map DNS, not Service Connect - PARAMETERS, "The engine table".
  LlmDiscovery:
    Type: AWS::ServiceDiscovery::Service
    Condition: HasLlmModel
    Properties:
      Name: !Ref LlmDiscoveryName
      NamespaceId: !ImportValue { "Fn::Sub": "${PlatformStackName}-NamespaceId" }
      DnsConfig:
        DnsRecords: [ { Type: A, TTL: 10 } ]
      HealthCheckCustomConfig: { FailureThreshold: 1 }

  LlmService:
    Type: AWS::ECS::Service
    Condition: HasLlmModel
    DependsOn: Associations
    Properties:
      ServiceName: !Sub "af-${AWS::StackName}-llm"
      Cluster: !ImportValue { "Fn::Sub": "${PlatformStackName}-ClusterArn" }
      TaskDefinition: !Ref LlmTaskDef
      # !! No DesiredCount, load-bearing - PARAMETERS, "The engine services". The launch type IS
      # spelled out (ADR 0070 decision 1): the CP buys the box, ECS only runs the task on it.
      LaunchType: EC2
      # !! The role's boxes and nothing else - PARAMETERS, "The engine boxes". On the SERVICE,
      # not the task definition: an engine changes boxes and must not cut a revision each time.
      PlacementConstraints:
        - { Type: memberOf, Expression: "attribute:af-role == engine-llm" }
      DeploymentConfiguration: { MinimumHealthyPercent: 0, MaximumPercent: 100 }
      NetworkConfiguration:
        AwsvpcConfiguration:
          AssignPublicIp: DISABLED
          Subnets: !Split [ ",", !ImportValue { "Fn::Sub": "${NetworkStackName}-PrivateSubnets" } ]
          SecurityGroups: [ !Ref EngineSg ]
      ServiceRegistries:
        - RegistryArn: !GetAtt LlmDiscovery.Arn
      PropagateTags: SERVICE
      Tags:
        - { Key: af-pool, Value: !ImportValue { "Fn::Sub": "${PlatformStackName}-ClusterName" } }
        - { Key: af-role, Value: engine-llm }

  # --- the image engine ---
  ImageTaskDef:
    Type: AWS::ECS::TaskDefinition
    Condition: HasImageModel
    Properties:
      Family: !Sub "af-${AWS::StackName}-image"
      RequiresCompatibilities: [ EC2 ]
      NetworkMode: awsvpc
      Cpu: !Ref ImageTaskCpu
      Memory: !Ref ImageTaskMemory
      ExecutionRoleArn: !ImportValue { "Fn::Sub": "${PlatformStackName}-ExecRoleArn" }
      TaskRoleArn: !GetAtt EngineTaskRole.Arn
      Volumes:
        - Name: models
          Host: {}
      ContainerDefinitions:
        - Name: fetch
          Essential: false
          # !! The script is BAKED, and the contract below is what refuses an image that speaks
          # a different one - PARAMETERS, "The engine tools image".
          Image: !Sub
            - "${Uri}:${Tag}"
            - Uri: !ImportValue { "Fn::Sub": "${PlatformStackName}-EcrEngineToolsUri" }
              Tag: !Ref EngineToolsImageTag
          Command: [ /opt/af/fetch-models.sh ]
          Environment:
            - { Name: ENGINE_TOOLS_CONTRACT, Value: "1" }
            - { Name: MODELS_DIR, Value: /models }
            - { Name: BUCKET, Value: !Ref ModelsBucket }
            - { Name: ACTIVE_PARAM, Value: !Sub "${EnginesSsmParamName}/image/active" }
            - { Name: PENDING_PARAM, Value: !Sub "${EnginesSsmParamName}/image/pending" }
            - { Name: WATCH_SEC, Value: "60" }
            - { Name: SYNC_ALL, Value: !If [ ImageIsComfy, "1", "" ] }
            - { Name: PRESET_FILE, Value: "" }
            - { Name: ALIAS_FLAG, Value: "" }
            - { Name: CTX_FLAG, Value: "" }
          MountPoints: [ { SourceVolume: models, ContainerPath: /models } ]
          LogConfiguration:
            LogDriver: awslogs
            Options:
              awslogs-group: !Ref LogGroup
              awslogs-region: !Ref "AWS::Region"
              awslogs-stream-prefix: image-fetch
        # !! ImageEngine picks the image AND the command - PARAMETERS, "The idle wrapper".
        - Name: engine
          Essential: true
          Image: !If
            - ImageIsComfy
            - !Sub
              - "${Uri}:${Tag}"
              - Uri: !ImportValue { "Fn::Sub": "${PlatformStackName}-EcrComfyuiUri" }
                Tag: !Ref ImageComfyImageTag
            - !Sub
              - "${Uri}:${Tag}"
              - Uri: !ImportValue { "Fn::Sub": "${PlatformStackName}-EcrSdcppUri" }
                Tag: !Ref ImageImageTag
          EntryPoint: [ "sh", "-c" ]
          Command:
            - !If
              - ImageIsComfy
              # !! Two traps in this one line - PARAMETERS, "The idle wrapper".
              - >-
                n=0; while [ ! -f /models/ready ] && [ $n -lt 3600 ]; do n=$((n+1)); sleep 1; done;
                if [ -s /models/cmdline ]; then rm -rf /ComfyUI/models; ln -sfn /models/image /ComfyUI/models;
                exec python3 /ComfyUI/main.py --listen 0.0.0.0 --port 8080 --disable-auto-launch
                --verbose DETAIL;
                else echo "image: no checkpoint in the catalogue - idling"; sleep infinity; fi
              - !Sub
                - >-
                  mkdir -p /models/image/loras;
                  n=0; while [ ! -f /models/ready ] && [ $n -lt 3600 ]; do n=$((n+1)); sleep 1; done;
                  if [ -s /models/cmdline ]; then exec /sd-server --listen-ip 0.0.0.0
                  --listen-port 8080 --lora-model-dir /models/image/loras
                  ${Extra} $(cat /models/cmdline);
                  else echo "image: no checkpoint in the catalogue - idling"; sleep infinity; fi
                - Extra: !Join [ " ", !Ref ImageExtraArgs ]
          ResourceRequirements: !If [ HasImageGpu, [ { Type: GPU, Value: !Ref ImageGpuCount } ], !Ref "AWS::NoValue" ]
          MountPoints: [ { SourceVolume: models, ContainerPath: /models } ]
          DependsOn: [ { ContainerName: fetch, Condition: START } ]
          LogConfiguration:
            LogDriver: awslogs
            Options:
              awslogs-group: !Ref LogGroup
              awslogs-region: !Ref "AWS::Region"
              awslogs-stream-prefix: image

  ImageDiscovery:
    Type: AWS::ServiceDiscovery::Service
    Condition: HasImageModel
    Properties:
      Name: !Ref ImageDiscoveryName
      NamespaceId: !ImportValue { "Fn::Sub": "${PlatformStackName}-NamespaceId" }
      DnsConfig:
        DnsRecords: [ { Type: A, TTL: 10 } ]
      HealthCheckCustomConfig: { FailureThreshold: 1 }

  ImageService:
    Type: AWS::ECS::Service
    Condition: HasImageModel
    DependsOn: Associations
    Properties:
      ServiceName: !Sub "af-${AWS::StackName}-image"
      Cluster: !ImportValue { "Fn::Sub": "${PlatformStackName}-ClusterArn" }
      TaskDefinition: !Ref ImageTaskDef
      # !! On demand or Spot is the CP's choice at CreateFleet now, so there is no strategy here
      # for a release to put back (ADR 0077 decision 2, overriding ADR 0075 decision 12).
      LaunchType: EC2
      PlacementConstraints:
        - { Type: memberOf, Expression: "attribute:af-role == engine-image" }
      DeploymentConfiguration: { MinimumHealthyPercent: 0, MaximumPercent: 100 }
      NetworkConfiguration:
        AwsvpcConfiguration:
          AssignPublicIp: DISABLED
          Subnets: !Split [ ",", !ImportValue { "Fn::Sub": "${NetworkStackName}-PrivateSubnets" } ]
          SecurityGroups: [ !Ref EngineSg ]
      ServiceRegistries:
        - RegistryArn: !GetAtt ImageDiscovery.Arn
      PropagateTags: SERVICE
      Tags:
        - { Key: af-pool, Value: !ImportValue { "Fn::Sub": "${PlatformStackName}-ClusterName" } }
        - { Key: af-role, Value: engine-image }

  # --- the engine table - PARAMETERS, "The engine table" ---
  EnginesParam:
    Type: AWS::SSM::Parameter
    Properties:
      Name: !Ref EnginesSsmParamName
      Type: String
      Description: !Sub "agent-fleet engine table written by ${AWS::StackName} (ADR 0071)"
      Value: !Sub
        - '{"engines":[${Llm}${Sep}${Image}],"ingest":${Ingest}}'
        - Llm: !If
            - HasLlmModel
            - !Sub
              - >-
                {"key":"llm","api":"chat","service":"${Service}","launchTemplate":"${Lt}",
                "url":"http://${LlmDiscoveryName}.${ServiceConnectNamespace}:8080",
                "health":"/health","warmPath":"/models","provider":"llamacpp",
                "apiKeyParam":"${LlmApiKeySsmParam}","classes":"${LlmInstanceClasses}","idleSec":${LlmIdleSec},
                "offers":"${LlmOffers}","offerBudgetSec":${LlmOfferBudgetSec},
                "startDeadlineSec":${LlmStartDeadlineSec},"mode":"${LlmMode}"}
              - Service: !GetAtt LlmService.Name
                Lt: !Ref LlmLaunchTemplate
            - ""
          Image: !If
            - HasImageModel
            - !Sub
              - >-
                {"key":"image","api":"images","service":"${Service}","launchTemplate":"${Lt}",
                "url":"http://${ImageDiscoveryName}.${ServiceConnectNamespace}:8080",
                "health":"${Health}","provider":"${Provider}",
                "apiKeyParam":"","classes":"${ImageInstanceClasses}","idleSec":${ImageIdleSec},
                "offers":"${ImageOffers}","offerBudgetSec":${ImageOfferBudgetSec},
                "startDeadlineSec":${ImageStartDeadlineSec},"mode":"${ImageMode}"}
              - Service: !GetAtt ImageService.Name
                # !Ref on a launch template is its ID (lt-...), which is what CreateFleet takes.
                # Written this way and not restated as a !Sub: a table naming a template that
                # does not exist fails at the first purchase, and only there.
                Lt: !Ref ImageLaunchTemplate
                Health: !If [ ImageIsComfy, "/system_stats", "/v1/models" ]
                Provider: !If [ ImageIsComfy, "comfy", "sdcpp" ]
            - ""
          Sep: !If [ HasBothModels, ",", "" ]
          Ingest: !Sub
            - >-
              {"taskDef":"${Family}","subnets":["${Subnets}"],"securityGroups":["${Sg}"],
              "logGroup":"${Log}","tokenSecret":"${Secret}"}
            - Family: !Ref IngestTaskDef
              Subnets: !Join [ '","', !Split [ ",", !ImportValue { "Fn::Sub": "${NetworkStackName}-PrivateSubnets" } ] ]
              Sg: !Ref EngineSg
              Log: !Ref LogGroup
              Secret: !Ref HfTokenSecret

Outputs:
  EnginesSsmParam:
    Description: AF_ENGINES_SSM_PARAM for the Control Plane.
    Value: !Ref EnginesSsmParamName
    Export: { Name: !Sub "${AWS::StackName}-EnginesSsmParam" }
  LlmServiceName:
    Description: The llm ECS service name, or - when the role is off (never empty).
    Value: !If [ HasLlmModel, !GetAtt LlmService.Name, "-" ]
    Export: { Name: !Sub "${AWS::StackName}-LlmServiceName" }
  LlmLaunchTemplateId:
    Description: The llm role's launch template; the CP buys its box from this.
    Value: !Ref LlmLaunchTemplate
    Export: { Name: !Sub "${AWS::StackName}-LlmLaunchTemplateId" }
  ImageServiceName:
    Description: The image ECS service name, or - when the role is off (never empty).
    Value: !If [ HasImageModel, !GetAtt ImageService.Name, "-" ]
    Export: { Name: !Sub "${AWS::StackName}-ImageServiceName" }
  ImageLaunchTemplateId:
    Description: The image role's launch template, as the llm one.
    Value: !Ref ImageLaunchTemplate
    Export: { Name: !Sub "${AWS::StackName}-ImageLaunchTemplateId" }
  ModelsBucket:
    Description: S3 bucket the models are staged in.
    Value: !Ref ModelsBucket
    Export: { Name: !Sub "${AWS::StackName}-ModelsBucket" }
  IngestTaskDefFamily:
    Description: Task definition family for the ingest task.
    Value: !Ref IngestTaskDef
    Export: { Name: !Sub "${AWS::StackName}-IngestTaskDefFamily" }
