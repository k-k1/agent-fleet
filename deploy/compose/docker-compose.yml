# agent-fleet — on-prem compose (P3-10 stage 2: CP + Caddy auto-TLS).
# backup/restore comes in stage 3; config consolidation + runbook in stage 4.
#
#   cp deploy/compose/.env.example deploy/compose/.env   # then fill it in
#   docker compose -f deploy/compose/docker-compose.yml up -d --build
#
# The three DooD constraints (docs/log/p3-10-packaging.md §20.3), encoded here:
#   (A) network_mode: host   — the 127.0.0.1:<port> publishes the CP issues are
#       executed by the host daemon, so the CP must share the host loopback to
#       reach the agents.
#   (B) ${DATA_DIR}:${DATA_DIR} same-path bind — the -v specs the CP hands to the
#       host daemon resolve as host paths, so DATA_DIR must be visible at the same
#       absolute path inside the CP.
#   (C) user: "1000:1000" + group_add ${DOCKER_GID} — homes are created owned by
#       uid 1000(dev); docker.sock access comes from adding the host docker gid.
services:
  cp:
    image: ${REGISTRY:-agent-fleet}/control-plane:${VERSION:-dev}
    build:
      context: ../..
      dockerfile: control-plane/Dockerfile
    # (A)
    network_mode: host
    # (C)
    user: "1000:1000"
    group_add:
      - "${DOCKER_GID}"
    env_file:
      - .env
    environment:
      # The CP binds loopback only (never 0.0.0.0, even on host-net = the existing
      # loopback-only invariant is kept). Public exposure is handled by the stage-2
      # Caddy service.
      CP_ADDR: ${CP_ADDR:-127.0.0.1:8099}
      # (B) Where the CP creates the DB/homes. Must be the same path as the
      # workspace -v source.
      WS_DATA: ${DATA_DIR}
      WS_JVM_DIR: ${DATA_DIR}/shared/jvm
    volumes:
      # docker-out-of-docker: talk to the host daemon.
      - /var/run/docker.sock:/var/run/docker.sock
      # (B) same absolute path bind.
      - ${DATA_DIR}:${DATA_DIR}
    restart: unless-stopped

  # Caddy: automatic TLS for the public domain (ACME/Let's Encrypt) + reverse proxy
  # to the CP. Host-net so it shares the host loopback and reaches 127.0.0.1:8099
  # (the CP) (§20.4: both host-net). Runs as root to bind 80/443 (privileged ports).
  # Certs persist under DATA_DIR, so the stage-3 backup picks them up too. Companies
  # fronting with their own proxy drop this service (see Caddyfile alternative 2).
  caddy:
    image: caddy:2-alpine
    network_mode: host
    env_file:
      - .env
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ${DATA_DIR}/caddy/data:/data
      - ${DATA_DIR}/caddy/config:/config
    depends_on:
      - cp
    restart: unless-stopped
