# Workload Identity: the CP's Google service account, which alone holds Cloud SQL client
# and instance user and Artifact Registry reader (deploy/gcp/gke, iam.tf).
apiVersion: v1
kind: ServiceAccount
metadata:
  name: af-cp
  namespace: af-placeholder-cp
  annotations:
    iam.gke.io/gcp-service-account: af-placeholder@example.iam.gserviceaccount.com
