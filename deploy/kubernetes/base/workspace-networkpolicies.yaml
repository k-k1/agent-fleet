# Exactly the table of ADR 0106 decision 7. NetworkPolicy only allows: a deny is the
# absence of an allow, and any other policy selecting these pods adds to it. So this
# namespace holds these and nothing broader; a private destination a deployment needs
# (a LAN engine, an internal git host) is one extra, per-destination policy.
#
# Enforced only by a CNI that implements NetworkPolicy (Dataplane V2 on GKE). Without
# one these are accepted and enforce nothing.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny
  namespace: af-placeholder-ws
spec:
  podSelector: {}
  policyTypes: ["Ingress", "Egress"]
---
# any -> workspace agent port: from the CP's pods only.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: agent-from-cp
  namespace: af-placeholder-ws
spec:
  podSelector:
    matchExpressions:
      - key: agent-fleet.io/workspace
        operator: Exists
  policyTypes: ["Ingress"]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: af-placeholder-cp
          podSelector:
            matchLabels:
              app.kubernetes.io/name: af-cp
      ports:
        - protocol: TCP
          port: 7700
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: egress-dns
  namespace: af-placeholder-ws
spec:
  podSelector:
    matchExpressions:
      - key: agent-fleet.io/workspace
        operator: Exists
  policyTypes: ["Egress"]
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
---
# workspace -> CP: the internal listener only. The policy matches the pod's port, so the
# main port (8099) stays closed even though both are on the same pod.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: egress-cp-internal
  namespace: af-placeholder-ws
spec:
  podSelector:
    matchExpressions:
      - key: agent-fleet.io/workspace
        operator: Exists
  policyTypes: ["Egress"]
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: af-placeholder-cp
          podSelector:
            matchLabels:
              app.kubernetes.io/name: af-cp
      ports:
        - protocol: TCP
          port: 8098
---
# workspace -> the internet: every address outside RFC 1918, 100.64.0.0/10 and
# 169.254.0.0/16 (the metadata address included), written as the complement of those ranges
# with no `except`. GKE Dataplane V2 adds a node-identity selector to any ipBlock whose cidr
# contains a node address, and an `except` cannot take it away (measured: `0.0.0.0/0` with the
# node range excepted left every node's :22 and :10250 open to workspaces; ADR 0106 addendum
# of 2026-10-03). So no block may contain a node address, and the deployment's node, pod,
# service and control-plane ranges must lie inside the excluded ranges: deploy/gcp/gke checks
# that, other clusters check it themselves (README, P15). IPv4 only: with no `::/0` allow,
# IPv6 egress stays denied.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: egress-internet
  namespace: af-placeholder-ws
spec:
  podSelector:
    matchExpressions:
      - key: agent-fleet.io/workspace
        operator: Exists
  policyTypes: ["Egress"]
