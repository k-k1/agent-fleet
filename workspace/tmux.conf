# agent-fleet: attach したクライアントを1セッションに閉じ込める。
# Workspace 内では全セッション(claude_slotXX)が単一 tmux サーバに同居する。
# 既定 prefix C-b のままだと C-b s / :switch-client などで他セッションへ横断でき
# Console の「1スロット=1セッション」管理が崩れる。prefix 変更では防げない
# (別キーで同じ操作ができる)ため、prefix キーテーブルを一掃して安全キーだけ戻す。

unbind -a -T prefix          # prefix の全バインドを破棄（s w ( ) L : c d & ...）

# Esc を押してから tmux がそれを Esc だと判断するまでの待ち時間。tmux 3.3a の既定は
# **500ms** で、そのまま使うと claude/codex/vim の Esc が必ず 0.5 秒遅れる（体感の
# 「ターミナルが遅い」の一部はこれ）。この待ちは「Esc 単独か、Esc で始まる矢印などの
# シーケンスの先頭か」を見分けるためのもので、シーケンスがバラバラに届く実端末を想定
# した値。ここでの入力元は xterm.js で、1 回の onData = 1 WebSocket フレームとして
# シーケンスを分割せずに送るため、この長い猶予は不要。
set -sg escape-time 20

bind [ copy-mode             # 戻すのはセッション内で安全なものだけ
bind ] paste-buffer
bind PPage copy-mode -u
bind r source-file /etc/tmux.conf \; display "tmux.conf reloaded"

# ':' コマンドプロンプトは戻さない → switch-client / new-session を打つ手段を残さない。
# detach バインドも不要（ブラウザのタブを閉じれば attach は終わる）。
# agent は send-keys で駆動するためキーバインド撤去の影響を受けない。

# Console からこのセッションが kill されたら他へ吸われず detach する
set -g detach-on-destroy on

# マウスホイールでページスクロール。mouse off のままだと bash プロンプト上のホイールが
# オルタネートスクロールで ↑/↓（readline のヒストリ移動）に化ける。mouse on にすると
# tmux がホイールを捕まえ、非マウスアプリ(shell/ssm)は copy-mode スクロール＝出力履歴の
# ページスクロールになる。claude 等マウス対応 TUI へは従来通りマウスを転送する。
# セッション分離は不変（マウスで別セッションへは移動できない）。
set -g mouse on

# 右クリックは tmux の display-menu（Copy/Split/Kill... のポップアップ）を出す既定
# バインドがある。Console ではブラウザ側の contextmenu で「クリップボード貼り付け」を
# 担うため、tmux メニューは邪魔なので撤去する。撤去すると右クリックは tmux では無反応と
# なり、xterm.js の contextmenu ハンドラ（貼り付け）だけが残る。
unbind -n MouseDown3Pane
unbind -n MouseDown3Status

# マウス選択を利用者のクリップボードへ。mouse on だと素のドラッグは tmux の copy-mode に
# 入るため、xterm のブラウザ選択は働かない（＝ブラウザのクリップボードに入らない）。
# set-clipboard on にすると tmux はコピー時に OSC 52 を外側端末(xterm.js)へ送るので、
# xterm 側に足した OSC 52 ハンドラ経由で navigator.clipboard に着地する（term.ts 参照）。
# ドラッグ終了で copy-selection-and-cancel する既定バインドはそのまま活きる。
set -g set-clipboard on
