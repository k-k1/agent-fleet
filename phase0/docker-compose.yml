name: agent-fleet-phase0

services:
  workspace:
    build:
      context: .
    image: agent-fleet/workspace:poc
    container_name: af-ws-poc
    init: true
    command: ["sleep", "infinity"]

    # 【既定】Linux の同一マシンで動かす場合。
    # host ネットワークなら claude /login の localhost コールバックを
    # ホスト側ブラウザがそのまま叩けるため、対話ログインが素直に通る（Approach A）。
    network_mode: "host"

    volumes:
      # 永続ホーム。ここに .claude（認証情報・設定）/ .ssh（鍵）/ repos が貯まる。
      # 事前に `mkdir -p data/home` （uid 1000 で）しておくこと。root 所有だと書けない。
      - ./data/home:/home/node

    # 【代替】リモートホストやネットワーク分離が必要な場合は host ネットワークをやめ、
    # bridge + manual code paste 方式（Approach B）に倒す。その際は上の network_mode を消し、
    # 必要なら claude が示すコールバックポートを ports で 127.0.0.1 に publish する。
    # ports:
    #   - "127.0.0.1:<port>:<port>"
