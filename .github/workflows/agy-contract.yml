# Antigravity TUI pane contract. agy has no structured driver, so paneMode is the
# launch-seed readiness signal that prevents the first mirror prompt being consumed by
# its boot/login screen. The probe is intentionally turn-free; Google OAuth is required
# only to reach the real composer.
name: agy-contract

on:
  workflow_dispatch:
    inputs:
      cli_version:
        description: "agy version to verify (latest for self-update-enabled Workspaces)"
        type: string
        default: latest

permissions:
  contents: read
  issues: write

concurrency:
  group: agy-contract
  cancel-in-progress: false

jobs:
  pane-drift:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      AGY_CLI_DISABLE_AUTO_UPDATE: "1"
    steps:
      - uses: actions/checkout@v4
      - name: guard signed-in composer credential
        env:
          TOKEN: ${{ secrets.E2E_AGY_OAUTH_TOKEN }}
        run: |
          set -euo pipefail
          [ -n "$TOKEN" ] || { echo '::error::register secrets.E2E_AGY_OAUTH_TOKEN'; exit 1; }
          install -d -m 700 "$HOME/.gemini/antigravity-cli"
          umask 077
          printf '%s' "$TOKEN" > "$HOME/.gemini/antigravity-cli/antigravity-oauth-token"
      - uses: ./.github/actions/setup-agent-cli
        id: cli
        with:
          agent: agy
          version: ${{ inputs.cli_version }}
      - name: real TUI pane drift contract
        working-directory: workspace/agent
        env:
          E2E_REQUIRE: "1"
        run: go test -tags drift -run '^TestDriftAgyPaneMode$' -count=1 -v -timeout 12m ./...

      # ⚠️ カタログの契約。ペインのフッタだけ見ていたので、1.1.19 で
      # `agy models` が「表示名だけ」→「id<TAB>表示名」に変わったのを
      # 誰も検知できなかった（docs/70 §70.14.8）。しかもその壊れ方は
      # **セッションは動くのに黙って別のモデル**で、実機の TUI に出る警告
      # 1 行以外どこにも現れない。上の pane 契約とは別物なので別ステップ。
      - name: real models catalog drift contract
        working-directory: workspace/agent
        env:
          E2E_REQUIRE: "1"
        run: go test -tags drift -run '^TestDriftAgyModelsCatalog$' -count=1 -v -timeout 5m ./...
      - name: remember successfully tested latest
        if: success() && inputs.cli_version == 'latest'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          EFFECTIVE: ${{ steps.cli.outputs.version }}
        run: |
          version="$(printf '%s' "$EFFECTIVE" | grep -oE '[0-9]+(\.[0-9]+)+' | head -1)"
          [ -n "$version" ]
          deploy/local/cli-release-state.sh set tested agy "$version"
