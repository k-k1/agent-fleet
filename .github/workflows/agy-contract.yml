# Antigravity TUI pane contract. agy has no structured driver, so paneMode is the
# launch-seed readiness signal that prevents the first mirror prompt being consumed by
# its boot/login screen. The probe is intentionally turn-free; Google OAuth is required
# only to reach the real composer.
#
# A thin caller of cli-contract.yml: triggers, the credential and the test scripts live here,
# everything else (install, bookkeeping, the failure-report condition) is shared.
name: agy-contract

on:
  workflow_dispatch:
    inputs:
      cli_version:
        description: "agy version to verify (latest for self-update-enabled Workspaces)"
        type: string
        default: latest
      model:
        description: "Model for the contract's real turn (empty = the test's default, a cheap one with quota)"
        type: string
        default: ""

permissions:
  actions: read # the failure report lists this run's failed steps
  contents: read
  issues: write

concurrency:
  group: agy-contract
  cancel-in-progress: false

jobs:
  pane-drift:
    uses: ./.github/workflows/cli-contract.yml
    secrets:
      E2E_AGY_OAUTH_TOKEN: ${{ secrets.E2E_AGY_OAUTH_TOKEN }}
    with:
      cli: agy
      version: ${{ inputs.cli_version }}
      timeout_minutes: 20
      job_env: |
        AGY_CLI_DISABLE_AUTO_UPDATE=true
      guard: |
        set -euo pipefail
        TOKEN="$E2E_AGY_OAUTH_TOKEN"
        [ -n "$TOKEN" ] || { echo '::error::register secrets.E2E_AGY_OAUTH_TOKEN'; exit 1; }
        install -d -m 700 "$HOME/.gemini/antigravity-cli"
        umask 077
        printf '%s' "$TOKEN" > "$HOME/.gemini/antigravity-cli/antigravity-oauth-token"
      test_0_name: real TUI pane drift contract
      test_0_env: |
        E2E_REQUIRE=1
      test_0: |
        go test -tags contract -run '^TestDriftAgyPaneMode$' -count=1 -v -timeout 12m ./...

      # The contract for the scrape path. The pane contract above only exercises
      # BuildLaunch, so nothing put the /usage scrape (pre-trusting the scratch dir → TUI
      # launch → /usage → panel parsing) in front of a real CLI. This is also the only path
      # against a real CLI that covers the reply to the trust prompt
      # (internal/agents/agy/trustprompt.go): while the pre-trust works no prompt appears,
      # and this goes red on the day it stops working.
      #
      # -v keeps the panel contents in the log, but the test also prints the account
      # line, which must not go raw into a public repository's logs. pipefail is required:
      # the default `bash -e` does not set it, so piping through sed makes a failing
      # `go test` look green.
      test_1_name: real /usage scrape contract
      test_1_env: |
        AF_AGY_LIVE=1
      test_1: |
        set -euo pipefail
        go test -run '^TestScrapeUsageLive$' -count=1 -v -timeout 5m ./internal/agents/agy/ \
          | sed -E 's/[[:alnum:]._%+-]+@[[:alnum:].-]+\.[[:alpha:]]{2,}/<redacted-email>/g'

      # The catalog contract. Watching only the pane footer meant nothing detected `agy
      # models` changing from "display name only" to "id<TAB>display name" in 1.1.19
      # (docs/log/70 §70.14.8) — and that breakage means the session still runs but
      # silently on a different model, visible nowhere except one warning line in the real
      # TUI. A separate concern from the pane contract above, hence a separate step.
      test_2_name: real models catalog drift contract
      test_2_env: |
        E2E_REQUIRE=1
      test_2: |
        go test -tags contract -run '^TestDriftAgyModelsCatalog$' -count=1 -v -timeout 5m ./...

      # The hooks contract. The steps above run agy without our hooks.json entry, so none saw
      # agy 1.4.4 deny every tool call when the PreToolUse hook printed "{}" (#2470): the session
      # starts and answers, and no tool ever runs. This runs one real turn that calls a tool with
      # the Agent's entry installed, and fails unless the tool ran and the hook fired.
      test_3_name: real tool-call hooks contract
      test_3_env: |
        E2E_REQUIRE=1
        AF_AGY_CONTRACT_MODEL=${{ inputs.model }}
      test_3: |
        go test -tags contract -run '^TestDriftAgyToolHooks$' -count=1 -v -timeout 8m ./...

  # The `tested` this run may have recorded is what a bump waits for; see cli-pin-bump.yml's
  # `on:` for why this dispatches it instead of relying on `workflow_run`. A job of its own,
  # so actions: write never reaches the steps that run the CLI. Whatever the result:
  # cli-pin-bump decides by `tested == latest` and changes nothing when nothing is due.
  pin-bump:
    needs: pane-drift
    if: ${{ !cancelled() && github.event_name != 'pull_request' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: write
    steps:
      - name: dispatch cli-pin-bump
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh workflow run cli-pin-bump.yml --repo "$GITHUB_REPOSITORY" --ref main
