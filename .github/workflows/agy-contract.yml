# Antigravity TUI pane contract. agy has no structured driver, so paneMode is the
# launch-seed readiness signal that prevents the first mirror prompt being consumed by
# its boot/login screen. The probe is intentionally turn-free; Google OAuth is required
# only to reach the real composer.
name: agy-contract

on:
  workflow_dispatch:
    inputs:
      cli_version:
        description: "agy version to verify (latest for self-update-enabled Workspaces)"
        type: string
        default: latest

permissions:
  contents: read
  issues: write

concurrency:
  group: agy-contract
  cancel-in-progress: false

jobs:
  pane-drift:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      AGY_CLI_DISABLE_AUTO_UPDATE: "true"
    steps:
      - uses: actions/checkout@v4
      - name: guard signed-in composer credential
        env:
          TOKEN: ${{ secrets.E2E_AGY_OAUTH_TOKEN }}
        run: |
          set -euo pipefail
          [ -n "$TOKEN" ] || { echo '::error::register secrets.E2E_AGY_OAUTH_TOKEN'; exit 1; }
          install -d -m 700 "$HOME/.gemini/antigravity-cli"
          umask 077
          printf '%s' "$TOKEN" > "$HOME/.gemini/antigravity-cli/antigravity-oauth-token"
      - uses: ./.github/actions/setup-agent-cli
        id: cli
        with:
          agent: agy
          version: ${{ inputs.cli_version }}
      - name: real TUI pane drift contract
        working-directory: workspace/agent
        env:
          E2E_REQUIRE: "1"
        run: go test -tags drift -run '^TestDriftAgyPaneMode$' -count=1 -v -timeout 12m ./...

      # The contract for the scrape path. The pane contract above only exercises
      # BuildLaunch, so nothing put the /usage scrape (pre-trusting the scratch dir → TUI
      # launch → /usage → panel parsing) in front of a real CLI. This is also the only path
      # against a real CLI that covers the reply to the trust prompt
      # (internal/agents/agy/trustprompt.go): while the pre-trust works no prompt appears,
      # and this goes red on the day it stops working.
      - name: real /usage scrape contract
        working-directory: workspace/agent
        env:
          AF_AGY_LIVE: "1"
        # -v keeps the panel contents in the log, but the test also prints the account
        # line, which must not go raw into a public repository's logs. pipefail is required:
        # the default `bash -e` does not set it, so piping through sed makes a failing
        # `go test` look green.
        run: |
          set -euo pipefail
          go test -run '^TestScrapeUsageLive$' -count=1 -v -timeout 5m ./internal/agents/agy/ \
            | sed -E 's/[[:alnum:]._%+-]+@[[:alnum:].-]+\.[[:alpha:]]{2,}/<redacted-email>/g'

      # The catalog contract. Watching only the pane footer meant nothing detected `agy
      # models` changing from "display name only" to "id<TAB>display name" in 1.1.19
      # (docs/log/70 §70.14.8) — and that breakage means the session still runs but
      # silently on a different model, visible nowhere except one warning line in the real
      # TUI. A separate concern from the pane contract above, hence a separate step.
      - name: real models catalog drift contract
        working-directory: workspace/agent
        env:
          E2E_REQUIRE: "1"
        run: go test -tags drift -run '^TestDriftAgyModelsCatalog$' -count=1 -v -timeout 5m ./...
      - name: remember successfully tested latest
        if: success() && inputs.cli_version == 'latest'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          EFFECTIVE: ${{ steps.cli.outputs.version }}
        run: |
          version="$(printf '%s' "$EFFECTIVE" | grep -oE '[0-9]+(\.[0-9]+)+' | head -1)"
          [ -n "$version" ]
          deploy/local/cli-release-state.sh set tested agy "$version"
