# E2E（docs/dev/10 §10.4): Workspace イメージを build し、L1（e2e-smoke.sh: CLI 実版 =
# Dockerfile ARG ピン等）→ L2（e2e/: CP をヘッドレス起動して workspace/session 疎通）→
# L3（console-e2e/: Playwright でブラウザ→CP→コンテナの縦串）を検証する。イメージ build が
# 重いので ci.yml から分離し、関係パスの変更時 + 週次 cron（コード無変更でも上流 CLI の
# 破壊を検出）+ 手動のみ実行する。
#
# 課金を伴うジョブは workflow_dispatch の入力を立てた時だけ走り、**エージェント毎に入力が
# 別**（枠の消費先が違うので、片方だけ回せる必要がある）:
#   - live_claude → live-smoke（L4・実 API キー / OAuth トークンで claude 疎通）
#   - live_codex  → codex-live-drift（Tier2・ChatGPT サブスク枠で実ターン）
# 注: rtk は git-ignored のホスト vendor 品なので CI は「rtk なし」パスの検証になる。
name: e2e

on:
  push:
    paths:
      - "workspace/**"
      - "control-plane/**"
      - "console/**"
      - "e2e/**"
      - "console-e2e/**"
      - "deploy/local/e2e-smoke.sh"
      - ".github/workflows/e2e.yml"
  pull_request:
    paths:
      - "workspace/**"
      - "control-plane/**"
      - "console/**"
      - "e2e/**"
      - "console-e2e/**"
      - "deploy/local/e2e-smoke.sh"
      - ".github/workflows/e2e.yml"
  schedule:
    - cron: "0 21 * * 0" # 毎週月曜 6:00 JST — 上流 CLI / base image の破壊検出
  workflow_dispatch:
    inputs:
      # 課金を伴うジョブは**エージェント毎に**入力を分ける。1 つの live 入力を共有すると
      # claude のサブスク枠と ChatGPT(codex) のサブスク枠が同時に減り、片方だけ回せない。
      live_claude:
        description: "L4: claude 疎通スモーク（live-smoke）を実行する — Anthropic のサブスク枠 / API 課金を消費"
        type: boolean
        default: false
      live_codex:
        description: "Tier2: codex ドリフト検知（codex-live-drift）を実行する — ChatGPT(codex) のサブスク枠を消費（実測 ~45k tokens/回）"
        type: boolean
        default: false

concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: true

jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      WS_IMAGE: agent-fleet/workspace:dev
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: control-plane/go.mod
          cache-dependency-path: control-plane/go.sum
      - uses: docker/setup-buildx-action@v3
      - name: build workspace image
        uses: docker/build-push-action@v6
        with:
          context: workspace
          tags: ${{ env.WS_IMAGE }}
          load: true
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: image smoke (L1)
        run: deploy/local/e2e-smoke.sh "$WS_IMAGE"
      - name: vet e2e module
        working-directory: e2e
        run: go vet -tags e2e ./...
      - name: fleet e2e (L2)
        working-directory: e2e
        env:
          E2E_REQUIRE: "1"
        run: go test -v -tags e2e -timeout 15m ./...

  ui-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      WS_IMAGE: agent-fleet/workspace:dev
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: control-plane/go.mod
          cache-dependency-path: control-plane/go.sum
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            console/package-lock.json
            console-e2e/package-lock.json
      - uses: docker/setup-buildx-action@v3
      - name: build workspace image
        uses: docker/build-push-action@v6
        with:
          context: workspace
          tags: ${{ env.WS_IMAGE }}
          load: true
          cache-from: type=gha
          # e2e ジョブが cache-to を担う（同じ内容の二重書き込みを避ける）
      - name: build console
        working-directory: console
        run: |
          npm ci
          NODE_OPTIONS=--max-old-space-size=3072 npm run build
      - name: install playwright
        working-directory: console-e2e
        run: |
          npm ci
          npx playwright install --with-deps chromium
      - name: console ui e2e (L3)
        working-directory: console-e2e
        env:
          E2E_REQUIRE: "1"
        run: npx playwright test
      - name: upload traces & CP log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ui-e2e-results
          path: console-e2e/test-results/
          if-no-files-found: ignore

  codex-drift:
    # codex CLI ドリフト検知（Tier 1）。実 codex バイナリ＋実 tmux ペインに当てて、
    # hooks スキーマ・-c config キー・TUI フッタ仕様の破壊を検出する（workspace/agent の
    # `-tags drift` テスト）。上の e2e ジョブと違いイメージ build が要らないので数十秒で終わる。
    #
    # 無料・無認証: 検証する経路（features list / config 検証 / UserPromptSubmit の発火 /
    # フッタ描画）は全て API 呼び出しの前に完結する（実測）。実ターンを要する Stop hook・
    # rollout イベント・turn/* 通知は Tier 2（要課金）で、ここには含めない。
    #
    # 版は Dockerfile の ARG ピンに合わせる（＝実際に焼き込まれる版を検証する）。
    # 注: self-update opt-in の Workspace は @latest で動くため、この版と実フリートの
    # 稼働版がずれることがある。latest も回すかは運用判断（未決）。
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: workspace/agent/go.mod
          cache-dependency-path: workspace/agent/go.sum
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: install pinned codex + tmux
        run: |
          PIN=$(sed -n 's/^ARG CODEX_VERSION=//p' workspace/Dockerfile | head -1)
          [ -n "$PIN" ] || { echo "::error::ARG CODEX_VERSION が workspace/Dockerfile に無い"; exit 1; }
          echo "pinned codex: $PIN"
          npm install -g "@openai/codex@$PIN"
          codex --version
          sudo apt-get update && sudo apt-get install -y tmux
      - name: codex drift (Tier 1)
        working-directory: workspace/agent
        env:
          # 未インストールを skip でなく失敗にする（silent skip は false green）。
          E2E_REQUIRE: "1"
        run: go test -tags drift -run TestDrift -v -timeout 10m ./...

  codex-live-drift:
    # codex CLI ドリフト検知（Tier 2 / **実ターンを消費する**）。上の codex-drift（Tier 1・
    # 無料）では観測できない4点だけを実ターンで見る: Stop hook→idle / rollout の
    # task_started・task_complete / request_user_input の function_call / managed の
    # turn/started・turn/completed。
    #
    # live-smoke と同型で **workflow_dispatch の live_codex 入力を立てた時だけ**走る（cron 無し）。
    # live_claude とは独立 ＝ claude 側の枠を消費せずに codex だけ回せる。
    # 実測コスト: 1実行あたり概ね 45k tokens 前後（内訳はジョブログの `MEASURED COST` 行）。
    # auth_mode="chatgpt" ならサブスク枠の消費（API 課金ではない）。
    #
    # 認証: secrets.E2E_CODEX_AUTH_JSON = `codex login` 後の ~/.codex/auth.json の中身。
    # chatgpt トークンは refresh_token 前提で in-place 更新されるため、**CI に置いたコピーは
    # いずれ失効する**（ローテートされた新トークンを CI 側は保持できない）。失効時に
    # 「謎の 401」で終わらないよう、テスト側がターン前の `codex login status` と
    # ターン中の 401 文面を分類し、再 login → secret 更新まで書いたメッセージで落とす。
    if: github.event_name == 'workflow_dispatch' && inputs.live_codex
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: workspace/agent/go.mod
          cache-dependency-path: workspace/agent/go.sum
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: guard secret
        env:
          AUTH: ${{ secrets.E2E_CODEX_AUTH_JSON }}
        run: |
          if [ -z "$AUTH" ]; then
            # 注: バッククォートは書かない（"..." 内ではコマンド置換として実行されてしまう）
            echo '::error::secrets.E2E_CODEX_AUTH_JSON を登録してください（codex login 後の ~/.codex/auth.json の中身をそのまま貼る）'
            exit 1
          fi
      - name: install pinned codex + tmux
        run: |
          PIN=$(sed -n 's/^ARG CODEX_VERSION=//p' workspace/Dockerfile | head -1)
          [ -n "$PIN" ] || { echo "::error::ARG CODEX_VERSION が workspace/Dockerfile に無い"; exit 1; }
          npm install -g "@openai/codex@$PIN"
          codex --version
          sudo apt-get update && sudo apt-get install -y tmux
      - name: codex live drift (Tier 2)
        working-directory: workspace/agent
        env:
          E2E_CODEX_AUTH_JSON: ${{ secrets.E2E_CODEX_AUTH_JSON }}
        run: go test -tags driftlive -run TestLiveDrift -v -timeout 20m ./...

  live-smoke:
    # L4: 実 API キーで claude -p の疎通を見る。手動 + 明示 opt-in のみ（課金あり）。
    # codex 側（codex-live-drift）とは入力が別 ＝ 片方だけ回せる。
    if: github.event_name == 'workflow_dispatch' && inputs.live_claude
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      WS_IMAGE: agent-fleet/workspace:dev
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: control-plane/go.mod
          cache-dependency-path: control-plane/go.sum
      - uses: docker/setup-buildx-action@v3
      - name: build workspace image
        uses: docker/build-push-action@v6
        with:
          context: workspace
          tags: ${{ env.WS_IMAGE }}
          load: true
          cache-from: type=gha
      - name: guard secret
        env:
          KEY: ${{ secrets.E2E_ANTHROPIC_API_KEY }}
          TOKEN: ${{ secrets.E2E_CLAUDE_OAUTH_TOKEN }}
        run: |
          if [ -z "$KEY" ] && [ -z "$TOKEN" ]; then
            echo "::error::secrets.E2E_ANTHROPIC_API_KEY（API キー）か secrets.E2E_CLAUDE_OAUTH_TOKEN（claude setup-token の OAuth トークン）のどちらかを登録してください"
            exit 1
          fi
      - name: claude live smoke (L4)
        working-directory: e2e
        env:
          E2E_REQUIRE: "1"
          E2E_ANTHROPIC_API_KEY: ${{ secrets.E2E_ANTHROPIC_API_KEY }}
          E2E_CLAUDE_OAUTH_TOKEN: ${{ secrets.E2E_CLAUDE_OAUTH_TOKEN }}
        run: go test -v -tags e2e -timeout 15m -run TestClaudeLive ./...
