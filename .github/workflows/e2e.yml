# E2E (docs/build/10 §10.4): build the Workspace image, then verify L1 (e2e-smoke.sh:
# actual CLI versions = Dockerfile ARG pins etc.) -> L2 (e2e/: boot the CP headless
# and exercise workspace/session round-trips) -> L3 (console-e2e/: Playwright
# browser->CP->container end-to-end). The image build is heavy, so this is split
# out of ci.yml and runs only on PRs to main (merge gate) + a nightly cron
# (integration check of the default branch = develop; caps breakage exposure at one
# day and keeps bisects practical) + manual dispatch. Not run on pushes to develop
# (spreads billing; CONTRIBUTING "Commits & PRs"). L4 (claude round-trip with real
# credentials) consumes quota, so it only runs when the workflow_dispatch live
# input is set.
#
# Agent-CLI contract / drift detection does not live here (separate files, no image
# build needed): claude-tui-contract.yml / codex-contract.yml / opencode-contract.yml.
# Version-drift monitoring itself is cli-drift.yml. Overall layout: docs/build/10-development.md.
# Note: rtk is always baked in (BAKE_RTK=1 default, ARG-pinned), so CI-built images
# also contain rtk and the L1 smoke verifies its inclusion (the old host vendor
# path is gone).
name: e2e

# Least privilege for GITHUB_TOKEN. The repo default is already read-only, but this
# stays explicit so the job keeps it if the org/repo default ever changes (public
# repo: workflow runs and their logs are world-readable).
permissions:
  contents: read

on:
  pull_request:
    branches: [main]
    paths:
      - "workspace/**"
      - "control-plane/**"
      - "console/**"
      - "e2e/**"
      - "console-e2e/**"
      - "deploy/local/e2e-smoke.sh"
      - ".github/workflows/e2e.yml"
  schedule:
    - cron: "0 19 * * *" # nightly 04:00 JST — integration check of develop (default branch) + upstream CLI / base image breakage detection
  workflow_dispatch:
    inputs:
      # An input that spends billing / quota must map to **exactly one agent this
      # workflow runs**. This live input used to be shared with codex's Tier2 job,
      # so one dispatch burned both Anthropic and ChatGPT quota (no way to run just
      # one). codex has moved to codex-contract.yml = this input is exclusively for
      # claude's live-smoke.
      live:
        description: "L4: run the claude round-trip smoke (live-smoke) — consumes Anthropic subscription quota / API billing"
        type: boolean
        default: false

concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: true

jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      WS_IMAGE: agent-fleet/workspace:dev
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: control-plane/go.mod
          cache-dependency-path: control-plane/go.sum
      - name: free disk space
        # ubuntu-latest ships ~14GB free; the workspace image bakes chromium+CJK
        # フォント / node / python+uv MCP 群 / Go / awscli+SSM / agent CLI 4種で、
        # buildx + gha cache(mode=max) が空き0MBに達し "no space left on device" で
        # 落ちる（e2e が恒常 FAIL していた真因）。使わないプリインストール(android ~9GB,
        # dotnet, ghc 等)を消して十数GB を回収する。外部 action は供給網回避のため使わない。
        run: |
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc \
            /usr/local/.ghcup /opt/hostedtoolcache/CodeQL /usr/local/share/boost || true
          df -h /
      - uses: docker/setup-buildx-action@v3
      - name: build workspace image
        uses: docker/build-push-action@v6
        with:
          context: workspace
          tags: ${{ env.WS_IMAGE }}
          build-args: BAKE_AGENT_CLIS=1
          load: true
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: image smoke (L1)
        run: deploy/local/e2e-smoke.sh "$WS_IMAGE"
      - name: vet e2e module
        working-directory: e2e
        run: go vet -tags e2e ./...
      - name: fleet e2e (L2)
        working-directory: e2e
        env:
          E2E_REQUIRE: "1"
        run: go test -v -tags e2e -timeout 15m ./...

  ui-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      WS_IMAGE: agent-fleet/workspace:dev
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: control-plane/go.mod
          cache-dependency-path: control-plane/go.sum
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            console/package-lock.json
            console-e2e/package-lock.json
      - name: free disk space
        # ubuntu-latest ships ~14GB free; the workspace image bakes chromium+CJK
        # フォント / node / python+uv MCP 群 / Go / awscli+SSM / agent CLI 4種で、
        # buildx + gha cache(mode=max) が空き0MBに達し "no space left on device" で
        # 落ちる（e2e が恒常 FAIL していた真因）。使わないプリインストール(android ~9GB,
        # dotnet, ghc 等)を消して十数GB を回収する。外部 action は供給網回避のため使わない。
        run: |
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc \
            /usr/local/.ghcup /opt/hostedtoolcache/CodeQL /usr/local/share/boost || true
          df -h /
      - uses: docker/setup-buildx-action@v3
      - name: build workspace image
        uses: docker/build-push-action@v6
        with:
          context: workspace
          tags: ${{ env.WS_IMAGE }}
          build-args: BAKE_AGENT_CLIS=1
          load: true
          cache-from: type=gha
          # the e2e job owns cache-to (avoid double-writing identical content)
      - name: build console
        working-directory: console
        run: |
          npm ci
          NODE_OPTIONS=--max-old-space-size=3072 npm run build
      - name: install playwright
        working-directory: console-e2e
        run: |
          npm ci
          npx playwright install --with-deps chromium
      - name: console ui e2e (L3)
        working-directory: console-e2e
        env:
          E2E_REQUIRE: "1"
        run: npx playwright test
      - name: upload traces & CP log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ui-e2e-results
          path: console-e2e/test-results/
          if-no-files-found: ignore

  live-smoke:
    # L4: verify claude -p round-trip with a real API key. Manual + explicit opt-in
    # only (billed). Note: this is headless `claude -p` = no TUI, no footer rendered.
    # The state-detection contract is not visible here; claude-tui-contract.yml
    # covers it separately.
    if: github.event_name == 'workflow_dispatch' && inputs.live
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      WS_IMAGE: agent-fleet/workspace:dev
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: control-plane/go.mod
          cache-dependency-path: control-plane/go.sum
      - name: free disk space
        # ubuntu-latest ships ~14GB free; the workspace image bakes chromium+CJK
        # フォント / node / python+uv MCP 群 / Go / awscli+SSM / agent CLI 4種で、
        # buildx + gha cache(mode=max) が空き0MBに達し "no space left on device" で
        # 落ちる（e2e が恒常 FAIL していた真因）。使わないプリインストール(android ~9GB,
        # dotnet, ghc 等)を消して十数GB を回収する。外部 action は供給網回避のため使わない。
        run: |
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc \
            /usr/local/.ghcup /opt/hostedtoolcache/CodeQL /usr/local/share/boost || true
          df -h /
      - uses: docker/setup-buildx-action@v3
      - name: build workspace image
        uses: docker/build-push-action@v6
        with:
          context: workspace
          tags: ${{ env.WS_IMAGE }}
          build-args: BAKE_AGENT_CLIS=1
          load: true
          cache-from: type=gha
      - name: guard secret
        env:
          KEY: ${{ secrets.E2E_ANTHROPIC_API_KEY }}
          TOKEN: ${{ secrets.E2E_CLAUDE_OAUTH_TOKEN }}
        run: |
          if [ -z "$KEY" ] && [ -z "$TOKEN" ]; then
            echo "::error::Register either secrets.E2E_ANTHROPIC_API_KEY (API key) or secrets.E2E_CLAUDE_OAUTH_TOKEN (OAuth token from claude setup-token)"
            exit 1
          fi
      - name: claude live smoke (L4)
        working-directory: e2e
        env:
          E2E_REQUIRE: "1"
          E2E_ANTHROPIC_API_KEY: ${{ secrets.E2E_ANTHROPIC_API_KEY }}
          E2E_CLAUDE_OAUTH_TOKEN: ${{ secrets.E2E_CLAUDE_OAUTH_TOKEN }}
        run: go test -v -tags e2e -timeout 15m -run TestClaudeLive ./...
