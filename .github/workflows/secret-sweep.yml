# Daily credential sweep over every ref of the repository (#4905).
#
# ci.yml's `secret-scan` scans only what a PR's merge commit reaches, so a credential-shaped
# value pushed on a branch that never gets a PR is not seen there. This sweep is where it is
# seen: all branches and tags, every day, plus ci.yml's own scan of every push to main. A
# finding fails this run and opens (or refreshes) one issue, closed again by the first clean
# sweep. Pushing the value already published it; the sweep reports it, it cannot prevent it.
name: secret-sweep

on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

permissions:
  contents: read
  issues: write # the one tracking issue (scripts/secret-sweep-issue.sh)

concurrency:
  group: secret-sweep
  cancel-in-progress: false

jobs:
  sweep:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # every branch's full history
      - uses: ./.github/actions/install-gitleaks
      - name: scan every ref
        id: scan
        continue-on-error: true
        run: scripts/secret-scan.sh all --report-format json --report-path "$RUNNER_TEMP/report.json"
      - name: open or refresh the tracking issue
        if: steps.scan.outcome == 'failure'
        env:
          GH_TOKEN: ${{ github.token }}
        run: scripts/secret-sweep-issue.sh open "$RUNNER_TEMP/report.json" "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
      - name: close the tracking issue
        if: steps.scan.outcome == 'success'
        env:
          GH_TOKEN: ${{ github.token }}
        run: scripts/secret-sweep-issue.sh close "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
      # continue-on-error above keeps the scan's failure from skipping the issue step; this
      # puts it back so the run itself is red.
      - name: fail the run when the scan found something
        if: steps.scan.outcome == 'failure'
        run: exit 1
