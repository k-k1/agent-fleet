# Daily credential sweep over every ref of the repository (#4905).
#
# ci.yml's `secret-scan` scans only what a PR's merge commit reaches, so a credential-shaped
# value pushed on a branch that never gets a PR is not seen there. This sweep is where it is
# seen: all branches and tags, every day, plus ci.yml's own scan of every push to main. A
# finding fails this run and opens (or refreshes) one issue, closed again by the first clean
# sweep. Pushing the value already published it; the sweep reports it, it cannot prevent it.
# It sees the refs that exist when it runs: a commit already deleted or force-pushed away is
# not reachable from any of them.
name: secret-sweep

on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

permissions:
  contents: read
  issues: write # the one tracking issue (scripts/secret-sweep-issue.sh)

concurrency:
  group: secret-sweep
  cancel-in-progress: false

jobs:
  sweep:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # every branch's full history
      - uses: ./.github/actions/install-gitleaks
      # One script decides what the scan's result may do to the tracking issue: only a scan
      # that completed opens, refreshes or closes it (scripts/secret-sweep.sh). A manual run
      # from another branch runs that branch's scripts and .gitleaks.toml, so it never touches
      # the issue; the scheduled run is always on main.
      - name: scan every ref and sync the tracking issue
        env:
          GH_TOKEN: ${{ github.token }}
          SYNC_ISSUE: ${{ github.ref == 'refs/heads/main' }}
        run: scripts/secret-sweep.sh "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
