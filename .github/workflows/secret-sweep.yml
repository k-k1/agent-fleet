# Daily credential sweep over every ref of the repository (#4905).
#
# ci.yml's `secret-scan` scans only what a PR's merge commit reaches, so a credential-shaped
# value pushed on a branch that never gets a PR is not seen there. This sweep is where it is
# seen: all branches and tags, every day, plus ci.yml's own scan of every push to main. A
# finding fails this run and opens (or refreshes) one issue, closed again by the first clean
# sweep. Pushing the value already published it; the sweep reports it, it cannot prevent it.
# It sees the refs that exist when it runs: a commit already deleted or force-pushed away is
# not reachable from any of them.
name: secret-sweep

on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

# No token permission at workflow level: each job states its own.
permissions: {}

# Two jobs with the same steps, so the token that can write issues exists only in a run
# whose code is main's: a manual run from another branch loads that branch's scripts, and
# must not be handed a token it could misuse by a changed script. scripts/secret-sweep.sh
# decides what a scan result may do to the tracking issue (only a scan that completed opens,
# refreshes or closes it); the branch job runs it with SYNC_ISSUE=false and no token.
# `route` picks the job with an exact string match (scripts/secret-sweep-route.sh): an
# expression like `github.ref == 'refs/heads/main'` ignores case and would take `Main` for main.
jobs:
  route:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      is_main: ${{ steps.route.outputs.is_main }}
    steps:
      - uses: actions/checkout@v7
        with:
          sparse-checkout: scripts/secret-sweep-route.sh
          persist-credentials: false
      - id: route
        run: scripts/secret-sweep-route.sh "$GITHUB_REF" | tee -a "$GITHUB_OUTPUT"

  sweep-main:
    needs: route
    if: needs.route.outputs.is_main == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # Only this job may change the issue, so only it queues: a read-only check of another
    # branch must not displace a pending scheduled sweep.
    concurrency:
      group: secret-sweep-main
      cancel-in-progress: false
    permissions:
      contents: read
      issues: write # the one tracking issue (scripts/secret-sweep-issue.sh)
    steps:
      - uses: actions/checkout@v7
        with:
          # main as it is now, not the commit this run was queued for: a re-run of an old
          # run keeps its GITHUB_SHA, and its result would then speak for an old main (an
          # old allowlist could close an issue that today's main still earns).
          ref: refs/heads/main
          fetch-depth: 0 # every branch's full history
          persist-credentials: false
      - uses: ./.github/actions/install-gitleaks
      - name: scan every ref and sync the tracking issue
        env:
          GH_TOKEN: ${{ github.token }}
          SYNC_ISSUE: "true"
        run: scripts/secret-sweep.sh "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"

  sweep-branch:
    needs: route
    if: needs.route.outputs.is_main != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # every branch's full history
          persist-credentials: false
      - uses: ./.github/actions/install-gitleaks
      - name: scan every ref (the issue is not touched)
        env:
          SYNC_ISSUE: "false"
        run: scripts/secret-sweep.sh "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
