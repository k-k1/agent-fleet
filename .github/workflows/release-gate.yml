# Release gate (docs/35 §35.7.1 P1 / §35.7.2 P2 / §35.7.3 P3): verifies on a hosted
# runner that the distribution artifacts A+B+D build, the lean variant boot-installs,
# the default (fully baked) build is unaffected, native C+R build and run under real
# bwrap (gates d/e), and the ECS release procedure passes static checks (gate g).
#
# The development Workspace has no docker, and heavy builds on the dev host risk
# OOMing the live fleet (shared, memory-constrained host), so only this gate — which
# needs real image builds — runs on hosted CI. To limit billing it has no permanent
# trigger: it runs on pushes that change this workflow file itself (= deliberate
# trigger) and on workflow_dispatch once it is on develop/main.
# Re-run with `gh run rerun <id>`.
# P4 (docs/35 §35.7.4): adds dist-gate (stub run of publish/install + real chromium
# CDN download check). The dev WS network gets 400s from the PRSS CDN, so the CI
# network is the authoritative place to measure the CDN.
name: release-gate

# Least privilege for GITHUB_TOKEN. The repo default is already read-only, but this
# stays explicit so the job keeps it if the org/repo default ever changes (public
# repo: workflow runs and their logs are world-readable).
permissions:
  contents: read

on:
  push:
    branches: [feat/packaging]
    paths: ['.github/workflows/release-gate.yml']
  workflow_dispatch:

concurrency:
  group: release-gate-${{ github.ref }}
  cancel-in-progress: true

env:
  VERSION: 0.0.0-ci
  # The gate builds but never pushes, so keep the local image names it asserts on
  # (ADR 0037 made the release default a real registry path).
  AF_REGISTRY: agent-fleet

jobs:
  # Gates (a)+(b): build A+D via the release path, verify the lean B
  # (BAKE_AGENT_CLIS=0) contents (e2e-smoke lean mode) and live-run boot-install.
  # The full "sessions actually work" check (real CP + real auth) stays a host-side
  # fleet concern.
  compose-gate:
    # Skip heavy jobs while iterating: [native-only] skips the two P1 jobs,
    # [ecs-only] skips all three docker-building jobs (only ecs-gate runs),
    # [dist-only] skips everything but dist-gate. Final verification runs all jobs
    # via an unmarked push.
    if: "!contains(github.event.head_commit.message, '[native-only]') && !contains(github.event.head_commit.message, '[ecs-only]') && !contains(github.event.head_commit.message, '[dist-only]')"
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4

      - name: build release artifacts (A+D)
        run: VERSION=$VERSION deploy/release/build.sh --compose

      - name: assert artifacts + bundle contents
        run: |
          set -eux
          cd deploy/release/dist
          test -f "agent-fleet-$VERSION.tar.gz"          # A
          test -f SHA256SUMS                             # D
          # ADR 0037: no images tar is produced or published any more
          ! ls agent-fleet-images-*.tar.gz 2>/dev/null
          sha256sum -c SHA256SUMS
          # A bundles the aws/ tree, LICENSE and NOTICE, and .env.example is pinned to VERSION
          tar tzf "agent-fleet-$VERSION.tar.gz" | grep -q "^agent-fleet-$VERSION/aws/ecs/cfn/30-ingress.yaml$"
          tar tzf "agent-fleet-$VERSION.tar.gz" | grep -q "^agent-fleet-$VERSION/aws/ec2-single/cfn.yaml$"
          tar tzf "agent-fleet-$VERSION.tar.gz" | grep -q "^agent-fleet-$VERSION/NOTICE$"
          tar tzf "agent-fleet-$VERSION.tar.gz" | grep -q "^agent-fleet-$VERSION/LICENSE$"
          # NOTICE must keep the primary-distribution URL that Apache-2.0 4(d) makes
          # redistributors carry forward
          tar xzf "agent-fleet-$VERSION.tar.gz" "agent-fleet-$VERSION/NOTICE" -O \
            | grep -q "github.com/k-k1/agent-fleet-dist"
          # release-ecr.sh is bundled with the execute bit set (P3 §35.7.3-5)
          tar tvzf "agent-fleet-$VERSION.tar.gz" | grep -E "^-rwx.* agent-fleet-$VERSION/aws/ecs/release-ecr\.sh$"
          tar xzf "agent-fleet-$VERSION.tar.gz" "agent-fleet-$VERSION/.env.example" -O | grep -q "^VERSION=$VERSION$"
          # no key material (gitignored) slipped into the bundle
          ! tar tzf "agent-fleet-$VERSION.tar.gz" | grep -E '(-key|\.pem)$'

      - name: assert CP image (docs denylist + /api/version stamp)
        run: |
          set -eux
          # the distribution-variant CP bakes docs with the internal denylist
          # (docs/.distignore) applied
          docker run --rm --entrypoint /bin/sh "agent-fleet/control-plane:$VERSION" -c '
            set -e
            d=/usr/local/share/agent-fleet/docs
            test -f "$d/35-packaging.md" && test -d "$d/dev" && test -d "$d/guide"
            test ! -e "$d/HANDOFF.md" && test ! -e "$d/CHANGELOG-handoff.md"
            test ! -e "$d/talk" && test ! -e "$d/history"'
          # version stamp: after boot, /api/version behind auth returns VERSION
          # (AUTH=dev has no gate). Booting with no mounts is intentional — the CP's
          # MkdirAll(dbPath parent) supports it, and this gate once caught an
          # immediate first-boot death (WS_DATA missing → sqlite open failure), so
          # we deliberately do not pre-create the directory.
          docker run -d --name cp-gate -p 8099:8099 -e CP_ADDR=:8099 -e WS_DATA=/tmp/af-data \
            "agent-fleet/control-plane:$VERSION"
          up=0
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8099/healthz 2>/dev/null | grep -qx ok; then up=1; break; fi
            sleep 1
          done
          if [ "$up" != 1 ]; then echo "CP never became healthy; logs:"; docker logs cp-gate; exit 1; fi
          curl -fsS http://127.0.0.1:8099/api/version | grep -F "\"version\":\"$VERSION\""
          docker logs cp-gate 2>&1 | grep -F "control-plane $VERSION on"
          docker rm -f cp-gate

      - name: assert workspace-agent version stamp (lean B)
        run: |
          set -eux
          out="$(docker run --rm --entrypoint /bin/bash "agent-fleet/workspace:$VERSION" \
            -c 'timeout 10 workspace-agent 2>&1 || true')"
          echo "$out" | grep -F "workspace-agent $VERSION listening"

      # Gate (l): nothing we ship carries a string this project removed from its
      # history (docs/35 §35.7.5). Runs before the tars are dropped, and expands
      # the image layers inside B — where the escape that motivated this gate
      # actually shipped.
      - name: forbidden-token scan (A+D)
        run: deploy/release/scan-forbidden.sh

      - name: free disk (drop dist tars)
        run: rm -rf deploy/release/dist

      - name: e2e-smoke (lean mode)
        run: EXPECT_AGENT_CLIS=0 deploy/local/e2e-smoke.sh "agent-fleet/workspace:$VERSION"

      - name: boot-install live run (lean B)
        timeout-minutes: 15
        run: |
          # the entrypoint (run at container start) boot-installs the versions.json
          # pins into ~/.local before bash verifies them. Network available
          # (npm / GitHub Releases).
          docker run --rm "agent-fleet/workspace:$VERSION" /bin/bash -lc '
            set -e
            pin() { node -e "process.stdout.write(String(require(\"/usr/local/share/agent-fleet/versions.json\")[process.argv[1]]||\"\"))" "$1"; }
            for c in claude opencode codex copilot; do
              test -e "$HOME/.local/bin/$c" || { echo "NG: $c not boot-installed"; exit 1; }
              v="$("$c" --version 2>/dev/null | grep -oE "[0-9]+\.[0-9]+\.[0-9]+" | head -1)"
              test "$v" = "$(pin "$c")" || { echo "NG: $c effective $v != pin $(pin "$c")"; exit 1; }
              echo "ok  $c $v (pinned)"
            done
            test -x "$HOME/.local/bin/rtk"
            rv="$(rtk --version 2>/dev/null | grep -oE "[0-9]+\.[0-9]+\.[0-9]+" | head -1)"
            test "$rv" = "$(pin rtk)" || { echo "NG: rtk $rv != pin $(pin rtk)"; exit 1; }
            echo "ok  rtk $rv (pinned)"
            test -x "$HOME/.local/bin/agy" || { echo "NG: agy not boot-installed"; exit 1; }
            test "$(cat "$HOME/.local/bin/.agy.version")" = "$(pin agy)" || { echo "NG: agy marker"; exit 1; }
            if grep -qw rdrand /proc/cpuinfo; then
              agy --version && echo "ok  agy $(pin agy) (--version ran)"
            else
              echo "ok  agy binary present (no rdrand on runner; --version skipped)"
            fi
            echo "== boot-install gate OK =="'

  # Gates (d)+(e) (P2 — docs/35 §35.7.2): build and content-check C (native tar) +
  # R (lean rootfs), then live-run on the runner = af start --rootfs → workspace
  # boots under bwrap → the rootfs entrypoint boot-installs the pins into the
  # virtual HOME. The end-to-end pass on plain WSL2 (no extra installs) remains
  # the P4 real-machine gate.
  native-gate:
    if: "!contains(github.event.head_commit.message, '[ecs-only]') && !contains(github.event.head_commit.message, '[dist-only]')"
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: build native artifacts (C+R+D)
        run: VERSION=$VERSION deploy/release/build.sh --native

      - name: assert artifacts (gate d)
        run: |
          set -eux
          cd deploy/release/dist
          C="agent-fleet-native-$VERSION-linux-amd64"
          test -f "$C.tar.gz"
          R="$(ls agent-fleet-rootfs-*-linux-amd64.tar.zst)"
          sha256sum -c SHA256SUMS
          tar tzf "$C.tar.gz" | grep -q "^$C/af$"
          # bundled binaries must be truly static (fail if ldd says dynamic)
          for b in af-cp bwrap git git-http-backend zstd; do
            test -x "$C/bin/$b"
            if ldd "$C/bin/$b" >/dev/null 2>&1; then echo "NOT STATIC: $b"; exit 1; fi
          done
          # the rootfs.json pin matches R (af verifies/extracts against this sha)
          sha="$(sed -n 's/.*"sha256": *"\([^"]*\)".*/\1/p' "$C/rootfs.json")"
          echo "$sha  $R" | sha256sum -c -
          # console / docs (denylist applied) / LICENSE / NOTICE / VERSION are bundled
          test -f "$C/console/index.html"
          test -f "$C/docs/35-packaging.md" && test -d "$C/docs/dev"
          test ! -e "$C/docs/HANDOFF.md" && test ! -e "$C/docs/talk" && test ! -e "$C/docs/history"
          test -f "$C/NOTICE" && test -f "$C/README.md" && test -f "$C/LICENSE"
          grep -q "github.com/k-k1/agent-fleet-dist" "$C/NOTICE"
          test "$(cat "$C/VERSION")" = "$VERSION"
          # the image-env manifest is injected into the rootfs (CP rootfs mode
          # depends on it)
          tar -I zstd -tf "$R" | grep -q '^usr/local/share/agent-fleet/image-env.json$'

      # Gate (l) for the native side: C carries the same Console bundle the CP
      # image does, so it needs the same scan (docs/35 §35.7.5).
      - name: forbidden-token scan (C+R+D)
        run: deploy/release/scan-forbidden.sh

      - name: install.sh flow against built C (file:// — gate i)
        run: |
          set -eux
          DIST="$PWD/deploy/release/dist"
          C="agent-fleet-native-$VERSION-linux-amd64"
          # installer ↔ real artifact fit: feed the real C tar + SHA256SUMS via
          # file:// (not a fake layout), up to running the installed af.
          mkdir -p "/tmp/dist-layout/v$VERSION"
          cp "$DIST/$C.tar.gz" "$DIST/SHA256SUMS" "/tmp/dist-layout/v$VERSION/"
          AF_DIST_URL_BASE="file:///tmp/dist-layout" AF_VERSION="$VERSION" \
            AF_PREFIX=/tmp/af-prefix bash deploy/release/dist-repo/install.sh
          test -L /tmp/af-prefix/bin/af
          /tmp/af-prefix/bin/af help
          /tmp/af-prefix/bin/af status | grep -q "control-plane: stopped"
          # PKG (where rootfs.json lives) resolves correctly even via the symlink:
          # if it resolved, we reach the "--rootfs ... not found" error
          ( /tmp/af-prefix/bin/af start --rootfs /nonexistent 2>&1 || true ) \
            | grep -q "rootfs /nonexistent not found"

      - name: enable unprivileged userns (ubuntu 24.04 runner)
        run: |
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0 || true

      - name: live run (gate e) — af start --rootfs → workspace up → boot-install pins
        timeout-minutes: 30
        run: |
          set -eux
          DIST="$PWD/deploy/release/dist"
          C="agent-fleet-native-$VERSION-linux-amd64"
          R="$(ls "$DIST"/agent-fleet-rootfs-*.tar.zst)"
          RUN=/tmp/af-native; mkdir -p "$RUN"
          tar xzf "$DIST/$C.tar.gz" -C "$RUN"
          export WS_DATA=/tmp/af-native-data
          ( cd "$RUN/$C" && exec ./af start --rootfs "$R" ) > /tmp/af-cp.log 2>&1 &
          AF_PID=$!
          up=0
          for i in $(seq 1 90); do
            if curl -fsS http://127.0.0.1:8099/healthz 2>/dev/null | grep -qx ok; then up=1; break; fi
            sleep 1
          done
          if [ "$up" != 1 ]; then echo "CP never became healthy:"; cat /tmp/af-cp.log; exit 1; fi
          curl -fsS http://127.0.0.1:8099/api/version | grep -F "\"version\":\"$VERSION\""
          # start the workspace (AUTH=dev). Start is synchronous until the agent is
          # healthy — the first run includes the rootfs entrypoint's boot-install
          # (downloading pins), so it takes minutes (health wait default 300s).
          # On failure, dump both CP and agent logs to keep the cause.
          set +e
          code="$(curl -sS --max-time 570 -o /tmp/start-out.json -w '%{http_code}' -X POST http://127.0.0.1:8099/api/workspace/start)"
          set -e
          echo "start: http=$code body=$(cat /tmp/start-out.json 2>/dev/null || true)"
          if [ "$code" != 200 ] || ! grep -qF '"state":"running"' /tmp/start-out.json; then
            echo '=== af-cp.log ==='; cat /tmp/af-cp.log || true
            echo '=== agent.log ==='; tail -n 200 "$WS_DATA"/dev/agent.log || true
            ls -la "$WS_DATA"/dev 2>/dev/null || true
            exit 1
          fi
          # the agent under bwrap is alive (checked via the CP's workspace state)
          curl -fsS http://127.0.0.1:8099/api/workspace | grep -F '"state":"running"'
          # boot-install: pinned CLIs are in the virtual HOME (the point of lean rootfs)
          HOMEDIR="$WS_DATA/dev/home"
          ls -la "$HOMEDIR/.local/bin" || true
          for c in claude opencode codex copilot rtk agy; do
            test -e "$HOMEDIR/.local/bin/$c" || { echo "NG: $c not boot-installed"; tail -200 "$WS_DATA"/dev/agent.log; exit 1; }
          done
          # version match is checked via npm's install record (package.json) and
          # agy's version marker (avoids running CLIs from outside the rootfs and
          # agy's RDRAND requirement).
          VJ="$(ls "$WS_DATA"/shared/rootfs/*/usr/local/share/agent-fleet/versions.json | head -1)"
          for pair in "claude=@anthropic-ai/claude-code" "opencode=opencode-ai" \
                      "codex=@openai/codex" "copilot=@github/copilot"; do
            k="${pair%%=*}"; pkg="${pair#*=}"
            pin="$(jq -r ".$k" "$VJ")"
            got="$(jq -r .version "$HOMEDIR/.local/lib/node_modules/$pkg/package.json")"
            test "$got" = "$pin" || { echo "NG: $k $got != pin $pin"; exit 1; }
            echo "ok  $k $got (pinned)"
          done
          test "$(cat "$HOMEDIR/.local/bin/.agy.version")" = "$(jq -r .agy "$VJ")"
          echo "== native live gate OK =="
          # cleanup: stop the CP → af reset --all must remove everything
          curl -fsS -X POST http://127.0.0.1:8099/api/workspace/stop
          kill "$AF_PID" 2>/dev/null || true
          for i in $(seq 1 20); do pgrep -f "$RUN/$C/bin/af-cp" >/dev/null || break; sleep 1; done
          pgrep -f "$RUN/$C/bin/af-cp" >/dev/null && { pkill -TERM -f "$RUN/$C/bin/af-cp"; sleep 2; } || true
          ( cd "$RUN/$C" && WS_DATA="$WS_DATA" ./af reset --all --yes )
          test ! -e "$WS_DATA"

  # Gate (g) (P3 — docs/35 §35.7.3): static verification of the ECS release
  # procedure. Lightweight job, no docker/AWS: cfn-lint (4 templates incl. the
  # LanguageExtensions/Persistence branches), shellcheck, and a stub run of
  # release-ecr.sh (fake aws/docker pin the call sequence and ECR URIs). A full
  # sandbox pass (gate h) needs real credentials and stays outside CI.
  ecs-gate:
    if: "!contains(github.event.head_commit.message, '[dist-only]')"
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: cfn-lint (ecs cfn templates)
        run: |
          pip install --quiet cfn-lint
          cfn-lint deploy/aws/ecs/cfn/*.yaml

      # cfn-lint passes a template that exports an empty value (measured, 1.53.1) and
      # so does validate-template — the failure only appears at CREATE, after every
      # resource is built, and rolls the stack back. 0.10.0 shipped exactly that in
      # 40-ec2-pool, which made a fresh ecs-ec2 deployment impossible.
      - name: no empty CFN exports (would roll a fresh stack back)
        run: python3 deploy/aws/ecs/check-cfn-exports.py deploy/aws/ecs/cfn/*.yaml deploy/aws/ec2-single/cfn.yaml

      - name: shellcheck + syntax
        run: |
          bash -n deploy/aws/ecs/release-ecr.sh
          shellcheck deploy/aws/ecs/release-ecr.sh

      - name: release-ecr.sh stub run (call-sequence gate)
        run: deploy/local/release-ecr-stub-test.sh

  # Gate (i) (P4 — docs/35 §35.7.4): verifies the dist publish set. Lightweight
  # job, no docker: shellcheck + stub run of publish-dist.sh/install.sh (fake gh /
  # file:// layout) + real chromium CDN download check (the measuring point of
  # §35.9-7(a) — the dev WS network gets PRSS 400s and cannot measure it. Note:
  # all 3 hosts redirect-converge on PRSS = effectively one origin, two doors).
  dist-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: shellcheck + syntax
        run: |
          set -eux
          for f in deploy/release/publish-dist.sh deploy/release/dist-repo/install.sh \
                   deploy/release/dist-repo/install-compose.sh \
                   deploy/release/notes-body.sh deploy/release/gen-changelog.sh \
                   deploy/release/scan-forbidden.sh \
                   deploy/release/republish-dist.sh \
                   deploy/local/dist-stub-test.sh deploy/local/republish-stub-test.sh; do
            bash -n "$f"
          done
          shellcheck deploy/release/publish-dist.sh deploy/release/dist-repo/install.sh \
            deploy/release/dist-repo/install-compose.sh \
            deploy/release/notes-body.sh deploy/release/gen-changelog.sh \
            deploy/release/scan-forbidden.sh \
            deploy/release/republish-dist.sh \
            deploy/local/dist-stub-test.sh deploy/local/republish-stub-test.sh

      - name: publish/install stub run (call-sequence + file:// flow)
        run: deploy/local/dist-stub-test.sh

      # republish-dist.sh rewrites a published release body in place; the stub
      # pins that it replaces the notice without eating the notes underneath.
      - name: republish stub run (notice rewrite + refusal paths)
        run: deploy/local/republish-stub-test.sh

      # The seeded CHANGELOGs are generated from notes/index.tsv + the notes files;
      # this catches a ledger row or notes edit that was not regenerated.
      - name: dist CHANGELOG is up to date
        run: deploy/release/gen-changelog.sh --check

      # Every version in the ledger must have canonical (English) notes, or the
      # publish would fail at render time.
      - name: every released version has notes
        run: |
          set -eu
          while IFS="$(printf '\t')" read -r v _date _commit; do
            case "$v" in ''|\#*) continue ;; esac
            test -f "deploy/release/notes/$v.md" \
              || { echo "::error::missing release notes: deploy/release/notes/$v.md"; exit 1; }
          done < deploy/release/notes/index.tsv

      - name: chromium CDN real download (pinned build)
        run: |
          set -eux
          # amd64 = Chrome for Testing (the chromium_cft pin = browser version;
          # playwright 1.61 moved x64 from builds/chromium to CfT — old URLs give
          # bucket 404 / PRSS 400)
          CFT="$(sed -n 's/^ARG CHROMIUM_CFT_VERSION=\(.*\)$/\1/p' workspace/Dockerfile)"
          test -n "$CFT"
          U1="https://cdn.playwright.dev/builds/cft/$CFT/linux64/chrome-linux64.zip"
          U2="https://storage.googleapis.com/chrome-for-testing-public/$CFT/linux64/chrome-linux64.zip"
          # path 1: full download → check zip integrity and the chrome binary
          # (the chrome-linux64/chrome layout install-chromium expects)
          curl -fSL --retry 3 -o /tmp/c1.zip "$U1"
          unzip -l /tmp/c1.zip | grep -q 'chrome-linux64/chrome$'
          head -c 1024 /tmp/c1.zip > /tmp/c1.head
          # path 2 (Google's official CfT bucket = a truly independent fallback):
          # ranged GET works and the first 1KiB is identical to path 1
          curl -fsSL --retry 3 -r 0-1023 -o /tmp/c2.head "$U2"
          cmp /tmp/c1.head /tmp/c2.head
          # arm64 (chromium_dl pin = old builds/chromium layout): all 3 paths exist
          PIN="$(sed -n 's/^ARG CHROMIUM_DL_VERSION=\(.*\)$/\1/p' workspace/Dockerfile)"
          test -n "$PIN"
          Z=chromium-linux-arm64.zip
          for u in "https://cdn.playwright.dev/dbazure/download/playwright/builds/chromium/$PIN/$Z" \
                   "https://playwright.download.prss.microsoft.com/dbazure/download/playwright/builds/chromium/$PIN/$Z" \
                   "https://cdn.playwright.dev/builds/chromium/$PIN/$Z"; do
            curl -fsSL --retry 3 -r 0-1023 -o /dev/null "$u"
          done
          # CJK font (noto_cjk pin) raw URL reachability
          NOTO="$(sed -n 's/^ARG NOTO_CJK_VERSION=\(.*\)$/\1/p' workspace/Dockerfile)"
          test -n "$NOTO"
          curl -fsSI -o /dev/null "https://raw.githubusercontent.com/notofonts/noto-cjk/$NOTO/Sans/Variable/OTC/NotoSansCJK-VF.otf.ttc"

  # Gate (c): the fully-baked internal build (self-host / run-dev with
  # BAKE_AGENT_CLIS=1) and e2e-smoke pass unchanged. NOTE: the Dockerfile ARG
  # default is now lean-CLI (BAKE_AGENT_CLIS=0), so this gate bakes the CLIs in
  # explicitly to keep the baked self-host path covered; lean-CLI coverage lives
  # in the dist/native gates. The CP also builds with the default DOCS_SRC
  # (full docs tree).
  default-image-gate:
    if: "!contains(github.event.head_commit.message, '[native-only]') && !contains(github.event.head_commit.message, '[ecs-only]') && !contains(github.event.head_commit.message, '[dist-only]')"
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: build workspace image (baked variant, explicit BAKE_AGENT_CLIS=1)
        run: docker build --build-arg BAKE_AGENT_CLIS=1 -t agent-fleet/workspace:ci-default workspace

      - name: e2e-smoke (default)
        run: deploy/local/e2e-smoke.sh agent-fleet/workspace:ci-default

      - name: build CP image (default DOCS_SRC = full docs tree)
        run: |
          set -eux
          docker build -f control-plane/Dockerfile -t agent-fleet/control-plane:ci-default .
          # in-house builds keep the full tree (HANDOFF present = denylist applies
          # to distribution only)
          docker run --rm --entrypoint /bin/sh agent-fleet/control-plane:ci-default -c '
            test -f /usr/local/share/agent-fleet/docs/HANDOFF.md'
