# CLI version drift monitoring (P0).
#
# What we want to catch: **the gap between the version CI verifies and the version
# the live fleet runs**. The ARG pins in workspace/Dockerfile only apply at bake
# time; a Workspace opted into self-update (AF_AGENT_SELF_UPDATE_ALLOWED=1 and
# AF_AGENT_SELF_UPDATE=1) has entrypoint.sh install @latest on every boot. Meanwhile
# e2e.yml passes no build-args and always verifies a pinned-version image = CI stays
# green even when a new release breaks things (which is why claude state detection
# broke 3 times and was found by humans every time).
#
# This job does not detect the breakage itself (that is the job of the contract
# tests that run the real CLIs = P1). It only says "time to go look" — still better
# than today, where nobody notices new releases.
#
# Noise design: drift is the **steady state** (claude moves ahead within days).
# Going red every night would get ignored immediately, so on drift the job stays
# green and we **upsert a single tracking issue** (auto-closed once resolved). The
# job goes red only when the check itself breaks (npm fetch failure etc.).
#
# Note: schedule runs on the workflow definition of the default branch (develop).
name: cli-drift

on:
  schedule:
    - cron: "0 20 * * *" # daily 05:00 JST
  workflow_dispatch:
  # No push trigger (spreads billing; develop-trunk workflow). Verifying script
  # changes via the daily cron or workflow_dispatch is enough.

permissions:
  contents: read
  issues: write

concurrency:
  group: cli-drift
  cancel-in-progress: false

jobs:
  drift:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      TITLE: "CLI version drift: Dockerfile pins are behind npm latest"
    steps:
      - uses: actions/checkout@v4

      - name: check drift
        id: check
        run: |
          set +e
          deploy/local/cli-drift-check.sh > /tmp/drift.txt 2>&1
          code=$?
          set -e
          cat /tmp/drift.txt
          echo "code=$code" >> "$GITHUB_OUTPUT"
          # 2 = the check itself failed (unreadable ARG / npm view failure) -> go red here.
          # 1 = drift (= steady state). Handled via the issue; keep the job green.
          if [ "$code" = 2 ]; then exit 2; fi

      - name: find tracking issue
        id: issue
        run: |
          num="$(gh issue list --state open --search "in:title CLI version drift" --json number,title \
                 --jq ".[] | select(.title == \"$TITLE\") | .number" | head -1)"
          echo "num=$num" >> "$GITHUB_OUTPUT"

      - name: open / update tracking issue
        if: steps.check.outputs.code == '1'
        run: |
          # Build the body with quoted heredocs (don't let the shell interpret the report text).
          {
            cat <<'HEAD'
          The ARG pins in `workspace/Dockerfile` are behind npm latest.

          ```
          HEAD
            cat /tmp/drift.txt
            cat <<'TAIL'
          ```

          **Workspaces opted into self-update are running these latest versions** (what CI
          verifies is the pinned versions). Check that no upstream breakage has slipped in:

          1. Run `claude --version` on a real workspace to confirm the effective version
             (don't trust the pin).
          2. Re-verify the state-detection footer contract — recapture real panes following
             `workspace/agent/internal/tmuxx/testdata/footers/SOURCE.txt` and diff against
             the golden corpus.
          3. If all is well, bump the ARGs (= bring what CI verifies back in line with the
             live fleet).

          <sub>Auto-updated by cli-drift.yml. Closes automatically once the pins catch up
          to latest.</sub>
          TAIL
          } > /tmp/body.md

          gh label create cli-drift --color FBCA04 --description "upstream CLI version drift" 2>/dev/null || true
          if [ -n "${{ steps.issue.outputs.num }}" ]; then
            gh issue edit "${{ steps.issue.outputs.num }}" --body-file /tmp/body.md
            echo "updated issue #${{ steps.issue.outputs.num }}"
          else
            gh issue create --title "$TITLE" --body-file /tmp/body.md --label cli-drift
          fi

      - name: close tracking issue when back in sync
        if: steps.check.outputs.code == '0' && steps.issue.outputs.num != ''
        run: |
          gh issue close "${{ steps.issue.outputs.num }}" \
            --comment "Pins have caught up to npm latest (cli-drift.yml)."
