# CLI version drift monitoring (P0).
#
# What we want to catch: **the gap between the version CI verifies and the version
# the live fleet runs**. The ARG pins in workspace/Dockerfile only apply at bake
# time; a Workspace opted into self-update (AF_AGENT_SELF_UPDATE_ALLOWED=1 and
# AF_AGENT_SELF_UPDATE=1) has entrypoint.sh install @latest on every boot. Meanwhile
# e2e.yml passes no version build-args and always verifies a pinned-version image = CI stays
# green even when a new release breaks things (which is why claude state detection
# broke 3 times and was found by humans every time).
#
# This job does not detect the breakage itself (that is the job of the contract
# tests that run the real CLIs = P1). It only says "time to go look" — still better
# than today, where nobody notices new releases.
#
# Noise design: drift is the **steady state** (claude moves ahead within days), and
# most of it needs no person: the watcher runs the contract and cli-pin-bump.yml opens
# the PR. So the job stays green on drift and keeps **one issue per CLI, open only while
# a person has something to do** (deploy/local/cli-update-issues.sh): its title is the
# next step and a PR closes it. The job goes red only when the check itself breaks.
#
# Note: schedule runs on the workflow definition of the default branch (main).
name: cli-drift

on:
  schedule:
    # Every 2 hours, on the hour. The order drift (:00) -> watcher (:30) -> pin-bump (next
    # odd hour, :00) is what the three schedules are tuned to; keep them together.
    - cron: "0 */2 * * *"
  workflow_dispatch:
  # No push trigger (spreads billing; main-trunk workflow). Verifying script
  # changes via the cron or workflow_dispatch is enough.

permissions:
  actions: read # contract-health lists the contract workflows' recent runs
  contents: read
  issues: write
  pull-requests: read # the update issues link the open pin-bump PR

concurrency:
  group: cli-drift
  cancel-in-progress: false

jobs:
  drift:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v7

      - name: check drift
        id: check
        run: |
          set +e
          deploy/local/cli-drift-check.sh > /tmp/drift.txt 2>&1
          code=$?
          set -e
          cat /tmp/drift.txt
          echo "code=$code" >> "$GITHUB_OUTPUT"
          # 2 = not one release source answered -> the check could not run, go red here.
          # A single unreadable row instead comes back in `failed=` and leaves the other
          # rows' verdicts intact.
          # 1 = drift (= steady state). Handled via the issue; keep the job green.
          if [ "$code" = 2 ]; then exit 2; fi

      # Red contracts live in one section of each CLI's update issue (a failing contract
      # writes its own row; see deploy/local/cli-contract-report.sh). Refreshed before the
      # issues are synced, because the rows decide what the next step is.
      #
      # N = 2. Contract runs are rare (a release edge, plus a weekly cron for three of them),
      # so waiting for 3 would take weeks to notice a harness regression, while one run alone
      # is what a single bad release or a flaky network already produces. Two in a row is the
      # smallest count that says "not this version". Cancelled runs do not count either way.
      - name: contract health (stale rows, consecutive red runs)
        env:
          VERSIONS_JSON: ${{ toJSON(steps.check.outputs) }}
        run: |
          # A reporting failure must not turn the drift check itself red.
          deploy/local/cli-contract-report.sh prune || echo "::warning::could not prune the red-contract rows"
          . deploy/local/cli-manifest.sh
          manifest_load
          for kind in $(manifest_tested_kinds); do
            wf="${M_contract[$kind]%.yml}"
            deploy/local/cli-contract-report.sh streak "$wf" 2 || echo "::warning::streak check failed for $wf"
          done

      # One issue per CLI, open only while a person has something to do; the title is the
      # next step. `false` marks a contract the watcher cannot run for want of its secret.
      - name: sync the per-CLI update issues
        env:
          CRED_CLAUDE: ${{ secrets.E2E_ANTHROPIC_API_KEY != '' || secrets.E2E_CLAUDE_OAUTH_TOKEN != '' }}
          CRED_COPILOT: ${{ secrets.E2E_COPILOT_GITHUB_TOKEN != '' }}
          CRED_AGY: ${{ secrets.E2E_AGY_OAUTH_TOKEN != '' }}
        run: deploy/local/cli-update-issues.sh sync

  # Debian package pins (workspace/Dockerfile `ARG CHROMIUM_VERSION`). trixie-security
  # keeps only the current build, so a pin vanishes the day Debian ships the next update,
  # possibly for one architecture first; the next uncached image build then fails. Unlike
  # CLI drift this is not a steady state — the image cannot be built — so the job goes
  # red, and its output names the version served on every architecture to bump to.
  apt-pins:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - name: pinned Debian packages are served for amd64 and arm64
        run: deploy/local/apt-pin-check.sh

  # プラン決着の文言ドリフト（クレデンシャル不要・毎日）。
  #
  # 上の drift ジョブが答えるのは「ピンが遅れているか」だけで、**上流が文言を変えたか**は
  # 誰も見ていなかった。2026-08-31、承認結果に計画本文が丸ごと付くようになり、Console の
  # キーワード判定が本文の「却下」を拾って**承認したプランに 却下 バッジ**が付いた
  # （単体テストは既知の形を固定しているだけなので全部緑のまま）。
  #
  # ここは実 CLI（latest = self-update した Workspace が走らせる版）に、製品コードが
  # 読んでいる文言がまだ在るかだけを見る。実ターンも認証も要らないので毎日回せる。
  # ⚠ 文字列が在ることは「今もその場所で使われている」証明ではない — 経路まで通す証明は
  # claude-tui-contract.yml の plan approval contract（実 TUI・要クレデンシャル）の役目。
  #
  # 版ドリフトと違ってこれは**定常状態ではない**（起きたら製品側の修正が要る）ので、
  # issue ではなく普通に赤くする。
  plan-result-format:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-agent-cli
        with:
          agent: claude
          version: latest
      - name: plan result literals
        working-directory: workspace/agent
        env:
          E2E_REQUIRE: "1" # CLI が入っていないのに skip で緑になるのを防ぐ
        run: |
          go test -tags contract -run '^TestDriftClaudePlanResultLiterals$' \
            -count=1 -v -timeout 5m .
