# Cursor credentials are refreshable local auth state, so a real turn is dispatched
# only when its encrypted CI secret is configured. A failed/expired auth never advances
# the release marker, and the cursor update issue (cli-update-issues.sh) stays open.
#
# E2E_CURSOR_AUTH_JSON is ~/.config/cursor/auth.json from a login used by CI only.
# A second login or a logout of the same session revokes it, and `cursor-agent status`
# still says "authenticated" for a revoked token while the TUI stops at "Press any key
# to log in..." (#1003). The token is a JWT that lives about 60 days; the restore step
# fails once it has expired and warns in its last 14 days. To regenerate it:
#   h=$(mktemp -d) && HOME=$h cursor-agent login \
#     && gh secret set E2E_CURSOR_AUTH_JSON < "$h/.config/cursor/auth.json"; rm -rf "$h"
#
# A thin caller of cli-contract.yml: triggers, the credential and the test scripts live here.
name: cursor-contract

on:
  workflow_dispatch:
    inputs:
      cli_version:
        description: "cursor-agent version to verify (latest for self-update-enabled Workspaces)"
        type: string
        default: latest

permissions:
  actions: read # the failure report lists this run's failed steps
  contents: read
  issues: write

concurrency:
  group: cursor-contract
  cancel-in-progress: false

jobs:
  tui-mirror:
    uses: ./.github/workflows/cli-contract.yml
    secrets:
      E2E_CURSOR_AUTH_JSON: ${{ secrets.E2E_CURSOR_AUTH_JSON }}
    with:
      cli: cursor
      version: ${{ inputs.cli_version }}
      timeout_minutes: 40
      # `cursor-agent --version` prints the whole version (a date and a hash): keep the line.
      version_pattern: raw
      guard: |
        set -euo pipefail
        AUTH="$E2E_CURSOR_AUTH_JSON"
        [ -n "$AUTH" ] || { echo '::error::register secrets.E2E_CURSOR_AUTH_JSON'; exit 1; }
        install -d -m 700 "$HOME/.config/cursor"
        umask 077
        printf '%s' "$AUTH" > "$HOME/.config/cursor/auth.json"
        jq -e . "$HOME/.config/cursor/auth.json" >/dev/null
        # Read only the expiry claim of the access token; never print the token.
        payload="$(jq -r '.accessToken // empty' "$HOME/.config/cursor/auth.json" | cut -d. -f2 | tr '_-' '/+')"
        while [ $(( ${#payload} % 4 )) -ne 0 ]; do payload="$payload="; done
        exp="$(printf '%s' "$payload" | base64 -d 2>/dev/null | jq -r '.exp // empty' 2>/dev/null || true)"
        if [ -z "$exp" ]; then
          echo '::warning::E2E_CURSOR_AUTH_JSON has no readable accessToken expiry'
        else
          left=$(( (exp - $(date +%s)) / 86400 ))
          echo "E2E_CURSOR_AUTH_JSON access token expires $(date -u -d "@$exp" +%F) ($left days left)"
          [ "$exp" -gt "$(date +%s)" ] || { echo '::error::E2E_CURSOR_AUTH_JSON has expired; regenerate it (see the header of this workflow)'; exit 1; }
          [ "$left" -ge 14 ] || echo "::warning::E2E_CURSOR_AUTH_JSON expires in $left days; regenerate it (see the header of this workflow)"
        fi
      test_0_name: real TUI and mirror contract
      test_0_env: |
        E2E_REQUIRE=1
      test_0: |
        go test -tags contract -run '^TestCursorTUIMirrorContract$' -count=1 -v -timeout 12m .
      # Declared Caps against observed behaviour (interrupt, fork-at, model override): the same
      # test as above in AF_CAPS_PROBES=only mode, so it reuses this kind's auth setup. Costs one
      # interrupted long turn and three one-line turns (up to five when the model probe meets
      # explicit refusals). Advisory unless the repository variable CAPS_PROBES_BLOCKING is
      # 'true' (see cli-contract.yml).
      caps: |
        export E2E_REQUIRE=1 AF_CAPS_PROBES=only
        go test -tags contract -run '^TestCursorTUIMirrorContract$' -count=1 -v -timeout 15m .

  # The `tested` this run may have recorded is what a bump waits for; see cli-pin-bump.yml's
  # `on:` for why this dispatches it instead of relying on `workflow_run`. A job of its own,
  # so actions: write never reaches the steps that run the CLI. Whatever the result:
  # cli-pin-bump decides by `tested == latest` and changes nothing when nothing is due.
  pin-bump:
    needs: tui-mirror
    if: ${{ !cancelled() && github.event_name != 'pull_request' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: write
    steps:
      - name: dispatch cli-pin-bump
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh workflow run cli-pin-bump.yml --repo "$GITHUB_REPOSITORY" --ref main
