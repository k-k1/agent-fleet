# Cursor credentials are refreshable local auth state, so a real turn is dispatched
# only when its encrypted CI secret is configured. A failed/expired auth never advances
# the release marker, and the cursor update issue (cli-update-issues.sh) stays open.
#
# E2E_CURSOR_AUTH_JSON is ~/.config/cursor/auth.json from a login used by CI only.
# A second login or a logout of the same session revokes it, and `cursor-agent status`
# still says "authenticated" for a revoked token while the TUI stops at "Press any key
# to log in..." (#1003). The token is a JWT that lives about 60 days; the restore step
# fails once it has expired and warns in its last 14 days. To regenerate it:
#   h=$(mktemp -d) && HOME=$h cursor-agent login \
#     && gh secret set E2E_CURSOR_AUTH_JSON < "$h/.config/cursor/auth.json"; rm -rf "$h"
name: cursor-contract

on:
  workflow_dispatch:
    inputs:
      cli_version:
        description: "cursor-agent version to verify (latest for self-update-enabled Workspaces)"
        type: string
        default: latest

permissions:
  actions: read # the failure report lists this run's failed steps
  contents: read
  issues: write

concurrency:
  group: cursor-contract
  cancel-in-progress: false

jobs:
  tui-mirror:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7
      - name: restore encrypted Cursor auth state
        env:
          AUTH: ${{ secrets.E2E_CURSOR_AUTH_JSON }}
        run: |
          set -euo pipefail
          [ -n "$AUTH" ] || { echo '::error::register secrets.E2E_CURSOR_AUTH_JSON'; exit 1; }
          install -d -m 700 "$HOME/.config/cursor"
          umask 077
          printf '%s' "$AUTH" > "$HOME/.config/cursor/auth.json"
          jq -e . "$HOME/.config/cursor/auth.json" >/dev/null
          # Read only the expiry claim of the access token; never print the token.
          payload="$(jq -r '.accessToken // empty' "$HOME/.config/cursor/auth.json" | cut -d. -f2 | tr '_-' '/+')"
          while [ $(( ${#payload} % 4 )) -ne 0 ]; do payload="$payload="; done
          exp="$(printf '%s' "$payload" | base64 -d 2>/dev/null | jq -r '.exp // empty' 2>/dev/null || true)"
          if [ -z "$exp" ]; then
            echo '::warning::E2E_CURSOR_AUTH_JSON has no readable accessToken expiry'
          else
            left=$(( (exp - $(date +%s)) / 86400 ))
            echo "E2E_CURSOR_AUTH_JSON access token expires $(date -u -d "@$exp" +%F) ($left days left)"
            [ "$exp" -gt "$(date +%s)" ] || { echo '::error::E2E_CURSOR_AUTH_JSON has expired; regenerate it (see the header of this workflow)'; exit 1; }
            [ "$left" -ge 14 ] || echo "::warning::E2E_CURSOR_AUTH_JSON expires in $left days; regenerate it (see the header of this workflow)"
          fi
      - uses: ./.github/actions/setup-agent-cli
        id: cli
        with:
          agent: cursor
          version: ${{ inputs.cli_version }}
      - name: real TUI and mirror contract
        id: contract_0
        working-directory: workspace/agent
        env:
          E2E_REQUIRE: "1"
        run: go test -tags contract -run '^TestCursorTUIMirrorContract$' -count=1 -v -timeout 12m .
      - name: remember successfully tested latest
        if: success() && inputs.cli_version == 'latest'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          EFFECTIVE: ${{ steps.cli.outputs.version }}
        run: |
          version="$(printf '%s' "$EFFECTIVE" | head -1)"
          [ -n "$version" ]
          deploy/local/cli-release-state.sh set tested cursor "$version"

      # Declared Caps against observed behaviour (interrupt, fork-at, model override): the
      # same test as above in AF_CAPS_PROBES=only mode, so it reuses this kind's auth setup.
      # Placed after "remember successfully tested latest" on purpose: a capability that
      # drifted is a finding for the update issue, not a reason to call the mirror contract
      # of this version untested. Costs one interrupted long turn and two one-line turns.
      #
      # ADVISORY until the repository variable CAPS_PROBES_BLOCKING is 'true' (the one switch,
      # shared by the cursor, copilot and kiro workflows; docs/build/10-development.md, "Promoting
      # the caps drift probes"). Advisory: a DRIFT or probe error leaves this step `outcome:
      # failure` but `conclusion: success`, so the job stays green, `failure()` stays false and the
      # red-contract report below never sees it; "report caps probe outcome" records it without
      # the watcher's `red` marker. Blocking: the step fails the job and is reported as a red contract.
      - name: caps drift probes
        id: caps_probe
        continue-on-error: ${{ vars.CAPS_PROBES_BLOCKING != 'true' }}
        working-directory: workspace/agent
        env:
          E2E_REQUIRE: "1"
          AF_CAPS_PROBES: only
        run: go test -tags contract -run '^TestCursorTUIMirrorContract$' -count=1 -v -timeout 15m .

      # Advisory findings only (see above). Never writes or clears the `red` marker or the
      # red-contract row: those belong to the mirror contract. A pass clears this kind's advisory
      # row. Skipped when the probes did not run, were cancelled, or are blocking and failed.
      - name: report caps probe outcome
        if: ${{ !cancelled() && (steps.caps_probe.outcome == 'success' || (steps.caps_probe.outcome == 'failure' && steps.caps_probe.conclusion == 'success')) }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          OUTCOME: ${{ steps.caps_probe.outcome }}
          EFFECTIVE: ${{ steps.cli.outputs.version }}
          CLI_VERSION: ${{ inputs.cli_version }}
        run: |
          version="$(printf '%s' "$EFFECTIVE" | head -1 || true)"
          if [ "$OUTCOME" = failure ]; then
            echo "::warning title=cursor caps drift probes::DRIFT or probe error (advisory, job not failed). Set repository variable CAPS_PROBES_BLOCKING=true to gate on it."
            {
              echo "### cursor caps drift probes: DRIFT or probe error (advisory)"
              echo
              echo "The mirror contract result stands; no red-contract row or marker was written. Read the \`caps drift probes\` step log for the \`DRIFT\` lines."
            } >> "$GITHUB_STEP_SUMMARY"
            [ "$CLI_VERSION" = latest ] || exit 0
            deploy/local/cli-contract-report.sh advisory cursor "${version:-unknown}" || echo "::warning::could not record the advisory caps finding"
          elif [ "$CLI_VERSION" = latest ]; then
            deploy/local/cli-contract-report.sh advisory-clear cursor || echo "::warning::could not clear the advisory caps row"
          fi

      # Clearing the red-contract row waits for the probes: when they block, a success before them
      # would drop the previous run's row (and, when pin == latest, let the sync close the update
      # issue) only for a red probe to open a new one on every re-run of the same version. An
      # advisory probe failure does not stop this step (the step's conclusion is success), and this
      # step never touches the advisory caps row. A cancelled probe step leaves the earlier row standing.
      - name: clear red-contract row
        if: success() && inputs.cli_version == 'latest'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: deploy/local/cli-contract-report.sh success cursor || echo "::warning::could not clear the red-contract row"

      # A red run of `latest` is written into that CLI's update issue and, for kinds the
      # watcher dispatches by itself, stops it re-dispatching this version every 2 hours
      # (deploy/local/cli-contract-report.sh). A cancelled or timed-out run is not
      # `failure()`, so it leaves no marker and the version is retried. Only a failed contract
      # step counts: a setup or credential-guard failure ran no test and spent no quota, so it
      # is retried by the next watcher run instead of being held until a human acts.
      - name: report failed contract for latest
        if: failure() && (steps.contract_0.conclusion == 'failure' || steps.caps_probe.conclusion == 'failure') && inputs.cli_version == 'latest'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          EFFECTIVE: ${{ steps.cli.outputs.version }}
        run: |
          version="$(printf '%s' "$EFFECTIVE" | head -1 || true)"
          deploy/local/cli-contract-report.sh failure cursor "${version:-unknown}"
