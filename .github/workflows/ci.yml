# CI (docs/23 P0): automates the manual checks from CONTRIBUTING.md (gofmt / vet /
# test / build). Verifies the 3 components in independent jobs. Extra linters
# (golangci-lint etc.) may follow as opt-in.
#
# Billing spread (develop-trunk workflow; CONTRIBUTING "Commits & PRs"): hosted CI does
# not run on pushes to develop (per-commit verification is each session's local runs).
# Hosted CI is concentrated on the main gate (develop→main PRs and post-merge main pushes).
name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  control-plane:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: control-plane
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: control-plane/go.mod
          cache-dependency-path: control-plane/go.sum
      - name: gofmt
        run: |
          out=$(gofmt -l .)
          if [ -n "$out" ]; then echo "gofmt needed:"; echo "$out"; exit 1; fi
      - name: go vet
        run: go vet ./...
      - name: go build
        run: go build ./...
      - name: go test
        run: go test ./...

  workspace-agent:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: workspace/agent
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: workspace/agent/go.mod
          cache-dependency-path: workspace/agent/go.sum
      - name: gofmt
        run: |
          out=$(gofmt -l .)
          if [ -n "$out" ]; then echo "gofmt needed:"; echo "$out"; exit 1; fi
      - name: go vet
        run: go vet ./...
      - name: go build
        run: go build ./...
      - name: go test
        run: go test ./...

  console:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: console
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: console/package-lock.json
      - name: npm ci
        run: npm ci
      - name: typecheck
        run: npm run typecheck
      - name: i18n-lint
        run: npm run i18n:lint
      - name: vitest
        run: npm test
      - name: build
        run: npm run build
