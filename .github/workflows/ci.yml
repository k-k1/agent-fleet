# CI (docs/log/23 P0): automates the manual checks from CONTRIBUTING.md (gofmt / vet /
# test / build). Verifies the 3 components in independent jobs. Extra linters
# (golangci-lint etc.) may follow as opt-in.
#
# Runs on the develop trunk as well as the main gate. This file is free to run: the
# repository is public, so GitHub-hosted standard runners cost nothing, and none of the
# jobs below spend an external LLM quota. The billing spread described in
# CONTRIBUTING "Commits & PRs" / docs/log/35-packaging.md therefore applies to e2e.yml and
# the contract workflows (which do spend quota), not here.
#
# Why develop needs its own trigger: "done" means merged into develop, and main moves
# only on a release train. Gating on main alone meant these checks did not run for a
# month at a time while develop took 1500+ commits — long enough for a break to be
# discovered only at release. Bursts are cheap: the concurrency group below cancels a
# superseded develop run, so a rapid series of merges collapses onto the newest commit.
#
# Why pull_request also lists develop (ADR 0067 decision 11): with main alone, a PR aimed at
# develop got NO checks at all — it went red only after it was merged, on develop's own
# push trigger. That was survivable while one PR landed at a time; it is not while the
# parallel refactor keeps ~13 transport PRs in flight, each moving thousands of lines
# whose only real proof is these gates. A PR branch is not main/develop, so this adds no
# duplicate run: the push trigger still fires once, after the merge.
name: ci

# Least privilege for GITHUB_TOKEN. The repo default is already read-only, but this
# stays explicit so the job keeps it if the org/repo default ever changes (public
# repo: workflow runs and their logs are world-readable).
permissions:
  contents: read

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Whether this PR touches anything the build/test jobs below read (#1573). A docs-only PR
  # skips control-plane, workspace-agent, deploy-scripts and console; the scans above them
  # and docs.yml still run. Pushes to main/develop and manual runs always run everything, so
  # whatever a PR skipped is still built after the merge.
  #
  # The gated jobs test `!= 'false'`, not `== 'true'`: if this job fails, its output is
  # empty and the jobs run instead of skipping. A job skipped through `if:` reports
  # "skipped", which a required check accepts — a workflow-level `paths-ignore` would leave
  # the check pending forever instead.
  changes:
    runs-on: ubuntu-latest
    outputs:
      code: ${{ steps.classify.outputs.code }}
    steps:
      - uses: actions/checkout@v7
        with:
          # A pull_request run checks out the PR's merge commit, whose first parent is the
          # base tip: HEAD^1..HEAD is exactly what the PR changes.
          fetch-depth: 2
      - name: classifier self-test
        run: ./scripts/ci-changes-test.sh
      - id: classify
        name: classify the changed paths
        env:
          EVENT: ${{ github.event_name }}
        run: |
          set -euo pipefail
          if [ "$EVENT" != pull_request ]; then
            echo "code=true" | tee -a "$GITHUB_OUTPUT"
            exit 0
          fi
          # --no-renames lists both sides of a move, so moving a file out of console/ into
          # docs/ still counts as touching console/.
          git diff --name-only --no-renames HEAD^1 HEAD > "$RUNNER_TEMP/changed.txt"
          cat "$RUNNER_TEMP/changed.txt"
          ./scripts/ci-changes.sh < "$RUNNER_TEMP/changed.txt" | tee -a "$GITHUB_OUTPUT"

  # Credential-leak detection. In a public repository "committed" means "published" and
  # there is no taking it back, so this scans the whole history every time rather than a
  # diff (12 s for 2436 commits / 64 MB — cheap enough).
  # `-m` is mandatory: without it gitleaks skips merge commits, and whatever entered while
  # resolving a conflict (138 commits' worth in this repository) stays unscanned and green.
  # Allowlist and false-positive handling live in .gitleaks.toml.
  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # the full history is required
      - name: install gitleaks (version+checksum pinned)
        env:
          VERSION: 8.30.1
          SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
        run: |
          set -euo pipefail
          url="https://github.com/gitleaks/gitleaks/releases/download/v${VERSION}/gitleaks_${VERSION}_linux_x64.tar.gz"
          curl -fsSL -o /tmp/gitleaks.tar.gz "$url"
          echo "${SHA256}  /tmp/gitleaks.tar.gz" | sha256sum -c -
          tar xzf /tmp/gitleaks.tar.gz -C /tmp gitleaks
      - name: scan full history
        run: /tmp/gitleaks --version && /tmp/gitleaks git --log-opts="--all --full-history -m" --redact --verbose

  # Core verification of the forbidden-token gate for shipped artifacts (docs/log/35
  # §35.7.5). The artifacts themselves are scanned by release-gate and publish-dist (both
  # need a build); what this job confirms every time is that the mechanism works and that
  # the source is clean. The unit tests exercise both "detects" and "does not detect" with
  # invented words, so the gate can be shown not to be a no-op without knowing what is in
  # the ledger.
  release-scan:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: deploy/release/scan
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: deploy/release/scan/go.mod
          # The scanner has no dependencies and so no go.sum: a cache would hold nothing,
          # and asking for one annotates every run with "Restore cache failed".
          cache: false
      - name: gofmt
        run: |
          out=$(gofmt -l .)
          if [ -n "$out" ]; then echo "gofmt needed:"; echo "$out"; exit 1; fi
      - name: go vet
        run: go vet ./...
      - name: go test
        run: go test ./...
      - name: scan the source tree
        working-directory: .
        run: |
          set -euo pipefail
          # Scan a git archive (tracked files only). Looking at the working directory
          # directly picks up unreachable pre-rewrite objects left in .git's packs and
          # reports them as false positives.
          git archive --format=tar HEAD > /tmp/src.tar
          deploy/release/scan-forbidden.sh /tmp/src.tar

  # Model-id-shaped literals in the product Go code outside the fallback registry
  # (workspace/agent/internal/modelfallback, issue #1084). Its own module, like the release
  # scanner, so it scans both product modules at once; its tests carry the positive and
  # negative controls.
  model-id-lint:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: scripts/model-id-lint
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: scripts/model-id-lint/go.mod
          # No dependencies, so no go.sum and nothing to cache (see release-scan).
          cache: false
      - name: gofmt
        run: |
          out=$(gofmt -l .)
          if [ -n "$out" ]; then echo "gofmt needed:"; echo "$out"; exit 1; fi
      - name: go vet
        run: go vet ./...
      - name: go test
        run: go test ./...
      - name: lint the product modules
        run: go run .

  control-plane:
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.code != 'false' }}
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: control-plane
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: control-plane/go.mod
          cache-dependency-path: control-plane/go.sum
      - name: gofmt
        run: |
          out=$(gofmt -l .)
          if [ -n "$out" ]; then echo "gofmt needed:"; echo "$out"; exit 1; fi
      - name: go vet
        run: go vet ./...
      - name: go build
        run: go build ./...
      - name: cross-compile for arm64
        # ⚠️ `go build` on the runner only proves amd64. unix.Stat_t is a DIFFERENT
        # struct per architecture (Blksize is int64 on amd64 and int32 on arm64), so
        # code that touches syscall structs can compile here and fail on Graviton —
        # which is exactly what happened the first time the workspace image was built
        # for arm64 (docs/log/70 §70.9). An ecs-ec2 slot can be arm64, so both binaries
        # have to build for it. CGO_ENABLED=0 matches how the images build them.
        env: { CGO_ENABLED: "0", GOOS: linux, GOARCH: arm64 }
        run: go build ./...
      - name: go test
        run: go test ./...
      # The kubernetes adapter's envtest cases skip without kube-apiserver, etcd and
      # kube-controller-manager, so the step above does not run them. This one installs the
      # pinned binaries and makes their absence a failure: without it the controller timing,
      # the `restricted` admission and the CP's RBAC would never be checked in CI.
      - name: go test (kubernetes adapter against a real control plane)
        env:
          AF_K8S_TEST_REQUIRED: "1"
          AF_K8S_TEST_BIN_DIR: ${{ runner.temp }}/af-k8s-test
        run: |
          ../deploy/local/k8s-test-binaries.sh
          go test -count=1 -v -run 'TestKubernetesEnv' ./internal/runtime/
      # control-plane currently has no build-tagged files. Passing no argument declares
      # "there should be none", so this goes red as soon as a single tag appears — which is
      # how anyone notices. Do not turn it into "add the tag when one shows up": who
      # notices the addition is the whole reason this step exists. With zero tags the vet
      # loop runs zero times and costs nothing.
      - name: go vet (build tags)
        working-directory: .
        run: cd control-plane && ../scripts/vet-build-tags.sh

  workspace-agent:
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.code != 'false' }}
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: workspace/agent
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: workspace/agent/go.mod
          cache-dependency-path: workspace/agent/go.sum
      - name: gofmt
        run: |
          out=$(gofmt -l .)
          if [ -n "$out" ]; then echo "gofmt needed:"; echo "$out"; exit 1; fi
      - name: go vet
        run: go vet ./...
      - name: go build
        run: go build ./...
      - name: cross-compile for arm64
        # ⚠️ `go build` on the runner only proves amd64. unix.Stat_t is a DIFFERENT
        # struct per architecture (Blksize is int64 on amd64 and int32 on arm64), so
        # code that touches syscall structs can compile here and fail on Graviton —
        # which is exactly what happened the first time the workspace image was built
        # for arm64 (docs/log/70 §70.9). An ecs-ec2 slot can be arm64, so both binaries
        # have to build for it. CGO_ENABLED=0 matches how the images build them.
        env: { CGO_ENABLED: "0", GOOS: linux, GOARCH: arm64 }
        run: go build ./...
      - name: go test
        run: go test ./...
      # Build-tagged files are not part of the default build, and none of the gofmt / vet /
      # build / test steps above touch them (measured: an unused import in tagged code left
      # every gate green and only `go vet -tags contract` red). The reason and what the
      # check does are written in the script.
      - name: go vet (build tags)
        working-directory: .
        run: cd workspace/agent && ../../scripts/vet-build-tags.sh contract contract_live contract_manual
      # entrypoint.sh is not Go, but what dies when it breaks is the Workspace this job
      # guards. The identity-relocation block once left a home built from a golden snapshot
      # unable to boot, so that shape is pinned by a regression check.
      - name: entrypoint.sh syntax + keep-relocation regression
        working-directory: .
        run: |
          bash -n workspace/entrypoint.sh
          ./deploy/local/keep-relocate-test.sh

  # The deployment scripts (deploy/aws/ecs) only run in full against real AWS, but if that
  # is taken as a reason to check nothing, a break is discovered on the day the stack
  # cannot be rebuilt. This job covers only the branches reachable with `aws` / `crane`
  # stubbed out — the standby restore point (what is not measured is listed at the top of
  # the script). Zero CFN create/delete/update calls: there are 198 invocations, but every
  # one is a read against the fake `aws` (180 `describe-stacks`, among others).
  deploy-scripts:
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.code != 'false' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: capture / teardown restore point
        run: ./deploy/aws/ecs/capture-restore-test.sh
      # This check also runs in release-gate.yml, and running it only there means a PR that
      # breaks the teardown order looks green until release day. It takes 5 s on the same
      # fake `aws`, so it runs per PR as well.
      - name: teardown / bring-up order (the same check as release-gate)
        run: ./deploy/local/ecs-lifecycle-stub-test.sh
      # The engine fetch sidecar lives inside a CloudFormation Mappings entry, where nothing
      # type-checks it and the only feedback is a GPU box that comes up idle ten minutes
      # later. This pulls it out of the template and runs it (ADR 0072 P0).
      - name: engine fetch sidecar (real script, stub aws)
        run: ./deploy/local/engine-sidecar-test.sh
      # CloudFormation replaces every non-ASCII codepoint in a template with `?`, server-side
      # and silently -- so a warning sign in a parameter Description reaches operators as `?`,
      # and one inside a Mappings shell block reaches the engine log the same way. Nothing
      # else in CI reads a template as text, and the mangling is invisible until somebody
      # diffs a deployed stack against the repo (which is how it was found).
      - name: CloudFormation templates are ASCII-only
        run: ./deploy/local/cfn-ascii-test.sh
      # The workspace egress policy is 47 generated blocks; a hand edit that lets one cover a
      # node address reopens every node to workspaces on GKE (ADR 0106, 2026-10-03 addendum).
      - name: workspace egress blocks match their generator
        run: python3 ./deploy/kubernetes/egress-blocks.py
      # The CP task role may write EC2 tags only where the SendCommand fence stays intact,
      # and a call site the policy refuses fails with AccessDenied on a real deployment
      # only: the live E2E runs as the deployer. This holds every call site against the
      # template, offline.
      - name: CP role tag-write fence (inventory vs template)
        run: python3 ./deploy/local/cfn-cp-tag-fence-test.py
      # The same role's EC2 writes (af-pool fence), slot-role PassRole and ECS / EFS tag
      # writes: every call site and the resources it names, held against the templates.
      - name: CP role EC2 / PassRole / TagResource scope (inventory vs template)
        run: python3 ./deploy/local/cfn-cp-ec2-scope-test.py
      # The release watcher's own branches. They run once a day against live registries,
      # so the only feedback on a bad one is a dispatch that silently did not happen —
      # which is exactly how one unreadable source came to drop all seven contracts for
      # a night. No `act` here, so the decision lives in scripts and is tested as such.
      - name: CLI release watcher decisions (real scripts, stub npm/curl/gh)
        run: ./deploy/local/cli-drift-stub-test.sh
      # The bump PR is opened unattended; which kinds move and which checksums are
      # accepted is decided here, so it is tested here.
      - name: CLI pin bump decisions (real script, stub drift/gh/curl)
        run: ./deploy/local/cli-pin-bump-stub-test.sh

  console:
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.code != 'false' }}
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: console
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: console/package-lock.json
      - name: npm ci
        run: npm ci
      - name: typecheck
        run: npm run typecheck
      # rules-of-hooks only (oxlint, since typescript-eslint cannot load TypeScript 7). A hook
      # below an early return took the whole Console black in #631; this is the gate for it.
      - name: lint
        run: npm run lint
      - name: i18n-lint
        run: npm run i18n:lint
      # Model ids outside src/lib/modelFallbacks.ts (issue #1084). The Go half runs in the
      # model-id-lint job; both read scripts/model-id-lint/patterns.txt.
      - name: model-id-lint
        run: npm run models:lint
      - name: vitest
        run: npm test
      # Real-browser checks (docs/log/82). This is the only place that covers what jsdom
      # cannot measure in principle: pdf:check looks at canvas pixels and at the serving of
      # the bundled assets, doc:check at the WASM actually initialising and converting
      # OOXML.
      #
      # The browser is the runner image's /usr/bin/chromium, used as it comes. Measured
      # with a throwaway probe:
      #   /usr/bin/chromium = Chromium 151.0.7922.0 / /usr/bin/google-chrome = 151.0.7922.173
      #   CHROME_BIN=/usr/bin/google-chrome, doc:check 13 s / pdf:check 4 s
      # so neither an install step nor CHROMIUM= is needed (headless.mjs resolves it from
      # the candidates and, if none exists, fails naming where it looked). The runner image
      # carries no Japanese fonts at all (`fc-list :lang=ja`): Japanese in the samples is
      # drawn as tofu, but these two look at whether something was drawn and whether the
      # assets could be served, not at glyph shapes, so the verdict does not change.
      - name: pdf:check (real browser)
        run: npm run pdf:check
      - name: doc:check (real browser)
        run: npm run doc:check
      - name: build
        run: npm run build
