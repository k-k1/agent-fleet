# TEMPORARY — agy 1.1.22 の workspace trust プロンプトの**現物**を採る。
# 製品コード（auth.go / context.go / usage.go）は「Yes が preselected」前提で Enter を
# 盲打ちしている。claude 2.1.248 で同型の仮定が反転して「承認」が「終了」になったので、
# agy でも並び・既定・マーカーを実測してから直す。採れたら削除する。
#
# v1 の実測: 素の runner home では agy は**オンボーディング未了**なので、trust の前に
# 「Choose your color scheme」で止まる。なので driveOnboarding と同じ順で画面に答え、
# trust が出た瞬間に**押さずに**フレームを採る。
#
# workflow_dispatch は既定ブランチにある物しか起動できないので、このブランチへの push で回す。
on:
  push:
    branches: [temp/stdhnji]
    paths: [".github/workflows/tmp-agy-trust-probe.yml"]
  workflow_dispatch:

name: tmp-agy-trust-probe

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      AGY_CLI_DISABLE_AUTO_UPDATE: "true"
    steps:
      - uses: actions/checkout@v4
      - name: seed the signed-in credential (agy-contract と同じ形)
        env:
          TOKEN: ${{ secrets.E2E_AGY_OAUTH_TOKEN }}
        run: |
          set -euo pipefail
          [ -n "$TOKEN" ] || { echo '::error::register secrets.E2E_AGY_OAUTH_TOKEN'; exit 1; }
          install -d -m 700 "$HOME/.gemini/antigravity-cli"
          umask 077
          printf '%s' "$TOKEN" > "$HOME/.gemini/antigravity-cli/antigravity-oauth-token"
      - uses: ./.github/actions/setup-agent-cli
        id: cli
        with:
          agent: agy
          version: pinned

      - name: trust プロンプトの現物（押さずに採る）
        run: |
          set -uo pipefail
          redact() { sed -E -e 's/[[:alnum:]._%+-]+@[[:alnum:].-]+\.[[:alpha:]]{2,}/<redacted-email>/g'; }
          frame() { tmux capture-pane -p -t a 2>/dev/null | redact | sed -e 's/[[:space:]]*$//' | grep -vE '^$' || true; }
          rawframe() { tmux capture-pane -p -t a 2>/dev/null | redact | cat -A | grep -vE '^\$$' || true; }

          d1="$(mktemp -d)"
          tmux new-session -d -s a -x 200 -y 50 -c "$d1" agy
          sent_color=0; sent_tos=0; got_trust=0
          for i in $(seq 1 45); do
            f="$(frame)"
            if printf '%s' "$f" | grep -qi "trust"; then
              echo "############ TRUST SCREEN (i=$i) — plain ############"
              printf '%s\n' "$f"
              echo "############ TRUST SCREEN — cat -A ############"
              rawframe
              got_trust=1
              break
            fi
            if [ "$sent_color" = 0 ] && printf '%s' "$f" | grep -q "Choose your color scheme"; then
              echo "############ color scheme (i=$i) ############"; printf '%s\n' "$f"
              tmux send-keys -t a Enter; sent_color=1; sleep 2; continue
            fi
            if [ "$sent_tos" = 0 ] && printf '%s' "$f" | grep -q "Terms of Service"; then
              echo "############ ToS (i=$i) ############"; printf '%s\n' "$f"
              tmux send-keys -t a Enter; sleep 1
              tmux send-keys -t a Down;  sleep 1
              tmux send-keys -t a Right; sleep 1
              echo "############ ToS 確定直前 ############"; frame
              tmux send-keys -t a Enter; sent_tos=1; sleep 2; continue
            fi
            sleep 2
          done
          [ "$got_trust" = 1 ] || { echo "############ trust に到達せず — 最終フレーム ############"; frame; rawframe; }
          echo "--- settings.json (オンボーディング後) ---"; redact < "$HOME/.gemini/antigravity-cli/settings.json" 2>/dev/null || echo "(none)"
          tmux kill-server 2>/dev/null || true

      - name: 2 本目 — オンボ済みの起動で untrusted dir に出る trust（usage/context の状況）
        run: |
          set -uo pipefail
          redact() { sed -E -e 's/[[:alnum:]._%+-]+@[[:alnum:].-]+\.[[:alpha:]]{2,}/<redacted-email>/g'; }
          d2="$(mktemp -d)"
          tmux new-session -d -s b -x 200 -y 50 -c "$d2" agy
          for i in $(seq 1 12); do
            sleep 2
            if tmux capture-pane -p -t b 2>/dev/null | grep -qi "trust"; then break; fi
          done
          echo "############ 2 本目 (i=$i) — plain ############"
          tmux capture-pane -p -t b 2>/dev/null | redact | sed -e 's/[[:space:]]*$//' | grep -vE '^$' || true
          echo "############ 2 本目 — cat -A ############"
          tmux capture-pane -p -t b 2>/dev/null | redact | cat -A | grep -vE '^\$$' || true
          tmux kill-server 2>/dev/null || true

          # 3 本目: 事前 trust 済み dir では出ないことの確認（一次対策が 1.1.22 でも効くか）。
          d3="$(mktemp -d)"
          python3 - "$d3" <<'PY'
          import json, os, sys
          p = os.path.expanduser("~/.gemini/antigravity-cli/settings.json")
          m = {}
          if os.path.exists(p):
              m = json.load(open(p))
          m.setdefault("trustedWorkspaces", []).append(sys.argv[1])
          json.dump(m, open(p, "w"), indent=2)
          PY
          tmux new-session -d -s c -x 200 -y 50 -c "$d3" agy
          sleep 20
          echo "############ 3 本目（事前 trust 済み）############"
          tmux capture-pane -p -t c 2>/dev/null | redact | sed -e 's/[[:space:]]*$//' | grep -vE '^$' || true
          tmux kill-server 2>/dev/null || true
