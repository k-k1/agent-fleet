# MCP レジストリの materialize 契約（docs/log/48 §8 / §13）。**認証も課金も不要**。
#
# 何を検証するか: af は「各 CLI のグローバル MCP 設定はこういう形だ」という契約の上で
# 利用者の設定ファイルを書き換えている（claude = $CLAUDE_CONFIG_DIR/.claude.json の
# mcpServers、codex = $CODEX_HOME/config.toml の [mcp_servers.*]、opencode =
# ~/.config/opencode/opencode.jsonc の mcp、copilot = $COPILOT_HOME/mcp-config.json、
# cursor = ~/.cursor/mcp.json）。CLI 側が形を変えても af のユニットテストは緑のまま —
# 自分の出力を自分で読んでいるだけだからで、気付くのは利用者が「登録したのにツールが
# 出ない」と言うときになる。ここでは **CLI 自身の `mcp add` に書かせた設定と af の
# materialize 結果を構造比較**し、`mcp add` を持たない cursor と、ヘッダを `mcp add` で
# 表現できない codex については **CLI 自身に af の書いたファイルを読み返させて**、
# 契約が動いたら赤くする。
#
# なぜ agent 別ファイルでなく 1 本か: 検証対象は「MCP 設定ファイルの形」という
# **レジストリ側の 1 つの契約**で、複数 CLI に同時に跨がる。codex-contract.yml は
# `-run '^TestDriftCodex'` を ./... に当てているので codex 側は変更時に二重に走るが、
# mcpreg 自体を触った PR を拾うのはこのワークフローの役目。
#
# 版マトリクス: pinned = イメージに焼かれる版、latest = self-update を opt-in した
# Workspace が実際に走らせる版（cli-drift-check.sh の頭にある教訓）。
name: mcp-config-contract

permissions:
  contents: read

on:
  pull_request:
    branches: [main]
    paths:
      - "workspace/agent/internal/mcpreg/**"
      - "workspace/agent/internal/paths/paths.go"
      - "workspace/Dockerfile"
      - ".github/workflows/mcp-config-contract.yml"
      - ".github/actions/setup-agent-cli/action.yml"
  schedule:
    # 毎週月曜 6:45 JST。codex-contract（21:15 UTC）/ e2e（21:00 UTC）とずらす。
    - cron: "45 21 * * 0"
  workflow_dispatch:

concurrency:
  group: mcp-config-contract-${{ github.ref }}
  cancel-in-progress: true

jobs:
  materialize-drift:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        # test = テスト名の接尾辞。drift タグは他エージェントの probe と共有なので、
        # 名前で自分の分だけに絞る。
        #
        # ここに **kiro と agy が居ない**のは意図的で、どちらも CI で契約を確認できない:
        #   - kiro は `mcp` サブコマンドが全部ログインを要求する（`mcp add` も `mcp list` も）。
        #     runner にログインは持ち込めないので、kiro の drift は**ログイン済みの手元**でしか
        #     走らない（未ログインなら skip する）。
        #   - agy は FIPS/BoringCrypto ビルドで、RDRAND の無いホストでは起動すらしない。
        # 落とせない層なので、この 2 つは §8.1 の実測記録が唯一の裏取りになる。
        agent: [claude, codex, opencode, copilot, cursor]
        version: [pinned, latest]
        include:
          - agent: claude
            test: Claude
          - agent: codex
            test: Codex
          - agent: opencode
            test: Opencode
          - agent: copilot
            test: Copilot
          - agent: cursor
            test: Cursor
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-agent-cli
        with:
          agent: ${{ matrix.agent }}
          version: ${{ matrix.version }}
      - name: materialize drift (${{ matrix.agent }}, ${{ matrix.version }})
        working-directory: workspace/agent
        env:
          # CLI が居ないときは skip ではなく fail（黙った skip は偽の緑）。
          E2E_REQUIRE: "1"
        run: |
          go test -tags drift -count=1 -v -timeout 10m \
            -run '^TestDrift${{ matrix.test }}' \
            ./internal/mcpreg/
