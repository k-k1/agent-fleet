# The materialize contract of the MCP registry (docs/log/48 §8 / §13). Needs no
# authentication and spends no quota.
#
# What it verifies: af rewrites the user's config files on the assumption of a contract —
# "this is the shape of each CLI's global MCP config" (claude = mcpServers in
# $CLAUDE_CONFIG_DIR/.claude.json, codex = [mcp_servers.*] in $CODEX_HOME/config.toml,
# opencode = mcp in ~/.config/opencode/opencode.jsonc, copilot =
# $COPILOT_HOME/mcp-config.json, cursor = ~/.cursor/mcp.json). When a CLI changes that
# shape, af's unit tests stay green — they only read back af's own output — and the first
# sign of trouble is a user reporting "I registered it but no tools show up". This job
# structurally compares the config the CLI's own `mcp add` writes against af's materialize
# result, and for cursor (no `mcp add`) and codex (headers cannot be expressed through
# `mcp add`) has the CLI itself read back the file af wrote, so a moved contract goes red.
#
# Why one file rather than one per agent: what is verified is a single contract on the
# registry side — the shape of the MCP config file — and it spans several CLIs at once.
# codex-contract.yml runs `-run '^TestDriftCodex'` over ./..., so codex is covered twice
# when it changes, but catching a PR that touches mcpreg itself is this workflow's job.
#
# Version matrix: pinned = the version baked into the image, latest = the version a
# Workspace that opted into self-update actually runs (the lesson at the top of
# cli-drift-check.sh).
name: mcp-config-contract

permissions:
  contents: read

on:
  pull_request:
    branches: [main]
    paths:
      - "workspace/agent/internal/mcpreg/**"
      - "workspace/agent/internal/paths/paths.go"
      - "workspace/Dockerfile"
      - ".github/workflows/mcp-config-contract.yml"
      - ".github/actions/setup-agent-cli/action.yml"
  schedule:
    # Mondays 6:45 JST, offset from codex-contract (21:15 UTC) and e2e (21:00 UTC).
    - cron: "45 21 * * 0"
  workflow_dispatch:

concurrency:
  group: mcp-config-contract-${{ github.ref }}
  cancel-in-progress: true

jobs:
  materialize-drift:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        # test = the test-name suffix. The drift tag is shared with the other agents'
        # probes, so the name narrows the run down to this agent's own tests.
        #
        # kiro and agy are absent on purpose — neither contract can be confirmed in CI:
        #   - every kiro `mcp` subcommand requires a login (`mcp add` and `mcp list`
        #     alike). A login cannot be brought onto the runner, so kiro's drift only runs
        #     on a logged-in machine locally (it skips when not logged in).
        #   - agy is a FIPS/BoringCrypto build and will not even start on a host without
        #     RDRAND.
        # They cannot be dropped from the layer, so for these two the measurements recorded
        # in §8.1 are the only backing there is.
        agent: [claude, codex, opencode, copilot, cursor]
        version: [pinned, latest]
        include:
          - agent: claude
            test: Claude
          - agent: codex
            test: Codex
          - agent: opencode
            test: Opencode
          - agent: copilot
            test: Copilot
          - agent: cursor
            test: Cursor
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-agent-cli
        with:
          agent: ${{ matrix.agent }}
          version: ${{ matrix.version }}
      - name: materialize drift (${{ matrix.agent }}, ${{ matrix.version }})
        working-directory: workspace/agent
        env:
          # Fail rather than skip when the CLI is missing: a silent skip is a false green.
          E2E_REQUIRE: "1"
        run: |
          go test -tags drift -count=1 -v -timeout 10m \
            -run '^TestDrift${{ matrix.test }}' \
            ./internal/mcpreg/
