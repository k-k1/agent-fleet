# Open or update the one CLI pin-bump PR.
#
# cli-drift.yml says the pins are behind and cli-release-watch.yml dispatches the
# contracts that record `tested`. This closes the loop: every kind whose public latest
# has passed its contract (`tested == latest`) gets its `ARG` pins and checksums rewritten
# in workspace/Dockerfile, on one fixed branch, in one PR that waits for a human. The
# decision and the edit are deploy/local/cli-pin-bump.sh (tested by
# cli-pin-bump-stub-test.sh); this file only calls it and pushes.
#
# The token is a secret, not GITHUB_TOKEN: a push or PR made with GITHUB_TOKEN starts no
# other workflow, so the PR's CI would never run and it could never be merged on green.
# CLI_PIN_BUMP_TOKEN is a fine-grained PAT (or GitHub App token) limited to this
# repository with Contents and Pull requests read/write. Setup: docs/build/10-development.md
# §10.2.2.
name: cli-pin-bump

on:
  # A contract that just recorded `tested` is the moment a bump can become possible.
  workflow_run:
    workflows:
      - claude-tui-contract
      - codex-contract
      - opencode-contract
      - copilot-contract
      - agy-contract
      - cursor-contract
      - kiro-contract
      - muse-contract
    types: [completed]
  schedule:
    - cron: "0 1-23/2 * * *" # every 2 hours at the odd hours, a backstop 30 minutes after the watcher
  workflow_dispatch:

permissions:
  contents: read
  issues: read

concurrency:
  group: cli-pin-bump
  cancel-in-progress: false

jobs:
  bump:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      BRANCH: automation/cli-pin-bump
    steps:
      # Always develop, never the triggering run's ref: a contract run on a PR must not
      # decide what the bump is based on.
      - uses: actions/checkout@v7
        with:
          ref: develop
          persist-credentials: false

      - name: rewrite the pins
        id: bump
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BODY_FILE: ${{ runner.temp }}/body.md
        run: deploy/local/cli-pin-bump.sh

      # A release source or download that could not be read says nothing about the release;
      # acting on it would drop a kind from the PR, or close it, over a network blip.
      - name: skip an incomplete run
        if: steps.bump.outputs.incomplete == 'true'
        run: |
          echo "::notice::A release source could not be read; the bump branch and PR are left as they are until a complete run."
          cat "$RUNNER_TEMP/body.md" >> "$GITHUB_STEP_SUMMARY"

      - name: open or update the bump PR
        if: steps.bump.outputs.incomplete != 'true' && steps.bump.outputs.count != '0'
        env:
          TOKEN: ${{ secrets.CLI_PIN_BUMP_TOKEN }}
          TITLE: ${{ steps.bump.outputs.title }}
          EDIT_ID: ${{ steps.bump.outputs.edit_id }}
          BODY_FILE: ${{ runner.temp }}/body.md
        run: |
          set -euo pipefail
          if [ -z "$TOKEN" ]; then
            echo "::error::CLI_PIN_BUMP_TOKEN is not set. A PR opened with GITHUB_TOKEN would never run CI. Create a fine-grained PAT for this repository only (Contents: read and write, Pull requests: read and write) and save it as the Actions secret CLI_PIN_BUMP_TOKEN (docs/build/10-development.md §10.2.2)."
            cat "$BODY_FILE" >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
          export GH_TOKEN="$TOKEN"
          remote="https://x-access-token:${TOKEN}@github.com/${GITHUB_REPOSITORY}.git"

          # A human closed a PR carrying this exact edit without merging it: that is a
          # "no", and re-proposing it after every contract run would override it. Matched
          # on the edit id in the body, so a deleted branch or an unrelated Dockerfile
          # change on develop does not bring it back; a new version does.
          declined="$(gh pr list --repo "$GITHUB_REPOSITORY" --head "$BRANCH" --state closed \
            --json number,mergedAt,body \
            --jq "[.[] | select(.mergedAt == null and (.body | contains(\"<!-- cli-pin-bump edit=$EDIT_ID -->\"))) | .number] | first // empty")"
          if [ -n "$declined" ]; then
            echo "::notice::PR #$declined proposed this same edit and was closed without merging; not proposed again."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -c "$BRANCH"
          {
            printf '%s\n\n' "$TITLE"
            echo "Automated by cli-pin-bump.yml: each bumped kind passed its contract on the"
            echo "new version. Evidence and the kinds left at their pin are in the PR body."
          } > "$RUNNER_TEMP/msg.txt"
          git commit -q -F "$RUNNER_TEMP/msg.txt" -- workspace/Dockerfile

          # Re-push only when the Dockerfile would differ: a force-push restarts CI, and
          # every contract completion runs this job.
          if git fetch -q "$remote" "refs/heads/$BRANCH" 2>/dev/null &&
             git diff --quiet FETCH_HEAD HEAD -- workspace/Dockerfile; then
            echo "The bump branch already carries this edit; not re-pushed."
          else
            git push -q --force "$remote" "HEAD:refs/heads/$BRANCH"
          fi

          num="$(gh pr list --repo "$GITHUB_REPOSITORY" --head "$BRANCH" --state open \
            --json number --jq 'first | .number // empty')"
          if [ -n "$num" ]; then
            gh pr edit "$num" --repo "$GITHUB_REPOSITORY" --title "$TITLE" --body-file "$BODY_FILE"
            echo "Updated PR #$num." >> "$GITHUB_STEP_SUMMARY"
          else
            gh pr create --repo "$GITHUB_REPOSITORY" --base develop --head "$BRANCH" \
              --title "$TITLE" --body-file "$BODY_FILE"
          fi
          cat "$BODY_FILE" >> "$GITHUB_STEP_SUMMARY"

      # Nothing is bumpable any more (a proposed kind published again before its PR was
      # merged, and its contract has not passed on the new latest). An open PR would still
      # offer versions that are no longer latest, so it is closed; the marker is replaced
      # first so the closure is not read as a human declining that edit.
      - name: close a bump PR that nothing supports any more
        if: steps.bump.outputs.incomplete != 'true' && steps.bump.outputs.count == '0'
        env:
          TOKEN: ${{ secrets.CLI_PIN_BUMP_TOKEN }}
          BODY_FILE: ${{ runner.temp }}/body.md
        run: |
          set -euo pipefail
          echo "No drifting kind has passed its contract on latest; nothing to bump." >> "$GITHUB_STEP_SUMMARY"
          if [ -z "$TOKEN" ]; then
            echo "::warning::CLI_PIN_BUMP_TOKEN is not set, so an open bump PR (if any) was not checked."
            exit 0
          fi
          export GH_TOKEN="$TOKEN"
          num="$(gh pr list --repo "$GITHUB_REPOSITORY" --head "$BRANCH" --state open \
            --json number --jq 'first | .number // empty')"
          [ -n "$num" ] || exit 0
          gh pr view "$num" --repo "$GITHUB_REPOSITORY" --json body --jq .body |
            sed 's/<!-- cli-pin-bump edit=[^ ]* -->/<!-- cli-pin-bump superseded -->/' > "$RUNNER_TEMP/old.md"
          gh pr edit "$num" --repo "$GITHUB_REPOSITORY" --body-file "$RUNNER_TEMP/old.md"
          {
            echo "Closed by \`cli-pin-bump.yml\`: no kind in this PR still has \`tested == latest\`. A new PR opens once a contract passes on the current latest."
            echo
            cat "$BODY_FILE"
          } > "$RUNNER_TEMP/close.md"
          gh pr close "$num" --repo "$GITHUB_REPOSITORY" --comment "$(cat "$RUNNER_TEMP/close.md")"
          echo "Closed PR #$num." >> "$GITHUB_STEP_SUMMARY"
