# claude TUI footer contract probe (P1). **Manual runs only**.
#
# What it checks: starts the real CLI's interactive TUI in tmux, runs real turns, and
# verifies against the real thing that state detection (internal/tmuxx's IsBusy /
# AtIdlePrompt) keeps up with the actual footer/spinner. The existing L4
# (e2e/live_test.go) uses headless `claude -p`, which **renders neither footer nor
# spinner**, and has never caught a state-detection breakage (3 as of 2026-07-17, all
# found by hand on the live fleet while CI stayed green).
#
# Installs **@latest** by default: e2e.yml verifies the pinned image, while
# self-update-enabled workspaces run latest. The shared setup action installs the
# requested real CLI plus Go/tmux on the runner; building the full workspace image
# would also bake the unrelated ~855MB Kiro bundle and exhaust hosted-runner disk.
# Setting cli_version to an explicit version still allows A/B comparison.
#
# Why no cron: credentials (the OAuth token) expire, which is operational burden — an
# expired token turns the scheduled job red, it gets left alone, and eventually
# ignored. Run it manually first, and decide about always-on after seeing a track
# record. The operational signal comes from cli-drift.yml (daily, no credentials,
# issue notification), so "a drift issue arrives → trigger this job" captures most of
# the value.
#
# Billing: 2 real turns (manual / bypass). One short essay each, a few hundred tokens.
# With E2E_CLAUDE_OAUTH_TOKEN (a `claude setup-token` token = Max/Pro subscription
# quota) there is no extra charge. E2E_ANTHROPIC_API_KEY is pay-as-you-go.
name: claude-tui-contract

on:
  workflow_dispatch:
    inputs:
      cli_version:
        description: "claude CLI version to bake in (latest recommended; enter a number only for A/B against a specific version)"
        type: string
        default: "latest"

permissions:
  contents: read
  issues: write

concurrency:
  group: claude-tui-contract
  cancel-in-progress: false

jobs:
  tui-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      DISABLE_AUTOUPDATER: "1"
    steps:
      - uses: actions/checkout@v4

      - name: guard secret
        env:
          KEY: ${{ secrets.E2E_ANTHROPIC_API_KEY }}
          TOKEN: ${{ secrets.E2E_CLAUDE_OAUTH_TOKEN }}
        run: |
          if [ -z "$KEY" ] && [ -z "$TOKEN" ]; then
            echo "::error::register either secrets.E2E_CLAUDE_OAUTH_TOKEN (claude setup-token token, subscription quota, recommended) or secrets.E2E_ANTHROPIC_API_KEY (pay-as-you-go)"
            exit 1
          fi

      - uses: ./.github/actions/setup-agent-cli
        id: cli
        with:
          agent: claude
          version: ${{ inputs.cli_version }}

      - name: seed non-secret interactive onboarding state
        run: |
          # CLAUDE_CODE_OAUTH_TOKEN supplies auth, but the interactive TUI still opens
          # "Select login method" unless this non-secret state is present. Production's
          # claude.ensureFolderTrusted writes the same keys before every TUI launch.
          jq -n '{hasCompletedOnboarding:true,theme:"dark"}' > "$HOME/.claude.json"
          # Production's entrypoint seeds this separate settings file. Without it the
          # bypass subtest stops at the dangerous-mode acknowledgement dialog.
          mkdir -p "$HOME/.claude"
          jq -n '{skipDangerousModePermissionPrompt:true}' > "$HOME/.claude/settings.json"

      # Pass credentials via env (never typed or logged) and drive the real interactive
      # CLI in a real tmux pane. The Go test calls production tmuxx functions directly.
      - name: TUI contract probe
        working-directory: workspace/agent
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.E2E_CLAUDE_OAUTH_TOKEN }}
          ANTHROPIC_API_KEY: ${{ secrets.E2E_ANTHROPIC_API_KEY }}
        run: |
          set -o pipefail
          go test -tags tui_contract ./internal/tmuxx/ \
            -run TestClaudeTUIContractLive -v -timeout 20m \
            2>&1 | tee /tmp/contract.log

      # プラン承認の実 TUI 契約（docs: planDecision.ts / plan_verdict.go）。プランカードの
      # バッジは claude が返す**非契約の文言**とメニュー形状に乗っており、そこは 2 回壊れて
      # いる（2026-07-22 却下が承認になる／2026-08-31 承認に 却下 バッジ）。固定キャプチャの
      # ロックはどちらも緑のままだったので、実 TUI で「既定行は必ず Yes」「承認の結果が
      # 承認と読める」「決着に計画本文が混ざらない」まで通す。実ターン 1 回（短いプラン）。
      - name: plan approval contract (ExitPlanMode)
        working-directory: workspace/agent
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.E2E_CLAUDE_OAUTH_TOKEN }}
          ANTHROPIC_API_KEY: ${{ secrets.E2E_ANTHROPIC_API_KEY }}
        run: |
          go test -tags tui_contract -run '^TestClaudePlanApprovalContractLive$' \
            -count=1 -v -timeout 15m .

      # 発言時点からの分岐（docs/log/55）のドリフト検知。claude だけは公式の分岐点 API を
      # 使えず転写 jsonl を自分で切り詰めているので、claude の転写スキーマや resume の
      # 解釈が動いた瞬間に静かに壊れる（起動はするが会話が変、という気づけない壊れ方）。
      # print モードで済むので TUI は要らないが、実クレデンシャルが要る点は同じなので
      # このジョブに相乗りする。3 ターン（haiku・各 1 行）。
      - name: fork-at transcript contract (docs/log/55)
        working-directory: workspace/agent
        env:
          CLAUDE_CONTRACT_LIVE: "1"
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.E2E_CLAUDE_OAUTH_TOKEN }}
          ANTHROPIC_API_KEY: ${{ secrets.E2E_ANTHROPIC_API_KEY }}
        run: |
          go test -tags clicontract ./internal/agents/claude/ \
            -run TestContractLiveClaudeForkAt -v -timeout 10m

      # The captured frames come from a *signed-in* TUI, so they carry the CI account's
      # identity (the "Welcome back <name>!" banner and the "<email>'s Organization"
      # line). Artifacts of a public repo are world-downloadable, so redact those before
      # uploading — the artifact only exists to show wording drift, which survives it.
      # (The credentials themselves are env-only and never printed; GitHub also masks
      # exact secret values in logs. This step covers what masking cannot: values
      # *derived* from the account.)
      - name: redact account identity from the frame log
        if: always()
        run: |
          [ -f /tmp/contract.log ] || exit 0
          sed -E \
            -e 's/[[:alnum:]._%+-]+@[[:alnum:].-]+\.[[:alpha:]]{2,}/<redacted-email>/g' \
            -e 's/(Welcome back )[^!]*!/\1<redacted-account>!/g' \
            /tmp/contract.log > /tmp/contract-public.log

      # Make wording drift visible even on green (the observed spinner/footer lines are printed).
      - name: upload observed frames
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: claude-tui-contract-log
          path: /tmp/contract-public.log
          if-no-files-found: ignore

      - name: remember successfully tested latest
        if: success() && inputs.cli_version == 'latest'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          EFFECTIVE: ${{ steps.cli.outputs.version }}
        run: |
          version="$(printf '%s' "$EFFECTIVE" | grep -oE '[0-9]+(\.[0-9]+)+' | head -1)"
          [ -n "$version" ]
          deploy/local/cli-release-state.sh set tested claude "$version"
