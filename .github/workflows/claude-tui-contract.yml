# claude TUI footer contract probe (P1). **Manual runs only**.
#
# What it checks: starts the real CLI's interactive TUI in tmux, runs real turns, and
# verifies against the real thing that state detection (internal/tmuxx's IsBusy /
# AtIdlePrompt) keeps up with the actual footer/spinner. The existing L4
# (e2e/live_test.go) uses headless `claude -p`, which **renders neither footer nor
# spinner**, and has never caught a state-detection breakage (3 as of 2026-07-17, all
# found by hand on the live fleet while CI stayed green).
#
# Installs **@latest** by default: e2e.yml verifies the pinned image, while
# self-update-enabled workspaces run latest. The shared setup action installs the
# requested real CLI plus Go/tmux on the runner; building the full workspace image
# would also bake the unrelated ~855MB Kiro bundle and exhaust hosted-runner disk.
# Setting cli_version to an explicit version still allows A/B comparison.
#
# Why no cron: credentials (the OAuth token) expire, which is operational burden — an
# expired token turns the scheduled job red, it gets left alone, and eventually
# ignored. Run it manually first, and decide about always-on after seeing a track
# record. The operational signal comes from cli-drift.yml (daily, no credentials,
# issue notification), so "an update issue arrives → trigger this job" captures most of
# the value.
#
# Billing: 2 real turns (manual / bypass). One short essay each, a few hundred tokens.
# With E2E_CLAUDE_OAUTH_TOKEN (a `claude setup-token` token = Max/Pro subscription
# quota) there is no extra charge. E2E_ANTHROPIC_API_KEY is pay-as-you-go.
#
# A thin caller of cli-contract.yml: triggers, the credential and the test scripts live here.
name: claude-tui-contract

on:
  workflow_dispatch:
    inputs:
      cli_version:
        description: "claude CLI version to bake in (latest recommended; enter a number only for A/B against a specific version)"
        type: string
        default: "latest"

permissions:
  actions: read # the failure report lists this run's failed steps
  contents: read
  issues: write

concurrency:
  group: claude-tui-contract
  cancel-in-progress: false

jobs:
  tui-contract:
    uses: ./.github/workflows/cli-contract.yml
    secrets:
      E2E_ANTHROPIC_API_KEY: ${{ secrets.E2E_ANTHROPIC_API_KEY }}
      E2E_CLAUDE_OAUTH_TOKEN: ${{ secrets.E2E_CLAUDE_OAUTH_TOKEN }}
    with:
      cli: claude
      version: ${{ inputs.cli_version }}
      timeout_minutes: 40
      # Credentials go to the CLI through env (never typed or logged); the test steps drive
      # the real interactive CLI in a real tmux pane.
      tests_need_secrets: true
      job_env: |
        DISABLE_AUTOUPDATER=1
      guard: |
        if [ -z "$E2E_ANTHROPIC_API_KEY" ] && [ -z "$E2E_CLAUDE_OAUTH_TOKEN" ]; then
          echo "::error::register either secrets.E2E_CLAUDE_OAUTH_TOKEN (claude setup-token token, subscription quota, recommended) or secrets.E2E_ANTHROPIC_API_KEY (pay-as-you-go)"
          exit 1
        fi
      seed: |
        # CLAUDE_CODE_OAUTH_TOKEN supplies auth, but the interactive TUI still opens
        # "Select login method" unless this non-secret state is present. Production's
        # claude.ensureFolderTrusted writes the same keys before every TUI launch.
        jq -n '{hasCompletedOnboarding:true,theme:"dark"}' > "$HOME/.claude.json"
        # Production's entrypoint seeds this separate settings file. Without it the
        # bypass subtest stops at the dangerous-mode acknowledgement dialog.
        mkdir -p "$HOME/.claude"
        jq -n '{skipDangerousModePermissionPrompt:true}' > "$HOME/.claude/settings.json"
      test_0_name: TUI contract probe
      test_0: |
        export CLAUDE_CODE_OAUTH_TOKEN="$E2E_CLAUDE_OAUTH_TOKEN" ANTHROPIC_API_KEY="$E2E_ANTHROPIC_API_KEY"
        set -o pipefail
        go test -tags contract ./internal/tmuxx/ \
          -run TestClaudeTUIContractLive -v -timeout 20m \
          2>&1 | tee /tmp/contract.log

      # The real-TUI contract for plan approval (planDecision.ts / plan_verdict.go). The plan
      # card's badge rides on wording claude returns that is not a contract, plus the menu
      # shape, and it has broken twice (2026-07-22 a rejection read as an approval;
      # 2026-08-31 an approval got a rejection badge). Locks on captured frames stayed green
      # both times, so this drives the real TUI: "the default row is always Yes", "an
      # approval reads as an approval", "the plan body never leaks into the verdict".
      # One real turn (a short plan).
      test_1_name: plan approval contract (ExitPlanMode)
      test_1: |
        export CLAUDE_CODE_OAUTH_TOKEN="$E2E_CLAUDE_OAUTH_TOKEN" ANTHROPIC_API_KEY="$E2E_ANTHROPIC_API_KEY"
        go test -tags contract -run '^TestClaudePlanApprovalContractLive$' \
          -count=1 -v -timeout 15m .

      # Drift detection for fork-at-a-message (docs/log/55). Only claude cannot use an
      # official fork-point API and truncates the transcript jsonl itself, so it breaks
      # silently the moment claude's transcript schema or resume handling moves (it still
      # starts, the conversation is just wrong). Print mode is enough, no TUI needed, but
      # a real credential is, so this rides on the same job. Three turns (haiku, one line each).
      test_2_name: fork-at transcript contract (docs/log/55)
      test_2_env: |
        CLAUDE_CONTRACT_LIVE=1
      test_2: |
        export CLAUDE_CODE_OAUTH_TOKEN="$E2E_CLAUDE_OAUTH_TOKEN" ANTHROPIC_API_KEY="$E2E_ANTHROPIC_API_KEY"
        go test -tags contract ./internal/agents/claude/ \
          -run TestContractLiveClaudeForkAt -v -timeout 10m

      # The captured frames come from a *signed-in* TUI, so they carry the CI account's
      # identity (the "Welcome back <name>!" banner and the "<email>'s Organization"
      # line). Artifacts of a public repo are world-downloadable, so redact those before
      # uploading — the artifact only exists to show wording drift, which survives it.
      # (The credentials themselves are env-only and never printed; GitHub also masks
      # exact secret values in logs. This covers what masking cannot: values *derived*
      # from the account.) Wording drift stays visible even on green.
      post: |
        [ -f /tmp/contract.log ] || exit 0
        sed -E \
          -e 's/[[:alnum:]._%+-]+@[[:alnum:].-]+\.[[:alpha:]]{2,}/<redacted-email>/g' \
          -e 's/(Welcome back )[^!]*!/\1<redacted-account>!/g' \
          /tmp/contract.log > /tmp/contract-public.log
      artifact_name: claude-tui-contract-log
      artifact_path: /tmp/contract-public.log

  # The `tested` this run may have recorded is what a bump waits for; see cli-pin-bump.yml's
  # `on:` for why this dispatches it instead of relying on `workflow_run`. A job of its own,
  # so actions: write never reaches the steps that run the CLI. Whatever the result:
  # cli-pin-bump decides by `tested == latest` and changes nothing when nothing is due.
  pin-bump:
    needs: tui-contract
    if: ${{ !cancelled() && github.event_name != 'pull_request' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: write
    steps:
      - name: dispatch cli-pin-bump
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh workflow run cli-pin-bump.yml --repo "$GITHUB_REPOSITORY" --ref main
