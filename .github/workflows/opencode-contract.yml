# opencode CLI contract (drift detection). The existing e2e.yml L1 is a *pin
# conformance* check ("actual version in image == Dockerfile ARG pin"), so a new
# opencode that breaks our parsing still passes green. Meanwhile the fleet runs
# @latest via entrypoint.sh's opt-in self-update (the pin is the base image's default
# / fallback), so CI was verifying a version the fleet doesn't run. This is the
# structural hole through which claude's false-idle reached the live fleet and was
# found by hand.
#
# Here we assert the contract against the real opencode binary, real store, real
# app-server, and real tmux pane (-tags contract). opencode bundles the free
# OpenCode Zen model, so the composer and real turns work without login — unlike
# claude's L4, **no billing and no secrets needed**.
#
# Versions run as a 2-way matrix to separate "we broke it" from "upstream moved":
#   - pinned: the Dockerfile ARG pin (= the version baked into the image now)
#   - latest: the version the fleet actually runs
#
# A second job (contract-v2) runs the opencode 2 (@opencode/cli) contract tests: no model, no
# credentials, nothing beyond the npm install. It needs no quota, so unlike the job above it runs
# on every relevant PR, not only on the cron and dispatch.
#
# Note: no image build is needed (just node+tmux+Go on the runner), so this is
# independent of e2e.yml and finishes in minutes.
#
# Why it stays a separate file (the original plan was "fold all 3 into e2e.yml at
# main merge", since reversed): path filters and workflow_dispatch inputs are both
# **per workflow**, so co-locating in e2e.yml would (1) run the opencode contract even
# for console/** etc. changes, and (2) mix inputs with other agents. codex's Tier2 and
# claude's live-smoke actually shared a single `live` input and could not be run
# separately (split in 6e2f8ee). One file per agent makes this coupling structurally
# impossible.
# Same shape: codex-contract.yml / claude-tui-contract.yml. Version-skew monitoring is
# cli-drift.yml. Shared setup (Go/Node/tmux/CLI install) is .github/actions/setup-agent-cli.
name: opencode-contract

permissions:
  actions: read # the failure report lists this run's failed steps
  contents: read
  issues: write

on:
  # Not run on pushes to main (billing spread; CONTRIBUTING "Commits & PRs").
  # Contract checks are concentrated on PRs to main (when relevant paths changed)
  # and the weekly cron.
  pull_request:
    branches: [main]
    paths:
      - "workspace/agent/internal/agents/opencode/**"
      - "workspace/agent/internal/chatx/**"
      - "workspace/opencode-plugin/**"
      - "workspace/agent/session_io.go"
      - "workspace/agent/opencode_contract_test.go"
      - "workspace/Dockerfile"
      - ".github/workflows/opencode-contract.yml"
      - ".github/actions/setup-agent-cli/action.yml"
      # The shared body of every contract caller.
      - ".github/workflows/cli-contract.yml"
      # The action reads the CLI manifest (arg, package, install method) through this reader.
      - "deploy/local/cli-manifest.sh"
      - "workspace/agent/internal/climanifest/cli-manifest.psv"
  schedule:
    # Mondays 6:30 JST — catch upstream opencode breakage even with no code changes
    - cron: "30 21 * * 0"
  workflow_dispatch:

concurrency:
  group: opencode-contract-${{ github.ref }}
  cancel-in-progress: true

jobs:
  contract:
    if: github.event_name != 'pull_request' || github.base_ref == 'main'
    uses: ./.github/workflows/cli-contract.yml
    strategy:
      fail-fast: false # even if pinned breaks we want latest's result (and vice versa)
      matrix:
        version: [pinned, latest]
    with:
      cli: opencode
      version: ${{ matrix.version }}
      timeout_minutes: 20
      # A pinned contract must stay pinned. Without the same guard as the workspace image,
      # opencode starts a background `npm install @latest`; the executable can disappear
      # between tests and the "pinned" matrix silently tests another version.
      job_env: |
        OPENCODE_DISABLE_AUTOUPDATE=true
      # Tier A: deterministic, no LLM calls. Asserts the store schema / app-server protocol /
      # TUI footer (paneMode) contracts against the real thing. Red here = confirmed that
      # upstream moved a surface we read. E2E_REQUIRE fails rather than skips when the binary
      # is missing.
      test_0_name: tier A — store / app-server / TUI contract
      test_0_env: |
        E2E_REQUIRE=1
      test_0: |
        go test -tags contract -run TestContract -v -count=1 -timeout 15m ./internal/agents/opencode/ ./

  contract-v2:
    # Read-only token: nothing here reports, and the npm package and the PR's test code both
    # run with it. The issue-writing permission above belongs to the reporting steps of `contract`.
    permissions:
      contents: read
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      OPENCODE_DISABLE_AUTOUPDATE: "true"
      AF_REQUIRE_OPENCODE2: "1"
    steps:
      - uses: actions/checkout@v7

      # The Dockerfile pin is the source of truth.
      - name: resolve the opencode 2 version
        id: v2
        run: |
          set -euo pipefail
          pin="$(sed -n 's/^ARG OPENCODE_VERSION=//p' workspace/Dockerfile | head -1)"
          [ -n "$pin" ] || { echo "::error::ARG OPENCODE_VERSION is missing from workspace/Dockerfile"; exit 1; }
          case "$pin" in 2.*) ;; *) echo "::error::not an opencode 2 version: '$pin'"; exit 1 ;; esac
          echo "version=$pin" >> "$GITHUB_OUTPUT"

      - uses: ./.github/actions/setup-agent-cli
        id: cli
        with:
          agent: opencode
          version: ${{ steps.v2.outputs.version }}

      # The tests build their own isolated HOME / XDG roots (envWithHome), so the runner's
      # home is never read. Selection is by name: a new TestContractTerminalForm*, V2* or
      # Shared* test joins automatically, and the -list check below fails when any one of the
      # tests that exist today stops matching (a rename would otherwise drop it silently).
      - name: opencode 2 contract tests
        working-directory: workspace/agent
        run: |
          set -u
          run='^(TestContract(ServeAPI|V2|Shared|TerminalForm)|TestOpencodePluginModules)'
          go test -tags contract -list "$run" ./internal/agents/opencode/ > "$RUNNER_TEMP/list.txt"
          for name in TestContractServeAPI TestContractV2Form TestContractV2State TestContractV2EventStream \
                      TestContractShared TestContractTerminalForm TestOpencodePluginModules; do
            grep -q "^$name" "$RUNNER_TEMP/list.txt" || { echo "::error::no test named $name* is selected"; exit 1; }
          done
          rc=0
          go test -p 2 -tags contract -run "$run" -v -count=1 -timeout 12m ./internal/agents/opencode/ > "$RUNNER_TEMP/v2.log" 2>&1 || rc=$?
          cat "$RUNNER_TEMP/v2.log"
          [ "$rc" -eq 0 ] || exit "$rc"
          if grep -q -e '--- SKIP' "$RUNNER_TEMP/v2.log"; then
            echo "::error::a opencode 2 contract test skipped; a skip must not read as a pass"
            exit 1
          fi

      # The assistant chat and one-shot paths on a real 2.x: `run` flags, the inline config
      # (read-only posture, af MCP server and its precedence). Its own package, so its own step.
      - name: opencode 2 chat contract test
        working-directory: workspace/agent
        run: |
          set -u
          go test -tags contract -list '^TestContractV2Chat' ./internal/chatx/ | grep -q '^TestContractV2ChatPostureAndMCP' \
            || { echo "::error::TestContractV2Chat* is not selected"; exit 1; }
          rc=0
          go test -tags contract -run '^TestContractV2Chat' -v -count=1 -timeout 8m ./internal/chatx/ > "$RUNNER_TEMP/v2chat.log" 2>&1 || rc=$?
          grep -v '^        {' "$RUNNER_TEMP/v2chat.log" || true
          [ "$rc" -eq 0 ] || exit "$rc"
          if grep -q -e '--- SKIP' "$RUNNER_TEMP/v2chat.log"; then
            echo "::error::the opencode 2 chat contract test skipped; a skip must not read as a pass"
            exit 1
          fi

  # The `tested` this run may have recorded is what a bump waits for; see cli-pin-bump.yml's
  # `on:` for why this dispatches it instead of relying on `workflow_run`. A job of its own,
  # so actions: write never reaches the steps that run the CLI. Whatever the result:
  # cli-pin-bump decides by `tested == latest` and changes nothing when nothing is due.
  pin-bump:
    needs: contract
    if: ${{ !cancelled() && github.event_name != 'pull_request' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: write
    steps:
      - name: dispatch cli-pin-bump
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh workflow run cli-pin-bump.yml --repo "$GITHUB_REPOSITORY" --ref main
