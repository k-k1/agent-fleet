# GitHub Copilot Terminal (CLI) contract. The GH OAuth token is the same stable
# connection source used by the fleet, so this workflow exercises a real turn on
# release edges; it covers the TUI composer plus events.jsonl mirror/state path.
name: copilot-contract

on:
  workflow_dispatch:
    inputs:
      cli_version:
        description: "copilot version to verify (latest for self-update-enabled Workspaces)"
        type: string
        default: latest

permissions:
  contents: read
  issues: write

concurrency:
  group: copilot-contract
  cancel-in-progress: false

jobs:
  tui-mirror:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      COPILOT_AUTO_UPDATE: "false"
    steps:
      - uses: actions/checkout@v4
      - name: guard GitHub OAuth credential
        env:
          TOKEN: ${{ secrets.E2E_COPILOT_GITHUB_TOKEN }}
        run: |
          [ -n "$TOKEN" ] || { echo '::error::register secrets.E2E_COPILOT_GITHUB_TOKEN'; exit 1; }
      - uses: ./.github/actions/setup-agent-cli
        id: cli
        with:
          agent: copilot
          version: ${{ inputs.cli_version }}
      - name: real TUI and mirror contract
        working-directory: workspace/agent
        env:
          E2E_REQUIRE: "1"
          GH_TOKEN: ${{ secrets.E2E_COPILOT_GITHUB_TOKEN }}
        run: go test -tags tui_contract -run '^TestCopilotTUIMirrorContract$' -count=1 -v -timeout 12m .
      - name: remember successfully tested latest
        if: success() && inputs.cli_version == 'latest'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          EFFECTIVE: ${{ steps.cli.outputs.version }}
        run: |
          version="$(printf '%s' "$EFFECTIVE" | grep -oE '[0-9]+(\.[0-9]+)+' | head -1)"
          [ -n "$version" ]
          deploy/local/cli-release-state.sh set tested copilot "$version"
