# GitHub Copilot Terminal (CLI) contract. The GH OAuth token is the same stable
# connection source used by the fleet, so this workflow exercises a real turn on
# release edges; it covers the TUI composer plus events.jsonl mirror/state path.
#
# A thin caller of cli-contract.yml: triggers, the credential and the test scripts live here,
# everything else (install, bookkeeping, the caps probe's reporting) is shared.
name: copilot-contract

on:
  workflow_dispatch:
    inputs:
      cli_version:
        description: "copilot version to verify (latest for self-update-enabled Workspaces)"
        type: string
        default: latest

permissions:
  actions: read # the failure report lists this run's failed steps
  contents: read
  issues: write

concurrency:
  group: copilot-contract
  cancel-in-progress: false

jobs:
  tui-mirror:
    uses: ./.github/workflows/cli-contract.yml
    secrets:
      E2E_COPILOT_GITHUB_TOKEN: ${{ secrets.E2E_COPILOT_GITHUB_TOKEN }}
    with:
      cli: copilot
      version: ${{ inputs.cli_version }}
      timeout_minutes: 40
      # The CLI itself needs the token, so the test steps get the secret too.
      tests_need_secrets: true
      job_env: |
        COPILOT_AUTO_UPDATE=false
      guard: |
        [ -n "$E2E_COPILOT_GITHUB_TOKEN" ] || { echo '::error::register secrets.E2E_COPILOT_GITHUB_TOKEN'; exit 1; }
      test_0_name: real TUI and mirror contract
      test_0_env: |
        E2E_REQUIRE=1
      test_0: |
        export GH_TOKEN="$E2E_COPILOT_GITHUB_TOKEN"
        go test -tags contract -run '^TestCopilotTUIMirrorContract$' -count=1 -v -timeout 12m .

      # Drift detection for fork-at-a-message (docs/log/55). copilot has no official fork
      # point: the session-state is copied and events.jsonl truncated. The surgery works
      # **only because events.jsonl is the source of the restore**; the moment the adjacent
      # session.db becomes authoritative it silently turns into "the mirror is cut but the
      # agent remembers everything". Synthetic tests stay green either way, so this is the
      # only alarm. Three real turns.
      test_1_name: fork-at events contract (docs/log/55)
      test_1_env: |
        COPILOT_CONTRACT_LIVE=1
      test_1: |
        export GH_TOKEN="$E2E_COPILOT_GITHUB_TOKEN"
        go test -tags contract -run '^TestContractLiveCopilotForkAt$' -count=1 -v -timeout 12m ./internal/agents/copilot/

      # Declared Caps against observed behaviour (interrupt, fork-at, model override): the same
      # test as above in AF_CAPS_PROBES=only mode, so it reuses this kind's auth setup. Costs one
      # interrupted long turn and three one-line turns (up to five when the model probe meets
      # explicit refusals). Advisory unless the repository variable CAPS_PROBES_BLOCKING is
      # 'true' (see cli-contract.yml).
      caps: |
        export E2E_REQUIRE=1 AF_CAPS_PROBES=only GH_TOKEN="$E2E_COPILOT_GITHUB_TOKEN"
        go test -tags contract -run '^TestCopilotTUIMirrorContract$' -count=1 -v -timeout 15m .

  # The `tested` this run may have recorded is what a bump waits for; see cli-pin-bump.yml's
  # `on:` for why this dispatches it instead of relying on `workflow_run`. A job of its own,
  # so actions: write never reaches the steps that run the CLI. Whatever the result:
  # cli-pin-bump decides by `tested == latest` and changes nothing when nothing is due.
  pin-bump:
    needs: tui-mirror
    if: ${{ !cancelled() && github.event_name != 'pull_request' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: write
    steps:
      - name: dispatch cli-pin-bump
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh workflow run cli-pin-bump.yml --repo "$GITHUB_REPOSITORY" --ref main
