# Real publish (docs/35 §35.7.4-5; runbook is §35.8.2): builds all artifacts and
# publishes them to the public dist repo (k-k1/agent-fleet-dist) Releases.
# workflow_dispatch-only path. Implements §35.4.2 "release builds happen on the
# private side (Actions workflow_dispatch)".
#
# Prerequisites (one-time, done by the user):
#   1) create the dist repo manually (gh repo create k-k1/agent-fleet-dist --public)
#   2) create a fine-grained PAT (scope = the dist repo only, Contents RW)
#   3) register the secret on this repo: gh secret set DIST_PUBLISH_TOKEN
# Releases that keep <r> unchanged (build.sh --rootfs-json) are done locally (§35.8.2).
name: publish-dist

# Least privilege for GITHUB_TOKEN. The repo default is already read-only, but this
# stays explicit so the job keeps it if the org/repo default ever changes (public
# repo: workflow runs and their logs are world-readable).
permissions:
  contents: read
  packages: write # push the release images to GHCR (ADR 0037)

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version (semver, e.g. 0.1.0)'
        required: true

concurrency:
  group: publish-dist
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      VERSION: ${{ inputs.version }}
      GH_TOKEN: ${{ secrets.DIST_PUBLISH_TOKEN }}
    steps:
      - name: preflight (secret + version format)
        run: |
          if [ -z "$GH_TOKEN" ]; then
            echo "::error::secret DIST_PUBLISH_TOKEN is not set. First follow docs/35 §35.8.2 (create the PAT, then gh secret set DIST_PUBLISH_TOKEN)."
            exit 1
          fi
          echo "$VERSION" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+([-.][0-9A-Za-z.-]+)?$' \
            || { echo "::error::version is not semver: $VERSION"; exit 1; }

      - uses: actions/checkout@v4

      # ADR 0037: images are distributed through GHCR. GITHUB_TOKEN can push to
      # this repository's own package namespace; DIST_PUBLISH_TOKEN is scoped to
      # the dist repo's contents and deliberately cannot.
      - name: log in to GHCR
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin

      # Self-check before publishing (fake gh / file:// — never touches the real repo)
      - name: stub self-check
        run: deploy/local/dist-stub-test.sh

      - name: build all artifacts (A+C+R+D) and push images to GHCR
        run: VERSION=$VERSION deploy/release/build.sh --all --push

      # Last line before anything becomes public and permanent: expand every
      # artifact (including the layers inside the images tar) and fail if a
      # string this project removed from its history is in any of them
      # (docs/35 §35.7.5). 0.1.0–0.5.0 shipped one and had to be withdrawn;
      # nothing gets published again without passing through here.
      - name: forbidden-token scan (blocks publish)
        run: deploy/release/scan-forbidden.sh

      # A private GHCR package breaks the whole compose install path (ADR 0037),
      # and the failure is invisible from here — the push succeeds either way.
      # This cannot be a hard failure: on the very first push the package does not
      # exist until we create it, so it is private by definition and the visibility
      # flip can only happen afterwards (docs/35 §35.8.2). So: warn loudly.
      - name: check GHCR packages are anonymously pullable
        run: |
          private=0
          for pkg in k-k1/agent-fleet/control-plane k-k1/agent-fleet/workspace; do
            code=$(curl -sS -o /dev/null -w '%{http_code}' \
              "https://ghcr.io/token?scope=repository:$pkg:pull&service=ghcr.io")
            if [ "$code" = 200 ]; then
              echo "public: $pkg"
            else
              private=1
              echo "::warning title=GHCR package is not public::$pkg returned $code to an anonymous pull. Compose users cannot pull it until you flip it to public."
            fi
          done
          if [ "$private" = 1 ]; then
            {
              echo "### ⚠️ GHCR packages are not anonymously pullable"
              echo "\`docker compose pull\` will fail for everyone until this is fixed:"
              echo "1. open the package settings (Danger Zone → Change visibility → Public)"
              echo "2. enable *Inherit access from repository*"
              echo "3. re-run the check in docs/35 §35.8.2"
            } >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: publish to dist repo
        run: VERSION=$VERSION deploy/release/publish-dist.sh --seed

      - name: summary
        run: |
          ls -la deploy/release/dist
          {
            echo "## publish-dist $VERSION"
            echo "- https://github.com/k-k1/agent-fleet-dist/releases"
            echo '- Verify: `curl -fsSL https://raw.githubusercontent.com/k-k1/agent-fleet-dist/main/install.sh | bash` → `af start`'
          } >> "$GITHUB_STEP_SUMMARY"
