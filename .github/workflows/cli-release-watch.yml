# Public agent-CLI release watcher.
#
# cli-drift.yml answers "are image pins behind?". This workflow answers the
# different question "did a public version change since we last reacted?" and
# dispatches the expensive TUI/pane contracts only on that edge.
#
# Successful contracts append a "tested" marker to the release-state issue; a failed
# dispatched contract never advances tested state, so the watcher retries it on its next
# run - unless it finished red (see below). A release this job cannot test (cursor and
# kiro, or a missing secret) is not reported from here: cli-drift.yml opens that CLI's
# update issue, which names the step a person has to take.
#
# A contract that finishes red writes a `red` marker for that version (and a row in that
# CLI's update issue). At a 2-hour cadence the watcher would otherwise spend the
# contract's LLM quota ~12 times a day on a version that keeps failing; cli-release-edges.sh
# skips a `latest` that carries the marker. A newer release, a passing run or a manual
# dispatch releases it.
#
# One unreadable release source holds back that row and nothing else. It used to abort
# the job: on 2026-09-09 claude 2.1.267 was detected, rtk's GitHub Releases call failed,
# and all seven dispatches were dropped with `tested` left at 2.1.265 — which reads
# exactly like an upstream that released nothing. The decision lives in
# deploy/local/cli-release-edges.sh so it can be tested (no `act` here), and every run
# writes its own liveness to the state issue's `watcher` namespace.
name: cli-release-watch

on:
  schedule:
    - cron: "30 */2 * * *" # every 2 hours at :30, after cli-drift at :00
  workflow_dispatch:

permissions:
  actions: write
  contents: read
  issues: write

concurrency:
  group: cli-release-watch
  cancel-in-progress: false

jobs:
  detect-and-dispatch:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v7

      - name: load durable release state
        id: state
        run: |
          set -euo pipefail
          deploy/local/cli-release-state.sh ensure watcher ok
          . deploy/local/cli-manifest.sh
          manifest_load
          for name in $(manifest_tested_kinds); do
            echo "tested_$name=$(deploy/local/cli-release-state.sh get tested "$name")" >> "$GITHUB_OUTPUT"
            echo "red_$name=$(deploy/local/cli-release-state.sh get red "$name")" >> "$GITHUB_OUTPUT"
          done

      - name: fetch all public versions
        id: versions
        run: |
          set +e
          deploy/local/cli-drift-check.sh
          code=$?
          set -e
          # 1 is normal pin drift; a row that could not be read comes back in `failed=`
          # and is handled per row. 2 means not one source answered, which is a broken
          # runner or a broken network, not a release edge.
          [ "$code" != 2 ] || echo "unusable=true" >> "$GITHUB_OUTPUT"

      - name: detect release edges
        id: changed
        if: steps.versions.outputs.unusable != 'true'
        env:
          FAILED: ${{ steps.versions.outputs.failed }}
          STATE_JSON: ${{ toJSON(steps.state.outputs) }}
          VERSIONS_JSON: ${{ toJSON(steps.versions.outputs) }}
        run: deploy/local/cli-release-edges.sh

      # Before any dispatch, and on the unusable path too: the point of this record is
      # that a run which did nothing still says so. Nothing downstream may skip it.
      - name: record watcher liveness
        if: always()
        env:
          WATCHER_OK: ${{ steps.changed.outputs.watcher_ok }}
          WATCHER_FAILED: ${{ steps.changed.outputs.watcher_failed }}
          WATCHER_AT: ${{ steps.changed.outputs.watcher_at }}
          UNUSABLE: ${{ steps.versions.outputs.unusable }}
          FAILED: ${{ steps.versions.outputs.failed }}
        run: |
          set -euo pipefail
          at="${WATCHER_AT:-$(date -u +%Y-%m-%dT%H:%M:%SZ)}"
          if [ "$UNUSABLE" = true ]; then
            deploy/local/cli-release-state.sh set watcher failed "${FAILED:-all}"
          else
            [ -z "$WATCHER_OK" ] || deploy/local/cli-release-state.sh set watcher ok "$WATCHER_OK"
            deploy/local/cli-release-state.sh set watcher failed "${WATCHER_FAILED:-none}"
          fi
          deploy/local/cli-release-state.sh set watcher at "$at"

      # Which contracts, with which `latest` input and which secrets, is the CLI manifest's
      # (deploy/local/cli-dispatch.sh); only the secret bindings live here, because a workflow
      # can bind a secret to the environment only by name. `cli-drift-check.sh --tables` fails
      # when this list and the manifest disagree. cursor and kiro are never dispatched from
      # here: Cursor's auth.json is a refreshable interactive credential and kiro's
      # device-flow DB rotates, so their update issue asks a person.
      - name: dispatch latest TUI / mirror contracts when auth is configured
        if: steps.changed.outputs.count != '' && steps.changed.outputs.count != '0'
        env:
          CHANGED_JSON: ${{ toJSON(steps.changed.outputs) }}
          E2E_ANTHROPIC_API_KEY: ${{ secrets.E2E_ANTHROPIC_API_KEY }}
          E2E_CLAUDE_OAUTH_TOKEN: ${{ secrets.E2E_CLAUDE_OAUTH_TOKEN }}
          E2E_COPILOT_GITHUB_TOKEN: ${{ secrets.E2E_COPILOT_GITHUB_TOKEN }}
          E2E_AGY_OAUTH_TOKEN: ${{ secrets.E2E_AGY_OAUTH_TOKEN }}
        run: deploy/local/cli-dispatch.sh

      # Last, so the watcher state is already written when it runs. Every source failing
      # is not release news, it is the check being unable to run at all — the one case
      # that still deserves a red job.
      - name: fail when not one release source could be read
        if: steps.versions.outputs.unusable == 'true'
        run: |
          echo "::error::No public release source answered; no contract was dispatched."
          echo "No public release source answered. See the \`watcher\` block of the \`CLI release watcher state\` issue." >> "$GITHUB_STEP_SUMMARY"
          exit 1
