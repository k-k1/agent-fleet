# Public agent-CLI release watcher.
#
# cli-drift.yml answers "are image pins behind?". This workflow answers the
# different question "did a public version change since we last reacted?" and
# dispatches the expensive TUI/pane contracts only on that edge.
#
# Successful contracts append a "tested" marker to the release-state issue. An
# unavailable credential appends a separate "seen" marker after the tracking issue is
# updated (one report per release); a failed dispatched contract never advances tested
# state, so the watcher retries it the next day.
#
# One unreadable release source holds back that row and nothing else. It used to abort
# the job: on 2026-09-09 claude 2.1.267 was detected, rtk's GitHub Releases call failed,
# and all seven dispatches were dropped with `tested` left at 2.1.265 — which reads
# exactly like an upstream that released nothing. The decision lives in
# deploy/local/cli-release-edges.sh so it can be tested (no `act` here), and every run
# writes its own liveness to the state issue's `watcher` namespace.
name: cli-release-watch

on:
  schedule:
    - cron: "30 20 * * *" # daily 05:30 JST, after cli-drift at 05:00
  workflow_dispatch:

permissions:
  actions: write
  contents: read
  issues: write

concurrency:
  group: cli-release-watch
  cancel-in-progress: false

jobs:
  detect-and-dispatch:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - name: load durable release state
        id: state
        run: |
          set -euo pipefail
          deploy/local/cli-release-state.sh ensure watcher ok
          for name in claude codex opencode copilot agy cursor kiro; do
            echo "tested_$name=$(deploy/local/cli-release-state.sh get tested "$name")" >> "$GITHUB_OUTPUT"
            echo "seen_$name=$(deploy/local/cli-release-state.sh get seen "$name")" >> "$GITHUB_OUTPUT"
          done

      - name: fetch all public versions
        id: versions
        run: |
          set +e
          deploy/local/cli-drift-check.sh
          code=$?
          set -e
          # 1 is normal pin drift; a row that could not be read comes back in `failed=`
          # and is handled per row. 2 means not one source answered, which is a broken
          # runner or a broken network, not a release edge.
          [ "$code" != 2 ] || echo "unusable=true" >> "$GITHUB_OUTPUT"

      - name: detect release edges
        id: changed
        if: steps.versions.outputs.unusable != 'true'
        env:
          FAILED: ${{ steps.versions.outputs.failed }}
          TESTED_CLAUDE: ${{ steps.state.outputs.tested_claude }}
          TESTED_CODEX: ${{ steps.state.outputs.tested_codex }}
          TESTED_OPENCODE: ${{ steps.state.outputs.tested_opencode }}
          TESTED_COPILOT: ${{ steps.state.outputs.tested_copilot }}
          TESTED_AGY: ${{ steps.state.outputs.tested_agy }}
          TESTED_CURSOR: ${{ steps.state.outputs.tested_cursor }}
          TESTED_KIRO: ${{ steps.state.outputs.tested_kiro }}
          LATEST_CLAUDE: ${{ steps.versions.outputs.latest_claude }}
          LATEST_CODEX: ${{ steps.versions.outputs.latest_codex }}
          LATEST_OPENCODE: ${{ steps.versions.outputs.latest_opencode }}
          LATEST_COPILOT: ${{ steps.versions.outputs.latest_copilot }}
          LATEST_AGY: ${{ steps.versions.outputs.latest_agy }}
          LATEST_CURSOR: ${{ steps.versions.outputs.latest_cursor }}
          LATEST_KIRO: ${{ steps.versions.outputs.latest_kiro }}
        run: deploy/local/cli-release-edges.sh

      # Before any dispatch, and on the unusable path too: the point of this record is
      # that a run which did nothing still says so. Nothing downstream may skip it.
      - name: record watcher liveness
        if: always()
        env:
          WATCHER_OK: ${{ steps.changed.outputs.watcher_ok }}
          WATCHER_FAILED: ${{ steps.changed.outputs.watcher_failed }}
          WATCHER_AT: ${{ steps.changed.outputs.watcher_at }}
          UNUSABLE: ${{ steps.versions.outputs.unusable }}
          FAILED: ${{ steps.versions.outputs.failed }}
        run: |
          set -euo pipefail
          at="${WATCHER_AT:-$(date -u +%Y-%m-%dT%H:%M:%SZ)}"
          if [ "$UNUSABLE" = true ]; then
            deploy/local/cli-release-state.sh set watcher failed "${FAILED:-all}"
          else
            [ -z "$WATCHER_OK" ] || deploy/local/cli-release-state.sh set watcher ok "$WATCHER_OK"
            deploy/local/cli-release-state.sh set watcher failed "${WATCHER_FAILED:-none}"
          fi
          deploy/local/cli-release-state.sh set watcher at "$at"

      - name: dispatch latest TUI / mirror contracts when auth is configured
        id: dispatch
        if: steps.changed.outputs.count != '' && steps.changed.outputs.count != '0'
        env:
          CLAUDE_CHANGED: ${{ steps.changed.outputs.claude }}
          CODEX_CHANGED: ${{ steps.changed.outputs.codex }}
          OPENCODE_CHANGED: ${{ steps.changed.outputs.opencode }}
          COPILOT_CHANGED: ${{ steps.changed.outputs.copilot }}
          AGY_CHANGED: ${{ steps.changed.outputs.agy }}
          CURSOR_CHANGED: ${{ steps.changed.outputs.cursor }}
          KIRO_CHANGED: ${{ steps.changed.outputs.kiro }}
          CLAUDE_KEY: ${{ secrets.E2E_ANTHROPIC_API_KEY }}
          CLAUDE_TOKEN: ${{ secrets.E2E_CLAUDE_OAUTH_TOKEN }}
          COPILOT_TOKEN: ${{ secrets.E2E_COPILOT_GITHUB_TOKEN }}
          AGY_TOKEN: ${{ secrets.E2E_AGY_OAUTH_TOKEN }}
        run: |
          set -euo pipefail
          if [ "$CLAUDE_CHANGED" = true ]; then
            if [ -n "$CLAUDE_KEY" ] || [ -n "$CLAUDE_TOKEN" ]; then
              gh workflow run claude-tui-contract.yml -f cli_version=latest
            else
              echo "claude_unavailable=true" >> "$GITHUB_OUTPUT"
              echo "::warning::Claude changed but no TUI-contract credential is configured"
            fi
          fi
          if [ "$CODEX_CHANGED" = true ]; then
            gh workflow run codex-contract.yml
          fi
          if [ "$OPENCODE_CHANGED" = true ]; then
            gh workflow run opencode-contract.yml
          fi
          if [ "$COPILOT_CHANGED" = true ]; then
            if [ -n "$COPILOT_TOKEN" ]; then
              gh workflow run copilot-contract.yml -f cli_version=latest
            else
              echo "copilot_unavailable=true" >> "$GITHUB_OUTPUT"
            fi
          fi
          if [ "$AGY_CHANGED" = true ]; then
            if [ -n "$AGY_TOKEN" ]; then
              gh workflow run agy-contract.yml -f cli_version=latest
            else
              echo "agy_unavailable=true" >> "$GITHUB_OUTPUT"
            fi
          fi
          if [ "$CURSOR_CHANGED" = true ]; then
            # Cursor auth.json is a refreshable interactive credential.  Keep the
            # dedicated workflow runnable by dispatch, but do not turn a stale
            # snapshot into an unattended release gate.
            echo "cursor_manual=true" >> "$GITHUB_OUTPUT"
          fi
          if [ "$KIRO_CHANGED" = true ]; then
            # Kiro's device-flow DB rotates and is intentionally split across
            # manual-workflow secrets.  A release edge asks for a deliberate run;
            # it must never spend a user's device-flow credential unattended.
            echo "kiro_manual=true" >> "$GITHUB_OUTPUT"
          fi

      - name: report releases whose credential is unavailable
        if: steps.dispatch.outputs.claude_unavailable == 'true' || steps.dispatch.outputs.copilot_unavailable == 'true' || steps.dispatch.outputs.agy_unavailable == 'true' || steps.dispatch.outputs.cursor_manual == 'true' || steps.dispatch.outputs.kiro_manual == 'true'
        env:
          CLAUDE_UNAVAILABLE: ${{ steps.dispatch.outputs.claude_unavailable }}
          COPILOT_UNAVAILABLE: ${{ steps.dispatch.outputs.copilot_unavailable }}
          AGY_UNAVAILABLE: ${{ steps.dispatch.outputs.agy_unavailable }}
          CURSOR_MANUAL: ${{ steps.dispatch.outputs.cursor_manual }}
          KIRO_MANUAL: ${{ steps.dispatch.outputs.kiro_manual }}
          SEEN_CLAUDE: ${{ steps.state.outputs.seen_claude }}
          SEEN_COPILOT: ${{ steps.state.outputs.seen_copilot }}
          SEEN_AGY: ${{ steps.state.outputs.seen_agy }}
          SEEN_CURSOR: ${{ steps.state.outputs.seen_cursor }}
          SEEN_KIRO: ${{ steps.state.outputs.seen_kiro }}
          LATEST_CLAUDE: ${{ steps.versions.outputs.latest_claude }}
          LATEST_COPILOT: ${{ steps.versions.outputs.latest_copilot }}
          LATEST_AGY: ${{ steps.versions.outputs.latest_agy }}
          LATEST_CURSOR: ${{ steps.versions.outputs.latest_cursor }}
          LATEST_KIRO: ${{ steps.versions.outputs.latest_kiro }}
        run: |
          set -euo pipefail
          title="CLI release needs fleet TUI/mirror probe"
          body="$(mktemp)"
          {
          echo "The release watcher found public versions that need a fleet TUI/mirror probe:"
            echo
            for name in CLAUDE COPILOT AGY; do
              eval "unavailable=\${${name}_UNAVAILABLE:-}"
              eval "latest=\${LATEST_${name}}"
              eval "seen=\${SEEN_${name}:-}"
              [ "$unavailable" = true ] && [ "$latest" != "$seen" ] && echo "- \`${name,,}=$latest\`"
            done
            for name in CURSOR KIRO; do
              eval "manual=\${${name}_MANUAL:-}"
              eval "latest=\${LATEST_${name}}"
              eval "seen=\${SEEN_${name}:-}"
              [ "$manual" = true ] && [ "$latest" != "$seen" ] && echo "- \`${name,,}=$latest\` (manual credentialed workflow)"
            done
            cat <<'EOF'

          Cursor/Kiro use refreshable interactive credentials, so dispatch their
          dedicated workflow deliberately after updating its secret.  For a missing
          Claude/Copilot/Antigravity credential, run the real signed-in CLI through
          Terminal (CLI), then verify:

          1. the composer readiness/footer is detected;
          2. a prompt sent from the mirror reaches the TUI;
          3. user/assistant turns appear in `/messages`;
          4. working returns to idle after the response.

          This issue is intentionally not called a passing contract. Close it only after the
          fleet probe succeeds or an automated contract replaces it.
          EOF
          } > "$body"
          # `first` inside jq, not `| head -1`: with `pipefail` a SIGPIPE'd gh is a 141
          # that `set -e` turns into a failed step for a lookup that worked.
          num="$(gh issue list --state open --search "in:title $title" --json number,title \
            --jq "[.[] | select(.title == \"$title\") | .number] | first // empty")"
          gh label create cli-drift --color FBCA04 --description "upstream CLI version drift" 2>/dev/null || true
          if ! grep -q '^-' "$body"; then
            exit 0
          elif [ -n "$num" ]; then
            gh issue comment "$num" --body-file "$body"
          else
            gh issue create --title "$title" --body-file "$body" --label cli-drift
          fi

      - name: remember handled releases
        if: steps.changed.outputs.count != '' && steps.changed.outputs.count != '0'
        env:
          CLAUDE_UNAVAILABLE: ${{ steps.dispatch.outputs.claude_unavailable }}
          COPILOT_UNAVAILABLE: ${{ steps.dispatch.outputs.copilot_unavailable }}
          AGY_UNAVAILABLE: ${{ steps.dispatch.outputs.agy_unavailable }}
          CURSOR_MANUAL: ${{ steps.dispatch.outputs.cursor_manual }}
          KIRO_MANUAL: ${{ steps.dispatch.outputs.kiro_manual }}
          SEEN_CLAUDE: ${{ steps.state.outputs.seen_claude }}
          SEEN_COPILOT: ${{ steps.state.outputs.seen_copilot }}
          SEEN_AGY: ${{ steps.state.outputs.seen_agy }}
          SEEN_CURSOR: ${{ steps.state.outputs.seen_cursor }}
          SEEN_KIRO: ${{ steps.state.outputs.seen_kiro }}
          LATEST_CLAUDE: ${{ steps.versions.outputs.latest_claude }}
          LATEST_COPILOT: ${{ steps.versions.outputs.latest_copilot }}
          LATEST_AGY: ${{ steps.versions.outputs.latest_agy }}
          LATEST_CURSOR: ${{ steps.versions.outputs.latest_cursor }}
          LATEST_KIRO: ${{ steps.versions.outputs.latest_kiro }}
        run: |
          set -euo pipefail
          # A missing credential gets one Issue report per public version. It is
          # deliberately stored separately from TESTED: no unavailable/failing run
          # may look like a passed TUI/mirror contract.
          for name in CLAUDE COPILOT AGY; do
            eval "unavailable=\${${name}_UNAVAILABLE:-}"
            [ "$unavailable" = true ] || continue
            eval "latest=\${LATEST_${name}}"
            eval "seen=\${SEEN_${name}:-}"
            [ "$latest" != "$seen" ] || continue
            deploy/local/cli-release-state.sh set seen "${name,,}" "$latest"
          done
          for name in CURSOR KIRO; do
            eval "manual=\${${name}_MANUAL:-}"
            [ "$manual" = true ] || continue
            eval "latest=\${LATEST_${name}}"
            eval "seen=\${SEEN_${name}:-}"
            [ "$latest" != "$seen" ] || continue
            deploy/local/cli-release-state.sh set seen "${name,,}" "$latest"
          done

      # Last, so the watcher state is already written when it runs. Every source failing
      # is not release news, it is the check being unable to run at all — the one case
      # that still deserves a red job.
      - name: fail when not one release source could be read
        if: steps.versions.outputs.unusable == 'true'
        run: |
          echo "::error::No public release source answered; no contract was dispatched."
          echo "No public release source answered. See the \`watcher\` block of the \`CLI release watcher state\` issue." >> "$GITHUB_STEP_SUMMARY"
          exit 1
