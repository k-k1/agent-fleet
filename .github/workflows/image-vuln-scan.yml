# Detect security fixes the published images are missing (#3320).
#
# The images build from floating base tags with no `apt-get upgrade`, and the Go binaries
# only pick up a new standard library when rebuilt, so a release carries whatever was
# current at build time and nothing moves afterwards. This workflow scans what was actually
# PUBLISHED and keeps one tracking issue open while a fix exists that the release lacks:
#
#   - the control-plane and workspace images (ghcr.io/k-k1/agent-fleet/<name>:<version>,
#     the tags deploy/compose/release.sh pushes) with Trivy
#   - the native rootfs (dist repo release v<version>) with Trivy
#   - the CP binary (native package bin/af-cp) and the Agent binary (rootfs
#     usr/local/bin/workspace-agent) with `govulncheck -mode=binary`
#
# Each of those is scanned for amd64 and, when that version published it, for arm64
# (publish-dist can skip every arm64 half). Nothing is executed, so both run on the same
# amd64 runner: Trivy reads the arm64 layers, govulncheck reads the binary's build info.
# Three jobs: `resolve` decides the version and which arm64 halves exist, `scan` is a
# matrix over the architectures that only reads and uploads JSON, and `report` is the ONE
# job that merges the findings and touches the issue (so no two writers race).
#
# "Latest published" is the highest vX.Y.Z non-draft, non-prerelease release of the dist
# repo, which is where publish-dist.sh puts every version; the images carry the same
# version as their tag. A patch release 0.x.y+1 cut from an older line is therefore not
# the one scanned once a newer minor exists, which is intended: the newest line is what
# deployments run.
#
# The verdict and issue text come from deploy/local/vuln-scan-report.py and
# vuln-scan-issue.sh (tested by vuln-scan-report-test.sh). A scanner that cannot run, a
# download that fails or an output that is not the scanner's makes the run RED; it never
# counts as clean and never closes the issue.
#
# How to turn the issue into a patch release: docs/build/94-patch-release.md.
#
# Note: schedule and workflow_run use the workflow definition of the default branch (main).
name: image-vuln-scan

on:
  schedule:
    - cron: "17 3 * * 1" # weekly, Monday
  # Right after each publish, so a release that shipped with a known fix pending is flagged
  # at once, and a patch release closes the issue without waiting for Monday.
  workflow_run:
    workflows: [publish-dist]
    types: [completed]
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to scan (default: the latest published release)'
        required: false

permissions:
  contents: read # per-job `issues: write` is granted to `report` alone

concurrency:
  group: image-vuln-scan
  cancel-in-progress: false

env:
  DIST_REPO: k-k1/agent-fleet-dist
  IMAGE_REPO: ghcr.io/k-k1/agent-fleet
  # Pinned by version AND hash: a tool that cannot be fetched or does not match fails the
  # run instead of scanning with something else. Bump the two together.
  TRIVY_VERSION: "0.76.1"
  TRIVY_SHA256: c7cbe3137fb8a48a17574bede3dd6beb16742d1e9772929940fc90082c39d9c0
  GOVULNCHECK_VERSION: v1.9.0

jobs:
  resolve:
    # A failed publish ships nothing new to scan.
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      version: ${{ steps.rel.outputs.version }}
      cp_arm64: ${{ steps.arm.outputs.cp_arm64 }}
      ws_arm64: ${{ steps.arm.outputs.ws_arm64 }}
      native_arm64: ${{ steps.arm.outputs.native_arm64 }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: resolve the release to scan
        id: rel
        env:
          GH_TOKEN: ${{ github.token }}
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          latest="$(deploy/local/vuln-scan-latest.sh)"
          version="${INPUT_VERSION:-$latest}"
          echo "$version" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$' \
            || { echo "::error::version is not X.Y.Z: $version"; exit 1; }
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "scanning $version (latest published: $latest)"
          # An older version can be scanned on request, but only the latest one owns the issue.
          [ "$version" = "$latest" ] || echo "::notice::$version is not the latest ($latest): the issue will not be touched"

      # publish-dist builds the arm64 halves only when asked (control_plane_arm64,
      # workspace_arm64, native_arm64), so which exist is read from what was published.
      # Only "not there" skips an arm64 scan; a lookup that fails is red, never a skip.
      # The native package alone decides the native half: its rootfs may be one an earlier
      # release published (publish-dist.sh --rootfs-json), which `scan` resolves from the
      # package's own rootfs.json and fails on if it cannot be had.
      - name: which arm64 halves were published
        id: arm
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.rel.outputs.version }}
        run: |
          set -euo pipefail
          assets="$(gh release view "v$VERSION" -R "$DIST_REPO" --json assets -q '.assets[].name')"
          if grep -qxF "agent-fleet-native-$VERSION-linux-arm64.tar.gz" <<<"$assets"; then
            echo "native_arm64=true" >> "$GITHUB_OUTPUT"
          else
            echo "native_arm64=false" >> "$GITHUB_OUTPUT"
          fi
          for pair in cp_arm64:control-plane ws_arm64:workspace; do
            raw="$(docker buildx imagetools inspect --raw "$IMAGE_REPO/${pair#*:}:$VERSION")"
            if jq -e '.manifests? // [] | any(.platform.architecture == "arm64")' <<<"$raw" >/dev/null; then
              echo "${pair%%:*}=true" >> "$GITHUB_OUTPUT"
            else
              echo "${pair%%:*}=false" >> "$GITHUB_OUTPUT"
            fi
          done
          cat "$GITHUB_OUTPUT"

  scan:
    needs: resolve
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false # the other architecture's JSON is still worth having; `report` is skipped on any failure
      matrix:
        arch: [amd64, arm64]
    # No token on this job: it unpacks and scans downloaded artifacts, and the steps that
    # talk to GitHub pass the job token explicitly.
    env:
      ARCH: ${{ matrix.arch }}
      VERSION: ${{ needs.resolve.outputs.version }}
      # amd64 is always published; arm64 only when `resolve` found it.
      DO_CP: ${{ matrix.arch == 'amd64' || needs.resolve.outputs.cp_arm64 == 'true' }}
      DO_WS: ${{ matrix.arch == 'amd64' || needs.resolve.outputs.ws_arm64 == 'true' }}
      DO_NATIVE: ${{ matrix.arch == 'amd64' || needs.resolve.outputs.native_arm64 == 'true' }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: install Trivy (pinned, checksum-verified)
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/bin" "$RUNNER_TEMP/dl"
          f="trivy_${TRIVY_VERSION}_Linux-64bit.tar.gz"
          curl -fsSL --retry 3 -o "$RUNNER_TEMP/dl/$f" \
            "https://github.com/aquasecurity/trivy/releases/download/v${TRIVY_VERSION}/$f"
          echo "$TRIVY_SHA256  $RUNNER_TEMP/dl/$f" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/dl/$f" -C "$RUNNER_TEMP/bin" trivy
          "$RUNNER_TEMP/bin/trivy" --version

      - uses: actions/setup-go@v7
        with:
          go-version: stable
          cache: false # no go.sum in play: govulncheck is installed from a pinned module version

      - name: install govulncheck (pinned)
        run: |
          set -euo pipefail
          GOBIN="$RUNNER_TEMP/bin" go install "golang.org/x/vuln/cmd/govulncheck@${GOVULNCHECK_VERSION}"
          test -x "$RUNNER_TEMP/bin/govulncheck"

      - name: download the native package and its rootfs
        if: ${{ env.DO_NATIVE == 'true' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          d="$RUNNER_TEMP/native"; mkdir -p "$d"
          pkg="agent-fleet-native-$VERSION-linux-$ARCH"
          gh release download "v$VERSION" -R "$DIST_REPO" -D "$d" -p "$pkg.tar.gz"
          # The package names its rootfs, which may belong to an earlier release.
          ref="$(tar -xzf "$d/$pkg.tar.gz" -O "$pkg/rootfs.json" \
            | python3 -I deploy/local/vuln-scan-rootfs-ref.py "$DIST_REPO" "$ARCH")"
          read -r tag name sha <<<"$ref"
          gh release download "$tag" -R "$DIST_REPO" -D "$d" -p "$name"
          echo "$sha  $d/$name" | sha256sum -c -
          echo "$name" > "$d/rootfs.name"

      # What was downloaded is data. Nothing from it is executed here (not even the zstd the
      # package ships: the runner's own is used), and the rootfs is unpacked by a filter that
      # refuses paths and links leaving the directory. The arm64 binaries are only read.
      - name: unpack the downloads as data
        if: ${{ env.DO_NATIVE == 'true' }}
        run: |
          set -euo pipefail
          d="$RUNNER_TEMP/native"; mkdir -p "$d/rootfs" "$d/pkg"
          command -v zstd >/dev/null || sudo apt-get install -y --no-install-recommends zstd
          tar -xzf "$d/agent-fleet-native-$VERSION-linux-$ARCH.tar.gz" -C "$d/pkg" --strip-components=1 \
            "agent-fleet-native-$VERSION-linux-$ARCH/bin/af-cp"
          zstd -dc "$d/$(cat "$d/rootfs.name")" \
            | python3 -I deploy/local/vuln-scan-extract.py "$d/rootfs"
          test -f "$d/rootfs/usr/local/bin/workspace-agent"

      # File names carry the architecture; `report` pairs them with the targets. A target
      # that was not published for this architecture simply has no file.
      - name: scan
        run: |
          set -euo pipefail
          out="$RUNNER_TEMP/scan"; mkdir -p "$out"
          d="$RUNNER_TEMP/native"
          trivy() { "$RUNNER_TEMP/bin/trivy" "$@" --scanners vuln --severity HIGH,CRITICAL \
            --ignore-unfixed --exit-code 0 --timeout 20m --format json; }
          if [ "$DO_CP" = true ]; then
            trivy image --platform "linux/$ARCH" --output "$out/control-plane.$ARCH.json" "$IMAGE_REPO/control-plane:$VERSION"
          fi
          if [ "$DO_WS" = true ]; then
            trivy image --platform "linux/$ARCH" --output "$out/workspace.$ARCH.json" "$IMAGE_REPO/workspace:$VERSION"
          fi
          if [ "$DO_NATIVE" = true ]; then
            trivy rootfs --output "$out/rootfs.$ARCH.json" "$d/rootfs"
            # govulncheck exits 3 when it finds something; 0 and 3 are both a completed scan.
            gv() { rc=0; "$RUNNER_TEMP/bin/govulncheck" -mode=binary -format json "$2" > "$1" || rc=$?
                   [ "$rc" = 0 ] || [ "$rc" = 3 ] || { echo "::error::govulncheck failed on $2 (exit $rc)"; exit 1; }; }
            gv "$out/af-cp.$ARCH.json" "$d/pkg/bin/af-cp"
            gv "$out/workspace-agent.$ARCH.json" "$d/rootfs/usr/local/bin/workspace-agent"
          fi
          ls -l "$out"

      # Scanner JSON only (public advisories); the issue shows the first rows, this the rest.
      - uses: actions/upload-artifact@v7
        if: ${{ !cancelled() }}
        with:
          name: vuln-scan-${{ needs.resolve.outputs.version }}-${{ matrix.arch }}
          path: ${{ runner.temp }}/scan/*.json
          if-no-files-found: ignore
          retention-days: 14

  # The only job that writes the issue. It needs every scan to have succeeded: a scan that
  # did not run is a red run, never a clean verdict.
  report:
    needs: [resolve, scan]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      issues: write # open / update / close the one tracking issue
    env:
      VERSION: ${{ needs.resolve.outputs.version }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/download-artifact@v8
        with:
          pattern: vuln-scan-${{ needs.resolve.outputs.version }}-*
          merge-multiple: true
          path: ${{ runner.temp }}/scan

      # amd64 is required; an arm64 file is expected exactly when `resolve` found that half.
      - name: build the report
        id: report
        env:
          CP_ARM64: ${{ needs.resolve.outputs.cp_arm64 }}
          WS_ARM64: ${{ needs.resolve.outputs.ws_arm64 }}
          NATIVE_ARM64: ${{ needs.resolve.outputs.native_arm64 }}
        run: |
          set -euo pipefail
          out="$RUNNER_TEMP/scan"
          args=()
          add() { args+=("$1" "$2@$3=$out/$4.$3.json"); }   # flag label arch file-stem
          for arch in amd64 arm64; do
            if [ "$arch" = amd64 ]; then cp=true ws=true nat=true; else cp=$CP_ARM64 ws=$WS_ARM64 nat=$NATIVE_ARM64; fi
            if [ "$cp" = true ]; then add --trivy "control-plane image" "$arch" control-plane; fi
            if [ "$ws" = true ]; then add --trivy "workspace image" "$arch" workspace; fi
            if [ "$nat" = true ]; then
              add --trivy "native rootfs" "$arch" rootfs
              add --govulncheck "af-cp (control plane binary)" "$arch" af-cp
              add --govulncheck "workspace-agent (agent binary)" "$arch" workspace-agent
            fi
          done
          python3 -I deploy/local/vuln-scan-report.py --release "$VERSION" --out "$out/body.md" \
            --pinned-dockerfile workspace/Dockerfile "${args[@]}" | tee -a "$GITHUB_OUTPUT"
          { echo "## image-vuln-scan $VERSION"; echo; cat "$out/body.md"; } >> "$GITHUB_STEP_SUMMARY"

      # The latest is asked again here: a release published while the scan ran makes this
      # verdict about an old version, and vuln-scan-issue.sh then leaves the issue alone.
      - name: open, update or close the tracking issue
        env:
          GH_TOKEN: ${{ github.token }}
          FIXABLE: ${{ steps.report.outputs.fixable }}
          SCANNED: ${{ needs.resolve.outputs.version }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          latest="$(deploy/local/vuln-scan-latest.sh)"
          deploy/local/vuln-scan-issue.sh sync "$RUNNER_TEMP/scan/body.md" "$FIXABLE" "$RUN_URL" "$SCANNED" "$latest"
