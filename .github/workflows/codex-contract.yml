# codex CLI contract (drift detection). Runs against the real codex binary in a real
# tmux pane to detect breakage of the hooks schema, -c config keys, the TUI footer
# spec, and rollout events.
#
# Why separate from e2e.yml: e2e.yml is about the image build → L1/L2/L3 pipeline, and
# its trigger path filter is broad (workspace/** control-plane/** console/**). Path
# filters are **per workflow**, so co-locating there would run the codex contract even
# for console changes (and widening e2e.yml's paths for our sake would drag in all its
# jobs). workflow_dispatch inputs are also per workflow — codex's Tier2 and claude's
# live-smoke actually shared a single `live` input and could not be run separately
# (split in 6e2f8ee). One file per agent makes this coupling structurally impossible.
# Same shape: opencode-contract.yml / claude-tui-contract.yml. Version-skew monitoring
# is cli-drift.yml.
name: codex-contract

permissions:
  contents: read
  issues: write

on:
  # Not run on pushes to develop (billing spread; CONTRIBUTING "Commits & PRs").
  # Contract checks are concentrated on PRs to main (when relevant paths changed)
  # and the weekly cron.
  pull_request:
    branches: [main]
    paths:
      - "workspace/agent/internal/agents/codex/**"
      - "workspace/agent/session_io.go"
      - "workspace/agent/codex_pane_drift_test.go"
      - "workspace/Dockerfile"
      - ".github/workflows/codex-contract.yml"
      - ".github/actions/setup-agent-cli/action.yml"
  schedule:
    # Every Monday 6:15 JST — catch upstream codex breakage even with no code changes.
    # Offset from e2e.yml (0 21) / opencode-contract.yml (30 21) so the weeklies
    # don't all fire at once.
    - cron: "15 21 * * 0"
  workflow_dispatch:
    inputs:
      live:
        description: "Tier2: also run drift checks that consume real turns — uses ChatGPT (codex) subscription quota (measured ~45k tokens/run)"
        type: boolean
        default: false

concurrency:
  group: codex-contract-${{ github.ref }}
  cancel-in-progress: true

jobs:
  drift:
    # Tier 1. Runs against the real codex binary in a real tmux pane to detect breakage
    # of the hooks schema, -c config keys, and the TUI footer spec (workspace/agent's
    # `-tags drift` tests). No image build needed, so it finishes in tens of seconds.
    #
    # Free, no auth: every verified path (features list / config validation /
    # UserPromptSubmit firing / footer rendering) completes before any API call
    # (measured). Things that need a real turn — the Stop hook, rollout events, turn/*
    # notifications — are covered by live-drift below (costs money).
    #
    # The matrix checks both the Dockerfile ARG pin (= baked fallback) and @latest
    # (= self-update-enabled workspaces). cli-release-watch dispatches this workflow
    # only when latest moves; the weekly cron remains the backstop.
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        # pinned protects the baked fallback; latest protects self-update-enabled
        # workspaces. Keeping both makes an upstream regression distinguishable
        # from a repository regression in one run.
        version: [pinned, latest]
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-agent-cli
        id: cli
        with:
          agent: codex
          version: ${{ matrix.version }}
      - name: codex drift (Tier 1, ${{ matrix.version }})
        working-directory: workspace/agent
        env:
          # Fail instead of skip when the CLI is missing (a silent skip is a false green).
          E2E_REQUIRE: "1"
        # The drift build tag is shared with agy's signed-in pane probe. Restrict by
        # test name so a codex-only runner never fails merely because agy is absent.
        run: go test -tags drift -run '^TestDriftCodex' -v -timeout 10m ./...
      - name: remember successfully tested latest
        if: matrix.version == 'latest' && github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          EFFECTIVE: ${{ steps.cli.outputs.version }}
        run: |
          version="$(printf '%s' "$EFFECTIVE" | grep -oE '[0-9]+(\.[0-9]+)+' | head -1)"
          [ -n "$version" ]
          deploy/local/cli-release-state.sh set tested codex "$version"

  live-drift:
    # Tier 2 — **consumes real turns**. Covers only the 4 things Tier 1 (free) cannot
    # observe: Stop hook→idle / rollout's task_started & task_complete /
    # request_user_input's function_call / managed turn/started & turn/completed.
    #
    # Runs **only when the workflow_dispatch live input is set** (no cron). Separate
    # input and workflow from claude's live-smoke (e2e.yml) = quota consumption never
    # mixes. Measured cost: roughly ~45k tokens per run (breakdown in the job log's
    # `MEASURED COST` line). With auth_mode="chatgpt" it consumes subscription quota
    # (not API billing).
    #
    # Auth: secrets.E2E_CODEX_AUTH_JSON = contents of ~/.codex/auth.json after
    # `codex login`. The chatgpt token is refreshed in place via refresh_token, so
    # **the copy stored in CI will eventually expire** (CI cannot keep the rotated new
    # token). To avoid dying with a "mystery 401" on expiry, the tests classify the
    # pre-turn `codex login status` and mid-turn 401 messages, and fail with a message
    # that spells out re-login → secret update.
    if: github.event_name == 'workflow_dispatch' && inputs.live
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: guard secret
        env:
          AUTH: ${{ secrets.E2E_CODEX_AUTH_JSON }}
        run: |
          if [ -z "$AUTH" ]; then
            # Note: no backquotes here (inside "..." they would run as command substitution)
            echo '::error::register secrets.E2E_CODEX_AUTH_JSON (paste the contents of ~/.codex/auth.json after codex login as-is)'
            exit 1
          fi
      - uses: ./.github/actions/setup-agent-cli
        with:
          agent: codex
          version: pinned
      - name: codex live drift (Tier 2)
        working-directory: workspace/agent
        env:
          E2E_CODEX_AUTH_JSON: ${{ secrets.E2E_CODEX_AUTH_JSON }}
        run: go test -tags driftlive -run TestLiveDrift -v -timeout 20m ./...
