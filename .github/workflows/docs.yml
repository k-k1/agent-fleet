# The docs gate: a machine check of the structural conventions for docs/
# (docs/CONVENTIONS.md).
#
# Why it is separate from ci.yml: ci.yml builds and tests Go and the Console, which is too
# heavy for a PR that only edits docs. Conversely the docs gate is wanted on code changes
# too — the tables under ref/ are matched against primary information in the code (the
# agent-kind constants, the runtime profiles), so they break precisely when the code is
# touched and the table is not. Hence it runs on both kinds of change.
#
# For the same reason it also looks outside docs/: workspace/agent/knowledge/af-usage.md
# (the assistant's knowledge) and workspace/workspace-notes.md (the operating policy
# distributed to every container) are copies of docs/ content and get left behind when
# docs/ is rearranged. So there is deliberately no `paths:` filter — a filter would limit
# this to "PRs that only touch docs", and those two go stale exactly when the docs side is
# edited.
#
# The check itself is scripts/docs-check.py, run locally with the same command.
name: docs

permissions:
  contents: read

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

concurrency:
  group: docs-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # No dependencies (standard library only), so the runner's python3 is used as is.
      - name: docs-check
        run: python3 scripts/docs-check.py

      # Surfaces the checks kept at warn level during the migration (the vocabulary of the
      # user-facing shelves). Once the shelves are written, fold this into the run above as
      # --strict.
      - name: docs-check (strict, informational)
        continue-on-error: true
        run: python3 scripts/docs-check.py --strict
