# Kiro's device-flow SQLite credential is restored only in the ephemeral runner. The
# real TUI/mirror turn is opt-in at dispatch time because the credential can rotate.
#
# A thin caller of cli-contract.yml: triggers, the credential and the test scripts live here.
name: kiro-contract

on:
  workflow_dispatch:
    inputs:
      cli_version:
        description: "kiro-cli version to verify (latest for self-update-enabled Workspaces)"
        type: string
        default: latest

permissions:
  actions: read # the failure report lists this run's failed steps
  contents: read
  issues: write

concurrency:
  group: kiro-contract
  cancel-in-progress: false

jobs:
  tui-mirror:
    uses: ./.github/workflows/cli-contract.yml
    secrets:
      E2E_KIRO_AUTH_DB_B64_1: ${{ secrets.E2E_KIRO_AUTH_DB_B64_1 }}
      E2E_KIRO_AUTH_DB_B64_2: ${{ secrets.E2E_KIRO_AUTH_DB_B64_2 }}
      E2E_KIRO_AUTH_DB_B64_3: ${{ secrets.E2E_KIRO_AUTH_DB_B64_3 }}
      E2E_KIRO_AUTH_DB_B64_4: ${{ secrets.E2E_KIRO_AUTH_DB_B64_4 }}
      E2E_KIRO_AUTH_DB_B64_5: ${{ secrets.E2E_KIRO_AUTH_DB_B64_5 }}
      E2E_KIRO_AUTH_DB_B64_6: ${{ secrets.E2E_KIRO_AUTH_DB_B64_6 }}
      E2E_KIRO_AUTH_DB_B64_7: ${{ secrets.E2E_KIRO_AUTH_DB_B64_7 }}
      E2E_KIRO_AUTH_DB_B64_8: ${{ secrets.E2E_KIRO_AUTH_DB_B64_8 }}
    with:
      cli: kiro
      version: ${{ inputs.cli_version }}
      timeout_minutes: 35
      # The SQLite credential database exceeds GitHub's 48 KiB per-secret limit after base64
      # encoding. The local helper splits one unchanged base64 stream; concatenate before
      # decoding so SQLite sees its original bytes (and never put any fragment in the job log).
      guard: |
        set -euo pipefail
        [ -n "$E2E_KIRO_AUTH_DB_B64_1" ] || { echo '::error::register secrets.E2E_KIRO_AUTH_DB_B64_1..8 with deploy/local/set-kiro-ci-auth.sh'; exit 1; }
        install -d -m 700 "$HOME/.local/share/kiro-cli"
        printf '%s%s%s%s%s%s%s%s' \
          "$E2E_KIRO_AUTH_DB_B64_1" "$E2E_KIRO_AUTH_DB_B64_2" "$E2E_KIRO_AUTH_DB_B64_3" "$E2E_KIRO_AUTH_DB_B64_4" \
          "$E2E_KIRO_AUTH_DB_B64_5" "$E2E_KIRO_AUTH_DB_B64_6" "$E2E_KIRO_AUTH_DB_B64_7" "$E2E_KIRO_AUTH_DB_B64_8" \
          | base64 --decode > "$HOME/.local/share/kiro-cli/data.sqlite3"
        chmod 600 "$HOME/.local/share/kiro-cli/data.sqlite3"
      test_0_name: real TUI and mirror contract
      test_0_env: |
        E2E_REQUIRE=1
      test_0: |
        go test -tags contract -run '^TestKiroTUIMirrorContract$' -count=1 -v -timeout 15m .
      # Declared Caps against observed behaviour (interrupt, fork-at, model override): the same
      # test as above in AF_CAPS_PROBES=only mode, so it reuses this kind's auth setup. Costs one
      # interrupted long turn and three one-line turns (up to five when the model probe meets
      # explicit refusals). Advisory unless the repository variable CAPS_PROBES_BLOCKING is
      # 'true' (see cli-contract.yml).
      caps: |
        export E2E_REQUIRE=1 AF_CAPS_PROBES=only
        go test -tags contract -run '^TestKiroTUIMirrorContract$' -count=1 -v -timeout 15m .

  # The `tested` this run may have recorded is what a bump waits for; see cli-pin-bump.yml's
  # `on:` for why this dispatches it instead of relying on `workflow_run`. A job of its own,
  # so actions: write never reaches the steps that run the CLI. Whatever the result:
  # cli-pin-bump decides by `tested == latest` and changes nothing when nothing is due.
  pin-bump:
    needs: tui-mirror
    if: ${{ !cancelled() && github.event_name != 'pull_request' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: write
    steps:
      - name: dispatch cli-pin-bump
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh workflow run cli-pin-bump.yml --repo "$GITHUB_REPOSITORY" --ref main
