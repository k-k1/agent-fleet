name: Enhancement
description: A new feature, an improvement, or work left over from another change
labels: ["enhancement"]
body:
  - type: textarea
    id: summary
    attributes:
      label: Summary
      description: What is wanted and why. No hostnames, account IDs, tokens or customer names.
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance
      description: How we will know it is done.
